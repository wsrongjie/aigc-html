<!doctype html>

  <title>模型编排工作台</title>
  <meta name="description" content="内部模型工作流编排、调试、发布与 Token 计费原型">
  <style>
    :root{
      --ink:#17243a;--muted:#66758c;--subtle:#8d9aab;--line:#dce3ec;--line-strong:#c8d2df;

    .app{height:100%;display:grid;grid-template-columns:216px minmax(0,1fr)}

    .nav{padding:16px 10px;display:flex;flex-direction:column;gap:4px}.nav-label{padding:9px 10px 5px;color:#708198;font-size:10px;letter-spacing:1.7px}
    .nav button{width:100%;border:0;background:transparent;color:#aab7c9;border-radius:7px;padding:10px 11px;display:flex;align-items:center;gap:10px;text-align:left}
    .nav button:hover{background:#18273c;color:#fff}.nav button.active{background:#243a63;color:#fff;box-shadow:inset 3px 0 0 #6c8cff}
    .nav-icon{width:18px;text-align:center;font:12px var(--mono);color:#7e94bc}.nav button.active .nav-icon{color:#9db2ff}
    .sider-foot{margin-top:auto;padding:14px 16px;border-top:1px solid #273750;color:#7f8ea3;font-size:10px;line-height:1.7}.system-dot{display:inline-block;width:7px;height:7px;background:#39be90;border-radius:50%;margin-right:6px}
    .shell{min-width:0;min-height:0;display:grid;grid-template-rows:58px minmax(0,1fr)}

    .crumb{display:flex;align-items:center;gap:8px;color:var(--subtle);font-size:12px}.crumb b{color:var(--ink);font-weight:600}.top-actions{display:flex;align-items:center;gap:10px}
    .env{font-size:10px;padding:4px 7px;background:#edf2f8;border:1px solid #dfe6ee;color:#758399;border-radius:4px}.avatar{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:#e7edff;color:#3159c7;font-weight:700}
    .content{min-width:0;min-height:0;overflow:auto;padding:22px}
    .content.editor-mode{overflow:hidden;padding:0}

    .btn{border:1px solid var(--line-strong);background:#fff;border-radius:6px;padding:7px 11px;color:#526176;box-shadow:0 1px 1px rgba(20,34,55,.03)}.btn:hover{border-color:#9dadc2;color:#233652}.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}.btn.primary:hover{background:#184de8}.btn.ghost{background:transparent}.btn.danger{color:var(--red);border-color:#efc9ce}.btn.small{padding:4px 8px;font-size:11px}.btn:disabled{opacity:.45;cursor:not-allowed}

    .table-wrap{overflow:auto}table{width:100%;border-collapse:collapse}th{background:#f7f9fc;color:#738096;font-size:10px;letter-spacing:.5px;text-align:left;padding:10px 13px;border-bottom:1px solid var(--line);white-space:nowrap}td{padding:12px 13px;border-bottom:1px solid #edf1f5;vertical-align:middle}td:last-child{white-space:nowrap}tr:last-child td{border-bottom:0}tbody tr:hover{background:#fafcff}td b{font-weight:600}td small{display:block;color:var(--subtle);margin-top:4px;line-height:1.45}

    .workflow-name{display:flex;align-items:flex-start;gap:10px}.wf-glyph{width:30px;height:30px;display:grid;place-items:center;background:#edf2ff;border:1px solid #d9e3ff;color:#365ec5;border-radius:6px;font:12px var(--mono);flex:0 0 auto}.inline-cost{font-family:var(--mono);font-size:11px;color:#4f6078}
    .service-filters{display:flex;align-items:center;gap:6px;flex-wrap:wrap}.service-filters button{border:1px solid var(--line);background:#fff;border-radius:5px;padding:6px 10px;color:#67768a;font-size:11px}.service-filters button.active{border-color:#97adee;background:#edf2ff;color:#315ac4}.service-mode-tabs{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:17px}.service-mode-tabs button{border:1px solid #dce4ef;border-radius:7px;padding:12px;background:#fff;text-align:left;color:#41536d}.service-mode-tabs button.active{border-color:#6e91ed;background:#f2f6ff;box-shadow:inset 0 0 0 1px #6e91ed}.service-mode-tabs b{display:block;font-size:12px}.service-mode-tabs small{display:block;margin-top:4px;color:#8290a3;font-size:10px;line-height:1.45}.service-section{margin:15px 0 10px;padding-top:13px;border-top:1px solid var(--line)}.service-section b{font-size:11px;color:#40506a}.service-section small{display:block;color:#8a97a8;margin-top:3px}.service-form .field-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.service-form .field input:disabled{background:#f3f6fa;color:#8491a4}.service-secret-note{background:#fff8ea;border:1px solid #f2dfba;color:#86682f;padding:9px 10px;border-radius:5px;font-size:10px;line-height:1.55;margin-top:6px}.service-address{max-width:300px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block;font:10px var(--mono);color:#51637d}
    .empty{padding:50px;text-align:center;color:var(--subtle)}

    /* Editor */

    .palette,.inspector{background:#fff;min-height:0;overflow:auto}.palette{position:absolute;z-index:12;left:12px;top:55px;bottom:12px;width:190px;border:1px solid var(--line);border-radius:8px;padding:14px 12px;box-shadow:var(--shadow);display:none}.palette.open{display:block}.inspector{border-left:1px solid var(--line)}
    .panel-title{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.panel-title b{font-size:12px}.panel-title span{font:9px var(--mono);color:var(--subtle)}.palette-group{margin:14px 0}.palette-group>label{display:block;color:#8491a2;font-size:9px;letter-spacing:1px;margin:0 4px 7px}.palette-item{border:1px solid var(--line);background:#fff;border-radius:6px;padding:8px;margin-bottom:6px;display:flex;gap:8px;align-items:center;width:100%;text-align:left}.palette-item:hover{border-color:#9db3e7;background:#f8faff}.palette-dot{width:22px;height:22px;border-radius:5px;display:grid;place-items:center;font:9px var(--mono);background:#edf2ff;color:#315bc8}.palette-item small{display:block;color:var(--subtle);font-size:9px;margin-top:2px}
    .canvas-shell{min-width:0;min-height:0;overflow:auto;position:relative;background-color:#eef3f8;background-image:radial-gradient(#c8d3e1 1px,transparent 1px);background-size:20px 20px}
    .canvas-toolbar{position:sticky;top:10px;left:12px;z-index:8;width:max-content;display:flex;align-items:center;gap:5px;padding:5px;background:rgba(255,255,255,.94);border:1px solid var(--line);border-radius:7px;box-shadow:0 5px 18px rgba(22,39,64,.08);backdrop-filter:blur(6px)}
    .canvas-toolbar button{border:0;background:transparent;border-radius:4px;padding:5px 7px;color:#64748a}.canvas-toolbar button:hover{background:#eef3fa;color:#253958}.zoom{font:10px var(--mono);color:#8390a2;padding:0 4px}.canvas-help{font-size:10px;color:#64748a;padding:0 5px;border-left:1px solid var(--line)}
    .canvas-viewport{position:relative;min-width:0;min-height:0;overflow:auto}.canvas-world{width:1080px;height:760px;position:relative;transform-origin:top left;transform:scale(var(--canvas-scale,.8))}.stage-band{position:absolute;top:80px;bottom:35px;border-left:1px dashed #cbd6e3}.stage-band span{position:absolute;top:-28px;left:10px;font:11px var(--mono);letter-spacing:.6px;color:#61748d;white-space:nowrap}.stage-1{left:40px}.stage-2{left:240px}.stage-3{left:440px}.stage-4{left:640px}.stage-5{left:840px}
    .wire-layer{position:absolute;inset:0;z-index:1;overflow:visible;pointer-events:none}.wire{fill:none;stroke:#a8b6c8;stroke-width:2}.wire.active{stroke:#4f75e7;stroke-width:2.5}.wire.dashed{stroke-dasharray:6 5}.wire.preview{stroke:#3c68e6;stroke-width:2.5;stroke-dasharray:6 4}.wire-label{font:9px var(--mono);fill:#718096}.wire-dot{fill:#fff;stroke:#7990ae;stroke-width:2}
    .node{position:absolute;width:180px;min-height:82px;background:#fff;border:1px solid #cfd9e5;border-radius:7px;z-index:3;box-shadow:0 5px 14px rgba(26,44,69,.07);cursor:pointer;transition:box-shadow .15s,border-color .15s,transform .15s}.node:hover{box-shadow:0 8px 20px rgba(26,44,69,.12);transform:translateY(-1px)}.node.selected{border-color:#4b70e6;box-shadow:0 0 0 2px #dce5ff,0 10px 22px rgba(39,94,254,.13)}.node.connection-source{border-color:#3769ed;box-shadow:0 0 0 3px #a9bbf9}.node.disabled{opacity:.48;filter:grayscale(.3)}.node.running{border-color:#cb8b2f;box-shadow:0 0 0 2px #ffebc8}.node.success{border-color:#39a782}.node.failed{border-color:#d45a67;box-shadow:0 0 0 2px #ffe0e3}
    .node-cap{height:25px;padding:0 8px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #e7ebf0;background:#f9fbfd;border-radius:7px 7px 0 0}.node-kind{font:9px var(--mono);letter-spacing:.6px;color:#6b7a90}.node-state{width:6px;height:6px;border-radius:50%;background:#8fa0b4}.node.model .node-state{background:#4267db}.node.control .node-state{background:#d08a27}.node.data .node-state{background:#1c9a9b}.node.output .node-state{background:#218663}
    .node-body{padding:9px 10px}.node-body b{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.node-body small{display:block;color:#718198;font-size:10px;line-height:1.45;margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.node-meta{display:flex;justify-content:space-between;gap:8px;margin-top:7px;font:10px var(--mono);color:#74839a}.node-meta span:first-child{max-width:115px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.port{position:absolute;width:15px;height:15px;border-radius:50%;background:#fff;border:2px solid #8295ae;z-index:5}.port.out{right:-8px;top:30px;cursor:crosshair;border-color:#4f75e7;background:#eaf0ff;touch-action:none}.port.bottom{left:calc(50% - 8px);bottom:-8px;top:auto}.port.out:hover,.port.out:focus-visible{background:#3769ed;border-color:#fff;box-shadow:0 0 0 4px #9ab2ff}.node.drop-target{border-color:#3c68e6;box-shadow:0 0 0 3px #a9bbf9}.node.condition .port.out.yes{right:auto;left:calc(50% - 8px);top:auto;bottom:-8px}.node.condition .port.out.no{right:-8px;top:30px}.port-label{position:absolute;z-index:5;font:9px var(--mono);color:#4562a1;pointer-events:none}.port-label.yes{left:calc(50% + 10px);bottom:-11px}.port-label.no{right:-25px;top:33px}
    .branch-label{position:absolute;padding:3px 5px;border-radius:3px;background:#fff;border:1px solid var(--line);font:9px var(--mono);color:#64758b;z-index:2}
    .inspector-head{padding:14px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#fff;z-index:4}.inspector-head h2{font-size:14px;margin:5px 0 3px}.inspector-head p{margin:0;color:var(--subtle);font-size:10px}.mode-switch{display:grid;grid-template-columns:1fr 1fr;background:#edf1f6;padding:3px;border-radius:6px;margin-top:12px}.mode-switch button{border:0;background:transparent;padding:6px;border-radius:4px;color:#728095;font-size:11px}.mode-switch button.active{background:#fff;color:#2e4e9d;box-shadow:0 1px 4px #182a4710}
    .inspector-body{padding:14px}.field{margin-bottom:13px}.field label{display:flex;justify-content:space-between;gap:8px;color:#65748a;font-size:10px;margin-bottom:6px}.field label span{color:#9aa5b5}.field input,.field select,.field textarea{width:100%;border:1px solid #cfd8e4;border-radius:5px;background:#fff;padding:7px 8px;font-size:11px}.field textarea{resize:vertical;min-height:70px;font-family:var(--mono);line-height:1.55}.field code{font:10px var(--mono);color:#3159b9;background:#edf2ff;padding:2px 4px;border-radius:3px}.field-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.field>small{display:block;color:#8c9aab;font-size:10px;line-height:1.5;margin-top:5px}.data-contract{margin:17px 0;padding-top:13px;border-top:1px solid var(--line)}.input-binding{border:1px solid #dce5f3;background:#f8faff;border-radius:6px;padding:8px;margin:8px 0}.input-binding .bind-row{padding:0 0 8px;border:0;color:#506581;font-size:10px}.input-binding .bind-row span:last-child{font:9px var(--mono);color:#6682c3}.input-binding .field{margin-bottom:0}.input-binding .field-grid{grid-template-columns:1fr}.node-actions{display:flex;gap:6px;flex-wrap:wrap;padding-top:11px;border-top:1px solid var(--line)}.hint{background:#f3f6fa;border:1px solid #e1e7ef;border-radius:6px;padding:9px;color:#6d7b8e;font-size:10px;line-height:1.55;margin-bottom:12px}.hint strong{color:#40506a}.toggle-row{display:flex;justify-content:space-between;align-items:center;border:1px solid var(--line);padding:8px;border-radius:5px;margin-bottom:10px}.switch{width:34px;height:19px;border-radius:20px;background:#b8c2cf;position:relative;border:0;padding:0}.switch::after{content:"";position:absolute;width:15px;height:15px;border-radius:50%;background:#fff;left:2px;top:2px;transition:.15s}.switch.on{background:#3e67df}.switch.on::after{left:17px}

    /* Test drawer */
    .test-drawer{position:absolute;left:0;right:316px;bottom:0;height:0;background:#fff;border-top:1px solid var(--line-strong);z-index:10;overflow:hidden;transition:height .22s ease;box-shadow:0 -8px 24px rgba(24,39,62,.1)}.test-drawer.open{height:360px}.test-head{height:46px;padding:0 14px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}.test-head h3{font-size:13px;margin:0}.test-grid{height:314px;display:grid;grid-template-columns:280px minmax(0,1fr)}.test-input{padding:12px;border-right:1px solid var(--line);overflow:auto}.test-input textarea{width:100%;height:118px;border:1px solid var(--line-strong);border-radius:6px;padding:9px;font-size:11px;line-height:1.5;resize:none}.test-options{display:flex;gap:12px;color:#66758a;font-size:10px;margin:8px 0}.test-result{overflow:auto;padding:11px}.run-summary{display:flex;gap:8px;margin-bottom:9px}.run-chip{background:#f3f6fa;border:1px solid var(--line);border-radius:5px;padding:6px 8px;font:9px var(--mono)}.run-list{display:grid;gap:5px}.run-row{display:grid;grid-template-columns:20px minmax(120px,1fr) 78px 70px 70px;align-items:center;gap:8px;border:1px solid #e4e9f0;border-radius:5px;padding:7px 8px;font-size:10px}.run-row .seq{font:9px var(--mono);color:#8795a8}.run-row .run-name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.run-row .run-status{font:9px var(--mono);color:#74839a}.run-row.success .run-status{color:var(--green)}.run-row.failed .run-status{color:var(--red)}.run-row.skipped .run-status{color:#8f9bab}.run-row.running .run-status{color:var(--amber)}.run-row span:nth-last-child(-n+2){font:9px var(--mono);color:#718096;text-align:right}

    .modal-layer{position:fixed;inset:0;background:rgba(12,23,40,.42);z-index:50;display:none;align-items:center;justify-content:center;padding:24px}.modal-layer.open{display:flex}.modal{width:min(760px,100%);max-height:88vh;overflow:auto;background:#fff;border-radius:9px;box-shadow:0 24px 80px rgba(9,21,38,.27)}.modal-head{position:sticky;top:0;z-index:3;background:#fff;padding:17px 19px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.modal-head h2{font-size:15px;margin:0}.modal-body{padding:18px 19px}.modal-foot{position:sticky;bottom:0;z-index:3;background:#fff;padding:13px 19px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px}.close{border:0;background:transparent;font-size:19px;color:#8290a3}
    .template-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.template{border:1px solid var(--line);border-radius:7px;padding:13px;background:#fff;cursor:pointer;text-align:left}.template:hover{border-color:#7391eb;box-shadow:0 5px 16px rgba(42,72,130,.08)}.template .tpl-icon{width:34px;height:34px;display:grid;place-items:center;border-radius:6px;background:#edf2ff;color:#315cca;font:11px var(--mono);margin-bottom:12px}.template b{display:block}.template p{font-size:10px;color:var(--muted);line-height:1.55;margin:7px 0 10px}.template small{color:#8794a6}
    .bind-list{border:1px solid var(--line);border-radius:6px;overflow:hidden}.bind-row{padding:10px 11px;display:flex;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line)}.bind-row:last-child{border-bottom:0}.bind-row small{color:var(--subtle)}
    .toast{position:fixed;top:72px;left:50%;transform:translateX(-50%);background:#16243a;color:#fff;padding:9px 14px;border-radius:6px;box-shadow:var(--shadow);z-index:80;font-size:11px;animation:toast-in .18s ease}@keyframes toast-in{from{opacity:0;transform:translate(-50%,-8px)}}
    .readonly-banner{background:#fff5e5;border:1px solid #efd7ab;color:#9a681f;padding:7px 10px;border-radius:5px;font-size:10px}

<body>
  <div class="app">
    <aside class="sider">
      <div class="brand"><div class="brand-mark">WF</div><div><strong>模型控制台</strong><small>MODEL CONTROL PLANE</small></div></div>
      <nav class="nav" id="nav"></nav>
      <div class="sider-foot"><span class="system-dot"></span>演示环境正常<br>私有化控制面 · 本地数据</div>
    </aside>
    <section class="shell">
      <header class="topbar">
        <div class="crumb"><span>内部平台</span><span>/</span><b id="crumb">编排工作流</b></div>

  <script>
  (()=>{
    'use strict';
    const STORAGE_KEY='fde-orchestration-studio-v1';
    const money=n=>'¥'+Number(n||0).toFixed(4);
    const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const clone=v=>JSON.parse(JSON.stringify(v));
    const nodeMeta={
      input:{label:'输入',code:'IN',group:'输入与数据',cls:'data',desc:'接收任务变量'},
      context:{label:'上下文获取',code:'CTX',group:'输入与数据',cls:'data',desc:'获取会话与画像'},
      transform:{label:'文本预处理',code:'TX',group:'处理',cls:'data',desc:'清洗和结构化'},
      model:{label:'模型调用',code:'LLM',group:'模型',cls:'model',desc:'调用已注册服务'},
      condition:{label:'条件分支',code:'IF',group:'控制',cls:'control',desc:'根据字段路由'},
      parallel:{label:'并行分发',code:'PAR',group:'控制',cls:'control',desc:'同时执行多个节点'},
      merge:{label:'结果汇聚',code:'JOIN',group:'控制',cls:'control',desc:'等待并行结果'},
      output:{label:'JSON 输出',code:'OUT',group:'输出',cls:'output',desc:'按标准协议返回'}
    };
    const seededOutputs={n1:'task',n2:'normalized_messages',n3:'risk_signal',n4:'route_payload',n5:'conversation_context',n6:'customer_profile',n7:'evidence',n8:'risk_result',n9:'quality_result',n10:'no_risk_result'};
    const outputName=n=>n.outputKey||seededOutputs[n.id]||`${n.id}_output`;
    const edgeBinding=(edge,source)=>({sourcePath:edge.sourcePath||`$.${outputName(source)}`,targetKey:edge.targetKey||outputName(source)});
    function materializeSnapshotBindings(snapshot){if(!Array.isArray(snapshot?.nodes)||!Array.isArray(snapshot?.edges))return;let inferred=false;snapshot.edges=snapshot.edges.map(edge=>{const source=snapshot.nodes.find(n=>n.id===edge.from);if(!source)return edge;if(!edge.sourcePath||!edge.targetKey)inferred=true;return {...edge,...edgeBinding(edge,source)}});if(inferred)snapshot.inferredBindings=true}
    const makeNode=(id,type,name,x,y,extra={})=>({id,type,name,x,y,enabled:true,service:type==='model'?'qwen3.6-plus':'',endpoint:type==='model'?'/v1/chat/completions':'',method:'POST',authRef:'MODEL_GATEWAY_KEY',timeout:type==='model'?null:30,retries:1,requestMap:'{{input}}',responsePath:'$.output',prompt:'',...extra});
    const riskNodes=()=>[
      makeNode('n1','input','会话任务输入',40,115,{requestMap:'conversation, target_id, variables'}),
      makeNode('n2','transform','消息标准化',240,115,{responsePath:'$.normalized_messages'}),
      makeNode('n3','model','快速风险筛查',440,115,{service:'omni-27b-fast',endpoint:'/model/omni-27b-fast',prompt:'仅判断是否存在需要进一步检查的风险信号。'}),
      makeNode('n4','condition','是否需要深度判定',640,115,{requestMap:'risk_signal == true'}),
      makeNode('n5','context','会话上下文',640,255,{endpoint:'/conversation/context',requestMap:'before:50, after:50'}),
      makeNode('n6','context','客户与员工画像',860,255,{endpoint:'/profile/snapshot',requestMap:'customer_id, employee_id'}),
      makeNode('n7','merge','证据与画像汇聚',750,385),
      makeNode('n8','model','深度风险判定',750,515,{service:'qwen3.6-plus',endpoint:'/model/qwen3.6-plus',prompt:'结合规则、上下文及业务证据输出结构化判断。',timeout:60,retries:2}),
      makeNode('n9','output','统一质检结果',750,645,{responsePath:'$.rule_results[]'}),
      makeNode('n10','output','无风险快速返回',860,115,{responsePath:'$.status = no_risk'})
    ];
    const riskEdges=()=>[
      {from:'n1',to:'n2'},{from:'n2',to:'n3'},{from:'n3',to:'n4'},
      {from:'n4',to:'n5',label:'YES'},{from:'n4',to:'n6',label:'YES'},{from:'n4',to:'n10',label:'NO',dashed:true},
      {from:'n5',to:'n7'},{from:'n6',to:'n7'},{from:'n7',to:'n8'},{from:'n8',to:'n9'}
    ];
    const cloudServiceExample={id:'cloud-qwen-demo',name:'千问公有云演示服务',mode:'cloud',type:'LLM',provider:'阿里云百炼',protocol:'openai-chat',baseUrl:'https://dashscope.aliyuncs.com/compatible-mode/v1',endpoint:'https://dashscope.aliyuncs.com/compatible-mode/v1',modelId:'qwen3.6-plus',region:'华北2（北京）',authMode:'api-key',credentialRef:'QWEN_CLOUD_DEMO_KEY',credentialStatus:'未配置',revision:1,status:'待接入',latency:'—',priceIn:0,priceOut:0,timeout:30};
    const defaults={
      serviceSchemaVersion:2,
      workflows:[
        {id:'WF-RISK-2STAGE',name:'会话风险两阶段识别',alias:'会话综合质检模型',description:'单条消息快速筛查，命中后拉取上下文与画像做深度判定。',status:'已发布',version:'v2.1',updated:'2026-11-02 15:42',owner:'陈岩',boundModels:['销售会话综合风控模型 v1.2','客户投诉识别模型 v2.0'],nodes:riskNodes(),edges:riskEdges(),history:[{version:'v2.0',note:'增加客户画像并行获取'},{version:'v1.0',note:'首次发布'}],lastTest:'通过 · 482 ms',testFingerprint:'seed',dirty:false,releaseNote:'两阶段识别与上下文精判'},
        {id:'WF-MATERIAL-PRECHECK',name:'营销素材多模态审核',alias:'素材合规审核模型',description:'解析图文、音视频转写和 OCR 结果，统一进入合规判定。',status:'已发布',version:'v1.4',updated:'2026-10-31 18:20',owner:'周敏',boundModels:['营销素材审核模型 v1.0'],nodes:[makeNode('m1','input','素材输入',100,150),makeNode('m2','parallel','内容解析分发',350,150),makeNode('m3','model','OCR / ASR 解析',610,70,{service:'qwen3-vl-plus'}),makeNode('m4','model','视觉语义理解',610,240,{service:'qwen3-vl-max'}),makeNode('m5','merge','解析结果汇聚',850,150),makeNode('m6','model','合规判定',850,390),makeNode('m7','output','审核 JSON',550,540)],edges:[{from:'m1',to:'m2'},{from:'m2',to:'m3'},{from:'m2',to:'m4'},{from:'m3',to:'m5'},{from:'m4',to:'m5'},{from:'m5',to:'m6'},{from:'m6',to:'m7'}],history:[],lastTest:'通过 · 1.84 s',testFingerprint:'seed',dirty:false,releaseNote:'统一多模态解析'},
        {id:'WF-VOICE-QA',name:'语音质检基础流程',alias:'语音质检模型',description:'语音转写、说话人分离与质检判定。',status:'草稿',version:'v0.3',updated:'2026-11-01 11:05',owner:'魏光',boundModels:[],nodes:[makeNode('v1','input','录音文件',100,150),makeNode('v2','model','ASR 转写',370,150,{service:'paraformer-v2'}),makeNode('v3','transform','说话人分离',640,150),makeNode('v4','model','质检判定',870,150),makeNode('v5','output','质检结果',870,390)],edges:[{from:'v1',to:'v2'},{from:'v2',to:'v3'},{from:'v3',to:'v4'},{from:'v4',to:'v5'}],history:[],lastTest:'未测试',testFingerprint:null,dirty:true,releaseNote:''}
      ],
      services:[
        {id:'omni-27b-fast',type:'LLM',provider:'私有化',endpoint:'/model/omni-27b-fast',status:'正常',latency:'86 ms',priceIn:0.8,priceOut:1.6},
        {id:'qwen3.6-plus',type:'LLM',provider:'模型网关',endpoint:'/model/qwen3.6-plus',status:'正常',latency:'328 ms',priceIn:2.0,priceOut:8.0},
        {id:'qwen3-vl-plus',type:'VLM',provider:'模型网关',endpoint:'/model/qwen3-vl-plus',status:'正常',latency:'912 ms',priceIn:3.0,priceOut:9.0},
        {id:'qwen3-vl-max',type:'VLM',provider:'模型网关',endpoint:'/model/qwen3-vl-max',status:'限流',latency:'1.42 s',priceIn:8.0,priceOut:24.0},
        {id:'paraformer-v2',type:'ASR',provider:'私有化',endpoint:'/model/paraformer-v2',status:'正常',latency:'0.31x',priceIn:0.4,priceOut:0},
        clone(cloudServiceExample)
      ],
      executions:[
        {id:'RUN-20261102-019',workflow:'会话风险两阶段识别',version:'v2.1',source:'销售会话综合风控模型 v1.2',time:'11-02 15:42:18',status:'成功',duration:482,input:2830,output:1012,cost:.0138},
        {id:'RUN-20261102-018',workflow:'营销素材多模态审核',version:'v1.4',source:'营销素材审核模型 v1.0',time:'11-02 15:36:04',status:'成功',duration:1840,input:6120,output:882,cost:.0274},
        {id:'RUN-20261102-017',workflow:'会话风险两阶段识别',version:'v2.1',source:'API 调试',time:'11-02 15:18:45',status:'失败',duration:30121,input:724,output:0,cost:.0006},
        {id:'RUN-20261102-016',workflow:'会话风险两阶段识别',version:'v2.1',source:'API 调试',time:'11-02 14:57:22',status:'成功',duration:511,input:3240,output:944,cost:.0140}
      ]
    };
    let data=load();
    normalizeWorkflowData();
    normalizeServiceData();
    save();
    let ui={view:'workflows',editingId:'WF-RISK-2STAGE',selectedNode:'n3',advanced:false,paletteOpen:false,testOpen:false,testing:false,runRows:[],lastRun:null,simulateFailure:false,runSample:'',scale:1,connecting:null,pendingConnection:null,serviceFilter:'all',serviceDraft:null,serviceSecretEntered:false};

    function load(){try{const v=JSON.parse(localStorage.getItem(STORAGE_KEY));if(v&&Array.isArray(v.workflows))return v;}catch(e){}return clone(defaults)}
    function normalizeWorkflowData(){for(const w of data.workflows){if(w.status==='已发布'&&!w.publishedSnapshot&&!w.dirty)w.publishedSnapshot={version:w.version,nodes:clone(w.nodes),edges:clone(w.edges),note:w.releaseNote||'',updated:w.updated};materializeSnapshotBindings(w.publishedSnapshot);for(const historical of w.history||[])materializeSnapshotBindings(historical);if(w.boundModels?.length&&!w.bindingVersion)w.bindingVersion=w.version}}
    function normalizeServiceData(){for(const service of data.services){service.mode=service.mode||'private';service.name=service.name||service.id;service.baseUrl=service.baseUrl||service.endpoint;service.modelId=service.modelId||service.id;service.protocol=service.protocol||(service.type==='ASR'?'custom-http':'openai-chat');service.authMode=service.authMode||'gateway';service.revision=service.revision||1;service.timeout=service.timeout||30;service.priceUnit=service.type==='ASR'?'audio-minute':'token-million';service.credentialStatus=service.credentialStatus||'演示配置'}if(!data.serviceSchemaVersion){if(!data.services.some(s=>s.mode==='cloud'))data.services.push(clone(cloudServiceExample));data.serviceSchemaVersion=2}}
    function save(){localStorage.setItem(STORAGE_KEY,JSON.stringify(data))}
    function current(){return data.workflows.find(x=>x.id===ui.editingId)}
    function fingerprint(w=current()){return JSON.stringify({nodes:w.nodes,edges:w.edges})}
    function serviceFingerprint(w=current()){return JSON.stringify([...new Set(w.nodes.filter(n=>n.enabled&&n.type==='model').map(n=>n.service))].sort().map(id=>{const s=data.services.find(x=>x.id===id);return s?{id:s.id,revision:s.revision,status:s.status,credentialStatus:s.credentialStatus}:null}))}
    function serviceReadinessError(w=current()){for(const id of new Set(w.nodes.filter(n=>n.enabled&&n.type==='model').map(n=>n.service))){const s=data.services.find(x=>x.id===id);if(!s)return `模型服务 ${id} 未注册`;if(s.status!=='正常')return `模型服务 ${s.name||id} 尚未通过接入验证，不能发布`;}return ''}
    function nextVersion(v){const m=/^v(\d+)\.(\d+)$/.exec(v||'');return m?`v${m[1]}.${Number(m[2])+1}`:'v1.0'}
    function toast(msg){document.getElementById('toast').innerHTML=`<div class="toast">${esc(msg)}</div>`;clearTimeout(toast.timer);toast.timer=setTimeout(()=>document.getElementById('toast').innerHTML='',2600)}
    function tag(text,type=''){return `<span class="tag ${type}">${esc(text)}</span>`}
    function btn(text,action,cls=''){return `<button class="btn ${cls}" onclick="${action}">${text}</button>`}

    function renderNav(){const groups=[['编排中心',[['workflows','◈','编排工作流'],['services','◉','模型服务']]],['运行治理',[['billing','≡','执行与计费']]]];document.getElementById('nav').innerHTML=groups.map(([g,items])=>`<div class="nav-label">${g}</div>${items.map(([id,icon,label])=>`<button class="${ui.view===id||ui.view==='editor'&&id==='workflows'?'active':''}" onclick="go('${id}')"><span class="nav-icon">${icon}</span><span>${label}</span></button>`).join('')}`).join('')}
    function go(view){if(ui.testing)return toast('请先等待当前测试完成');cancelConnection();cancelPendingConnection();ui.view=view;ui.testOpen=false;render()}
    function render(){renderNav();const c=document.getElementById('content'),oldViewport=c.querySelector('#canvasViewport'),scroll=oldViewport?{left:oldViewport.scrollLeft,top:oldViewport.scrollTop,content:c.scrollTop}:null;c.className='content'+(ui.view==='editor'?' editor-mode':'');document.getElementById('crumb').textContent={workflows:'编排工作流',services:'模型服务',billing:'执行与计费',editor:'工作流编辑器'}[ui.view]||'';c.innerHTML=ui.view==='editor'?renderEditor():ui.view==='services'?renderServices():ui.view==='billing'?renderBilling():renderWorkflows();if(ui.view==='editor')requestAnimationFrame(()=>{drawWires();fitCanvas();if(scroll){const viewport=document.getElementById('canvasViewport');viewport.scrollLeft=scroll.left;viewport.scrollTop=scroll.top;c.scrollTop=scroll.content}})}

    function renderWorkflows(){const published=data.workflows.filter(x=>x.status==='已发布').length,totalRefs=data.workflows.reduce((s,x)=>s+x.boundModels.length,0),sampleCost=data.executions.reduce((s,x)=>s+x.cost,0);return `
      <div class="page-head"><div><div class="eyebrow">WORKFLOW REGISTRY</div><h1>编排工作流</h1><p>将多个模型服务组合为可发布的“基础模型”，供风控模型 Step 1 选择。</p></div><div class="actions">${btn('恢复演示数据','resetDemo()')}${btn('＋ 新建工作流','openCreate()','primary')}</div></div>
      <div class="stats"><div class="stat"><label>工作流</label><b>${data.workflows.length}</b><small>内部技术资产</small></div><div class="stat"><label>已发布</label><b>${published}</b><small>可作为基础模型</small></div><div class="stat"><label>风控模型引用</label><b>${totalRefs}</b><small>锁定工作流版本</small></div><div class="stat"><label>样例调用成本</label><b style="font-family:var(--mono);font-size:20px">${money(sampleCost)}</b><small>${data.executions.length} 次演示调用汇总</small></div></div>
      <div class="notice"><b>概念边界：</b>这里的工作流是内部技术配置；在风控模型页面中仅以“基础模型”的业务名称展示。工作流升级不会自动替换已发布风控模型的引用。</div>
      <section class="card"><div class="card-head"><h2>工作流目录</h2><small>只有测试通过的版本可发布</small></div><div class="table-wrap"><table><thead><tr><th>工作流 / 对外名称</th><th>版本</th><th>节点</th><th>最近测试</th><th>风控模型引用</th><th>状态</th><th>操作</th></tr></thead><tbody>${data.workflows.map(w=>`<tr><td><div class="workflow-name"><span class="wf-glyph">WF</span><div><b>${esc(w.name)}</b><small>对外：${esc(w.alias)} · ${esc(w.description)}</small></div></div></td><td><b>${esc(w.version)}</b><small>${esc(w.updated)}</small></td><td>${w.nodes.length}<small>${w.edges.length} 条路由</small></td><td>${esc(w.lastTest)}</td><td>${w.boundModels.length}<small>${w.boundModels[0]?esc(w.boundModels[0]):'尚未被引用'}</small></td><td>${tag(w.status,w.status==='已发布'?'green':'amber')}${w.dirty?' '+tag('有未发布变更','blue'):''}</td><td>${btn('打开编排',`editWorkflow('${w.id}')`,'small')}</td></tr>`).join('')}</tbody></table></div></section>`}

    function renderServices(){
      const privateCount=data.services.filter(s=>s.mode==='private').length,cloudCount=data.services.length-privateCount,list=data.services.filter(s=>ui.serviceFilter==='all'||s.mode===ui.serviceFilter),linked=new Set(data.workflows.flatMap(w=>w.nodes.filter(n=>n.type==='model').map(n=>n.service)));
      return `<div class="page-head"><div><div class="eyebrow">MODEL SERVICE REGISTRY</div><h1>模型服务</h1><p>先注册可调用的模型服务，再由编排节点按服务 ID 引用。</p></div>${btn('＋ 注册服务','openServiceEditor()','primary')}</div>

      ui.connecting={pointerId:event.pointerId,from:node.dataset.node,label:port.dataset.label||'',port:port.classList.contains('bottom')||port.classList.contains('yes')?'bottom':'right',start,path,target:null,startClientX:event.clientX,startClientY:event.clientY,sourcePort:port};
    }
    function moveConnection(event){
      const c=ui.connecting;if(!c||event.pointerId!==c.pointerId)return;
      const end=canvasPoint(event.clientX,event.clientY),bend=c.port==='bottom'?Math.max(30,(end.y-c.start.y)/2):Math.max(30,(end.x-c.start.x)/2);
      c.path.setAttribute('d',c.port==='bottom'?`M ${c.start.x} ${c.start.y} C ${c.start.x} ${c.start.y+bend}, ${end.x} ${end.y-bend}, ${end.x} ${end.y}`:`M ${c.start.x} ${c.start.y} C ${c.start.x+bend} ${c.start.y}, ${end.x-bend} ${end.y}, ${end.x} ${end.y}`);
      const target=dropNode(event.clientX,event.clientY);if(c.target!==target){c.target?.classList.remove('drop-target');c.target=target&&target.dataset.node!==c.from&&!target.classList.contains('disabled')?target:null;c.target?.classList.add('drop-target')}

    function endConnection(event){const c=ui.connecting;if(!c||event.pointerId!==c.pointerId)return;event.preventDefault();event.stopPropagation();const target=dropNode(event.clientX,event.clientY),to=target?.dataset.node,moved=Math.hypot(event.clientX-c.startClientX,event.clientY-c.startClientY);cancelConnection();if(to&&to!==c.from)connectNodes(c.from,to,c.label,c.port);else if(moved<8)chooseConnection({currentTarget:c.sourcePort});else toast('请将连线放到目标节点上')}
    function cancelConnection(){const c=ui.connecting;if(!c)return;c.target?.classList.remove('drop-target');c.path?.remove();ui.connecting=null}
    function removeEdge(index){const w=current(),edges=w.edges.filter(e=>e.from===ui.selectedNode);w.edges.splice(w.edges.indexOf(edges[index]),1);markDirty();render()}

    function saveDraft(){save();toast('草稿已保存到当前浏览器')}

    function renderTestDrawer(){const sample='客户（MSG-001）：再不处理我就打 12386 投诉，并且要求退费。';return `<section class="test-drawer ${ui.testOpen?'open':''}"><div class="test-head"><h3>工作流测试台 <span class="tag blue">本地模拟</span></h3><div class="actions"><button class="btn small" onclick="closeTest()">收起</button></div></div><div class="test-grid"><div class="test-input"><label style="display:block;font-size:10px;color:var(--muted);margin-bottom:6px">模拟任务输入</label><textarea id="testSample" oninput="ui.runSample=this.value">${esc(ui.runSample||sample)}</textarea><div class="test-options"><label><input type="checkbox" ${ui.simulateFailure?'checked':''} onchange="ui.simulateFailure=this.checked"> 模拟深度模型首次超时</label></div><button class="btn primary" style="width:100%" onclick="runTest()" ${ui.testing?'disabled':''}>${ui.testing?'正在执行…':'▶ 运行全流程'}</button><p class="hint" style="margin-top:10px">本地模拟校验路由与映射，不验证真实模型连接。Token 费用按演示单价估算；ASR 未提供音频时长时不估算费用。</p></div><div class="test-result">${renderRunResult()}</div></div></section>`}
    function renderRunResult(){if(!ui.runRows.length)return '<div class="empty" style="padding:70px 20px">运行后将逐节点展示状态、耗时、Token 和费用</div>';const done=ui.runRows.filter(x=>x.status==='成功').length,totalTokens=ui.runRows.reduce((s,x)=>s+x.tokens,0),cost=ui.runRows.reduce((s,x)=>s+x.cost,0),duration=ui.runRows.reduce((s,x)=>s+x.duration,0);return `<div class="run-summary"><span class="run-chip">已执行 ${done} / ${ui.runRows.length}</span><span class="run-chip">${duration} ms</span><span class="run-chip">${totalTokens.toLocaleString()} Token</span><span class="run-chip">${money(cost)}</span>${ui.lastRun?.outcome?`<span class="run-chip">${esc(ui.lastRun.outcome)}</span>`:''}</div><div class="run-list">${ui.runRows.map((x,i)=>{const statusCls={'成功':'success','失败':'failed','运行中':'running','跳过':'skipped'}[x.status]||'';return `<div class="run-row ${statusCls}"><span class="seq">${String(i+1).padStart(2,'0')}</span><span class="run-name">${esc(x.name)}${x.attempts>1?' · 重试 '+(x.attempts-1)+' 次':''}</span><span class="run-status">${x.status==='成功'?'✓ 成功':x.status==='失败'?'× 失败':x.status==='运行中'?'... 运行中':x.status==='跳过'?'— 未走此分支':'等待'}</span><span>${x.duration?x.duration+' ms':'—'}</span><span>${x.tokens?x.tokens+' tk':'—'}</span></div>`}).join('')}</div>`}
    function openTest(){cancelConnection();cancelPendingConnection();ui.testOpen=true;render()}
    function closeTest(){if(ui.testing)return toast('运行中不能收起');ui.testOpen=false;render()}
    async function runTest(){
      if(ui.testing)return;
       const w=current(),sample=document.getElementById('testSample')?.value.trim(),error=validateWorkflow(w);
      if(!sample)return toast('请输入测试内容');
      if(error)return toast(error);
       ui.runSample=sample;ui.testing=true;ui.lastRun=null;
       const runFingerprint=fingerprint(w),runServiceFingerprint=serviceFingerprint(w),snapshot=clone(w),order=topological(snapshot),risk=/12386|投诉|退款|退费|违规|保证收益|风险/.test(sample),reached=new Set(order.filter(n=>n.type==='input').map(n=>n.id));
       let branchRisk=risk;
      ui.runRows=order.map(n=>({id:n.id,name:n.name,status:'等待',duration:0,input:0,output:0,tokens:0,cost:0,attempts:0}));render();
      let failed=false;
      for(const n of order){
        const row=ui.runRows.find(x=>x.id===n.id);
         if(!reached.has(n.id)){row.status='跳过';render();continue}
         if(n.type==='merge'&&snapshot.edges.some(e=>e.to===n.id&&reached.has(e.from)&&ui.runRows.find(x=>x.id===e.from)?.status!=='成功')){row.status='失败';failed=true;render();break}
        row.status='运行中';render();await wait(90);
        const firstTimeout=ui.simulateFailure&&n.type==='model'&&n.name.includes('深度');
        row.attempts=firstTimeout?Math.min(2,Number(n.retries||0)+1):1;
        row.duration=(n.type==='model'?180:26)*row.attempts;
         const service=data.services.find(x=>x.id===n.service);
        if(n.type==='model'&&service?.type==='ASR'){
          row.billingNote='未提供音频时长，ASR 费用未估算';
        }else if(n.type==='model'){
          row.input=(720+sample.length*2)*row.attempts;
          row.output=firstTimeout&&row.attempts===1?0:220;
          row.tokens=row.input+row.output;
          row.cost=(row.input*(service?.priceIn||0)+row.output*(service?.priceOut||0))/1000000;
        }
        if(firstTimeout&&row.attempts===1){row.status='失败';failed=true;render();break}
        row.status='成功';
         if(n.type==='condition')branchRisk=conditionResult(n,sample,risk,conditionInputs(snapshot,n));
         for(const edge of snapshot.edges.filter(x=>x.from===n.id)){
           if(n.type==='condition'&&edge.label!==(branchRisk?'YES':'NO'))continue;
          reached.add(edge.to);
        }
        render();
      }
       if(fingerprint(w)!==runFingerprint||serviceFingerprint(w)!==runServiceFingerprint)failed=true;
       if(failed)for(const row of ui.runRows.filter(x=>x.status==='等待'))row.status='跳过';
      const input=ui.runRows.reduce((s,x)=>s+x.input,0),output=ui.runRows.reduce((s,x)=>s+x.output,0),cost=ui.runRows.reduce((s,x)=>s+x.cost,0),duration=ui.runRows.reduce((s,x)=>s+x.duration,0);
       ui.lastRun={tokens:input+output,cost,duration,outcome:failed?'失败':branchRisk?'命中条件，进入深度判定':'未命中条件，快速返回'};
      ui.testing=false;w.lastTest=(failed?'失败':'通过')+' · '+duration+' ms';w.testFingerprint=failed?null:fingerprint(w);w.testServiceFingerprint=failed?null:serviceFingerprint(w);
      w.updated=new Date().toLocaleString('zh-CN',{hour12:false}).replaceAll('/','-');
      data.executions.unshift({id:'RUN-'+Date.now(),workflow:w.name,version:w.version,source:'编排测试台',time:w.updated,status:failed?'失败':'成功',duration,input,output,cost});
      save();render();toast(failed?'流程测试失败或配置已变化，请重新测试':'本地编排模拟通过；服务连通性仍需单独验证');
    }
    function wait(ms){return new Promise(r=>setTimeout(r,ms))}

    function openPublish(){const w=current(),error=validateWorkflow(w);if(error)return toast(error);const serviceError=serviceReadinessError(w);if(serviceError)return toast(serviceError);if(w.testFingerprint!==fingerprint(w)||w.testServiceFingerprint!==serviceFingerprint(w))return toast('当前配置未通过测试，不能发布');if(w.status==='已发布'&&!w.dirty)return toast('当前已是发布版本，请修改草稿后再发布');const next=w.status==='已发布'?nextVersion(w.version):w.version;showModal('发布工作流版本',`<div class="notice"><b>发布后冻结：</b>节点、路由、模型服务、默认 Prompt、输入输出协议和失败策略。<br>风控模型不会自动从 ${esc(w.version)} 切换到 ${esc(next)}。</div><div class="field-grid"><div class="field"><label>拟发布版本</label><input value="${esc(next)}" disabled></div><div class="field"><label>测试结果</label><input value="${esc(w.lastTest)}" disabled></div></div><div class="field"><label>版本说明 *</label><textarea id="publishNote" placeholder="说明节点、模型或协议变更">${esc(w.releaseNote||'')}</textarea></div>`,`<button class="btn" onclick="closeModal()">取消</button><button class="btn primary" onclick="confirmPublish('${esc(next)}')">确认发布</button>`)}
    function confirmPublish(version){const note=document.getElementById('publishNote')?.value.trim();if(!note)return toast('请填写版本说明');const w=current();if(validateWorkflow(w)||serviceReadinessError(w)||w.testFingerprint!==fingerprint(w)||w.testServiceFingerprint!==serviceFingerprint(w))return toast('配置或模型服务已变化，请重新验证和测试');if(w.status==='已发布'&&w.publishedSnapshot)w.history.unshift(clone(w.publishedSnapshot));w.version=version;w.status='已发布';w.releaseNote=note;w.dirty=false;w.updated=new Date().toLocaleString('zh-CN',{hour12:false}).replaceAll('/','-');const serviceIds=[...new Set(w.nodes.filter(n=>n.type==='model').map(n=>n.service))];w.publishedSnapshot={version,nodes:clone(w.nodes),edges:w.edges.map(edge=>({...clone(edge),...edgeBinding(edge,w.nodes.find(n=>n.id===edge.from))})),serviceConfigs:serviceIds.map(id=>data.services.find(s=>s.id===id)).filter(Boolean).map(clone),note,updated:w.updated};save();closeModal();render();toast('已发布 '+version+'，风控模型可在 Step 1 选择该版本')}
    function showVersions(){const w=current(),versions=[w.publishedSnapshot,...(w.history||[])].filter(Boolean);showModal('已发布版本',`<div class="notice">已发布配置以版本快照保存。当前画布的未发布修改不会覆盖这些快照。</div><div class="bind-list">${versions.map((v,i)=>`<div class="bind-row"><span><b>${esc(v.version)}</b><small>${esc(v.note||'历史演示版本')} · ${esc(v.updated||'时间未提供')}</small></span><span>${v.nodes?`${v.nodes.length} 节点 · ${v.edges.length} 连线 <button class="btn small" onclick="showVersionDetail(${i})">查看配置</button>`:'历史配置未留存'}</span></div>`).join('')||'<div class="empty">尚无已发布版本</div>'}</div>`,`<button class="btn primary" onclick="closeModal()">关闭</button>`)}
    function showVersionDetail(index){
      const w=current(),v=[w.publishedSnapshot,...(w.history||[])].filter(Boolean)[index];if(!v?.nodes)return toast('该历史演示版本没有配置快照');
      const rows=v.nodes.map(n=>{const routes=v.edges.filter(e=>e.from===n.id).map(e=>{const target=v.nodes.find(x=>x.id===e.to),binding=edgeBinding(e,n);return `${e.label?e.label+' · ':''}${target?.name||e.to}：${binding.sourcePath} → ${binding.targetKey}`});return `<div class="bind-row"><span><b>${esc(n.name)}</b><small>${esc(n.type)} · 输出 ${esc(outputName(n))}</small>${n.prompt?`<small>Prompt：${esc(n.prompt)}</small>`:''}${n.responsePath?`<small>响应路径：${esc(n.responsePath)}</small>`:''}</span><span>${esc(routes.join('；')||'终点')}</span></div>`}).join('');
      const services=v.serviceConfigs?`<div class="service-section"><b>本版模型服务快照</b></div><div class="bind-list">${v.serviceConfigs.map(s=>`<div class="bind-row"><span><b>${esc(s.name||s.id)}</b><small>${esc(s.id)} · r${s.revision||1} · ${esc(s.mode==='cloud'?'公有云 API':'私有化部署')}</small></span><span>${esc(s.modelId||s.id)}<small>${esc(s.baseUrl||s.endpoint)}</small></span></div>`).join('')}</div>`:'<div class="hint">旧演示版本未留存当时的模型服务配置，无法核对历史接入地址。</div>';
      showModal(v.version+' · 只读配置',`<div class="notice">${esc(v.note||'版本说明未提供')} · ${esc(v.updated||'时间未提供')}${v.inferredBindings?'<br>该旧演示版本未保存原始字段映射，下方展示按节点输出名推定的默认映射。':''}</div>${services}<div class="service-section"><b>节点与数据路由</b></div><div class="bind-list">${rows}</div>`,`<button class="btn" onclick="showVersions()">返回版本</button><button class="btn primary" onclick="closeModal()">关闭</button>`)
    }
    function showBindings(){const w=current();showModal('风控模型引用',`<div class="notice">风控模型页面将该工作流显示为“${esc(w.alias)}”，并锁定所选工作流版本。升级需要重新选择和发布风控模型。</div><div class="bind-list">${w.boundModels.length?w.boundModels.map(x=>`<div class="bind-row"><span><b>${esc(x)}</b><small>Step 1 基础模型</small></span>${tag('已锁定 '+(w.bindingVersion||w.version),'blue')}</div>`).join(''):'<div class="empty">尚未被风控模型引用</div>'}</div>`,`<button class="btn primary" onclick="closeModal()">知道了</button>`)}

    function openCreate(){showModal('新建编排工作流',`<div class="notice"><b>推荐从模板开始。</b>模板只复制节点和协议骨架，不复制真实鉴权凭证。</div><div class="template-grid"><button class="template" onclick="createFlow('risk')"><span class="tpl-icon">2S</span><b>两阶段风险识别</b><p>快速筛查命中后拉取上下文，适合会话实时质检。</p><small>10 节点 · 条件分支</small></button><button class="template" onclick="createFlow('parallel')"><span class="tpl-icon">PAR</span><b>多模型并行评估</b><p>同一份输入交给多个模型，统一汇聚评分。</p><small>7 节点 · 并行汇聚</small></button><button class="template" onclick="createFlow('blank')"><span class="tpl-icon">∅</span><b>空白工作流</b><p>仅创建输入和 JSON 输出，由研发自行增加节点。</p><small>2 节点 · 高级配置</small></button></div>`,'')}
    function createFlow(kind){let nodes,edges,name;if(kind==='risk'){nodes=riskNodes();edges=riskEdges();name='新建两阶段识别流程'}else if(kind==='parallel'){nodes=[makeNode('p1','input','任务输入',100,160),makeNode('p2','parallel','并行调度',350,160),makeNode('p3','model','语义风险模型',620,70),makeNode('p4','model','业务证据模型',620,240),makeNode('p5','merge','汇聚',870,160),makeNode('p6','model','仲裁模型',870,390),makeNode('p7','output','结果输出',570,540)];edges=[{from:'p1',to:'p2'},{from:'p2',to:'p3'},{from:'p2',to:'p4'},{from:'p3',to:'p5'},{from:'p4',to:'p5'},{from:'p5',to:'p6'},{from:'p6',to:'p7'}];name='新建多模型评估流程'}else{nodes=[makeNode('b1','input','任务输入',140,180),makeNode('b2','output','JSON 输出',820,180)];edges=[];name='未命名工作流'}const id='WF-'+Date.now().toString(36).toUpperCase();data.workflows.unshift({id,name,alias:'未命名基础模型',description:'待补充业务用途',status:'草稿',version:'v0.1',updated:new Date().toLocaleString('zh-CN',{hour12:false}),owner:'陈岩',boundModels:[],nodes,edges,history:[],lastTest:'未测试',testFingerprint:null,dirty:true,releaseNote:''});save();closeModal();editWorkflow(id);toast('工作流草稿已创建')}

    function resetDemo(){if(!confirm('确定恢复模型编排工作台的演示数据？不会影响现有合规工作台。'))return;data=clone(defaults);normalizeWorkflowData();normalizeServiceData();save();render();toast('演示数据已恢复')}

    Object.assign(window,{go,editWorkflow,selectNode,nodeClick,chooseConnection,setAdvanced,updateNode,updateOutputKey,updateEdgeBinding,toggleNode,fitCanvas,togglePalette,addEdge,removeEdge,beginConnection,moveConnection,endConnection,cancelConnection,moveNode,copyNode,deleteNode,addNode,saveDraft,openTest,closeTest,runTest,openPublish,confirmPublish,showVersions,showVersionDetail,showBindings,openCreate,createFlow,closeModal,resetDemo,toast,ui,setServiceFilter,openServiceEditor,setServiceField,setServiceMode,setServiceProvider,setServiceType,setServiceAuth,checkServiceDraft,saveService});
