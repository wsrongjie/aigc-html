<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>模型编排工作台 V3 · 多模态研发原型</title>
  <meta name="description" content="内部模型工作流编排、调试、发布与 Token 计费原型">
  <style>
    :root{
      --ink:#17243a;--muted:#66758c;--subtle:#8d9aab;--line:#dce3ec;--line-strong:#c8d2df;

    .brand strong{display:block;color:#fff;font-size:15px;letter-spacing:.4px}.brand small{display:block;color:#8392a9;font-size:10px;margin-top:3px}
    .nav{padding:16px 10px;display:flex;flex-direction:column;gap:4px}.nav-label{padding:9px 10px 5px;color:#708198;font-size:10px;letter-spacing:1.7px}

    .nav button:hover{background:#18273c;color:#fff}.nav button.active{background:#243a63;color:#fff;box-shadow:inset 3px 0 0 #6c8cff}
    .nav-icon{width:18px;text-align:center;font:12px var(--mono);color:#7e94bc}.nav button.active .nav-icon{color:#9db2ff}
    .sider-foot{margin-top:auto;padding:14px 16px;border-top:1px solid #273750;color:#7f8ea3;font-size:10px;line-height:1.7}.system-dot{display:inline-block;width:7px;height:7px;background:#39be90;border-radius:50%;margin-right:6px}
    .shell{min-width:0;min-height:0;display:grid;grid-template-rows:58px minmax(0,1fr)}
    .topbar{background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 22px;min-width:0}
    .crumb{display:flex;align-items:center;gap:8px;color:var(--subtle);font-size:12px}.crumb b{color:var(--ink);font-weight:600}.top-actions{display:flex;align-items:center;gap:10px}
    .env{font-size:10px;padding:4px 7px;background:#edf2f8;border:1px solid #dfe6ee;color:#758399;border-radius:4px}.avatar{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:#e7edff;color:#3159c7;font-weight:700}
    .content{min-width:0;min-height:0;overflow:auto;padding:22px}
    .content.editor-mode{overflow:hidden;padding:0}

    .btn{border:1px solid var(--line-strong);background:#fff;border-radius:6px;padding:7px 11px;color:#526176;box-shadow:0 1px 1px rgba(20,34,55,.03)}.btn:hover{border-color:#9dadc2;color:#233652}.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}.btn.primary:hover{background:#184de8}.btn.ghost{background:transparent}.btn.danger{color:var(--red);border-color:#efc9ce}.btn.small{padding:4px 8px;font-size:11px}.btn:disabled{opacity:.45;cursor:not-allowed}
    .stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:16px}.stat{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:15px 16px;box-shadow:0 2px 8px rgba(23,36,58,.025)}.stat label{display:block;color:var(--muted);font-size:11px}.stat b{display:block;font-size:23px;margin:9px 0 3px}.stat small{color:var(--subtle)}
    .card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);box-shadow:0 2px 10px rgba(23,36,58,.025);overflow:hidden}.card-head{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.card-head h2{font-size:14px;margin:0}.card-head small{color:var(--subtle)}
    .table-wrap{overflow:auto}table{width:100%;border-collapse:collapse}th{background:#f7f9fc;color:#738096;font-size:10px;letter-spacing:.5px;text-align:left;padding:10px 13px;border-bottom:1px solid var(--line);white-space:nowrap}td{padding:12px 13px;border-bottom:1px solid #edf1f5;vertical-align:middle}td:last-child{white-space:nowrap}tr:last-child td{border-bottom:0}tbody tr:hover{background:#fafcff}td b{font-weight:600}td small{display:block;color:var(--subtle);margin-top:4px;line-height:1.45}

    .empty{padding:50px;text-align:center;color:var(--subtle)}

    /* Editor */
    .editor{height:100%;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:68px minmax(0,1fr);background:#edf2f7}
    .editor-head{background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:9px 16px;gap:14px;min-width:0}.editor-title{min-width:0}.editor-title h1{font-size:16px;margin:3px 0 2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.editor-title small{color:var(--subtle)}.editor-summary{display:flex;align-items:center;gap:8px;white-space:nowrap}.metric-chip{border:1px solid var(--line);background:#f8fafc;border-radius:5px;padding:6px 8px;font:10px var(--mono);color:#5f6e82}.metric-chip b{color:var(--ink)}
    .editor-body{min-height:0;display:grid;grid-template-columns:minmax(0,1fr);position:relative;overflow:hidden}
    .palette,.inspector{background:#fff;min-height:0;overflow:auto}.palette{position:absolute;z-index:12;left:12px;top:55px;bottom:12px;width:190px;border:1px solid var(--line);border-radius:8px;padding:14px 12px;box-shadow:var(--shadow);display:none}.palette.open{display:block}
    /* 节点配置改为右侧浮层抽屉：默认隐藏，点击节点滑出，画布始终全宽 */
    .inspector{position:absolute;z-index:14;right:0;top:0;bottom:0;width:340px;background:#fff;border-left:1px solid var(--line-strong);box-shadow:-14px 0 36px rgba(23,36,58,.14);transform:translateX(100%);transition:transform .22s ease;visibility:hidden;pointer-events:none}

    .inspector-head-row{display:flex;justify-content:space-between;align-items:center;gap:8px}
    .panel-title{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.panel-title b{font-size:12px}.panel-title span{font:9px var(--mono);color:var(--subtle)}.palette-group{margin:14px 0}.palette-group>label{display:block;color:#8491a2;font-size:9px;letter-spacing:1px;margin:0 4px 7px}.palette-item{border:1px solid var(--line);background:#fff;border-radius:6px;padding:8px;margin-bottom:6px;display:flex;gap:8px;align-items:center;width:100%;text-align:left}.palette-item:hover{border-color:#9db3e7;background:#f8faff}.palette-dot{width:22px;height:22px;border-radius:5px;display:grid;place-items:center;font:9px var(--mono);background:#edf2ff;color:#315bc8}.palette-item small{display:block;color:var(--subtle);font-size:9px;margin-top:2px}
    .canvas-shell{min-width:0;min-height:0;overflow:auto;position:relative;background-color:#eef3f8;background-image:radial-gradient(#c8d3e1 1px,transparent 1px);background-size:20px 20px}
    .canvas-toolbar{position:sticky;top:10px;left:12px;z-index:8;width:max-content;display:flex;align-items:center;gap:5px;padding:5px;background:rgba(255,255,255,.94);border:1px solid var(--line);border-radius:7px;box-shadow:0 5px 18px rgba(22,39,64,.08);backdrop-filter:blur(6px)}
    .canvas-toolbar button{border:0;background:transparent;border-radius:4px;padding:5px 7px;color:#64748a}.canvas-toolbar button:hover{background:#eef3fa;color:#253958}.zoom{font:10px var(--mono);color:#8390a2;padding:0 4px}.canvas-help{font-size:10px;color:#64748a;padding:0 5px;border-left:1px solid var(--line)}
    .canvas-viewport{position:relative;min-width:0;min-height:0;overflow:auto}.canvas-world{width:1080px;height:760px;position:relative;transform-origin:top left;transform:scale(var(--canvas-scale,.8))}.stage-band{position:absolute;top:80px;bottom:35px;border-left:1px dashed #cbd6e3}.stage-band span{position:absolute;top:-28px;left:8px;font:11px var(--mono);letter-spacing:.6px;color:#61748d;white-space:nowrap}
    .wire-layer{position:absolute;inset:0;z-index:1;overflow:visible;pointer-events:none}.wire{fill:none;stroke:#a8b6c8;stroke-width:2}.wire.active{stroke:#4f75e7;stroke-width:2.5}.wire.dashed{stroke-dasharray:6 5}.wire.preview{stroke:#3c68e6;stroke-width:2.5;stroke-dasharray:6 4}.wire-label{font:9px var(--mono);fill:#718096}.wire-dot{fill:#fff;stroke:#7990ae;stroke-width:2}
    .node{position:absolute;width:240px;min-height:82px;background:#fff;border:1px solid #cfd9e5;border-radius:7px;z-index:3;box-shadow:0 5px 14px rgba(26,44,69,.07);cursor:pointer;transition:box-shadow .15s,border-color .15s,transform .15s}.node:hover{box-shadow:0 8px 20px rgba(26,44,69,.12);transform:translateY(-1px)}.node.selected{border-color:#4b70e6;box-shadow:0 0 0 2px #dce5ff,0 10px 22px rgba(39,94,254,.13)}.node.connection-source{border-color:#3769ed;box-shadow:0 0 0 3px #a9bbf9}.node.disabled{opacity:.48;filter:grayscale(.3)}.node.running{border-color:#cb8b2f;box-shadow:0 0 0 2px #ffebc8}.node.success{border-color:#39a782}.node.failed{border-color:#d45a67;box-shadow:0 0 0 2px #ffe0e3}
    .node-cap{height:25px;padding:0 8px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #e7ebf0;background:#f9fbfd;border-radius:7px 7px 0 0}.node-kind{font:9px var(--mono);letter-spacing:.6px;color:#6b7a90}.node-state{width:6px;height:6px;border-radius:50%;background:#8fa0b4}.node.model .node-state{background:#4267db}.node.control .node-state{background:#d08a27}.node.data .node-state{background:#1c9a9b}.node.output .node-state{background:#218663}
    .node-body{padding:9px 10px}.node-body b{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.node-body small{display:block;color:#718198;font-size:10px;line-height:1.45;margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.node-meta{display:flex;justify-content:space-between;gap:8px;margin-top:7px;font:10px var(--mono);color:#74839a}.node-meta span:first-child{max-width:115px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.port{position:absolute;width:15px;height:15px;border-radius:50%;background:#fff;border:2px solid #8295ae;z-index:5}.port.out{right:-8px;top:30px;cursor:crosshair;border-color:#4f75e7;background:#eaf0ff;touch-action:none}.port.bottom{left:calc(50% - 8px);bottom:-8px;top:auto}.port.out:hover,.port.out:focus-visible{background:#3769ed;border-color:#fff;box-shadow:0 0 0 4px #9ab2ff}.node.drop-target{border-color:#3c68e6;box-shadow:0 0 0 3px #a9bbf9}.node.condition .port.out.yes{right:auto;left:calc(50% - 8px);top:auto;bottom:-8px}.node.condition .port.out.no{right:-8px;top:30px}.port-label{position:absolute;z-index:5;font:9px var(--mono);color:#4562a1;pointer-events:none}.port-label.yes{left:calc(50% + 10px);bottom:-11px}.port-label.no{right:-25px;top:33px}
    .branch-label{position:absolute;padding:3px 5px;border-radius:3px;background:#fff;border:1px solid var(--line);font:9px var(--mono);color:#64758b;z-index:2}
    .inspector-head{padding:14px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#fff;z-index:4}.inspector-head h2{font-size:14px;margin:5px 0 3px}.inspector-head p{margin:0;color:var(--subtle);font-size:10px}.mode-switch{display:grid;grid-template-columns:1fr 1fr;background:#edf1f6;padding:3px;border-radius:6px;margin-top:12px}.mode-switch button{border:0;background:transparent;padding:6px;border-radius:4px;color:#728095;font-size:11px}.mode-switch button.active{background:#fff;color:#2e4e9d;box-shadow:0 1px 4px #182a4710}
    .inspector-body{padding:14px}.field{margin-bottom:13px}.field label{display:flex;justify-content:space-between;gap:8px;color:#65748a;font-size:10px;margin-bottom:6px}.field label span{color:#9aa5b5}.field input,.field select,.field textarea{width:100%;border:1px solid #cfd8e4;border-radius:5px;background:#fff;padding:7px 8px;font-size:11px}.field textarea{resize:vertical;min-height:70px;font-family:var(--mono);line-height:1.55}.field code{font:10px var(--mono);color:#3159b9;background:#edf2ff;padding:2px 4px;border-radius:3px}.field-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.field>small{display:block;color:#8c9aab;font-size:10px;line-height:1.5;margin-top:5px}.data-contract{margin:17px 0;padding-top:13px;border-top:1px solid var(--line)}.input-binding{border:1px solid #dce5f3;background:#f8faff;border-radius:6px;padding:8px;margin:8px 0}.input-binding .bind-row{padding:0 0 8px;border:0;color:#506581;font-size:10px}.input-binding .bind-row span:last-child{font:9px var(--mono);color:#6682c3}.input-binding .field{margin-bottom:0}.input-binding .field-grid{grid-template-columns:1fr}.node-actions{display:flex;gap:6px;flex-wrap:wrap;padding-top:11px;border-top:1px solid var(--line)}.hint{background:#f3f6fa;border:1px solid #e1e7ef;border-radius:6px;padding:9px;color:#6d7b8e;font-size:10px;line-height:1.55;margin-bottom:12px}.hint strong{color:#40506a}.toggle-row{display:flex;justify-content:space-between;align-items:center;border:1px solid var(--line);padding:8px;border-radius:5px;margin-bottom:10px}.switch{width:34px;height:19px;border-radius:20px;background:#b8c2cf;position:relative;border:0;padding:0}.switch::after{content:"";position:absolute;width:15px;height:15px;border-radius:50%;background:#fff;left:2px;top:2px;transition:.15s}.switch.on{background:#3e67df}.switch.on::after{left:17px}

    /* Test drawer */
    .test-drawer{position:absolute;left:0;right:0;bottom:0;height:0;background:#fff;border-top:1px solid var(--line-strong);z-index:16;overflow:hidden;transition:height .22s ease;box-shadow:0 -8px 24px rgba(24,39,62,.1)}.test-drawer.open{height:360px}.test-head{height:46px;padding:0 14px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}.test-head h3{font-size:13px;margin:0}.test-grid{height:314px;display:grid;grid-template-columns:280px minmax(0,1fr)}.test-input{padding:12px;border-right:1px solid var(--line);overflow:auto}.test-input textarea{width:100%;height:118px;border:1px solid var(--line-strong);border-radius:6px;padding:9px;font-size:11px;line-height:1.5;resize:none}.test-options{display:flex;gap:12px;color:#66758a;font-size:10px;margin:8px 0}.test-result{overflow:auto;padding:11px}.run-summary{display:flex;gap:8px;margin-bottom:9px}.run-chip{background:#f3f6fa;border:1px solid var(--line);border-radius:5px;padding:6px 8px;font:9px var(--mono)}.run-list{display:grid;gap:5px}.run-row{display:grid;grid-template-columns:20px minmax(120px,1fr) 78px 70px 70px;align-items:center;gap:8px;border:1px solid #e4e9f0;border-radius:5px;padding:7px 8px;font-size:10px}.run-row .seq{font:9px var(--mono);color:#8795a8}.run-row .run-name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.run-row .run-status{font:9px var(--mono);color:#74839a}.run-row.success .run-status{color:var(--green)}.run-row.failed .run-status{color:var(--red)}.run-row.skipped .run-status{color:#8f9bab}.run-row.running .run-status{color:var(--amber)}.run-row span:nth-last-child(-n+2){font:9px var(--mono);color:#718096;text-align:right}

    .modal-layer{position:fixed;inset:0;background:rgba(12,23,40,.42);z-index:50;display:none;align-items:center;justify-content:center;padding:24px}.modal-layer.open{display:flex}.modal{width:min(760px,100%);max-height:88vh;overflow:auto;background:#fff;border-radius:9px;box-shadow:0 24px 80px rgba(9,21,38,.27)}.modal-head{position:sticky;top:0;z-index:3;background:#fff;padding:17px 19px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.modal-head h2{font-size:15px;margin:0}.modal-body{padding:18px 19px}.modal-foot{position:sticky;bottom:0;z-index:3;background:#fff;padding:13px 19px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px}.close{border:0;background:transparent;font-size:19px;color:#8290a3}
    .template-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.template{border:1px solid var(--line);border-radius:7px;padding:13px;background:#fff;cursor:pointer;text-align:left}.template:hover{border-color:#7391eb;box-shadow:0 5px 16px rgba(42,72,130,.08)}.template .tpl-icon{width:34px;height:34px;display:grid;place-items:center;border-radius:6px;background:#edf2ff;color:#315cca;font:11px var(--mono);margin-bottom:12px}.template b{display:block}.template p{font-size:10px;color:var(--muted);line-height:1.55;margin:7px 0 10px}.template small{color:#8794a6}
    .bind-list{border:1px solid var(--line);border-radius:6px;overflow:hidden}.bind-row{padding:10px 11px;display:flex;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line)}.bind-row:last-child{border-bottom:0}.bind-row small{color:var(--subtle)}
    .toast{position:fixed;top:72px;left:50%;transform:translateX(-50%);background:#16243a;color:#fff;padding:9px 14px;border-radius:6px;box-shadow:var(--shadow);z-index:80;font-size:11px;animation:toast-in .18s ease}@keyframes toast-in{from{opacity:0;transform:translate(-50%,-8px)}}
    .readonly-banner{background:#fff5e5;border:1px solid #efd7ab;color:#9a681f;padding:7px 10px;border-radius:5px;font-size:10px}

    const nodeMeta={

      transform:{label:'数据转换（历史）',code:'MAP',group:'历史',cls:'data',desc:'旧版转换节点'},

      tool:{label:'MCP 工具（历史）',code:'TOOL',group:'历史',cls:'model',desc:'旧版工具节点'},

      fallback:{label:'降级（历史）',code:'TRY',group:'历史',cls:'control',desc:'旧版降级'}
    };
    const seededOutputs={n1:'task',n2:'normalized_messages',n3:'risk_signal',n4:'route_payload',n5:'conversation_context',n6:'customer_profile',n7:'evidence',n8:'risk_result',n9:'quality_result',n10:'no_risk_result'};
    const outputName=n=>n.outputKey||seededOutputs[n.id]||`${n.id}_output`;
    const dataTypes=['String','Number','Boolean','JSON','File'];
    const mediaKinds=['','image','audio','video'];
    const mediaTypeOptions=value=>mediaKinds.map(k=>`<option value="${k}" ${k===value?'selected':''}>${k?({image:'图片 URL',audio:'音频 URL',video:'视频 URL'}[k]):'普通字段'}</option>`).join('');
    const typeOptions=(value)=>dataTypes.map(t=>`<option value="${t}" ${t===value?'selected':''}>${t}</option>`).join('');
    const nodeOutputType=n=>n.type==='input'?'JSON':n.type==='output'?'JSON':n.outputType||'JSON';
    const edgeBinding=(edge,source)=>({sourcePath:edge.sourcePath||`$.${outputName(source)}`,targetKey:edge.targetKey||outputName(source),targetType:edge.targetType||'JSON',valueMode:edge.valueMode||'reference',literalValue:edge.literalValue??'{}'});

      if(key==='normalized_messages')return {messages:[{role:'customer',content:'我要投诉你们'}]};

      if(key==='customer_context')return {customer_id:'U001',risk_level:'R3'};

      if(key==='no_risk_result')return {risk_detected:false,reason:'未命中风险信号'};

    }
    function typeExample(type){return type==='JSON'?'{}':type==='Number'?'0':type==='Boolean'?'false':type==='File'?'file://demo/sample.png':'';}
    function parseTypedValue(raw,type){
      const value=String(raw??'');
      if(type==='JSON'){let out;try{out=JSON.parse(value)}catch(e){throw Error('JSON 格式错误：'+e.message)}if(out===null||typeof out!=='object')throw Error('JSON 顶层须为对象或数组');return out;}
      if(type==='Number'){if(!value.trim()||!Number.isFinite(Number(value)))throw Error('请输入有效数字');return Number(value)}

      if(type==='File'){if(!value.trim())throw Error('请填写文件引用');return {fileRef:value.trim()}}

    }
    function exampleError(value,type){try{parseTypedValue(value,type);return ''}catch(e){return e.message}}
    function jsonRootError(n){if(n.type!=='input')return '';return exampleError(n.inputExample||pretty(defaultExample(n)),'JSON')}
    function lookupPath(root,path){
      if(!/^\$\.[A-Za-z_][A-Za-z0-9_.\[\]]*$/.test(path))return undefined;
      const parts=path.slice(2).replace(/\[(\d+)\]/g,'.$1').split('.');
      return parts.reduce((acc,key)=>acc==null?undefined:acc[key],root);
    }
    function dataTypeOf(value){if(value===null||value===undefined)return '';if(typeof value==='string')return 'String';if(typeof value==='number')return 'Number';if(typeof value==='boolean')return 'Boolean';if(typeof value==='object')return 'JSON';return ''}

    function sourceValueFor(w,edge){const source=w.nodes.find(x=>x.id===edge.from);if(!source)return undefined;const root={[outputName(source)]:sampleValue(source)};return lookupPath(root,edgeBinding(edge,source).sourcePath)}

      if(b.valueMode!=='reference'||!source)return '';

    const makeNode=(id,type,name,x,y,extra={})=>({id,type,name,x,y,enabled:true,service:type==='model'?'qwen3.6-plus':'',endpoint:type==='model'?'/v1/chat/completions':'',method:'POST',authRef:'MODEL_GATEWAY_KEY',timeout:type==='model'?null:30,retries:1,requestMap:'{{input}}',responsePath:'$.output',prompt:'',code:'return { result: input };',inputFields:[],mediaOperation:'fetch',mediaKind:'video',mediaInterval:5,mediaMaxFrames:12,mediaFormat:'wav',mediaService:'paraformer-v2',modelInputMode:'text',resultMode:'reference',resultPath:'',outputType:'JSON',outputExample:'',inputExample:'',schemaInput:'',schemaOutput:'',loopArray:'$.items',loopMax:20,joinMode:'all',errorPolicy:'fail-fast',...extra});

    function serviceDraftError(){const d=ui.serviceDraft;if(!d)return '请先打开服务配置';if(!/^[a-zA-Z0-9][a-zA-Z0-9._-]*$/.test(d.id||''))return '服务 ID 只能使用字母、数字、点、下划线和短横线';if(!ui.serviceEditingId&&data.services.some(s=>s.id===d.id))return '服务 ID 已存在';if(!d.name?.trim())return '请填写显示名称';if(!d.provider?.trim())return '请填写服务商或部署来源';if(!d.modelId?.trim())return '请填写请求模型 ID';if(!protocolOptions(d.type).some(([key])=>key===d.protocol))return '能力类型与调用协议不匹配';if(d.mode==='cloud'&&!/^https:\/\/[^\s]+$/i.test(d.baseUrl||''))return '公有云 Base URL 需要使用 HTTPS';if(d.mode==='private'&&!/^(https?:\/\/[^\s]+|\/[A-Za-z0-9/_.-]+)$/i.test(d.baseUrl||''))return '私有化地址需是 HTTP(S) URL 或网关路由';if(d.mode==='cloud'&&!d.credentialRef?.trim())return '请填写密钥托管引用';if(d.mode==='private'&&['bearer','header'].includes(d.authMode)&&!d.credentialRef?.trim())return '所选鉴权方式需要密钥引用';if(d.authMode==='header'&&!d.headerName?.trim())return '请填写请求头名称';if(!Number.isFinite(Number(d.timeout))||Number(d.timeout)<1||Number(d.timeout)>600)return '超时需在 1 至 600 秒之间';if([d.priceIn,d.priceOut].some(v=>!Number.isFinite(Number(v))||Number(v)<0))return '单价不能为负数';return ''}

      w.updated=new Date().toLocaleString('zh-CN',{hour12:false}).replaceAll('/','-');
      data.executions.unshift({id:'RUN-'+Date.now(),workflow:w.name,version:w.version,source:'编排测试台',time:w.updated,status:failed?'失败':'成功',duration,input,output,cost});
      save();render();toast(failed?'流程测试失败或配置已变化，请重新测试':'本地流程模拟通过；尚未连接真实模型和业务接口');
    }
    function wait(ms){return new Promise(r=>setTimeout(r,ms))}

    function openPublish(){const w=current(),error=validateWorkflow(w);if(error)return toast(error);const serviceError=serviceReadinessError(w);if(serviceError)return toast(serviceError);if(w.testFingerprint!==fingerprint(w)||w.testServiceFingerprint!==serviceFingerprint(w))return toast('当前配置未通过测试，不能发布');if(w.status==='已发布'&&!w.dirty)return toast('当前已是演示发布，请修改草稿后再发布');const next=w.status==='已发布'?nextVersion(w.version):w.version;showModal('发布工作流版本',`<div class="notice"><b>演示发布后冻结配置：</b>节点、路由、模型服务、默认 Prompt、输入输出协议和失败策略。<br>风控模型不会自动从 ${esc(w.version)} 切换到 ${esc(next)}。</div><div class="field-grid"><div class="field"><label>拟演示发布</label><input value="${esc(next)}" disabled></div><div class="field"><label>测试结果</label><input value="${esc(w.lastTest)}" disabled></div></div><div class="field"><label>版本说明 *</label><textarea id="publishNote" placeholder="说明节点、模型或协议变更">${esc(w.releaseNote||'')}</textarea></div>`,`<button class="btn" onclick="closeModal()">取消</button><button class="btn primary" onclick="confirmPublish('${esc(next)}')">确认发布</button>`)}
    function confirmPublish(version){const note=document.getElementById('publishNote')?.value.trim();if(!note)return toast('请填写版本说明');const w=current();if(validateWorkflow(w)||serviceReadinessError(w)||w.testFingerprint!==fingerprint(w)||w.testServiceFingerprint!==serviceFingerprint(w))return toast('配置或模型服务已变化，请重新验证和测试');if(w.status==='已发布'&&w.publishedSnapshot)w.history.unshift(clone(w.publishedSnapshot));w.version=version;w.status='已发布';w.releaseNote=note;w.dirty=false;w.updated=new Date().toLocaleString('zh-CN',{hour12:false}).replaceAll('/','-');const serviceIds=[...new Set(w.nodes.filter(n=>n.type==='model').map(n=>n.service))];w.publishedSnapshot={version,nodes:clone(w.nodes),edges:w.edges.map(edge=>({...clone(edge),...edgeBinding(edge,w.nodes.find(n=>n.id===edge.from))})),serviceConfigs:serviceIds.map(id=>data.services.find(s=>s.id===id)).filter(Boolean).map(clone),note,updated:w.updated};save();closeModal();render();toast('已发布 '+version+'，风控模型可在 Step 1 选择该版本')}
    function showVersions(){const w=current(),versions=[w.publishedSnapshot,...(w.history||[])].filter(Boolean);showModal('已演示发布',`<div class="notice">已发布配置以版本快照保存。当前画布的未发布修改不会覆盖这些快照。</div><div class="bind-list">${versions.map((v,i)=>`<div class="bind-row"><span><b>${esc(v.version)}</b><small>${esc(v.note||'历史演示版本')} · ${esc(v.updated||'时间未提供')}</small></span><span>${v.nodes?`${v.nodes.length} 节点 · ${v.edges.length} 连线 <button class="btn small" onclick="showVersionDetail(${i})">查看配置</button>`:'历史配置未留存'}</span></div>`).join('')||'<div class="empty">尚无已演示发布</div>'}</div>`,`<button class="btn primary" onclick="closeModal()">关闭</button>`)}
    function showVersionDetail(index){
      const w=current(),v=[w.publishedSnapshot,...(w.history||[])].filter(Boolean)[index];if(!v?.nodes)return toast('该历史演示版本没有配置快照');
      const rows=v.nodes.map(n=>{const routes=v.edges.filter(e=>e.from===n.id).map(e=>{const target=v.nodes.find(x=>x.id===e.to),binding=edgeBinding(e,n);return `${e.label?e.label+' · ':''}${target?.name||e.to}：${binding.sourcePath} → ${binding.targetKey}`});return `<div class="bind-row"><span><b>${esc(n.name)}</b><small>${esc(n.type)} · 输出 ${esc(outputName(n))}</small>${n.prompt?`<small>Prompt：${esc(n.prompt)}</small>`:''}${n.responsePath?`<small>响应路径：${esc(n.responsePath)}</small>`:''}</span><span>${esc(routes.join('；')||'终点')}</span></div>`}).join('');
      const services=v.serviceConfigs?`<div class="service-section"><b>本版模型服务快照</b></div><div class="bind-list">${v.serviceConfigs.map(s=>`<div class="bind-row"><span><b>${esc(s.name||s.id)}</b><small>${esc(s.id)} · r${s.revision||1} · ${esc(s.mode==='cloud'?'公有云 API':'私有化部署')}</small></span><span>${esc(s.modelId||s.id)}<small>${esc(s.baseUrl||s.endpoint)}</small></span></div>`).join('')}</div>`:'<div class="hint">旧演示版本未留存当时的模型服务配置，无法核对历史接入地址。</div>';
      showModal(v.version+' · 只读配置',`<div class="notice">${esc(v.note||'版本说明未提供')} · ${esc(v.updated||'时间未提供')}${v.inferredBindings?'<br>该旧演示版本未保存原始字段映射，下方展示按节点输出名推定的默认映射。':''}</div>${services}<div class="service-section"><b>节点与数据路由</b></div><div class="bind-list">${rows}</div>`,`<button class="btn" onclick="showVersions()">返回版本</button><button class="btn primary" onclick="closeModal()">关闭</button>`)
    }
    function showBindings(){const w=current();showModal('风控模型引用',`<div class="notice">风控模型页面将该工作流显示为“${esc(w.alias)}”，并锁定所选工作流版本。升级需要重新选择和发布风控模型。</div><div class="bind-list">${w.boundModels.length?w.boundModels.map(x=>`<div class="bind-row"><span><b>${esc(x)}</b><small>Step 1 基础模型</small></span>${tag('已锁定 '+(w.bindingVersion||w.version),'blue')}</div>`).join(''):'<div class="empty">尚未被风控模型引用</div>'}</div>`,`<button class="btn primary" onclick="closeModal()">知道了</button>`)}

    function editWorkflowMeta(){const w=current();showModal('编辑工作流信息',`<div class="notice">这些信息面向内部编排资产管理。对外业务模型引用已演示发布，不会自动更新。</div><div class="field"><label>内部工作流名称</label><input id="metaName" value="${esc(w.name)}"></div><div class="field"><label>对外业务名称</label><input id="metaAlias" value="${esc(w.alias)}"></div><div class="field"><label>业务说明</label><textarea id="metaDesc">${esc(w.description)}</textarea></div>`,`<button class="btn" onclick="closeModal()">取消</button><button class="btn primary" onclick="saveWorkflowMeta()">保存信息</button>`)}
    function saveWorkflowMeta(){const w=current(),name=document.getElementById('metaName')?.value.trim(),alias=document.getElementById('metaAlias')?.value.trim();if(!name||!alias)return toast('名称不能为空');w.name=name;w.alias=alias;w.description=document.getElementById('metaDesc')?.value.trim()||'';markDirty();closeModal();render();toast('基础信息已更新，需重新测试后发布')}
    function openCreate(){showModal('新建编排工作流',`<div class="notice">选择简单模板起步，节点和配置可以在画布中继续调整。</div><div class="template-grid"><button class="template" onclick="createFlow('lite')"><span class="tpl-icon">2S</span><b>两阶段风险识别</b><p>初筛、条件路由、深度判定及结果输出。</p><small>9 个节点</small></button><button class="template" onclick="createFlow('video')"><span class="tpl-icon">AV</span><b>视频营销素材审核</b><p>OSS 视频、抽帧、ASR、VLM、汇聚输出。</p><small>10 个节点</small></button><button class="template" onclick="createFlow('blank')"><span class="tpl-icon">∅</span><b>空白流程</b><p>从开始和结束节点构建。</p><small>2 个节点</small></button></div>`,'')}
    function createFlow(kind){
      let nodes,edges,name;
      if(kind==='lite'){nodes=liteNodes();edges=liteEdges();name='新建两阶段风险识别';}
      else if(kind==='video'){nodes=videoNodes();edges=videoEdges();name='新建视频营销素材审核';}
      else if(kind==='parallel'){nodes=parallelNodes();edges=parallelEdges();name='新建多模型并行评估';}
      else{nodes=[makeNode('b1','input','任务输入',50,120),makeNode('b2','output','结果输出',350,120)];edges=[];name='未命名工作流';}
      const id='WF-'+Date.now().toString(36).toUpperCase();
      data.workflows.unshift({id,name,alias:name,description:'待补充业务说明',status:'草稿',version:'v0.1',updated:new Date().toLocaleString('zh-CN',{hour12:false}),owner:'内部研发',boundModels:[],nodes,edges,history:[],lastTest:'未测试',testFingerprint:null,dirty:true,releaseNote:''});
      save();closeModal();editWorkflow(id);toast('工作流草稿已创建');
    }
    function showModal(title,body,footer){document.getElementById('modal').innerHTML=`<div class="modal-layer open" onclick="if(event.target===this)closeModal()"><section class="modal"><div class="modal-head"><h2>${title}</h2><button class="close" onclick="closeModal()" aria-label="关闭">×</button></div><div class="modal-body">${body}</div>${footer!==''?`<div class="modal-foot">${footer}</div>`:''}</section></div>`}
    function closeModal(){const input=document.getElementById('serviceSecret');if(input)input.value='';ui.serviceDraft=null;ui.serviceEditingId=null;ui.serviceSecretEntered=false;document.getElementById('modal').innerHTML=''}
    function resetDemo(){if(!confirm('确定恢复模型编排工作台的演示数据？不会影响现有合规工作台。'))return;data=clone(defaults);normalizeWorkflowData();normalizeServiceData();save();render();toast('演示数据已恢复')}

    Object.assign(window,{inputPortClick,openInspector,closeInspector,onCanvasBlank,addInputField,removeInputField,updateInputField,updateMediaOperation,liveExample,formatExample,setOutputType,setEdgeField,simulateNode,sizeWorld,zoomBy,beginNodeDrag,moveNodeDrag,endNodeDrag,setInspectorTab,updateSchema,viewNodeTrace,editWorkflowMeta,saveWorkflowMeta,go,editWorkflow,selectNode,nodeClick,chooseConnection,setAdvanced,updateNode,updateOutputKey,updateEdgeBinding,toggleNode,fitCanvas,togglePalette,addEdge,removeEdge,beginConnection,moveConnection,endConnection,cancelConnection,moveNode,copyNode,deleteNode,addNode,saveDraft,openTest,closeTest,runTest,openPublish,confirmPublish,showVersions,showVersionDetail,showBindings,openCreate,createFlow,closeModal,resetDemo,toast,ui,setServiceFilter,openServiceEditor,setServiceField,setServiceMode,setServiceProvider,setServiceType,setServiceAuth,checkServiceDraft,saveService});
    window.addEventListener('keydown',event=>{if(event.key!=='Escape')return;if(ui.connecting||ui.pendingConnection){cancelConnection();cancelPendingConnection();return}if(ui.inspectorOpen)closeInspector()});
    render();
  })();
  </script>
