.rpt-scope{--blue:#2c5bd8;--blue-deep:#2147b0;--blue-bg:#eef3ff;--ink:#101828;--ink-2:#475467;--ink-3:#667085;--muted:#667085;--line:#eaecf0;--line-strong:#d0d5dd;--canvas:#f5f7fa;--red:#b42318;--red-bg:#fef3f2;--amber:#b54708;--amber-bg:#fffaeb;--green:#027a48;--green-bg:#ecfdf3;--radius:8px;--radius-sm:6px;--radius-lg:12px;--shadow-1:0 1px 2px rgba(16,24,40,.05);--shadow-2:0 8px 24px rgba(16,24,40,.08);}

function counts(key) {
  if (key === 'results') return String(['wx', 'material', 'live'].reduce((a, k) => a + rvCount(k), 0));
  if (key === 'appeals') return String(MATERIALS.filter(m => m.appeal && m.appeal.status === '待终审').length);
  if (key === 'rules') return String(RULES.filter(r => r.status === '已发布').length);
  if (key === 'models') return String(MODELS.filter(m => m.status === 'published').length);
  if (key === 'plans') return String(PLANS.filter(p => p.status === '启用').length);
  if (key === 'settings') return String(SOURCES.filter(s => s.status !== '正常').length) || '';
  return '';
}

function renderNav() {
  const active = CHILD[state.view] || state.view;
  const alertKeys = ['results', 'appeals', 'settings'];
  $('#nav').innerHTML = NAV.map(g => `<div class="nav-label">${g.label}</div>` + g.items.map(it => {
    const c = counts(it.key);
    const cls = alertKeys.includes(it.key) && Number(c) > 0 ? 'alert' : '';
    const main = `<button class="nav-item" data-nav="${it.key}"${it.children ? ` data-channel="${it.children[0].key}"` : ''} ${active === it.key ? 'aria-current="page"' : ''}><span class="nav-icon">${it.icon}</span><span>${it.name}</span>${c ? `<small class="${cls}">${c}</small>` : ''}</button>`;
    const subs = it.children ? `<div class="nav-sub">${it.children.map(ch => {
      const n = rvCount(ch.key);
      return `<button data-nav="${it.key}" data-channel="${ch.key}" ${active === it.key && rvChannel() === ch.key ? 'aria-current="page"' : ''}><span>${ch.name}</span>${n ? `<small class="${n > 0 ? 'alert' : ''}">${n}</small>` : ''}</button>`;
    }).join('')}</div>` : '';
    return main + subs;
  }).join('')).join('');
}

/* 客户风控趋势：纯内联 SVG，无第三方依赖 */
function custTrendSvg() {
  const T = CUST_TREND, n = custRange(), from = T.dates.length - n;
  const idx = []; for (let i = from; i < T.dates.length; i++) idx.push(i);
  const vis = CUST_STAGES.filter(s => !state.custHidden.includes(s.key));
  const max = Math.max(1, ...CUST_STAGES.flatMap(s => idx.map(i => T[s.key][i])));
  const top = Math.ceil(max / 20) * 20;
  const W = 780, H = 244, L = 42, R = 18, TP = 12, B = 26;
  const pw = W - L - R, ph = H - TP - B;
  const x = j => L + (pw * j) / Math.max(1, idx.length - 1);
  const y = v => TP + ph - (ph * v) / top;
  const grid = [0, 0.25, 0.5, 0.75, 1].map(r => {
    const v = top * r, yy = y(v);
    return `<line x1="${L}" y1="${yy.toFixed(1)}" x2="${W - R}" y2="${yy.toFixed(1)}" class="trend-grid"/><text x="${L - 8}" y="${yy.toFixed(1)}" class="trend-axis" text-anchor="end" dominant-baseline="middle">${v}</text>`;
  }).join('');
  const line = k => idx.map((i, j) => `${j ? 'L' : 'M'}${x(j).toFixed(1)},${y(T[k][i]).toFixed(1)}`).join(' ');
  const area = `M${x(0).toFixed(1)},${(TP + ph).toFixed(1)} ` + idx.map((i, j) => `L${x(j).toFixed(1)},${y(T.handling[i]).toFixed(1)}`).join(' ') + ` L${x(idx.length - 1).toFixed(1)},${(TP + ph).toFixed(1)} Z`;
  const step = Math.max(1, Math.ceil(idx.length / 8));
  const marks = []; for (let j = 0; j < idx.length; j += step) marks.push(j);
  const last = idx.length - 1;
  if (marks[marks.length - 1] !== last) {
    if (last - marks[marks.length - 1] < step * 0.6) marks[marks.length - 1] = last;
    else marks.push(last);
  }
  const labels = marks.map(j => `<text x="${x(j).toFixed(1)}" y="${H - 8}" class="trend-axis" text-anchor="middle">${T.dates[idx[j]].slice(5).replace('-', '/')}</text>`).join('');
  const dots = vis.map(s => idx.map((i, j) => `<circle cx="${x(j).toFixed(1)}" cy="${y(T[s.key][i]).toFixed(1)}" r="2.6" class="trend-dot" fill="${s.color}"><title>${T.dates[i]} · ${s.name} ${T[s.key][i]} 位客户</title></circle>`).join('')).join('');
  const paths = vis.map(s => `<path d="${line(s.key)}" class="trend-line" stroke="${s.color}"/>`).join('');
  return `<div class="trend-legend">${CUST_STAGES.map(s => `<button class="legend-item" data-act="stage-toggle" data-stage="${s.key}" aria-pressed="${!state.custHidden.includes(s.key)}"><i style="background:${s.color}"></i>${s.name}<b>${custLast(s.key)}</b></button>`).join('')}<span class="legend-note">阶段之间会流转，同一客户同一时刻只处于一个阶段</span></div>
  <svg class="trend-svg" viewBox="0 0 ${W} ${H}" role="img" aria-label="近 ${n} 天客户风控阶段趋势">${grid}${vis.some(s => s.key === 'handling') ? `<path d="${area}" class="trend-area"/>` : ''}${paths}${dots}${labels}</svg>`;
}

  const totalDays = Math.round((endUtc - startUtc) / DAY) + 1;

  const days = [];
  const events = [];
  let sequence = 0;

  for (let index = 0; index < totalDays; index += 1) {
    const time = startUtc + index * DAY;
    const date = dayText(time);
    const weekday = weekdayOf(time);
    const week = dayText(time - ((weekday + 6) % 7) * DAY);
    const progress = index / (totalDays - 1);   /* 0 → 1，用于制造覆盖率上升、密度下降的趋势 */
    const weekend = weekday === 0;

    const archived = Math.round(between(700, 1500) * (weekend ? .16 : 1));
    /* 质检覆盖率从约 68% 逐周提升到约 93%，并带日常波动 */
    const coverage = Math.min(.96, Math.max(.5, .68 + progress * .25 + between(-.03, .03)));
    const scanned = Math.round(archived * coverage);
    /* 每千条已质检会话的命中密度，随时间小幅下降，体现治理见效 */
    const perThousand = between(5, 8.5) * (1 - progress * .22);
    const hits = Math.max(0, Math.round(scanned / 1000 * perThousand));

    days.push({ date, weekday, week, archived, scanned, customers: Math.round(archived * between(.42, .58)) });

    for (let n = 0; n < hits; n += 1) {
      const rule = weighted(RULES.map(item => [item, item.weight]));
      const dept = weighted(DEPARTMENTS.map(item => [item, item.share * item.density]));
      const media = weighted(rule.media);
      const confirmed = random() < rule.confirmRate;
      const ageDays = Math.round((endUtc - time) / DAY);

      /* 事件越久越可能已完成整改或归档；最近几天通常仍在处置中。
       * 超过 12 天的事件假定已全部归档，避免出现滞留数十天的失真长尾。 */
      let stage = 'hit';
      if (confirmed) {
        const archiveChance = Math.min(1, Math.max(0, (ageDays - 2) / 10));
        const rectifyChance = Math.min(.98, Math.max(0, (ageDays - 1) / 9));
        stage = random() < archiveChance ? 'archived' : random() < rectifyChance ? 'rectified' : 'confirmed';
        /* 确定性保留少量长期未闭环，供长期积压与升级事项演示，不额外消耗随机序列 */
        if (ageDays > 20 && (sequence + 1) % 503 === 0) stage = 'confirmed';
      }

      /* 闭环时长（命中 → 归档）呈长尾分布，用指数分布近似，并受事件年龄上限约束 */
      let closedHours = null;
      if (stage === 'archived') {
        const ceiling = Math.max(6, ageDays * 24 - 6);
        closedHours = Math.max(4, Math.round(Math.min(ceiling, Math.exp(between(3.2, 5)))));
      }

      events.push({
        id: `OV-${date.replace(/-/g, '')}-${String(++sequence).padStart(4, '0')}`,
        date,
        week,
        dept: dept.name,
        employee: pick(dept.members),
        customerId: CUSTOMERS[sequence % CUSTOMERS.length].id,
        customerName: CUSTOMERS[sequence % CUSTOMERS.length].name,
        customerTier: CUSTOMERS[sequence % CUSTOMERS.length].tier,
        customerRisk: CUSTOMERS[sequence % CUSTOMERS.length].risk,
        ruleId: rule.id,
        ruleName: rule.name,
        category: rule.category,
        level: rule.level,
        critical: rule.critical === true,
        media,
        confirmed,
        stage,
        closedHours,
        overdue: confirmed && stage !== 'archived' && ageDays > 5,
        evidenceComplete: random() < EVIDENCE_COMPLETE[media],
        repeat: random() < rule.repeatRate
      });
    }
  }

  window.OverviewData = {
    seed: SEED,
    weeks: WEEKS,
    RULES,
    RULE_VERSIONS,
    CUSTOMERS,
    DEPARTMENTS,
    EVIDENCE_COMPLETE,
    days,
    events,
    range: { from: dayText(startUtc), to: END_DATE },
    /* 演示假设：名册 10 人中 9 人被抽检；真实员工覆盖需要逐员工扫描记录 */
    employeeCoverage: { checked: 9, total: DEPARTMENTS.flatMap(dept => dept.members).length }
  };
})();


/* 质检报表：面向管理者的聚合视图。
 * 只读取 overview-data.js 的演示数据集，不参与复核状态机，也不修改任何本地配置。
 * 图表全部用手写 SVG 与 CSS 实现，不引入任何第三方库，保证单文件离线可用。
 */
(() => {
  'use strict';

  const MEDIA_NAME = { text: '文字', image: '图片', audio: '语音', video: '视频' };
  const LEVEL_NAME = { high: '高风险', medium: '中风险', low: '低风险' };
  const LEVEL_COLOR = { high: '#c0564a', medium: '#c79a3e', low: '#7d9cc4' };
  const PRESETS = [{ days: 1, label: '前一天', offset: 1 }, { days: 7, label: '近 7 天' }, { days: 30, label: '近 30 天' }, { days: 90, label: '近 90 天' }];
  const DAY = 86400000;

  window.createOverview = env => {
    const { esc, main } = env;
    const data = window.OverviewData;
    const firstDate = data.days[0].date, lastDate = data.days[data.days.length - 1].date;
    const dayBefore = (date, days) => new Date(Date.parse(date + 'T00:00:00Z') - days * DAY).toISOString().slice(0, 10);
    let range = { from: dayBefore(lastDate, 6), to: lastDate };
    let topTab = 'people';

    /* ---------- 基础计算 ---------- */
    const sum = (list, picker) => list.reduce((total, item) => total + picker(item), 0);
    const ratio = (value, base) => (base ? value / base : 0);
    const percent = (value, digits = 1) => `${(value * 100).toFixed(digits)}%`;
    const number = value => Math.round(value).toLocaleString('zh-CN');
    function median(values) {
      if (!values.length) return 0;
      const sorted = [...values].sort((a, b) => a - b);
      const middle = Math.floor(sorted.length / 2);
      return sorted.length % 2 ? sorted[middle] : Math.round((sorted[middle - 1] + sorted[middle]) / 2);
    }

    /* 时间窗按所选日期区间聚合，默认最近 7 天（以数据最后一天为基准） */
    function windowBetween(from, to) {
      const days = data.days.filter(day => day.date >= from && day.date <= to);
      if (!days.length) return null;
      return { days, from: days[0].date, to: days[days.length - 1].date, events: data.events.filter(event => event.date >= from && event.date <= to) };
    }
    function clampRange() {
      if (range.from < firstDate) range.from = firstDate;
      if (range.to > lastDate) range.to = lastDate;
      if (range.from > range.to) { const swap = range.from; range.from = range.to; range.to = swap; }
    }

    function summarize(win) {
      const events = win.events;
      const archived = sum(win.days, day => day.archived);
      const scanned = sum(win.days, day => day.scanned);
      const confirmed = events.filter(event => event.confirmed);
      const resolved = events.filter(event => event.stage === 'archived');
      const durations = resolved.map(event => event.closedHours).filter(hours => typeof hours === 'number');
      const critical = confirmed.filter(event => event.critical);
      const criticalCustomers = new Set(critical.map(event => event.customerId)).size;
      const criticalHnwCustomers = new Set(critical.filter(event => ['高净值', '私行'].includes(event.customerTier)).map(event => event.customerId)).size;
      const highConfirmed = confirmed.filter(event => event.level === 'high');
      const highResolved = highConfirmed.filter(event => event.stage === 'archived');
      const highOpen = highConfirmed.filter(event => event.stage !== 'archived');
      const repeatConfirmed = confirmed.filter(event => event.repeat);
      /* 账龄是“截至数据截止日的存量”，不受统计窗口限制 */
      const reference = Date.parse(`${lastDate}T00:00:00Z`);
      const ageOf = event => Math.max(0, Math.round((reference - Date.parse(`${event.date}T00:00:00Z`)) / DAY));
      const openHigh = data.events.filter(event => event.confirmed && event.level === 'high' && event.stage !== 'archived');
      const aging = [
        { key: '0-3', label: '0–3 天', value: openHigh.filter(event => ageOf(event) <= 3).length },
        { key: '4-7', label: '4–7 天', value: openHigh.filter(event => ageOf(event) >= 4 && ageOf(event) <= 7).length },
        { key: '8-30', label: '8–30 天', value: openHigh.filter(event => ageOf(event) >= 8 && ageOf(event) <= 30).length },
        { key: '30+', label: '30 天以上', value: openHigh.filter(event => ageOf(event) > 30).length }
      ];
      return {
        win,
        archived,
        scanned,
        customers: sum(win.days, day => day.customers),
        hits: events.length,
        confirmedCount: confirmed.length,
        confirmedRate: ratio(confirmed.length, events.length),
        coverage: ratio(scanned, archived),
        closureRate: ratio(resolved.length, confirmed.length),
        rectifiedCount: events.filter(event => event.stage === 'archived' || event.stage === 'rectified').length,
        resolvedCount: resolved.length,
        overdueCount: events.filter(event => event.overdue).length,
        repeatRate: ratio(events.filter(event => event.repeat).length, events.length),
        medianHours: median(durations),
        criticalCount: critical.length,
        criticalCustomers,
        criticalHnwCustomers,
        criticalRate: ratio(critical.length, confirmed.length),
        repeatConfirmed: repeatConfirmed.length,
        repeatConfirmedRate: ratio(repeatConfirmed.length, confirmed.length),
        repeatEmployees: new Set(repeatConfirmed.map(event => event.employee)).size,
        affectedCustomers: new Set(confirmed.map(event => event.customerId)).size,
        affectedEmployees: new Set(confirmed.map(event => event.employee)).size,
        employeeTotal: data.employeeCoverage.total,
        highConfirmed: highConfirmed.length,
        highResolved: highResolved.length,
        highOpen: highOpen.length,
        highClosureRate: ratio(highResolved.length, highConfirmed.length),
        aging,
        agingTotal: openHigh.length
      };
    }

    function trendRows(win) {
      const buckets = new Map();
      const byDay = win.days.length <= 31;
      for (const day of win.days) {
        const key = byDay ? day.date : day.week;
        if (!buckets.has(key)) buckets.set(key, { key, hits: 0, confirmed: 0 });
      }
      for (const event of win.events) {
        const bucket = buckets.get(byDay ? event.date : event.week);
        if (!bucket) continue;
        bucket.hits += 1;
        if (event.confirmed) bucket.confirmed += 1;
      }
      return [...buckets.values()].sort((a, b) => a.key.localeCompare(b.key));
    }

    function ruleRows(win) {
      return data.RULES.map(rule => {
        const matched = win.events.filter(event => event.ruleId === rule.id);
        const rejected = matched.filter(event => !event.confirmed).length;
        return { id: rule.id, name: rule.name, category: rule.category, hits: matched.length, rejected, missRate: ratio(rejected, matched.length) };
      }).filter(row => row.hits > 0);
    }

    function departmentRows(win, summary) {
      return data.DEPARTMENTS.map(dept => {
        const matched = win.events.filter(event => event.dept === dept.name);
        /* 部门会话量按固定占比拆分：原型没有逐部门会话明细，用占比近似 */
        const sessions = summary.archived * dept.share;
        return {
          name: dept.name,
          hits: matched.length,
          confirmed: matched.filter(event => event.confirmed).length,
          sessions: Math.round(sessions),
          density: sessions ? matched.length / sessions * 1000 : 0
        };
      }).sort((a, b) => b.density - a.density);
    }

    function groupRows(win, picker, order) {
      const buckets = new Map();
      for (const event of win.events) {
        const key = picker(event);
        if (!buckets.has(key)) buckets.set(key, { key, hits: 0, confirmed: 0 });
        const bucket = buckets.get(key);
        bucket.hits += 1;
        if (event.confirmed) bucket.confirmed += 1;
      }
      const rows = [...buckets.values()];
      return order
        ? order.map(key => rows.find(row => row.key === key)).filter(Boolean)
        : rows.sort((a, b) => b.hits - a.hits);
    }

    /* 已确认、高风险、但尚未归档的事件，滞留最久的排前面 */
    function pendingHighRisk(win, limit = 3) {
      const reference = Date.parse(`${win.to}T00:00:00Z`);
      return win.events
        .filter(event => event.confirmed && event.level === 'high' && event.stage !== 'archived')
        .map(event => ({ ...event, age: Math.round((reference - Date.parse(`${event.date}T00:00:00Z`)) / DAY) }))
        .sort((a, b) => b.age - a.age)
        .slice(0, limit);
    }

    /* 重复违规：确认且标记再犯的事件，按「同人同规则」聚合，次数多的排前面 */
    function repeatRows(win, limit = 5) {
      const buckets = new Map();
      for (const event of win.events) {
        if (!event.confirmed || !event.repeat) continue;
        const key = `${event.employee}|${event.ruleId}`;
        if (!buckets.has(key)) buckets.set(key, { employee: event.employee, dept: event.dept, ruleId: event.ruleId, ruleName: event.ruleName, count: 0, last: event.date });
        const bucket = buckets.get(key);
        bucket.count += 1;
        if (event.date > bucket.last) bucket.last = event.date;
      }
      return [...buckets.values()].sort((a, b) => b.count - a.count || b.last.localeCompare(a.last)).slice(0, limit);
    }

    /* 业务量：按天（≤31 天）或按周聚合会话量与质检量 */
    function volumeRows(win) {
      const byDay = win.days.length <= 31;
      const buckets = new Map();
      for (const day of win.days) {
        const key = byDay ? day.date : day.week;
        if (!buckets.has(key)) buckets.set(key, { key, archived: 0, scanned: 0 });
        const bucket = buckets.get(key);
        bucket.archived += day.archived;
        bucket.scanned += day.scanned;
      }
      return [...buckets.values()].sort((a, b) => a.key.localeCompare(b.key));
    }

    function volumeChart(rows) {
      const width = 340, height = 140;
      const pad = { left: 8, right: 8, top: 14, bottom: 22 };
      const plotW = width - pad.left - pad.right;
      const plotH = height - pad.top - pad.bottom;
      const peak = Math.max(...rows.map(row => row.archived), 1);
      const x = index => pad.left + (rows.length > 1 ? index * plotW / (rows.length - 1) : plotW / 2);
      const y = value => pad.top + plotH - value / peak * plotH;
      const path = key => rows.map((row, index) => `${index ? 'L' : 'M'}${x(index).toFixed(1)} ${y(row[key]).toFixed(1)}`).join(' ');
      const area = `${path('scanned')} L${x(rows.length - 1).toFixed(1)} ${(pad.top + plotH).toFixed(1)} L${x(0).toFixed(1)} ${(pad.top + plotH).toFixed(1)} Z`;
      const grid = [0, .5, 1].map(t => `<line x1="${pad.left}" y1="${(pad.top + plotH * (1 - t)).toFixed(1)}" x2="${width - pad.right}" y2="${(pad.top + plotH * (1 - t)).toFixed(1)}" class="vol-grid"/>`).join('');
      const shortDate = date => `${Number(date.slice(5, 7))}/${Number(date.slice(8, 10))}`;
      const marks = [...new Set([0, Math.floor((rows.length - 1) / 2), rows.length - 1])];
      const labels = marks.map(index => `<text x="${x(index).toFixed(1)}" y="${height - 6}" class="vol-axis" text-anchor="${index === 0 ? 'start' : index === rows.length - 1 ? 'end' : 'middle'}">${shortDate(rows[index].key)}</text>`).join('');
      const dots = rows.map((row, index) => `<circle cx="${x(index).toFixed(1)}" cy="${y(row.scanned).toFixed(1)}" r="2.5" class="vol-dot scanned"><title>${row.key}：会话 ${number(row.archived)} · 已质检 ${number(row.scanned)}</title></circle>`).join('');
      return `<svg class="volume-svg" viewBox="0 0 ${width} ${height}" role="img" aria-label="会话量与质检量趋势">${grid}<path d="${area}" class="vol-area"/><path d="${path('archived')}" class="vol-line archived"/><path d="${path('scanned')}" class="vol-line scanned"/>${dots}${labels}</svg>`;
    }

    /* 重复违规面板：三个口径数字 + 屡犯名单，名单可跳转复核页 */
    function repeatPanel(summary, rows) {
      const stats = `<div class="repeat-stats">
          <div class="repeat-stat"><b>${percent(summary.repeatConfirmedRate)}</b><span>占确认风险</span></div>
          <div class="repeat-stat"><b>${number(summary.repeatEmployees)}</b><span>屡犯员工数</span></div>
          <div class="repeat-stat"><b>${number(summary.repeatConfirmed)}</b><span>重复确认条数</span></div>
        </div>`;
      const list = rows.length ? `<p class="action-group">屡犯名单 · 按再犯次数</p><div class="repeat-list">${rows.map((row, index) => `
        <button class="repeat-row" data-action="overview-cases" data-employee="${esc(row.employee)}" title="查看该员工相关风险">
          <span class="top-rank">${index + 1}</span>
          <span class="repeat-name">${esc(row.employee)}<small>${esc(row.dept)}</small></span>
          <span class="repeat-rule">${esc(row.ruleId)} ${esc(row.ruleName)}</span>
          <span class="repeat-count">${row.count} 次<i>最近 ${row.last.slice(5).replace('-', '/')}</i></span>
        </button>`).join('')}</div>` : '<p class="action-empty">本期确认风险中没有重复违规。</p>';
      return stats + list;
    }

    /* ---------- 结论条：把数据翻译成管理者要追的一句话 ---------- */
    function verdictOf(summary, rules) {
      const issues = [];
      if (summary.criticalCount > 0) issues.push(`本期确认红线风险 ${summary.criticalCount} 条，涉及 ${summary.criticalCustomers} 位客户`);
      if (summary.aging[3].value > 0) issues.push(`${summary.aging[3].value} 条高风险账龄超过 30 天仍未闭环，需立即升级`);
      if (summary.affectedEmployees >= Math.ceil(summary.employeeTotal * .8)) issues.push(`本期 ${summary.affectedEmployees} / ${summary.employeeTotal} 位员工被确认存在违规，风险覆盖面偏广`);
      if (summary.highClosureRate < .9) issues.push(`高风险闭环率 ${percent(summary.highClosureRate)}，低于 90% 目标`);
      const worstRule = [...rules].filter(row => row.hits >= 10).sort((a, b) => b.missRate - a.missRate)[0];
      if (worstRule && worstRule.missRate >= .3) issues.push(`${worstRule.id}「${worstRule.name}」误报率 ${percent(worstRule.missRate)}，建议复核规则口径`);
      const urgent = summary.criticalCount > 0 || summary.aging[3].value > 0;
      return {
        status: urgent ? '需立即关注' : issues.length ? '需关注' : '总体可控',
        tone: urgent ? 'warn' : issues.length ? 'notice' : 'good',
        headline: issues[0] || '本期未发现需要升级的红线与高风险积压，闭环与证据完整度在演示目标内。',
        rest: issues.slice(1, 3)
      };
    }

    /* ---------- 组件 ---------- */
    function kpiCard({ label, value, note, delta, better, target, status }) {
      let foot = '<span class="kpi-delta flat">环比 —</span>';
      if (typeof delta === 'number' && Number.isFinite(delta) && Math.abs(delta) >= .001) {
        const rising = delta > 0;
        const neutral = better === 'none';
        const good = !neutral && (better === 'up' ? rising : !rising);
        foot = `<span class="kpi-delta ${neutral ? 'flat' : good ? 'good' : 'bad'}">${rising ? '↑' : '↓'} ${percent(Math.abs(delta))}</span>`;
      }
      const badge = status ? `<span class="kpi-status ${status.tone}">${esc(status.label)}</span>` : '';
      return `<article class="kpi-card ${status ? 'has-status' : ''}">
        <p class="kpi-label">${label}${badge}</p>
        <p class="kpi-value">${value}</p>
        <p class="kpi-foot">${foot}<span class="kpi-note">${note}</span></p>
        ${target ? `<p class="kpi-target">${esc(target)}</p>` : ''}
      </article>`;
    }

    /* ---------- 领导驾驶舱：结果指标、账龄、Top 对象、升级事项 ---------- */
    function topRows(win, key, limit = 5) {
      const buckets = new Map();
      for (const event of win.events) {
        const name = event[key];
        if (!buckets.has(name)) buckets.set(name, { name, dept: event.dept, hits: 0, confirmed: 0, critical: 0, repeat: 0, resolved: 0 });
        const bucket = buckets.get(name);
        bucket.hits += 1;
        if (event.confirmed) bucket.confirmed += 1;
        if (event.confirmed && event.critical) bucket.critical += 1;
        if (event.confirmed && event.repeat) bucket.repeat += 1;
        if (event.confirmed && event.stage === 'archived') bucket.resolved += 1;
      }
      return [...buckets.values()]
        .sort((a, b) => b.confirmed - a.confirmed || b.critical - a.critical)
        .slice(0, limit)
        .map(row => ({ ...row, closureRate: ratio(row.resolved, row.confirmed) }));
    }
    function topList(win, tab) {
      const rows = topRows(win, tab === 'departments' ? 'dept' : 'employee');
      return `<div class="top-tabs" role="tablist" aria-label="Top 风险对象">
        <button role="tab" aria-selected="${tab === 'people'}" class="${tab === 'people' ? 'active' : ''}" data-action="overview-top" data-tab="people">人员</button>
        <button role="tab" aria-selected="${tab === 'departments'}" class="${tab === 'departments' ? 'active' : ''}" data-action="overview-top" data-tab="departments">团队</button>
      </div><div class="top-list">${rows.length ? rows.map((row, index) => `
        <button class="top-row" data-action="overview-cases" ${tab === 'departments' ? `data-dept="${esc(row.name)}"` : `data-employee="${esc(row.name)}"`}>
          <span class="top-rank">${index + 1}</span>
          <span class="top-name">${esc(row.name)}<small>${tab === 'departments' ? '团队' : esc(row.dept)}</small></span>
          <span class="top-metrics"><b>${row.confirmed}</b><small>确认</small></span>
          <span class="top-flags"><i>红线 ${row.critical}</i><i>重复 ${row.repeat}</i></span>
          <span class="top-rate">${percent(row.closureRate)}<small>闭环</small></span>
        </button>`).join('') : '<p class="muted small">本期没有可排行的风险对象。</p>'}</div>`;
    }

    function trendChart(rows) {
      const width = 760;
      const height = 220;
      const pad = { left: 46, right: 18, top: 20, bottom: 34 };
      const plotWidth = width - pad.left - pad.right;
      const plotHeight = height - pad.top - pad.bottom;
      const steps = 4;
      const rawPeak = Math.max(...rows.map(row => Math.max(row.hits, row.confirmed)), 1);
      const peak = Math.ceil(rawPeak / steps) * steps;
      const x = index => pad.left + (rows.length > 1 ? index * plotWidth / (rows.length - 1) : plotWidth / 2);
      const y = value => pad.top + plotHeight - value / peak * plotHeight;
      const path = key => rows.map((row, index) => `${index ? 'L' : 'M'}${x(index).toFixed(1)} ${y(row[key]).toFixed(1)}`).join(' ');
      const area = key => `${path(key)} L${x(rows.length - 1).toFixed(1)} ${(pad.top + plotHeight).toFixed(1)} L${x(0).toFixed(1)} ${(pad.top + plotHeight).toFixed(1)} Z`;
      const grid = Array.from({ length: steps + 1 }, (unused, index) => {
        const value = peak / steps * index;
        const lineY = y(value).toFixed(1);
        return `<line x1="${pad.left}" y1="${lineY}" x2="${width - pad.right}" y2="${lineY}" class="trend-grid"/>
          <text x="${pad.left - 9}" y="${lineY}" class="trend-axis" text-anchor="end" dominant-baseline="middle">${Math.round(value)}</text>`;
      }).join('');
      const shortDate = date => `${Number(date.slice(5, 7))}/${Number(date.slice(8, 10))}`;
      const labelStep = Math.max(1, Math.ceil(rows.length / 8));
      const marks = [];
      for (let index = 0; index < rows.length; index += labelStep) marks.push(index);
      if (marks.at(-1) !== rows.length - 1) {
        if (rows.length - 1 - marks.at(-1) >= Math.ceil(labelStep / 2)) marks.push(rows.length - 1);
        else marks[marks.length - 1] = rows.length - 1;
      }
      const labels = marks.map(index => `<text x="${x(index).toFixed(1)}" y="${height - 12}" class="trend-axis" text-anchor="middle">${shortDate(rows[index].key)}</text>`).join('');
      const dots = rows.map((row, index) => `
        <circle cx="${x(index).toFixed(1)}" cy="${y(row.hits).toFixed(1)}" r="3" class="trend-dot hit"><title>${row.key}：AI 提示 ${row.hits} 条</title></circle>
        <circle cx="${x(index).toFixed(1)}" cy="${y(row.confirmed).toFixed(1)}" r="3" class="trend-dot confirmed"><title>${row.key}：人工确认 ${row.confirmed} 条</title></circle>`).join('');
      return `<div class="trend-legend">
          <span class="legend-item"><i class="legend-line confirmed"></i>人工确认（主线）</span>
          <span class="legend-item"><i class="legend-line hit"></i>AI 提示（工作量）</span>
          <span class="legend-note">确认数才是结果；AI 提示会随规则收紧上升</span>
        </div>
        <div class="trend-scroll">
          <svg class="trend-svg" viewBox="0 0 ${width} ${height}" role="img" aria-label="所选区间内人工确认与 AI 提示趋势">
            ${grid}
            <path d="${area('confirmed')}" class="trend-area"/>
            <path d="${path('hits')}" class="trend-line hit"/>
            <path d="${path('confirmed')}" class="trend-line confirmed"/>
            ${dots}
            ${labels}
          </svg>
        </div>`;
    }

    /* 漏斗：上宽下窄的真实漏斗形状，每级宽度按占首环节数量比例收窄，右侧标注逐级转化率 */
    function funnel(summary) {
      const steps = [
        { label: 'AI 提示', value: summary.hits, color: '#4a6fb5' },
        { label: '人工确认', value: summary.confirmedCount, color: '#3f7fb5' },
        { label: '整改完成', value: summary.rectifiedCount, color: '#3f9d84' },
        { label: '已归档', value: summary.resolvedCount, color: '#2f8c68' }
      ];
      const width = 480, height = 224, cx = 176, maxW = 296, barH = 46, gap = 13;
      const top = Math.max(steps[0].value, 1);
      const widthOf = value => (value > 0 ? Math.max(30, value / top * maxW) : 10);
      const rows = steps.map((step, index) => ({ ...step, w: widthOf(step.value), y: index * (barH + gap) }));
      const shapes = rows.map((row, index) => {
        const next = rows[index + 1];
        const bottomW = next ? next.w : Math.max(16, row.w * .55);
        const x1 = (cx - row.w / 2).toFixed(1), x2 = (cx + row.w / 2).toFixed(1);
        const x3 = (cx + bottomW / 2).toFixed(1), x4 = (cx - bottomW / 2).toFixed(1);
        const inside = row.w >= 96;
        const label = inside
          ? `<text x="${cx}" y="${(row.y + barH / 2 - 4).toFixed(1)}" class="funnel-stage" text-anchor="middle">${esc(row.label)}</text><text x="${cx}" y="${(row.y + barH / 2 + 15).toFixed(1)}" class="funnel-count" text-anchor="middle">${number(row.value)}</text>`
          : `<text x="${(cx + row.w / 2 + 12).toFixed(1)}" y="${(row.y + barH / 2 + 4).toFixed(1)}" class="funnel-out">${esc(row.label)} ${number(row.value)}</text>`;
        return `<path d="M${x1} ${row.y}L${x2} ${row.y}L${x3} ${row.y + barH}L${x4} ${row.y + barH}Z" fill="${row.color}"><title>${esc(row.label)}：${number(row.value)} 条</title></path>${label}`;
      }).join('');
      const rateNames = ['确认率', '整改完成率', '归档率'];
      const rates = rows.slice(1).map((row, index) => {
        const prev = rows[index];
        const y = row.y - gap / 2;
        const from = cx + Math.max(row.w, prev.w) / 2 + 12;
        return `<line x1="${from.toFixed(1)}" y1="${y.toFixed(1)}" x2="352" y2="${y.toFixed(1)}" class="funnel-link"/><text x="356" y="${(y - 1).toFixed(1)}" class="funnel-rate-value">${percent(ratio(row.value, prev.value))}</text><text x="356" y="${(y + 12).toFixed(1)}" class="funnel-rate-label">${rateNames[index]}</text>`;
      }).join('');
      return `<div class="funnel-scroll"><svg class="funnel-svg" viewBox="0 0 ${width} ${height}" role="img" aria-label="处置漏斗：AI 提示经人工确认、整改完成到已归档的逐级转化">${shapes}${rates}</svg></div>`;
    }

    /* 团队风险密度：柱状图，纵轴为每千条会话命中数 */
    function densityChart(rows) {
      const width = 340, height = 232;
      const pad = { left: 42, right: 10, top: 26, bottom: 30 };
      const plotW = width - pad.left - pad.right;
      const plotH = height - pad.top - pad.bottom;
      const peakRaw = Math.max(...rows.map(row => row.value), .01);
      const peak = Math.max(.5, Math.ceil(peakRaw / .5) * .5);
      const yOf = value => pad.top + plotH - value / peak * plotH;
      const marks = [];
      for (let v = 0; v <= peak + 1e-9; v += .5) marks.push(v);
      const grid = marks.map(v => `<line x1="${pad.left}" y1="${yOf(v).toFixed(1)}" x2="${width - pad.right}" y2="${yOf(v).toFixed(1)}" class="density-grid"/><text x="${pad.left - 8}" y="${yOf(v).toFixed(1)}" class="density-axis" text-anchor="end" dominant-baseline="middle">${v.toFixed(1)}</text>`).join('');
      const slot = plotW / rows.length;
      const barW = Math.min(48, slot * .52);
      const lead = rows.findIndex(row => row.value === peakRaw);
      const bars = rows.map((row, index) => {
        const x = pad.left + slot * index + slot / 2;
        const y = yOf(row.value);
        return `<rect x="${(x - barW / 2).toFixed(1)}" y="${y.toFixed(1)}" width="${barW.toFixed(1)}" height="${(pad.top + plotH - y).toFixed(1)}" rx="4" class="density-bar ${index === lead ? 'lead' : ''}"><title>${esc(row.title)}</title></rect><text x="${x.toFixed(1)}" y="${(y - 7).toFixed(1)}" class="density-value" text-anchor="middle">${row.value.toFixed(2)}‰</text><text x="${x.toFixed(1)}" y="${(height - 10).toFixed(1)}" class="density-name" text-anchor="middle">${esc(row.name)}</text>`;
      }).join('');
      return `<svg class="density-svg" viewBox="0 0 ${width} ${height}" role="img" aria-label="各团队每千条会话的风险命中密度">${grid}<line x1="${pad.left}" y1="${pad.top + plotH}" x2="${width - pad.right}" y2="${pad.top + plotH}" class="density-axis-line"/>${bars}</svg>`;
    }

    /* 风险类型分布：横向堆叠条，蓝色人工确认 + 灰色误报驳回 */
    function categoryChart(rows) {
      const peak = Math.max(...rows.map(row => row.hits), 1);
      return `<div class="cat-legend"><span class="legend-item"><i class="legend-dot" style="background:#2c5bd8"></i>人工确认</span><span class="legend-item"><i class="legend-dot" style="background:#ccd6e4"></i>误报驳回</span></div>
        <div class="cat-rows">${rows.map(row => {
          const rejected = row.hits - row.confirmed;
          return `<div class="cat-row">
            <span class="cat-name">${esc(row.key)}</span>
            <div class="cat-track" title="${esc(row.key)}：命中 ${row.hits} 条 · 确认 ${row.confirmed} · 驳回 ${rejected}"><i class="cat-seg confirmed" style="width:${(row.confirmed / peak * 100).toFixed(1)}%"></i><i class="cat-seg rejected" style="width:${(rejected / peak * 100).toFixed(1)}%"></i></div>
            <span class="cat-text"><b>${row.hits}</b> 条 · 确认 ${row.confirmed}</span>
          </div>`;
        }).join('')}</div>`;
    }

    /* 风险等级：环形饼图 + 图例，中心显示总数 */
    function levelPie(rows, total) {
      if (!total) return '<p class="action-empty">当前窗口内没有 AI 提示。</p>';
      const cx = 90, cy = 90, outer = 76, inner = 52;
      let angle = -Math.PI / 2;
      const point = (r, a) => `${(cx + r * Math.cos(a)).toFixed(2)} ${(cy + r * Math.sin(a)).toFixed(2)}`;
      const slices = rows.map(row => {
        const span = Math.min(Math.PI * 2 - .001, row.hits / total * Math.PI * 2);
        const start = angle, end = angle + span;
        angle = end;
        const large = span > Math.PI ? 1 : 0;
        const d = row.hits ? `M${point(outer, start)}A${outer} ${outer} 0 ${large} 1 ${point(outer, end)}L${point(inner, end)}A${inner} ${inner} 0 ${large} 0 ${point(inner, start)}Z` : '';
        return { row, d, share: row.hits / total };
      });
      const paths = slices.filter(slice => slice.d).map(slice => `<path d="${slice.d}" fill="${LEVEL_COLOR[slice.row.key]}"><title>${LEVEL_NAME[slice.row.key]} ${slice.row.hits} 条 · 占比 ${percent(slice.share)}</title></path>`).join('');
      const legend = rows.map(row => `<li><i class="legend-dot" style="background:${LEVEL_COLOR[row.key]}"></i><span>${LEVEL_NAME[row.key]}</span><b>${row.hits}</b><small>占比 ${percent(row.hits / total)} · 确认 ${row.confirmed}</small></li>`).join('');
      return `<div class="level-pie">
        <svg viewBox="0 0 180 180" role="img" aria-label="风险等级占比">${paths}<text x="90" y="87" class="pie-total" text-anchor="middle">${number(total)}</text><text x="90" y="106" class="pie-caption" text-anchor="middle">AI 提示总数</text></svg>
        <ul class="level-list">${legend}</ul>
      </div>`;
    }

    function actionItems(items) {
      if (!items.length) return '<p class="action-empty">当前窗口内没有需要上报的条目。</p>';
      return `<ul class="action-list">${items.map(item => `
        <li class="action-item">
          <span class="action-tag ${item.tone}">${esc(item.tag)}</span>
          <div>
            <p class="action-title">${esc(item.title)}</p>
            <p class="action-note">${esc(item.note)}</p>
          </div>
        </li>`).join('')}</ul>`;
    }

    /* ---------- 领导问题层：在原报表上增量 ---------- */
    function addDays(date, days) {
      return new Date(Date.parse(`${date}T00:00:00Z`) + days * DAY).toISOString().slice(0, 10);
    }
    function leadTrend(delta) {
      if (delta === null || !Number.isFinite(delta)) return '<span class="lead-trend flat">—</span>';
      if (Math.abs(delta) < .001) return '<span class="lead-trend flat">持平</span>';
      const up = delta > 0;
      return `<span class="lead-trend ${up ? 'up' : 'down'}">${up ? '↑' : '↓'} ${percent(Math.abs(delta))}</span>`;
    }
    function ruleIssueRows(win, beforeWin) {
      const previousEvents = beforeWin?.events || [];
      return data.RULES.map(rule => {
        const matched = win.events.filter(event => event.ruleId === rule.id);
        const confirmed = matched.filter(event => event.confirmed);
        const rejected = matched.length - confirmed.length;
        const previousConfirmed = previousEvents.filter(event => event.confirmed && event.ruleId === rule.id).length;
        const teams = [...new Set(confirmed.map(event => event.dept))]
          .map(name => ({ name, count: confirmed.filter(event => event.dept === name).length }))
          .sort((a, b) => b.count - a.count);
        const critical = confirmed.filter(event => event.critical).length;
        const repeat = confirmed.filter(event => event.repeat).length;
        const delta = previousConfirmed ? (confirmed.length - previousConfirmed) / previousConfirmed : null;
        const missRate = ratio(rejected, matched.length);
        return {
          id: rule.id, name: rule.name, category: rule.category,
          hits: matched.length, confirmed: confirmed.length, rejected,
          missRate, critical, repeat, teams, delta,
          recommendation: missRate >= .3 ? '规则复核' : critical >= 10 ? '专项复盘' : repeat >= 3 ? '专项培训' : '保持观察'
        };
      }).filter(row => row.hits > 0)
        .sort((a, b) => b.critical - a.critical || b.confirmed - a.confirmed);
    }
    function teamIssueRows(win, beforeWin, summary) {
      const previousEvents = beforeWin?.events || [];
      return data.DEPARTMENTS.map(dept => {
        const matched = win.events.filter(event => event.dept === dept.name);
        const confirmed = matched.filter(event => event.confirmed);
        const archived = confirmed.filter(event => event.stage === 'archived');
        const overdue = confirmed.filter(event => event.overdue);
        const critical = confirmed.filter(event => event.critical);
        const repeat = confirmed.filter(event => event.repeat);
        const previousConfirmed = previousEvents.filter(event => event.confirmed && event.dept === dept.name).length;
        const sessions = Math.max(1, Math.round(summary.archived * dept.share));
        const employees = new Set(confirmed.map(event => event.employee)).size;
        return {
          name: dept.name, lead: dept.lead, sessions, employees, roster: dept.members.length,
          confirmed: confirmed.length, critical: critical.length,
          density: confirmed.length / sessions * 1000,
          closureRate: ratio(archived.length, confirmed.length),
          overdue: overdue.length,
          repeatRate: ratio(repeat.length, confirmed.length),
          falseRate: ratio(matched.length - confirmed.length, matched.length),
          delta: previousConfirmed ? (confirmed.length - previousConfirmed) / previousConfirmed : null,
          sample: sessions < 100
        };
      }).sort((a, b) => b.critical - a.critical || b.density - a.density);
    }
    function keyIssueRows(summary, rules, teams, win) {
      const issues = [];
      const topRule = rules[0];
      const topTeam = teams[0];
      const repeatRule = [...rules]
        .filter(row => row.repeat > 0 && (!topRule || row.id !== topRule.id))
        .sort((a, b) => b.repeat - a.repeat)[0];
      if (topRule && topRule.confirmed > 0) issues.push({
        tone: topRule.critical > 0 ? 'danger' : 'notice', label: '规则问题',
        title: `${topRule.id}「${topRule.name}」${topRule.critical > 0 ? '红线高发' : '命中高发'}`,
        impact: `红线 ${topRule.critical} 条 · 确认 ${topRule.confirmed} 条 · 误报 ${percent(topRule.missRate)}`,
        teams: topRule.teams.slice(0, 3),
        action: '复核规则口径与正反例，针对高频团队做专项复盘。',
        owner: '李合规', due: addDays(win.to, 10), status: '待排期',
        effect: '误报率降至 20% 以下，红线事件环比下降。',
        ruleId: topRule.id
      });
      if (topTeam && topTeam.confirmed > 0) issues.push({
        tone: topTeam.overdue > 0 || topTeam.closureRate < .7 ? 'warn' : 'notice', label: '团队问题',
        title: `${topTeam.name} ${topTeam.critical > 0 ? '红线与闭环压力' : '风险与闭环压力'}`,
        impact: `红线 ${topTeam.critical} 条 · 闭环 ${percent(topTeam.closureRate)} · 超期 ${topTeam.overdue} 条`,
        teams: [{ name: topTeam.name, count: topTeam.critical }],
        action: '由团队负责人牵头复盘话术与整改，优先处理超期事件。',
        owner: topTeam.lead, due: addDays(win.to, 7), status: '待启动',
        effect: '超期清零，团队闭环率提升至 85% 以上。',
        teamName: topTeam.name
      });
      if (repeatRule) issues.push({
        tone: 'notice', label: '重复违规',
        title: `${repeatRule.id}「${repeatRule.name}」重复违规`,
        impact: `重复确认 ${repeatRule.repeat} 条 · 占该规则确认 ${percent(repeatRule.confirmed ? repeatRule.repeat / repeatRule.confirmed : 0)}`,
        teams: repeatRule.teams.slice(0, 3),
        action: '开展专项培训，30 天后复检同人同规则复发率。',
        owner: '张培训', due: addDays(win.to, 14), status: '待排期',
        effect: '30 天复发率降至 10% 以下。',
        ruleId: repeatRule.id
      });
      if (issues.length < 3) issues.push({
        tone: 'notice', label: '数据缺口',
        title: '客户后果数据尚未接入',
        impact: '投诉 / 监管 / 赔付 / 安抚结果缺失，无法评估外溢影响。',
        teams: [],
        action: '明确投诉、监管、赔付与客户安抚的数据口径和责任人。',
        owner: '数据负责人', due: addDays(win.to, 30), status: '待排期',
        effect: '可评估事件后果与外溢影响，支撑管理决策。'
      });
      return issues.slice(0, 3);
    }
    function solutionRows(issues) {
      return issues.map(issue => ({
        issue: issue.title, action: issue.action, owner: issue.owner, due: issue.due,
        effect: issue.effect, status: issue.status, tone: issue.tone
      }));
    }
    function keyIssueCards(issues) {
      return `<section class="lead-issues">
        <div class="lead-section-head"><div><h2>本期关键问题</h2><p>先看这三件事，再往下看问题清单、团队和动作。</p></div><span class="tag amber">需管理者确认</span></div>
        <div class="lead-issue-grid">${issues.map((issue, index) => `<article class="lead-issue-card ${issue.tone}">
          <div class="lead-issue-top"><span class="lead-issue-index">${index + 1}</span><span class="tag ${issue.tone === 'danger' ? 'amber' : issue.tone === 'warn' ? 'amber' : 'blue'}">${esc(issue.label)}</span></div>
          <h3>${esc(issue.title)}</h3>
          <p class="lead-issue-impact">${esc(issue.impact)}</p>
          <div class="lead-issue-teams">${issue.teams.length ? issue.teams.map(team => `<button class="issue-team-chip" data-action="overview-cases" data-dept="${esc(team.name)}">${esc(team.name)} <b>${team.count}</b></button>`).join('') : '<span class="muted small">暂无具体团队</span>'}</div>
          <p class="lead-issue-action">${esc(issue.action)}</p>
          <div class="lead-issue-foot"><span>${esc(issue.owner)}</span><span>截止 ${esc(issue.due)}</span><span>${esc(issue.status)}</span></div>
        </article>`).join('')}</div>
      </section>`;
    }
    function issueTable(rows) {
      return `<section class="panel lead-panel" id="issue-list">
        <div class="panel-heading lead-panel-head"><div><h2>问题清单 <span class="tag subtle">${rows.length}</span></h2><p class="lead-sub">按红线数排序 · 覆盖规则、团队、趋势与建议</p></div><span class="tag subtle">本期 vs 上期</span></div>
        <div class="table-scroll"><table class="lead-table"><thead><tr><th>问题 / 规则</th><th class="num">命中</th><th class="num">确认</th><th class="num">误报率</th><th class="num">红线</th><th>涉及团队</th><th class="num">环比</th><th>建议</th><th></th></tr></thead><tbody>${rows.length ? rows.map(row => `<tr>
          <td><b>${esc(row.id)} · ${esc(row.name)}</b><small>${esc(row.category)}</small></td>
          <td class="num">${row.hits}</td>
          <td class="num">${row.confirmed}</td>
          <td class="num ${row.missRate > .2 ? 'lead-warn' : ''}">${percent(row.missRate)}</td>
          <td class="num ${row.critical ? 'lead-risk' : ''}">${row.critical}</td>
          <td><div class="lead-team-chips">${row.teams.length ? row.teams.slice(0, 3).map(team => `<button class="issue-team-chip" data-action="overview-cases" data-dept="${esc(team.name)}">${esc(team.name)} <b>${team.count}</b></button>`).join('') : '<span class="muted small">—</span>'}${row.teams.length > 3 ? `<span class="issue-team-more">+${row.teams.length - 3}</span>` : ''}</div></td>
          <td class="num">${leadTrend(row.delta)}</td>
          <td><span class="tag ${row.recommendation === '规则复核' || row.recommendation === '专项复盘' ? 'amber' : row.recommendation === '专项培训' ? 'blue' : 'subtle'}">${esc(row.recommendation)}</span></td>
          <td><button class="button mini" data-action="overview-issue" data-rule="${esc(row.id)}">查看</button></td>
        </tr>`).join('') : '<tr><td colspan="9"><div class="action-empty">当前窗口没有规则命中。</div></td></tr>'}</tbody></table></div>
        <p class="panel-foot">红线口径：承诺类 + 材料类（演示）；误报率为人工驳回 / 命中；环比按确认数对比上一周期。团队 chips 可点击查看该团队风险。</p>
      </section>`;
    }
    function teamCompareTable(rows, current) {
      return `<section class="panel lead-panel" id="team-compare">
        <div class="panel-heading lead-panel-head"><div><h2>团队问题对比</h2><p class="lead-sub">负责人、红线、闭环、超期、复发与误报</p></div><span class="tag subtle">${rows.length} 个团队</span></div>
        <div class="table-scroll"><table class="lead-table"><thead><tr><th>团队 / 负责人</th><th class="num">涉及员工</th><th class="num">确认</th><th class="num">红线</th><th class="num">每千条</th><th class="num">闭环率</th><th class="num">超期</th><th class="num">复发率</th><th class="num">误报率</th><th class="num">环比</th><th></th></tr></thead><tbody>${rows.map(row => `<tr>
          <td><b>${esc(row.name)}</b><small>负责人 ${esc(row.lead)}</small></td>
          <td class="num">${row.employees}/${row.roster}</td>
          <td class="num">${row.confirmed}</td>
          <td class="num ${row.critical ? 'lead-risk' : ''}">${row.critical}</td>

    function solutionTable(rows) {
      return `<section class="panel lead-panel" id="solutions">
        <div class="panel-heading lead-panel-head"><div><h2>行动跟踪</h2><p class="lead-sub">解决方案落地：问题 → 动作 → 负责人 → 截止 → 预期效果</p></div><span class="tag amber">需管理者确认</span></div>
        <div class="table-scroll"><table class="lead-table"><thead><tr><th>问题</th><th>建议动作</th><th>负责人</th><th>截止</th><th>预期效果</th><th>状态</th></tr></thead><tbody>${rows.map(row => `<tr>
          <td><b>${esc(row.issue)}</b></td>
          <td>${esc(row.action)}</td>
          <td>${esc(row.owner)}</td>
          <td>${esc(row.due)}</td>
          <td>${esc(row.effect)}</td>

    function openIssue(ruleId) {
      if (!env.open) return;
      const span = Math.round((Date.parse(range.to + 'T00:00:00Z') - Date.parse(range.from + 'T00:00:00Z')) / DAY) + 1;
      const current = windowBetween(range.from, range.to) || windowBetween(lastDate, lastDate);
      const previous = windowBetween(dayBefore(range.from, span), dayBefore(range.from, 1));
      const row = ruleIssueRows(current, previous).find(item => item.id === ruleId);
      if (!row) return;
      const events = current.events.filter(event => event.confirmed && event.ruleId === ruleId).sort((a, b) => b.date.localeCompare(a.date)).slice(0, 6);
      env.open(`${row.id}「${row.name}」`, `<div class="modal-body"><div class="lead-modal-kpis"><div><b>${row.hits}</b><span>命中</span></div><div><b>${row.confirmed}</b><span>确认</span></div><div><b>${percent(row.missRate)}</b><span>误报率</span></div><div><b>${row.critical}</b><span>红线</span></div><div><b>${row.repeat}</b><span>重复</span></div><div><b>${leadTrend(row.delta)}</b><span>环比</span></div></div><div class="section-label">涉及团队</div><div class="lead-team-chips">${row.teams.map(team => `<button class="issue-team-chip" data-action="overview-cases" data-dept="${esc(team.name)}">${esc(team.name)} <b>${team.count}</b></button>`).join('') || '<span class="muted small">暂无确认事件</span>'}</div><div class="section-label">近期确认事件</div><div class="lead-modal-list">${events.length ? events.map(event => `<div class="lead-modal-row"><span>${esc(event.date)} · ${esc(event.employee)} · ${esc(event.dept)}</span><span>${esc(event.customerName)} · ${event.stage === 'archived' ? '已归档' : '处理中'}</span></div>`).join('') : '<p class="muted small">当前窗口暂无确认事件。</p>'}</div><p class="form-hint">报表事件为聚合演示数据，与风险复核页的 10 条样例独立；此处用于演示问题下钻结构。</p></div>`);
    }

    /* ---------- 风险趋势：只保留 AI 提示与人工确认 ---------- */
    function trendPanel(trend, current) {
      return `<div class="panel-heading"><h2>风险趋势</h2><span class="tag subtle">${current.days.length <= 31 ? '按天' : '按周'}</span></div><div class="panel-body">${trendChart(trend)}</div>`;
    }

    /* ---------- 页面 ---------- */
    function render() {
      clampRange();
      const span = Math.round((Date.parse(range.to + 'T00:00:00Z') - Date.parse(range.from + 'T00:00:00Z')) / DAY) + 1;
      const current = windowBetween(range.from, range.to) || windowBetween(lastDate, lastDate);
      const previous = windowBetween(dayBefore(range.from, span), dayBefore(range.from, 1));
      const summary = summarize(current);
      const before = summarize(previous || current);
      const rules = ruleRows(current);

      const categories = groupRows(current, event => event.category);

      const trend = trendRows(current);
      const verdict = verdictOf(summary, rules);
      const top = topList(current, topTab);
      const repeatTop = repeatRows(current);
      const volume = volumeRows(current);
      const issueRows = ruleIssueRows(current, previous);

          note: `高净值 / 私行 ${summary.criticalHnwCustomers} 位`,
          delta: ratio(summary.criticalCustomers - before.criticalCustomers, before.criticalCustomers), better: 'down',
          status: { tone: summary.criticalHnwCustomers > 0 ? 'warn' : 'good', label: summary.criticalHnwCustomers > 0 ? '含高净值' : '普通客户' },
          target: '按红线事件关联客户去重'
        }),
        kpiCard({
          label: '超期未闭环', value: number(summary.overdueCount),
          note: `高风险未闭环 ${summary.highOpen} 条`,
          delta: ratio(summary.overdueCount - before.overdueCount, before.overdueCount), better: 'down',
          status: { tone: summary.overdueCount === 0 ? 'good' : 'bad', label: summary.overdueCount === 0 ? '无超期' : '需升级' },
          target: '确认后超过 5 天未归档'
        }),
        kpiCard({
          label: '高风险闭环率', value: percent(summary.highClosureRate),
          note: `已归档 ${summary.highResolved} / 确认 ${summary.highConfirmed}`,
          delta: summary.highClosureRate - before.highClosureRate, better: 'up',
          status: { tone: summary.highClosureRate >= .9 ? 'good' : summary.highClosureRate >= .8 ? 'warn' : 'bad', label: summary.highClosureRate >= .9 ? '达标' : '低于目标' },
          target: '目标 ≥ 90% · 环比受事件成熟度影响'
        })
      ].join('');
      const presetActive = item => item.offset
        ? range.from === dayBefore(lastDate, item.offset) && range.to === dayBefore(lastDate, item.offset)
        : span === item.days && range.to === lastDate;
      main.innerHTML = `
        <div class="page-heading overview-heading">
          <div>
            <h1>质检报表</h1>

          </div>
          <div class="heading-side"><span class="overview-dateline">数据截止 ${lastDate} · 北京时间</span></div>
        </div>
        <div class="overview-filters">
          <label class="date-field"><span>开始</span><input type="date" data-overview-date="from" value="${range.from}" min="${firstDate}" max="${lastDate}" aria-label="统计开始日期"></label>

          <div class="range-switch" role="group" aria-label="快捷时间范围">
            ${PRESETS.map(item => `<button class="range-button ${presetActive(item) ? 'active' : ''}" data-action="overview-preset" data-days="${item.days}" aria-pressed="${presetActive(item)}">${item.label}</button>`).join('')}
          </div>
          <span class="filter-hint">按已归档会话的日期聚合</span>
          <button class="button" data-action="overview-export" title="打印或另存为 PDF，含当前筛选区间"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v11m0 0 4-4m-4 4-4-4M4 20h16"/></svg>导出快照</button>
        </div>

        <div class="section-label lead-layer-label">总体汇总<span class="subtext">结论与核心指标</span></div>

        <section class="verdict ${verdict.tone}">

        <div class="result-kpis">${resultKpis}</div>

        ${keyIssueCards(keyIssues)}
        <div class="section-label lead-layer-label">汇总概览<span class="subtext">趋势、对象、结构、重复与覆盖</span></div>

          <section class="panel summary-half">${trendPanel(trend, current)}</section>
          <section class="panel top-panel summary-half">
            <div class="panel-heading"><h2>Top 5 风险对象</h2><span class="small muted">按确认数排序</span></div>
            <div class="panel-body">${top}</div>
          </section>
          <section class="panel summary-third">

          </section>
          <section class="panel summary-third">
            <div class="panel-heading"><h2>团队风险密度</h2><span class="small muted">每千条会话</span></div>
            <div class="panel-body">${densityChart(departments.map(row => ({ name: row.name, value: row.density, title: `${row.name}：每千条会话命中 ${row.density.toFixed(2)}‰ · 命中 ${row.hits} 条 / 约 ${number(row.sessions)} 条会话` })))}<p class="panel-foot">按会话量归一化，避免人多就显示问题多。会话量按团队占比估算。</p></div>
          </section>
          <section class="panel summary-third">
            <div class="panel-heading"><h2>重复违规</h2><span class="small muted">同人同规则再犯</span></div>
            <div class="panel-body">${repeatPanel(summary, repeatTop)}<p class="panel-foot">再犯指同一员工在同一规则上被再次确认；名单可点击跳转该员工相关风险。</p></div>

            </div>
          </section>
        </div>

        <div class="section-label lead-layer-label">问题与团队详情<span class="subtext">问题清单、团队责任与行动跟踪</span></div>
        ${issueTable(issueRows)}
        ${teamCompareTable(teamRows, current)}
        ${solutionTable(solutions)}

        <p class="report-foot">
          口径：统计范围为时间窗内<strong>已归档会话</strong>；红线暂按承诺类 + 材料类演示，待客户合规确认；AI 提示为规则命中条数，人工确认为判定成立条数，两者之差为误报，<strong>不等同准确率</strong>；涉及员工按确认违规员工姓名去重；涉及客户按客户标识去重；超过 30 天未闭环按确认日期计算；投诉、纠纷、监管事件与客户损失金额尚未接入。风险复核页的 10 条事件是同一批会话中已展开的可复核样例，本页只做聚合、不参与处置。本页为虚构演示数据，不代表客户实测口径或业务效果。
        </p>`;
    }

    function handleAction(dataset) {
      if (dataset.action === 'overview-export') { window.print(); return true; }
      if (dataset.action === 'overview-issue') { openIssue(dataset.rule); return true; }
      if (dataset.action === 'overview-top') { topTab = dataset.tab === 'departments' ? 'departments' : 'people'; render(); return true; }
      if (dataset.action !== 'overview-preset') return false;
      const days = Number(dataset.days);
      const preset = PRESETS.find(item => item.days === days);
      if (!preset) return true;
      if (preset.offset) range = { from: dayBefore(lastDate, preset.offset), to: dayBefore(lastDate, preset.offset) };
      else range = { from: dayBefore(lastDate, days - 1), to: lastDate };
      render();
      return true;
    }
    function change(target) {
      if (!target.dataset.overviewDate) return false;
      if (!target.value) return true;
      range[target.dataset.overviewDate] = target.value;
      clampRange();
      render();
      return true;
    }

    return { render, handleAction, change, reset: () => { range = { from: dayBefore(lastDate, 6), to: lastDate }; topTab = 'people'; } };
  };
})();

/* ============ 质检复核 ============ */
function evidenceKey(text, summary) {
  const s = String(summary || '');
  const quoted = s.match(/[“"]([^”"]{4,})[”"]/);
  const cands = [];
  if (quoted) cands.push(quoted[1]);
  s.replace(/[“”"]/g, '').split(/[，。、？！：:；;,.\s]/).forEach(x => { if (x.length >= 4) cands.push(x); });
  cands.push(s.replace(/[“”"]/g, ''));
  return cands.filter(k => k && text.includes(k)).sort((a, b) => b.length - a.length)[0] || '';
}
function highlight(text, summary) {
  const key = evidenceKey(text, summary);
  if (!key) return esc(text);
  return esc(text).split(esc(key)).join(`<mark>${esc(key)}</mark>`);
}
/* ============ 质检复核：三栏复核工作台 ============ */
const LEVEL_ORDER = { L0: 0, L1: 1, L2: 2 };
const OPEN_STATUS = ['待复核', '待处置', '待结案'];

function resultFiltered() {
  const f = state.f.results || (state.f.results = { q: '', status: 'all', scene: 'all', plan: 'all', level: 'all', sort: 'priority' });
  const q = (f.q || '').trim();
  return RESULTS.filter(r =>
    (f.status === 'all' || r.status === f.status) &&
    (f.scene === 'all' || r.scene === f.scene) &&
    (f.plan === 'all' || r.planId === f.plan) &&
    (!f.level || f.level === 'all' || sceneById(r.scene).level === f.level) &&
    (!q || (r.id + r.staff + r.customer + r.summary).includes(q)));
}

function resultSorted(list) {
  const f = state.f.results || {};
  const mode = f.sort || 'priority';
  const arr = [...list];
  if (mode === 'new') return arr.sort((a, b) => (a.time < b.time ? 1 : a.time > b.time ? -1 : 0));
  if (mode === 'deadline') return arr.sort((a, b) => (a.deadline || '9').localeCompare(b.deadline || '9'));
  return arr.sort((a, b) => (LEVEL_ORDER[sceneById(a.scene).level] - LEVEL_ORDER[sceneById(b.scene).level]) || a.time.localeCompare(b.time));
}

function resultOverview(list) {
  const lv = r => sceneById(r.scene).level;
  return {
    pending: list.filter(r => r.status === '待复核').length,
    high: list.filter(r => r.status === '待复核' && lv(r) === 'L0').length,
    doing: list.filter(r => r.status === '待处置').length,
    closing: list.filter(r => r.status === '待结案').length,
    closed: list.filter(r => ['已结案', '已关闭'].includes(r.status)).length,
    insufficient: list.filter(r => r.status === '证据不足').length,
    total: list.length
  };
}

function resultCard(r, selected) {
  const sc = sceneById(r.scene);
  return `<button class="qcard ${selected ? 'sel' : ''}" data-act="open-result" data-id="${r.id}" aria-pressed="${selected}">
    <div class="qcard-top">${levelTag(sc.level)}${statusPill(r.status)}</div>
    <h3>${esc(r.summary)}</h3>
    <div class="people">${esc(r.staff)}<i>→</i>${esc(r.customer)}<i>·</i>${esc(r.team)}</div>
    <div class="prev">${ruleById(r.rule).name}</div>
    <div class="meta"><span>${r.time.slice(5)}</span><span>置信度 ${r.conf}%</span></div>
  </button>`;
}

function chatMsgId(r, i) { return `MSG-${r.id.slice(-4)}-${String(i + 1).padStart(2, '0')}`; }

function resultChat(r) {
  const msgs = r.ctx || [];
  return `<section class="ws-chat" aria-label="原始会话">
    <div class="ws-chat-head"><div><h2>${esc(r.staff)} <span class="dim">与</span> ${esc(r.customer)}</h2><p>${esc(r.team)} · 企微单聊 · ${esc(planById(r.planId).name)}</p></div><span class="tag">${sceneById(r.scene).name}</span></div>
    <div class="ws-chat-bar"><span>原始会话记录 · ${msgs.length} 条</span><span>质检于 ${r.time}</span></div>
    <div class="chat-flow">${msgs.map((m, i) => {
      const out = m.who !== '客户';
      const evi = !!m.risk;
      const mid = chatMsgId(r, i);
      const name = m.who === '客户' ? r.customer : m.who === '老师' ? '直播老师' : r.staff + ' · 销售';
      return `<div class="cmsg ${out ? 'out' : 'in'} ${evi ? 'evi' : ''}" id="chat-${mid}"><span class="av">${esc(name[0])}</span><div class="body"><div class="meta"><span>${esc(name)}</span><time>${esc(m.t)}</time></div>${evi ? '<div class="flag">◉ AI 命中片段 · 1 项规则</div>' : ''}<div class="bubble">${evi ? highlight(m.text, r.summary) : esc(m.text)}</div><div class="mid">${mid}</div></div></div>`;
    }).join('')}</div>
    <div class="ws-chat-foot">保留原始消息顺序与时间 · 演示内容不代表真实客户记录</div>
  </section>`;
}

function resultConclusion(r) {
  if (r.status === '待复核') return `<div class="conclusion pending"><span class="lbl">人工结论</span><b>尚未认定，等待人工复核</b><p>按计划复核策略进入本队列；AI 提示不构成违规结论。</p></div>`;
  if (r.status === '证据不足') return `<div class="conclusion pending"><span class="lbl">人工结论</span><b>证据不足，不认定风险</b><p>原始转写缺失，需补齐证据后重新复核；本条不计入违规统计。</p></div>`;
  if (r.status === '已关闭') return `<div class="conclusion dismissed"><span class="lbl">当前人工结论</span><b>人工已驳回误报</b><p>已核对上下文与规则适用边界，本次提示不成立；样本已回流测试集。</p><span class="meta">复核人 李妍 · ${r.time}</span></div>`;
  const text = r.status === '待处置' ? '等待销售整改，整改结果需再次验收。' : r.status === '待结案' ? '销售已提交处理结果，待结案复核。' : '处理与复核记录完整，事件已归档。';
  return `<div class="conclusion"><span class="lbl">当前人工结论</span><b>人工已确认风险</b><p>${text}</p><span class="meta">复核人 周敏 · ${r.time}</span></div>`;
}

function resultActions(r) {
  const id = r.id;
  if (r.status === '待复核') return `<div class="row"><button class="btn primary" data-act="review" data-id="${id}" data-result="confirm">确认违规</button><button class="btn" data-act="review" data-id="${id}" data-result="false">判定误报</button><button class="btn" data-act="review" data-id="${id}" data-result="insufficient">证据不足</button><button class="btn ghost" data-act="assign" data-id="${id}">转派整改</button></div>`;
  if (r.status === '待处置') return `<div class="row"><button class="btn primary" data-act="review" data-id="${id}" data-result="confirm">提交处置结果</button><button class="btn ghost" data-act="assign" data-id="${id}">转派</button></div>`;
  if (r.status === '待结案') return `<div class="row"><button class="btn primary" data-act="review" data-id="${id}" data-result="confirm">结案归档</button></div>`;
  return `<div class="notice">该结果已闭合，如需改判请在处理轨迹中发起复核；此处为只读。</div>`;
}

function resultHistory(r) {
  const rows = [
    { t: r.time.slice(11), b: '模型生成结果', d: `计划 ${r.planId} 执行，命中 ${r.rule} ${ruleById(r.rule).name}，置信度 ${r.conf}%。` },
    { t: r.time.slice(11), b: '进入复核队列', d: `按计划复核策略：置信度 ${r.conf}%${r.conf < 80 ? ' 低于阈值，转人工' : ' 高于阈值，标记待复核'}。` }
  ];
  if (!['待复核'].includes(r.status)) {
    const human = r.status === '已关闭' ? '判定为误报' : r.status === '证据不足' ? '标记证据不足' : '确认违规';
    rows.push({ t: r.deadline === '—' ? r.time.slice(11) : r.deadline.slice(5), b: '人工复核：' + human, d: `复核人 ${r.status === '已关闭' ? '李妍' : '周敏'}；结论与依据已记录，样本回流训练集。` });
  }
  return `<ul class="timeline">${rows.map(x => `<li><time>${x.t}</time><i></i><div><b>${x.b}</b>${x.d}</div></li>`).join('')}</ul>`;
}

function resultAnalysis(r, list) {
  const sc = sceneById(r.scene), ru = ruleById(r.rule);
  const tab = state.rtab || 'detail';
  const idx = list.findIndex(x => x.id === r.id);
  const msgs = r.ctx || [];
  const eviIdx = msgs.findIndex(m => m.risk);
  const evi = msgs[eviIdx] || msgs[0] || { text: '', t: '' };
  const eviId = chatMsgId(r, eviIdx < 0 ? 0 : eviIdx);
  const facts = (r.facts || []).map(([k, v]) => `<div class="kv"><span>${esc(k)}</span><b>${esc(v)}</b></div>`).join('');
  const body = tab === 'history' ? `<div class="case-id mono"><span>${r.id}</span></div>${resultHistory(r)}` : `
    <div class="case-id"><span>${r.id}</span><button data-act="open-run" data-id="${r.planId}">来源计划 ${r.planId}</button></div>
    <section class="verdict ${sc.level === 'L0' ? '' : sc.level === 'L1' ? 'l1' : 'l2'}">
      <div class="eyebrow2">◈ 初始 AI 风险提示</div>
      <div class="big"><span>疑似 ${LEVEL[sc.level]}</span>${statusPill(r.status)}</div>
      <h4>${ru.id} ${esc(ru.name)}</h4>
      <div class="foot"><span>最终认定以人工结论为准</span><button data-act="locate-evidence" data-msg="${eviId}">定位原文</button></div>
    </section>
    ${resultConclusion(r)}
    <div class="sect">判断依据<span>模型 v3.2.0 · 置信度 ${r.conf}%</span></div>
    <p class="reason">${esc(ru.judge)}</p>
    <div class="sect">关键证据<button class="btn text small" data-act="locate-evidence" data-msg="${eviId}">定位原文</button></div>
    <div class="evi-quote">“${highlight(evi.text, r.summary)}”</div>
    <div class="evi-meta"><span class="tag">${eviId}</span><span class="tag">${esc(evi.t)}</span><span class="tag">${esc(ru.evidence)}</span></div>
    ${r.status === '证据不足' ? '<div class="notice warning" style="margin-top:7px">原始媒体缺失或转写失败，当前不能确认违规，已转待补证。</div>' : ''}
    <div class="sect">命中规则<span>1 项 · 冻结版本 ${ru.ver}</span></div>
    <details class="fold"><summary>${ru.id} ${esc(ru.name)}</summary><div class="body"><div class="kv"><span>判什么</span><b>${esc(ru.judge)}</b></div><div class="kv"><span>什么不算</span><b>${esc(ru.notJudge)}</b></div><div class="kv"><span>允许输出</span><b>${esc(ru.allow)}</b></div><div class="kv"><span>风险类型</span><b>${sc.name} · ${LEVEL[sc.level]}</b></div></div></details>
    <details class="fold"><summary>证据元数据<span style="margin-left:auto;font-size:9px;color:#93a0b0">消息、计划与业务事实</span></summary><div class="body"><div class="kv"><span>消息 ID</span><b class="mono">${eviId}</b></div><div class="kv"><span>质检计划</span><b>${esc(planById(r.planId).name)}</b></div><div class="kv"><span>质检时间</span><b>${r.time}</b></div><div class="kv"><span>处理时限</span><b>${r.deadline}</b></div>${facts}</div></details>
    <p class="boundary">AI 只输出提示与证据，不输出处罚或最终违规结论。复核需结合原件、上下文与适用场景；判定结果回流训练集。</p>`;
  return `<aside class="ws-analysis" aria-label="复核详情">
    <div class="ws-tabs"><button class="${tab === 'detail' ? 'active' : ''}" data-act="result-tab" data-rtab="detail">复核详情</button><button class="${tab === 'history' ? 'active' : ''}" data-act="result-tab" data-rtab="history">处理轨迹<small>${r.status === '待复核' ? 2 : 3}</small></button></div>
    <div class="ws-body">${body}</div>
    <div class="ws-actions"><div class="lab"><span>人工处置</span>${statusPill(r.status)}</div>${resultActions(r)}<div class="nav"><button class="btn text small" data-act="result-nav" data-dir="-1" ${idx <= 0 ? 'disabled' : ''}>‹ 上一条</button><span>${idx + 1} / ${list.length}</span><button class="btn text small" data-act="result-nav" data-dir="1" ${idx < 0 || idx >= list.length - 1 ? 'disabled' : ''}>下一条 ›</button></div></div>
  </aside>`;
}

/* ---- 复核渠道：企微消息 / 营销素材 / 文字直播间 ---- */
const RCHANNELS = [
  { key: 'wx', name: '企微消息复核', short: '企微消息', desc: '销售与客户的企微单聊记录，回到完整原文再作判断；AI 提示只是线索，结论由人工认定。' },
  { key: 'material', name: '营销素材复核', short: '营销素材', desc: '运营送检的图文、海报、脚本与视频；AI 只给建议，发布授权由合规人工确认。' },
  { key: 'live', name: '文字直播间复核', short: '文字直播间', desc: '直播间实时告警窗口，先响应再复核；告警是信号，转为质检结果后才算风险事件。' }
];
const RV_FOOT = {
  wx: '状态口径：待复核 → 待处置 → 待结案 → 已结案；误报关闭与证据不足是独立终态，不进入处置流程。复核结论与依据全部留痕，并回流训练集。',
  material: '素材口径：AI 结果只是建议，最终发布授权由合规人工确认；不通过需修改后重新送检，申诉终审为一次性结论。',
  live: '直播口径：告警是信号不是结论。先响应再复核；标记误报不产生风险记录，转质检结果后才进入处置与统计。'
};
const rvChannel = () => (RCHANNELS.some(c => c.key === state.channel) ? state.channel : 'wx');
const rvMeta = () => RCHANNELS.find(c => c.key === rvChannel()) || RCHANNELS[0];
function rvCount(ch) {
  if (ch === 'material') return MATERIALS.filter(m => m.status === '不通过' || (m.appeal && m.appeal.status === '待终审')).length;
  if (ch === 'live') return ALERTS.filter(a => a.status === '待响应' || a.status === '已升级').length;
  return RESULTS.filter(r => r.status === '待复核').length;
}
function rvSeg(ch) {
  return `<div class="segs" role="group" aria-label="复核渠道">${RCHANNELS.map(c => `<button class="seg" data-act="rv-channel" data-channel="${c.key}" aria-pressed="${ch === c.key}">${c.short}</button>`).join('')}</div>`;
}
function highlightAll(text, quotes) {
  let out = esc(text);
  (quotes || []).filter(Boolean).sort((a, b) => b.length - a.length).forEach(q => { out = out.split(esc(q)).join(`<mark>${esc(q)}</mark>`); });
  return out;
}
function materialLevel(m) {
  const lv = (m.risks || []).map(r => r.level);
  return lv.includes('L0') ? 'L0' : lv.includes('L1') ? 'L1' : 'L2';
}
function liveLevel(a) { return a.conf >= 90 ? 'L0' : a.conf >= 80 ? 'L1' : 'L2'; }

/* ---- 企微消息复核（原三栏工作台） ---- */
function resultWorkbench() {
  const f = state.f.results || (state.f.results = { q: '', status: 'all', scene: 'all', plan: 'all', level: 'all', sort: 'priority' });
  const filtered = resultFiltered();
  const list = resultSorted(filtered);
  const cur = list.find(r => r.id === state.id) || list[0] || null;
  if (cur) state.id = cur.id;
  const ov = resultOverview(filtered);
  return `<div class="ov"><div class="ov-main"><span>待人工复核</span><strong>${ov.pending}</strong><span>条</span><span class="ov-flag">⚑ 其中 ${ov.high} 条 L0 立即处理</span></div>
    <div class="ov-sub"><span>待处置<b>${ov.doing}</b></span><span>待结案<b>${ov.closing}</b></span><span>已闭合<b>${ov.closed}</b></span><span>证据不足<b>${ov.insufficient}</b></span><span>共<b>${ov.total}</b> 条</span></div></div>
  <section class="panel" style="margin-bottom:11px"><div class="filters" style="border-bottom:0"><label class="search"><input data-filter="results.q" value="${esc(f.q)}" placeholder="搜索结果编号、销售、客户或摘要"></label>
    <select data-filter="results.status"><option value="all">全部状态</option>${['待复核', '待处置', '待结案', '已结案', '已关闭', '证据不足'].map(s => `<option ${f.status === s ? 'selected' : ''}>${s}</option>`).join('')}</select>
    <select data-filter="results.scene"><option value="all">全部风险类型</option>${SCENES.map(s => `<option value="${s.id}" ${f.scene === s.id ? 'selected' : ''}>${s.name}</option>`).join('')}</select>
    <select data-filter="results.plan"><option value="all">全部计划</option>${PLANS.map(p => `<option value="${f.plan === p.id ? 'selected' : ''}">${p.name}</option>`).join('')}</select>
    <select data-filter="results.level"><option value="all">全部等级</option>${['L0', 'L1', 'L2'].map(l => `<option value="${l}" ${f.level === l ? 'selected' : ''}>${LEVEL[l]}</option>`).join('')}</select>
    <select data-filter="results.sort"><option value="priority" ${f.sort === 'priority' ? 'selected' : ''}>高风险优先</option><option value="deadline" ${f.sort === 'deadline' ? 'selected' : ''}>时限最近</option><option value="new" ${f.sort === 'new' ? 'selected' : ''}>最新入队</option></select>
    <button class="btn small" data-act="reset-results">重置</button></div></section>
  ${list.length ? `<section class="ws">
    <section class="ws-queue" aria-label="结果队列"><div class="pane-head"><b>结果队列</b><span>${list.length}</span></div><div class="queue-scroll">${list.map(r => resultCard(r, cur && r.id === cur.id)).join('')}</div><div class="queue-foot">高风险优先 · 已加载当前 ${list.length} 条</div></section>
    ${resultChat(cur)}
    ${resultAnalysis(cur, list)}
  </section>` : `<section class="panel"><div class="empty"><h3>没有匹配的结果</h3><p>调整筛选条件或搜索词后重试。</p><div style="margin-top:10px"><button class="btn small" data-act="reset-results">重置筛选</button></div></div></section>`}`;
}

/* ---- 营销素材复核 ---- */
function materialFiltered() {
  const f = state.f.rvm || (state.f.rvm = { q: '', status: 'all' });
  const q = (f.q || '').trim();
  const rank = m => (m.status === '不通过' ? 0 : m.status === '申诉中' ? 1 : 2);
  return MATERIALS.filter(m => (f.status === 'all' || m.status === f.status) && (!q || (m.id + m.title + m.submitter).includes(q))).sort((a, b) => rank(a) - rank(b) || a.time.localeCompare(b.time));
}
function materialCard(m, selected) {
  const names = (m.risks || []).map(r => ruleById(r.rule).name).join(' / ') || '无命中规则';
  return `<button class="qcard ${selected ? 'sel' : ''}" data-act="open-rv" data-id="${m.id}" aria-pressed="${selected}">
    <div class="qcard-top">${levelTag(materialLevel(m))}${statusPill(m.status)}</div>
    <h3>${esc(m.title)}</h3>
    <div class="people">${esc(m.type)}<i>·</i>${esc(m.product)} 线<i>·</i>${esc(m.submitter)}</div>
    <div class="prev">${esc(names)}</div>
    <div class="meta"><span>${m.time.slice(5)}</span><span>得分 ${m.score}</span></div>
  </button>`;
}
function materialDoc(m) {
  const quotes = (m.risks || []).map(r => r.quote);
  const sc = m.risks.length ? sceneById(ruleById(m.risks[0].rule).scene) : null;
  return `<section class="ws-chat" aria-label="素材原文">
    <div class="ws-chat-head"><div><h2>${esc(m.title)}</h2><p>${esc(m.type)} · ${esc(m.product)} 产品线 · ${m.ver} · 送审人 ${esc(m.submitter)}</p></div><span class="tag">${sc ? esc(sc.name) : '素材'}</span></div>
    <div class="ws-chat-bar"><span>素材文案 · ${m.copy.length} 字</span><span>提交于 ${m.time}</span></div>
    <div class="mat-body">
      <div class="mat-copy">${highlightAll(m.copy, quotes)}</div>
      ${(m.risks || []).length ? `<div class="sect" style="margin-top:12px">命中位置<span>${m.risks.length} 处</span></div>${m.risks.map(r => `<div class="mat-risk-item"><b>${r.rule} ${esc(ruleById(r.rule).name)}</b>${levelTag(r.level)}<div class="mat-quote">“${esc(r.quote)}”</div><div class="mat-fix">建议改法：${esc(r.fix)}</div></div>`).join('')}` : '<div class="notice" style="margin-top:12px">本条未命中规则，可直接进入人工确认。</div>'}
      ${m.suggested ? `<div class="mat-suggest"><b>建议改写稿</b>${esc(m.suggested)}</div>` : ''}
      <div class="sect" style="margin-top:14px">版本历史<span>当前 ${m.ver}</span></div>

    </div></section>
    <div>
      <section class="panel"><div class="panel-head"><div><h2>规则试跑</h2><p>单条样本，验证边界是否清晰。</p></div></div><div class="panel-body">
        <div class="field"><label>测试文本</label><textarea id="rule-sample">这个产品肯定不会亏，本金和收益我都可以保证。</textarea></div>
        <div class="head-actions" style="justify-content:flex-start;margin-top:10px"><button class="btn primary" data-act="run-rule">运行试跑</button></div>

      </div></section>
      <section class="panel"><div class="panel-head"><div><h2>引用关系</h2><p>被引用后不可原地修改</p></div></div><div class="panel-body">
        ${r ? (MODELS.filter(m => m.rules.some(b => b.ruleId === r.id)).map(m => `<div class="kv"><span>${m.code}</span><b>${m.name} · ${m.ver}</b></div>`).join('') || '<div class="empty"><p>暂未被任何模型引用</p></div>') : '<div class="empty"><p>新规则尚未被引用</p></div>'}

function reviewText(rv) {
  if (!rv) return '—';
  if (rv.mode === 'all') return '全部人工复核';
  if (rv.mode === 'threshold') return `置信度 < ${rv.threshold}% 转人工`;
  if (rv.mode === 'sample') return `抽检 ${rv.sample || 20}%`;
  return '免复核直接处置';
}

  return `<div class="head-actions" style="justify-content:flex-start;margin-bottom:12px"><button class="btn small" data-act="go" data-view="models">← 返回模型列表</button></div>

function modelTab(m, tab) {
  if (tab === 'rules') return `<div class="table-wrap"><table><thead><tr><th>规则</th><th>风险类型</th><th>冻结版本</th><th>敏感度</th><th>优先级</th><th>置信度门槛</th><th>人工复核</th><th>状态</th></tr></thead><tbody>${m.rules.map(b => { const r = ruleById(b.ruleId); return `<tr style="${b.enabled === false ? 'opacity:.6' : ''}"><td class="name-cell"><b>${r.name}</b><small>${r.id}</small></td><td>${sceneById(r.scene).name}</td><td class="mono">${r.ver}</td><td>${b.sens === 'inherit' ? '继承（' + SENS[m.sens] + '）' : SENS[b.sens]}</td><td>${b.priority}</td><td class="num">${b.confidence}%</td><td>${b.mustReview ? '必须' : '按模型结果'}</td><td>${b.enabled === false ? '<span class="tag">已停用</span>' : '<span class="tag green">启用</span>'}</td></tr>`; }).join('')}</tbody></table></div><div class="notice" style="margin-top:11px">规则绑定即冻结版本：规则发布新版本不会自动影响本模型，需显式升级并重新测试。</div>`;
  if (tab === 'tests') {
    if (m.test === 'pending') return `<div class="empty"><div style="font-size:26px">◌</div><h3>尚未测试</h3><p>完成测试集验证后才允许发布。</p></div>`;
    const metrics = [['准确率', 88.2, '≥ 90%'], ['召回率', 94.6, '≥ 92%'], ['误报率', 11.8, '≤ 10%'], ['漏报率', 5.4, '≤ 8%'], ['证据完整率', 98.9, '≥ 97%'], ['运行失败率', 0.2, '≤ 1%']];
    return `<div class="stats" style="margin-bottom:12px">${metrics.map(([k, v, t]) => `<article class="stat"><div class="stat-label">${k}</div><div class="stat-value" style="font-size:22px">${v}%</div><div class="stat-note">目标 ${t}</div></article>`).join('')}</div>
      <div class="notice ${m.test === 'warning' ? 'warning' : ''}">${m.test === 'warning' ? '技术链路通过，准确率与误报率未达标；发布时必须填写风险接受原因。' : '业务指标达到当前发布目标。'}测试快照：模型 ${m.ver} · 规则 ${m.rules.length} 条 · 测试集 TS-20261022-v4 · 1,280 条已标注样本。</div>`;
  }
  if (tab === 'versions') return `<ul class="timeline">
    <li><time>${m.updated.slice(0, 10)}</time><i></i><div><b>${m.ver} · 当前版本</b>${m.owner} 更新，验证得分 ${m.score || '—'}。${m.publishNote ? `<div class="notice" style="margin-top:7px">版本说明：${esc(m.publishNote)}</div>` : ''}</div></li>
    <li><time>2026-09-18</time><i></i><div><b>v3.1.0</b>新增“兜底与亏损补偿承诺”规则，误报率下降 3.2pt。</div></li>
    <li><time>2026-08-02</time><i></i><div><b>v3.0.0</b>首次纳入语音转写证据，支持情绪特征。</div></li>
  </ul><div class="notice" style="margin-top:11px">历史版本配置独立保存，不随规则目录变化；可回滚，但不可覆盖。</div>`;
  return `<div class="summary-grid"><div class="summary-item"><label>模型编号</label><strong>${m.code}</strong></div><div class="summary-item"><label>业务场景</label><strong>${m.biz}</strong></div><div class="summary-item"><label>默认敏感度</label><strong>${SENS[m.sens]}</strong></div><div class="summary-item"><label>关联规则</label><strong>${m.rules.length} 条</strong></div>${`<div class="summary-item"><label>支持素材类型</label><strong>${(m.materials || []).map(k => MTYPES[k].name).join(" / ") || "—"}</strong></div>`}<div class="summary-item"><label>复核策略</label><strong>由质检计划配置</strong></div><div class="summary-item"><label>最近更新</label><strong>${m.updated}</strong></div></div>
  <div class="callout" style="margin-top:13px">组合判定：单条规则通过但“主标 + 个股验证 + 收益渲染”组合后违规，由 R-012 在素材包维度判定。模型必须声明是否启用组合判定。</div>`;
}
