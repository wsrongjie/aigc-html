  <section class="editor-body"><div class="editor-head"><h2>${['填写模型基础信息', '关联质检规则', '设置识别与启用规则', '执行发布前测试', '核对并发布'][e.step - 1]}</h2><p>${['名称体现业务场景，不体现具体渠道。', '一个模型可绑定多条规则；保存时冻结规则版本。', '敏感度与规则启停决定模型如何判定；是否人工复核由质检计划配置。', '测试必须冻结模型、规则、测试集与参数快照。', '发布后只读，继续修改将生成新草稿。'][e.step - 1]}</p></div>
  <div class="step-panel">${modelStep(e)}</div>
  <footer class="editor-actions"><div>${e.step > 1 ? '<button class="btn" data-act="prev-step">上一步</button>' : '<button class="btn" data-act="go" data-view="models">取消</button>'}</div><div>${e.step < 5 ? `<button class="btn primary" data-act="next-step">${e.step === 4 ? '进入发布确认' : '下一步'}</button>` : '<button class="btn primary" data-act="publish-model" ' + (publishChecklist(e).some(i => !i.ok) ? 'disabled' : '') + '>发布模型</button>'}</div></footer></section></div>`;
};

function ruleEnabled(e, id) { return !(e.disabled || []).includes(id); }
function enabledRules(e) { return (e.rules || []).filter(id => ruleEnabled(e, id)); }

function modelStep(e) {
  if (e.step === 1) return `<div class="form-grid"><div class="field"><label>模型名称 <em>*</em></label><input id="m-name" value="${esc(e.name)}" placeholder="例如：销售营销话术质检模型"></div><div class="field"><label>业务场景</label><select id="m-biz">${['销售话术 T-1', '营销素材预审', '文字直播间实时', '客诉事后归集'].map(b => `<option ${e.biz === b ? 'selected' : ''}>${b}</option>`).join('')}</select></div><div class="field"><label>负责人</label><select id="m-owner">${['周敏', '李妍', '王铮', '陈嘉'].map(o => `<option ${e.owner === o ? 'selected' : ''}>${o}</option>`).join('')}</select></div><div class="field"><label>模型编号</label><input value="${e.code}" readonly></div><div class="field full"><label>模型说明</label><textarea id="m-desc">${esc(e.desc)}</textarea></div><div class="field full"><label>支持质检素材类型 <em>*</em></label><div class="type-pills">${MTYPE_KEYS.map(k => `<button type="button" class="type-pill" data-act="toggle-mtype" data-type="${k}" aria-pressed="${(e.materials || []).includes(k)}">${MTYPES[k].icon} ${MTYPES[k].name}</button>`).join('')}</div><small>决定该模型能质检的素材形态，可多选；测试验证时只能选择已启用的类型。文本=聊天记录/话术，图片=海报截图，音频=通话录音，视频=口播片段。</small></div><div class="field full"><div class="callout">模型不保存检查对象、数据来源、运行时间与通知方式；这些配置属于质检计划。</div></div></div>`;
  if (e.step === 2) return `<div class="rule-toolbar"><label class="search"><input id="m-rule-q" placeholder="搜索规则名称或风险类型"></label><select id="m-rule-scene"><option value="all">全部风险类型</option>${SCENES.map(s => `<option value="${s.id}">${s.name}</option>`).join('')}</select></div><div class="rule-list">${RULES.filter(r => r.status === '已发布').map(r => `<label class="rule-row" data-rule-row data-scene="${r.scene}" data-name="${esc(r.name + r.judge)}"><input class="check" type="checkbox" data-rule-check value="${r.id}" ${e.rules.includes(r.id) ? 'checked' : ''}><span class="rule-name"><strong>${r.name}</strong><small>${r.id} · ${sceneById(r.scene).name}</small></span><span>${sceneById(r.scene).name}</span><span>${levelTag(r.sev)}</span><span class="mono">${r.ver}</span></label>`).join('')}</div><div class="selected-bar">已选择 <b id="m-selected">${e.rules.length}</b> 条规则；保存时固定规则版本。</div>`;
  if (e.step === 3) return `<div class="form-grid" style="margin-bottom:13px"><div class="field"><label>默认识别敏感度</label><select id="m-sens">${[['low', '低 · 优先准确率'], ['medium', '中 · 平衡'], ['high', '高 · 优先召回']].map(([k, v]) => `<option value="${k}" ${e.sens === k ? 'selected' : ''}>${v}</option>`).join('')}</select></div><div class="field"><label>有效结果门槛</label><input value="证据不足时不输出风险结论" readonly></div><div class="field full"><label>人工复核</label><input value="由质检计划配置：全部人工 / 置信度低于阈值 / 按比例抽检 / 免复核" readonly></div></div><div class="selected-bar" style="margin:0 0 9px">已绑定 ${e.rules.length} 条 · 启用 ${enabledRules(e).length} 条<span style="margin-left:10px;color:#93a0b0">停用的规则不参与测试与计划运行，历史结果不受影响</span></div><div class="config-list">${e.rules.map(id => { const r = ruleById(id); const on = ruleEnabled(e, id); return `<div class="config-card" style="${on ? '' : 'opacity:.6'}"><div class="config-head"><div><strong>${r.name}</strong><small> ${r.id} · 冻结 ${r.ver}</small></div><div style="display:flex;gap:9px;align-items:center">${on ? '' : '<span class="tag">已停用</span>'}<button class="switch" data-act="toggle-rule-enabled" data-id="${id}" aria-pressed="${on}" aria-label="启用或停用规则" title="${on ? '停用' : '启用'}"><span></span></button></div></div><div class="config-summary"><span class="tag">敏感度：继承</span><span class="tag">置信度：${r.sev === 'L0' ? 88 : 82}%</span><span class="tag">${r.sev === 'L0' ? '必须人工复核' : '按模型结果'}</span></div></div>`; }).join('')}</div>`;
  if (e.step === 4) return testStep4(e);
  const items = publishChecklist(e);
  const blocking = items.filter(i => !i.ok).length;
  return `<div class="grid-split"><section class="panel" style="margin:0"><div class="panel-head"><div><h2>发布前检查</h2><p>${blocking ? `还有 ${blocking} 项未完成，不能发布` : '全部检查通过，可以发布'}</p></div><span class="status ${blocking ? 'fail' : 'done'}">${blocking ? blocking + ' 项未完成' : '已就绪'}</span></div><div class="panel-body">${items.map(it => `<div class="check-row"><div><b>${it.label}</b><small>${esc(it.note)}</small></div><span class="status ${it.ok ? 'done' : 'fail'}">${it.ok ? '已完成' : '未完成'}</span>${it.ok || !it.step ? '<span></span>' : `<button class="btn small" data-act="goto-step" data-step="${it.step}">去处理</button>`}</div>`).join('')}</div></section><div><section class="panel" style="margin:0"><div class="panel-head"><div><h2>配置摘要</h2><p>发布后立即生效</p></div></div><div class="panel-body"><div class="kv"><span>模型名称</span><b>${esc(e.name || '未命名')}</b></div><div class="kv"><span>业务场景</span><b>${e.biz}</b></div><div class="kv"><span>素材类型</span><b>${(e.materials || []).map(k => MTYPES[k].name).join(' / ') || '—'}</b></div><div class="kv"><span>关联规则</span><b>${e.rules.length} 条 · 启用 ${enabledRules(e).length} 条</b></div><div class="kv"><span>默认敏感度</span><b>${SENS[e.sens]}</b></div><div class="kv"><span>版本动作</span><b>发布 v${e.id ? '3.3.0' : '1.0.0'}</b></div></div></section><div class="field" style="margin-top:13px"><label>版本说明 <em>*</em></label><textarea id="publish-note" placeholder="记录本次规则、素材类型、阈值或输出格式的调整，作为可追溯依据">${esc(e.note || '')}</textarea><small>与“指标未达标时的风险接受原因”合并记录，进入版本记录与审计日志。</small></div></div></div>`;
}

/* ---- 第 4 步：分素材类型测试验证 ---- */
function testValid(e) {
  return Object.values(e.testResults || {}).some(r => r && r.kind && r.kind !== 'insufficient');
}
function publishChecklist(e) {
  const valid = Object.entries(e.testResults || {}).filter(([, r]) => r && r.kind && r.kind !== 'insufficient');
  const testNote = valid.length ? `${MTYPES[valid[0][0]].name}测试${valid[0][1].kind === 'hit' ? '命中 ' + valid[0][1].rule : '不命中'}` : '尚无有效测试（证据不足不计）';
  return [
    { ok: !!(e.name || '').trim() && !!(e.owner || ''), label: '基础信息已填写', note: `名称与负责人：${e.owner || '—'}`, step: 1 },
    { ok: (e.materials || []).length > 0, label: '素材类型已选择', note: (e.materials || []).map(k => MTYPES[k].name).join(' / ') || '未选择', step: 1 },
    { ok: enabledRules(e).length > 0, label: '规则绑定完成', note: `已绑定 ${e.rules.length} 条 · 启用 ${enabledRules(e).length} 条`, step: e.rules.length ? 3 : 2 },
    { ok: testValid(e), label: '样例测试已完成', note: testNote, step: 4 },
    { ok: true, label: '输出结构有效', note: '内置 Schema：风险等级 / 得分 / 发现项 / 复核标记', step: null }
  ];
}

function testStep4(e) {
  if (!e.materials || !e.materials.length) e.materials = ['text'];
  if (!e.materials.includes(e.testType)) e.testType = e.materials[0];
  const t = e.testType;
  const metrics = `<div class="stats">${[['准确率', '88.2%', '≥ 90%'], ['召回率', '94.6%', '≥ 92%'], ['误报率', '11.8%', '≤ 10%'], ['证据完整率', '98.9%', '≥ 97%']].map(([k, v, target]) => `<article class="stat"><div class="stat-label">${k}</div><div class="stat-value" style="font-size:22px">${v}</div><div class="stat-note">目标 ${target}</div></article>`).join('')}</div><div class="notice warning">技术验证通过，准确率低于目标；发布时需填写版本说明与风险接受原因。</div>`;
  return `<div class="notice">演示环境：附件仅本地预览，不做真实解析；判定依据是左侧填写的识别 / 转写文本。</div>
  <div class="field" style="margin:13px 0 4px"><label>测试素材类型 <em>*</em></label><div class="type-pills">${MTYPE_KEYS.map(k => { const on = e.materials.includes(k); return `<button type="button" class="type-pill" data-act="test-type" data-type="${k}" aria-pressed="${t === k}" ${on ? '' : 'disabled title="该模型未启用此素材类型"'} >${MTYPES[k].icon} ${MTYPES[k].name}</button>`; }).join('')}</div><small>只能选择模型在第 1 步启用的素材类型；切换类型不会丢失已输入内容。</small></div>
  <div class="grid-split"><div>
    ${testInputPanel(e, t)}
    <div class="head-actions" style="justify-content:flex-start;margin-top:12px"><button class="btn primary" data-act="run-model-test">运行测试</button><button class="btn" data-act="reset-test">清空本类型输入</button></div>
    ${testResultHtml(e, t)}
  </div><div>${outputPanel(e, t)}</div></div>
  <div style="margin-top:13px">${testValid(e) ? metrics : '<div class="notice">完成一次有效测试（命中 / 不命中）后，才允许进入发布确认；证据不足不计为有效测试。</div>'}</div>`;
}

function buildOutput(e, t) {
  const r = (e.testResults || {})[t];
  if (!r) return null;
  const score = r.kind === 'hit' ? ({ L0: 35, L1: 62, L2: 78 }[r.level] || 62) : r.kind === 'pass' ? 95 : null;
  const out = {
    risk_level: r.kind === 'hit' ? r.level : null,
    score,
    findings: r.kind === 'hit' ? [{ rule_id: r.rule, rule_name: ruleById(r.rule).name, evidence: r.evidence, confidence: r.conf, span: r.span || null }] : [],
    review_required: r.kind !== 'pass',
    material_type: t,
    model_version: e.id ? 'v3.3.0' : 'v1.0.0'
  };
  if (r.kind === 'insufficient') out.reason = r.reason || '证据不足，不输出风险结论';
  return out;
}

function outputPanel(e, t) {
  const r = (e.testResults || {})[t];
  const out = buildOutput(e, t);
  const len = (e.testInputs[t] || '').length;
  const ms = Math.round(820 + len * 2.6);
  const tokens = Math.round(340 + len * 1.7);
  const body = out
    ? `<div class="console">${esc(JSON.stringify(out, null, 2))}</div><div class="out-meta"><span>耗时 <b>${ms} ms</b></span><span>Token <b>${num(tokens)}</b></span><span>证据 <b>${r && r.span ? r.span.start + '–' + r.span.end + ' 字' : '无'}</b></span><span>复核 <b>${out.review_required ? '需要' : '不需要'}</b></span></div>`
    : '<div class="console dim">// 点击「运行测试」后展示模型结构化输出\n// 字段：risk_level / score / findings / review_required</div><div class="out-meta"><span>耗时 <b>—</b></span><span>Token <b>—</b></span><span>证据 <b>—</b></span></div>';
  return `<section class="panel" style="margin:0"><div class="panel-head"><div><h2>结构化输出</h2><p>统一 Schema · 只读</p></div><button class="btn small" data-act="copy-json" ${out ? '' : 'disabled'}>复制 JSON</button></div><div class="panel-body">${body}</div></section>`;
}

function testInputPanel(e, t) {
  if (t === 'text') {
    return `<div class="field" style="margin-top:12px"><label>聊天记录 / 话术原文 <em>*</em></label><textarea id="test-text" style="min-height:150px" placeholder="直接粘贴企微聊天记录，例如：&#10;2026-10-22 15:02 客户：这个产品风险大吗？&#10;2026-10-22 15:03 销售：肯定不亏，本金我都可以保证。">${esc(e.testInputs[t] || '')}</textarea><small>时间与昵称会被忽略，仅保留角色与内容；支持整段粘贴。</small><div class="head-actions" style="justify-content:flex-start;margin-top:8px"><button class="btn small" data-act="sample-test-text">载入示例聊天</button></div></div>`;
  }
  const f = e.attached && e.attached[t];
  const accept = { image: 'image/*', audio: 'audio/*', video: 'video/*' }[t];
  const limit = { image: '5MB', audio: '20MB', video: '50MB' }[t];
  let media = '';
  if (f) {
    if (t === 'image') media = `<img class="file-thumb" src="${f.url}" alt="附件预览">`;
    else media = `<div class="file-thumb">${t === 'audio' ? '♪' : '▶'}</div>`;
  }
  const extra = f ? `<div class="file-card">${media}<div class="file-meta"><b>${esc(f.name)}</b><small>${(f.size / 1024 / 1024).toFixed(2)} MB · 已就绪${t === 'image' ? ' · 可 OCR（演示）' : t === 'audio' ? ' · 可转写（演示）' : ' · 可抽帧与转写（演示）'}</small>${t === 'audio' ? `<audio controls src="${f.url}"></audio>` : ''}${t === 'video' ? `<video controls src="${f.url}" style="width:100%;max-height:150px;margin-top:6px;border-radius:5px"></video>` : ''}</div></div>` : '';
  const label = t === 'image' ? '图片识别文本（OCR）' : t === 'audio' ? '语音转写文本（ASR）' : '视频转写 / 抽帧文本';
  return `<div style="margin-top:12px"><label class="upload"><input type="file" data-upload="${t}" accept="${accept}"><strong>${f ? '重新选择' : '点击选择'}${MTYPES[t].name}附件</strong><small>支持 ${accept} 单文件 ≤ ${limit}；仅在浏览器本地预览</small></label>${extra}
  <div class="field" style="margin-top:11px"><label>${label}</label><textarea id="test-transcript" style="min-height:110px" placeholder="粘贴或填写识别结果；留空将判定为“证据不足”，不做推测。">${esc(e.testInputs[t] || '')}</textarea><small>演示环境不解析真实音视频；上线后由底层 ASR / OCR 自动填充，可人工修正。</small><div class="head-actions" style="justify-content:flex-start;margin-top:8px"><button class="btn small" data-act="sample-test-text">填入示例识别文本</button></div></div></div>`;
}

function testResultHtml(e, t) {
  const r = (e.testResults || {})[t];
  const type = `<span class="tag">${MTYPES[t].icon} ${MTYPES[t].name}</span>`;
  if (!r) return '<div class="notice" style="margin-top:12px">尚未运行测试。建议先用正例、再用反例各测一次，确认判定边界。</div>';
  if (r.kind === 'insufficient') return `<div class="test-result"><div class="head">${type}<span class="tag l1">证据不足</span></div><p>${esc(r.reason)}</p></div>`;
  if (r.kind === 'hit') {
    const ru = ruleById(r.rule);
    return `<div class="test-result"><div class="head">${type}<span class="tag l0">命中 ${r.rule}</span><span class="tag">${esc(ru.name)}</span><span class="tag">置信度 ${r.conf}%</span></div><p>命中原文：<mark>${esc(r.evidence)}</mark></p><p style="margin-top:6px">建议动作：进入人工复核；${r.level === 'L0' ? '按 L0 当天处理，并通知销售与主任。' : '按 L1 复核，3 个工作日内闭环。'}</p></div>`;
  }
  return `<div class="test-result"><div class="head">${type}<span class="tag green">不命中</span></div><p>未同时满足已绑定规则的判定条件；输出“不命中”，不产生风险结论。</p></div>`;
}

function judgeText(text, e) {
  const hitList = [
    [/保证|保本|肯定不亏|稳赚|必涨|确定性/, 'R-001', 94],
    [/翻倍|收益截图|个月收益|平均赚/, 'R-002', 88],
    [/全仓|加两成|目标价|直接买|直接卖|买入|卖出/, 'R-003', 91],
    [/最好|第一|唯一|无人能比|全网/, 'R-004', 86],
    [/无理由退费|随时退|全额退款|随时退款/, 'R-005', 89],
    [/亏了算我的|我来兜底|全亏我补/, 'R-006', 90],
    [/12386|证监会|证监局|曝光/, 'R-007', 96],
    [/退钱|退费|退款|不做了/, 'R-008', 92],
    [/全亏|气死|被坑|天天跌/, 'R-009', 84],
    [/蠢|滚|踢出群/, 'R-010', 85],
    [/不用测评|直接买这个/, 'R-011', 91]
  ];
  const bound = e.rules && e.rules.length ? enabledRules(e) : null;
  for (const [re, rule, conf] of hitList) {
    if (bound && !bound.includes(rule)) continue;
    const m = text.match(re);
    if (m) {
      const pos = text.indexOf(m[0]);
      const idx = Math.max(0, pos - 24);
      return { kind: 'hit', rule, conf, level: ruleById(rule).sev || 'L1', span: { start: pos, end: pos + m[0].length }, evidence: text.slice(idx, idx + 90).replace(/\n/g, ' ') };
    }
  }
  return { kind: 'pass' };
}

function captureTestInput(e) {
  const ta = $('#test-text') || $('#test-transcript');
  if (ta) e.testInputs[e.testType] = ta.value;
}


/* ============ 质检计划 ============ */
VIEWS.plans = () => `
  <header class="page-head"><div><div class="eyebrow">QC PLANS</div><h1>质检计划</h1><p>把模型变成可执行任务：数据范围、运行频率、数据窗口、复核策略、结果去向。</p></div><div class="head-actions"><button class="btn" data-act="run-plan-now">立即执行一次</button><button class="btn primary" data-act="new-plan">＋ 新建计划</button></div></header>
  <div class="notice">ⓘ 计划绑定模型版本，不随模型升级自动漂移；阈值与抽检策略在计划级可覆盖模型默认值。</div>
  <section class="panel" style="margin-top:13px"><div class="panel-head"><div><h2>计划列表</h2><p>启用 ${PLANS.filter(p => p.status === '启用').length} 个 · 停用 ${PLANS.filter(p => p.status !== '启用').length} 个</p></div></div>
    <div class="table-wrap"><table><thead><tr><th>计划</th><th>模型版本</th><th>频率 / 窗口</th><th>复核策略</th><th>最近结果</th><th>下次运行</th><th>状态</th><th>操作</th></tr></thead><tbody>
      ${PLANS.map(p => `<tr><td class="name-cell"><button data-act="edit-plan" data-id="${p.id}">${p.name}</button><small>${p.scope}</small></td><td>${modelById(p.modelId).name}<br><span class="mono">${modelById(p.modelId).ver}</span></td><td>${p.freq}<br><span class="mono">${p.window}</span></td><td style="font-size:11px">${reviewText(p.review)}</td><td class="num">${p.stats.results}</td><td class="mono">${p.nextRun}</td><td>${statusPill(p.status)}</td><td><div class="action-set"><button class="btn text small" data-act="open-run" data-id="${p.id}">批次</button><button class="btn text small" data-act="toggle-plan" data-id="${p.id}">${p.status === '启用' ? '停用' : '启用'}</button></div></td></tr>`).join('')}

function planTypeWarning(p) {
  const mm = modelById(p.modelId).materials || ['text'];
  const need = p.biz === 'material' ? ['text', 'image'] : p.biz === 'live' ? ['text'] : ['text'];
  const miss = need.filter(k => !mm.includes(k));
  if (!miss.length) return '';
  return `<div class="notice warning" style="margin-top:11px">当前模型未启用 ${miss.map(k => MTYPES[k].name).join('、')}，该计划对应的数据可能无法被完整质检，请调整模型或数据范围。</div>`;
}

function reportSlice(span) { return REPORT.days.slice(-span); }
function sumBy(days, key) { return days.reduce((a, d) => a + d[key], 0); }
function reportStats(days) {
  const archived = sumBy(days, 'archived'), scanned = sumBy(days, 'scanned');
  const hits = sumBy(days, 'hits'), confirmed = sumBy(days, 'confirmed');
  const critical = sumBy(days, 'critical'), overdue = sumBy(days, 'overdue');
  const hiConfirmed = sumBy(days, 'hiConfirmed'), hiResolved = sumBy(days, 'hiResolved');
  const critCustomers = Math.round(critical * 0.8);
  return {
    archived, scanned, hits, confirmed, critical, overdue, hiConfirmed, hiResolved,
    coverage: scanned / (archived || 1), confirmRate: confirmed / (hits || 1),
    critRate: critical / (confirmed || 1), closure: hiResolved / (hiConfirmed || 1),
    openHigh: hiConfirmed - hiResolved, critCustomers, hnw: Math.round(critCustomers * 0.25),
    affected: Math.round(confirmed * 0.6),
    rectified: Math.round(confirmed * 0.93), resolved: Math.round(confirmed * 0.82),
    judged: Math.round(hits * 1.12), pulled: Math.round(archived * 1.32),
    recall: Math.round(hits * 2.6), cand: Math.round(hits * 1.55)
  };
}
function reportKpiData(span) {
  const cur = reportStats(reportSlice(span));
  const prevDays = REPORT.days.slice(-span * 2, -span);
  const prev = reportStats(prevDays.length ? prevDays : reportSlice(span));
  return { cur, prev };
}
function kpiDelta(now, before, betterUp) {
  const base = before || 1;
  const pct = (now - before) / base;
  const flat = Math.abs(pct) < 0.005;
  const good = betterUp ? now >= before : now <= before;
  return `<span class="kpi-delta ${flat ? 'flat' : good ? 'good' : 'bad'}">${flat ? '—' : (pct > 0 ? '↑' : '↓') + ' ' + Math.abs(pct * 100).toFixed(1) + '%'}</span>`;
}

function reportKpiCards(span) {
  const { cur, prev } = reportKpiData(span);
  const cards = [
    { label: '红线确认数', value: num(cur.critical), note: `占确认风险 ${(cur.critRate * 100).toFixed(1)}%`, delta: kpiDelta(cur.critical, prev.critical, false), flag: cur.critical === 0 ? ['good', '无红线'] : ['bad', '需核查'] },
    { label: '红线涉及客户', value: num(cur.critCustomers), note: `高净值 / 私行 ${cur.hnw} 位`, delta: kpiDelta(cur.critCustomers, prev.critCustomers, false), flag: cur.hnw > 0 ? ['warn', '含高净值'] : ['good', '普通客户'] },
    { label: '超期未闭环', value: num(cur.overdue), note: `高风险未闭环 ${cur.openHigh} 条`, delta: kpiDelta(cur.overdue, prev.overdue, false), flag: cur.overdue === 0 ? ['good', '无超期'] : ['bad', '需升级'] },
    { label: '高风险闭环率', value: (cur.closure * 100).toFixed(1) + '%', note: `已归档 ${cur.hiResolved} / 确认 ${cur.hiConfirmed}`, delta: kpiDelta(cur.closure, prev.closure, true), flag: cur.closure >= 0.9 ? ['good', '达标'] : ['warn', '低于目标'] }
  ];
  return `<div class="stats four">${cards.map(c => `<article class="stat kpi-card2"><div class="stat-label">${c.label}<span class="kpi-flag ${c.flag[0]}">${c.flag[1]}</span></div><div class="stat-value">${c.value}</div><div class="stat-note">${c.delta}${c.note}</div></article>`).join('')}</div>`;
}

function reportTrendSvg(span) {
  const days = reportSlice(span);
  const hits = days.map(d => d.hits), conf = days.map(d => d.confirmed);
  const max = Math.max(...hits, 1), top = Math.ceil(max / 20) * 20;
  const W = 780, H = 220, L = 40, R = 16, TP = 12, B = 24;
  const pw = W - L - R, ph = H - TP - B;
  const x = i => L + pw * i / Math.max(1, days.length - 1);
  const y = v => TP + ph - ph * v / top;
  const grid = [0, .25, .5, .75, 1].map(r => `<line x1="${L}" y1="${y(top * r).toFixed(1)}" x2="${W - R}" y2="${y(top * r).toFixed(1)}" class="trend-grid"/><text x="${L - 8}" y="${y(top * r).toFixed(1)}" class="trend-axis" text-anchor="end" dominant-baseline="middle">${top * r}</text>`).join('');
  const line = arr => arr.map((v, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(' ');
  const step = Math.max(1, Math.ceil(days.length / 8));
  const marks = []; for (let i = 0; i < days.length; i += step) marks.push(i);
  if (marks[marks.length - 1] !== days.length - 1) marks.push(days.length - 1);
  const base = Date.UTC(2026, 8, 24) + (30 - days.length) * 864e5;
  const dateLabel = i => { const d = new Date(base + i * 864e5); return `${d.getUTCMonth() + 1}/${d.getUTCDate()}`; };
  const labels = marks.map(i => `<text x="${x(i).toFixed(1)}" y="${H - 6}" class="trend-axis" text-anchor="middle">${dateLabel(i)}</text>`).join('');
  const dots = days.map((d, i) => `<circle cx="${x(i).toFixed(1)}" cy="${y(d.confirmed).toFixed(1)}" r="2.4" fill="#187661" class="trend-dot"><title>第 ${i + 1} 天 · 确认 ${d.confirmed} 条 / 提示 ${d.hits} 条</title></circle>`).join('');
  return `<div class="trend-legend"><span class="legend-item"><i style="background:#315fcb"></i>AI 提示 · ${num(sumBy(days, 'hits'))}</span><span class="legend-item"><i style="background:#187661"></i>人工确认 · ${num(sumBy(days, 'confirmed'))}</span><span class="legend-note">确认数才是结果；AI 提示随规则收紧上升</span></div>
  <svg class="trend-svg" viewBox="0 0 ${W} ${H}" role="img" aria-label="AI 提示与人工确认趋势">${grid}<path d="${line(hits)}" class="trend-line" stroke="#315fcb"/><path d="${line(conf)}" class="trend-line" stroke="#187661"/>${dots}</svg>`;
}

function reportFunnel(st) {
  const steps = [
    ['AI 提示', st.hits], ['人工确认', st.confirmed], ['整改完成', st.rectified], ['已归档', st.resolved]
  ];
  return `<div class="funnel">${steps.map(([k, v], i) => {
    const rate = i ? (v / steps[i - 1][1] * 100).toFixed(1) + '%' : '—';
    return `<div class="funnel-row"><span>${k}<b>${num(v)}</b></span><div class="funnel-bar"><i style="width:${Math.max(2, v / st.hits * 100)}%"></i></div><b>${rate}</b></div>`;
  }).join('')}</div>
  <div class="kv" style="margin-top:6px"><span>超期未闭环</span><b>${st.overdue} 条</b></div>
  <div class="kv"><span>高风险未闭环</span><b>${st.openHigh} 条</b></div>
  <div class="kv"><span>高风险闭环率</span><b>${(st.closure * 100).toFixed(1)}%</b></div>
  <div class="panel-foot">转化率 = 本级 ÷ 上级；AI 提示到人工确认为误报过滤，其后为处置效率。</div>`;
}

function reportLevels(st) {
  const l0 = Math.round(st.confirmed * 0.18), l1 = Math.round(st.confirmed * 0.55), l2 = st.confirmed - l0 - l1;
  const rows = [['L0 立即', l0, '#b84d52'], ['L1 复核', l1, '#c08a2a'], ['L2 记录', l2, '#315fcb']];
  const total = st.confirmed || 1;
  return `<div class="stage-bar">${rows.map(([, v, c]) => `<i style="background:${c};width:${v / total * 100}%"></i>`).join('')}</div>
  ${rows.map(([n, v, c]) => `<div class="stage-row"><i class="stage-dot" style="background:${c}"></i><span>${n}</span><span class="num">${v}</span><span>${(v / total * 100).toFixed(1)}%</span></div>`).join('')}
  <div class="panel-foot">按人工确认后等级分布；AI 提示中含已驳回部分，不在此展示。</div>`;
}

function reportTypes(st) {
  const shareSum = REPORT.typeMix.reduce((a, t) => a + t[1], 0) || 1;
  const rows = REPORT.typeMix.map(([name, share, miss]) => {
    const c = Math.round(st.confirmed * share / shareSum), r = Math.round(c * miss / (1 - miss));
    return [name, c, r];
  });
  const max = Math.max(...rows.map(r => r[1] + r[2]), 1);
  return `<div class="type-list">${rows.map(([n, c, r]) => `<div class="type-row"><span>${n}</span><span class="type-bar"><i style="width:${c / max * 100}%"></i><i class="rej" style="width:${r / max * 100}%"></i></span><span class="num">${c} / ${r}</span></div>`).join('')}</div>
  <div class="evi-meta" style="margin-top:7px"><span class="tag green">人工确认</span><span class="tag">误报驳回</span></div>
  <div class="panel-foot">按命中条数排序；右列为 确认 / 驳回。误报率持续 &gt; 30% 的规则应补充反例。</div>`;
}

function reportTeams(st) {
  const rows = REPORT.teamMix.map(([name, sShare, hShare]) => {
    const sessions = Math.round(st.archived * sShare), hits = Math.round(st.hits * hShare);
    return { name, sessions, hits, confirmed: Math.round(st.confirmed * hShare), density: sessions ? hits / sessions * 1000 : 0 };
  }).sort((a, b) => b.density - a.density);
  const max = Math.max(...rows.map(r => r.density), 0.1) * 1.12;
  return `<div class="bars">${rows.map(r => `<div class="bar-row"><span>${r.name}</span><div class="bar amber"><i style="width:${r.density / max * 100}%"></i></div><b class="num">${r.density.toFixed(2)}‰</b></div>`).join('')}</div>
  <div class="panel-foot">每千条会话命中数，按会话量归一化，避免人多就显示问题多。</div>`;
}

function reportRules(st) {
  const rows = REPORT.ruleMix.map(([id, w, miss, crit, rep]) => {
    const hits = Math.round(st.hits * w);
    return { id, name: ruleById(id) ? ruleById(id).name : id, hits, confirmed: Math.round(hits * (1 - miss)), miss, crit, rep };
  }).sort((a, b) => b.hits - a.hits);
  return `<div class="table-wrap"><table><thead><tr><th>规则</th><th>命中</th><th>确认</th><th>误报率</th><th>红线</th><th>重复</th><th>结论</th></tr></thead><tbody>
  ${rows.map(r => `<tr><td class="name-cell"><b>${r.id} ${esc(r.name)}</b></td><td class="num">${r.hits}</td><td class="num">${r.confirmed}</td><td class="num ${r.miss >= .3 ? 'warn-cell' : ''}">${(r.miss * 100).toFixed(0)}%</td><td class="num">${r.crit}</td><td class="num">${r.rep}</td><td style="font-size:10px;color:#7b8899">${r.miss >= .3 ? '补充反例 / 下调敏感度' : r.crit >= 4 ? '红线集中，优先治理' : '保持观察'}</td></tr>`).join('')}
  </tbody></table></div><div class="panel-foot">规则明细为演示抽样，与上方汇总口径独立；误报率 = 驳回 ÷ 命中。</div>`;
}

function reportRepeats() {
  return `<div class="table-wrap"><table><thead><tr><th>员工</th><th>团队</th><th>规则</th><th>再犯次数</th><th>最近</th></tr></thead><tbody>
  ${REPORT.repeats.map(([emp, team, rid, n, last]) => `<tr><td class="name-cell"><b>${emp}</b></td><td>${team}</td><td>${rid} ${esc(ruleById(rid) ? ruleById(rid).name : '')}</td><td class="num">${n}</td><td class="mono">${last}</td></tr>`).join('')}
  </tbody></table></div><div class="panel-foot">再犯指同一员工在同一规则上被再次确认；累计 3 次进入专项培训名单。</div>`;
}

/* ============ 质检报表（看板销售维度与报表页共用同一主体） ============ */

  const st = reportStats(reportSlice(span));
  const topRule = REPORT.ruleMix.map(([id, , , crit]) => ({ id, crit })).sort((a, b) => b.crit - a.crit)[0];
  const verdict = `高风险闭环率 ${(st.closure * 100).toFixed(1)}%${st.closure >= .9 ? '，达标' : '，低于 90% 目标'}；红线确认 ${st.critical} 条，集中在 ${topRule.id} ${ruleById(topRule.id).name}；超期未闭环 ${st.overdue} 条，建议${st.overdue ? '升级至合规复核' : '保持当前节奏'}。`;
  return `
  <div class="verdict-line ${st.closure >= .9 ? 'good' : 'warn'}"><b>本期结论</b><span>${esc(verdict)}</span></div>

  ${reportKpiCards(span)}

  <div class="board-grid">

    <section class="panel" style="margin:0"><div class="panel-head"><div><h2>处置漏斗</h2><p>各环节转化</p></div></div><div class="panel-body">${reportFunnel(st)}</div></section>

    <section class="panel" style="margin:0"><div class="panel-head"><div><h2>风险类型</h2><p>确认与误报对比</p></div></div><div class="panel-body">${reportTypes(st)}</div></section>
    <section class="panel" style="margin:0"><div class="panel-head"><div><h2>团队风险密度</h2><p>每千条会话命中数</p></div></div><div class="panel-body">${reportTeams(st)}</div></section>

function reviewResult(id, decision) {
  const r = RESULTS.find(x => x.id === id);
  if (!r) return;
  if (decision === 'false') { r.status = '已关闭'; toast('已判定为误报，样本回流训练集'); }
  else if (decision === 'insufficient') { r.status = '证据不足'; toast('已标记证据不足，不输出风险结论'); }
  else if (r.status === '待复核') { r.status = '待处置'; toast('已确认违规，生成处置任务并通知销售'); }
  else if (r.status === '待处置') { r.status = '待结案'; toast('销售已提交处理结果，等待结案复核'); }
  else { r.status = '已结案'; toast('结案完成，已归档'); }
  render();
}

document.addEventListener('change', ev => {

  if (el && window.__rptCtl) {

document.addEventListener('click', ev => {
  const rptEl = ev.target.closest('[data-action]');
  if (rptEl && window.__rptCtl && window.__rptCtl.handleAction(rptEl.dataset)) {
    if (rptEl.dataset.action === 'overview-preset') { state.rptPreset = Number(rptEl.dataset.days); state.rptDates = null; }
    return;
  }
  const nav = ev.target.closest('[data-nav]');
  if (nav) { if (nav.dataset.channel) state.channel = nav.dataset.channel; go(nav.dataset.nav); return; }
  const el = ev.target.closest('[data-act]');
  if (!el) return;
  const act = el.dataset.act;
  const id = el.dataset.id;

  switch (act) {
    case 'go': if (el.dataset.tab) state.stab = el.dataset.tab; if (el.dataset.channel) state.channel = el.dataset.channel; go(el.dataset.view, el.dataset.id); break;
    case 'tab': state.tab = el.dataset.tab; render(); break;
    case 'settings-tab': state.stab = el.dataset.tab; render(); break;
    case 'open-result': state.rtab = 'detail'; go('results', id, 'wx'); break;
    case 'result-tab': state.rtab = el.dataset.rtab; render(); break;
    case 'board-range': state.range = Number(el.dataset.range) === 7 ? 7 : 30; render(); break;
    case 'report-range': state.range = Number(el.dataset.range) === 7 ? 7 : 30; render(); break;
    case 'board-dim': state.boardDim = el.dataset.dim === 'sales' ? 'sales' : 'customer'; render(); break;
    case 'stage-toggle': {
      const key = el.dataset.stage;
      state.custHidden = state.custHidden.includes(key) ? state.custHidden.filter(k => k !== key) : [...state.custHidden, key];
      render();
      break;
    }
    case 'cust-reason': {
      const reason = el.dataset.reason;
      state.custReason = state.custReason === reason ? null : reason;
      render();
      break;
    }
    case 'cust-clear-reason': state.custReason = null; render(); break;
    case 'cust-results': {
      state.f.results = { q: el.dataset.name, status: 'all', scene: 'all', plan: 'all', level: 'all', sort: 'priority' };
      go('results');
      break;
    }
    case 'result-nav': {
      const list = resultSorted(resultFiltered());
      const i = list.findIndex(x => x.id === state.id);
      const next = list[i + Number(el.dataset.dir)];
      if (next) { state.id = next.id; render(); }
      break;
    }
    case 'locate-evidence': {
      const t = document.getElementById('chat-' + el.dataset.msg);
      if (t) { t.classList.add('flash'); if (t.scrollIntoView) t.scrollIntoView({ block: 'center', behavior: 'smooth' }); setTimeout(() => t.classList.remove('flash'), 1300); }
      break;
    }
    case 'open-alert': state.channel = 'live'; go('alertDetail', id); break;
    case 'open-material': state.channel = 'material'; go('materialDetail', id); break;
    case 'open-source': go('source', id); break;
    case 'open-model': go('modelDetail', id); break;
    case 'open-run-detail': go('runDetail', id); break;
    case 'edit-plan': go('planEditor', id); break;
    case 'open-run': go('runDetail', (RUNS.find(r => r.planId === id) || RUNS[0]).id); break;
    case 'new-rule': state.editor = { mode: 'new' }; state.ruleRun = null; go('ruleEditor'); break;
    case 'edit-rule': state.editor = { mode: 'edit', id }; state.ruleRun = null; go('ruleEditor'); break;
    case 'run-rule': {

      go('modelEditor');
      break;
    }
    case 'next-step': {

      if (e.step === 1) {
        const name = ($('#m-name')?.value || '').trim();
        if (!name) { toast('请填写模型名称'); break; }

    case 'run-model-test': {

/* 筛选输入：保持焦点，避免重渲染后无法继续输入 */
let filterTimer = null;
function onFilterChange(ev) {
  const el = ev.target.closest('[data-filter]');
  if (!el) return;
  const path = el.dataset.filter.split('.');
  const group = path[0], key = path[1];
  state.f[group] = state.f[group] || {};
  state.f[group][key] = el.value;
  const view = state.view, caret = el.selectionStart;
  clearTimeout(filterTimer);
  filterTimer = setTimeout(() => {
    render();
    const again = document.querySelector(`[data-filter="${path[0]}.${path[1]}"]`);
    if (again) { again.focus(); try { again.setSelectionRange(caret, caret); } catch (e) { } }
  }, 220);
}
document.addEventListener('input', onFilterChange);
document.addEventListener('change', ev => {
  const sel = ev.target.closest('select[data-filter]');
  if (sel) { onFilterChange(ev); return; }
  const up = ev.target.closest('[data-upload]');
  if (up) {
    const f = ev.target.files && ev.target.files[0];
    if (!f) return;
    const t = up.dataset.upload;
    const maxMB = { image: 5, audio: 20, video: 50 }[t] || 20;
    if (f.size > maxMB * 1024 * 1024) { toast('文件超过 ' + maxMB + 'MB，请压缩后重试'); ev.target.value = ''; return; }
    const e = state.editor;
    e.attached = e.attached || {};
    if (e.attached[t] && e.attached[t].url) URL.revokeObjectURL(e.attached[t].url);
    e.attached[t] = { name: f.name, size: f.size, kind: f.type, url: URL.createObjectURL(f) };
    toast(MTYPES[t].name + '附件已就绪（仅本地预览）');
    render();
    return;
  }
  if (ev.target.matches('[data-rule-check]')) {
    state.editor.rules = $$('[data-rule-check]:checked').map(x => x.value);
    const n = $('#m-selected'); if (n) n.textContent = state.editor.rules.length;
    return;
  }
  const role = ev.target.closest('#role-switch');
  if (role) {
    state.role = role.value.split(' · ')[0];
    $('#avatar').textContent = state.role.slice(0, 1);
    toast('已切换演示角色：' + role.value);
  }
});

  const kw = ($('#m-rule-q')?.value || '').trim();
  const sc = $('#m-rule-scene')?.value || 'all';
  $$('[data-rule-row]').forEach(row => {
    const ok = (sc === 'all' || row.dataset.scene === sc) && (!kw || (row.dataset.name || '').includes(kw));
    row.style.display = ok ? '' : 'none';
  });
}

/* 初始化 */
renderNav();
render();
</script>
</body>
</html>
