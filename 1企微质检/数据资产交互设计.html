.demo{font-size:10.5px;padding:3px 9px;border-radius:999px;border:1px solid #e7ebf3;color:#8b95a5;background:#fafbfe}
.user{font-size:11.5px;color:#556174;gap:9px}
.user .avatar{
  width:30px;height:30px;border-radius:50%;font-size:11px;color:#fff;
  background:linear-gradient(160deg,#5b86f5,#3158c8);box-shadow:0 4px 10px -5px rgba(47,93,224,.7);
}

/* 主体区 */
.main{padding:32px 34px 48px}

/* 面板与统计卡 */
.panel{border-radius:var(--radius);border-color:#e7ecf4;background:#fff;box-shadow:var(--shadow-card)}
.panel-head{padding:18px 22px;border-bottom:1px solid #eef2f8;background:linear-gradient(180deg,#fff,#fcfdff)}
.panel-head h2{font-size:15px;font-weight:700;color:#1b2536}
.panel-head p{font-size:12px;color:#8492a6;margin-top:4px}
.panel-head .count{font-size:11.5px;color:#93a1b4}
.stats{gap:16px;margin-bottom:24px}
.stat{
  border-radius:var(--radius);border-color:#e7ecf4;padding:18px 20px;box-shadow:var(--shadow-card);
  transition:box-shadow .22s,transform .22s,border-color .22s;
}
.stat:hover{box-shadow:var(--shadow-hover);transform:translateY(-2px);border-color:#dbe4f3}
.stat-label{font-size:11.5px;font-weight:500;color:#76849c}
.stat-label .icon{color:#93a6c2}
.stat-value{font-size:30px;letter-spacing:-.5px;margin:10px 0 4px;color:#121c2c;font-variant-numeric:tabular-nums}
.stat-note{font-size:10.5px;color:#93a0b3}
.stat:first-child{border-top:2px solid #6d97fa}

/* 检索区 */
.search-main .search-field{
  min-height:48px;border-radius:11px;border-color:#dfe6f2;padding-left:15px;
  box-shadow:0 1px 2px rgba(16,27,45,.03);transition:border-color .16s,box-shadow .16s;
}
.search-main .search-field:focus-within{border-color:#8fb0f4;box-shadow:0 0 0 4px rgba(47,93,224,.1)}
.search-main .search-field input{font-size:13px}
.search-main>.btn{padding:11px 26px;font-size:13px;border-radius:11px}
.search-control{font-size:11.5px;color:#7f8da3}
.search-control>select{height:38px}
.search-condition-label,.search-hint{font-size:10.5px;color:#95a2b7}

/* 分类页签 / 视图切换 */
.category-tabs{gap:26px;border-bottom:1px solid #eef2f8}
.category-tabs button{font-size:12.5px;padding:14px 0 12px;color:#7b8a9f}
.category-tabs button span{font-size:10.5px;color:#9ea8b7}
.category-tabs button.active{color:var(--blue);font-weight:700}
.view-toggle{border-radius:9px;border-color:#e4eaf4;padding:3px;background:#f8fafd}
.view-toggle button{border-radius:6px;padding:5px 7px}
.view-toggle button.active{background:#fff;color:var(--blue);box-shadow:0 1px 3px rgba(16,27,45,.1)}
.results-bar{font-size:11px;color:#93a0b3;padding-bottom:12px}
.results-bar b{color:#3d4f6a;font-weight:700}
.table-foot{font-size:11px;color:#93a0b3;border-top:1px solid #eef2f8}

/* 表格 */
table{font-size:13px}
th{
  font-size:11px;font-weight:700;letter-spacing:.5px;color:#7c8ba1;
  background:#f8fafd;border-top:1px solid #eef2f8;border-bottom:1px solid #e9eef6;padding:12px 18px;
}
td{padding:15px 18px;border-bottom:1px solid #f1f4f9;color:#5b6a80}
tbody tr{transition:background .14s}
tbody tr:hover td{background:#f8fbff}
.asset-name .title{font-size:13px;font-weight:600;color:#26364e}
.asset-name .subtitle{font-size:11px;color:#9aa7b9;margin-top:4px}

/* 卡片类 */
.asset-card,.person-card,.source-card{
  border-radius:13px;border-color:#e7ecf4;box-shadow:var(--shadow-card);
  transition:box-shadow .22s,transform .22s,border-color .22s;
}
.asset-card:hover,.person-card:hover,.source-card:hover{
  box-shadow:var(--shadow-hover);transform:translateY(-3px);border-color:#dbe4f3;
}
.card-preview{
  height:156px;padding:0;border-bottom:1px solid #eef2f8;
  background:linear-gradient(180deg,#f8faff,#eef3fb);
}
.card-preview img{width:100%;height:100%;object-fit:contain;background:#fff}
.card-preview .icon{
  width:42px;height:42px;padding:11px;border-radius:13px;color:#7d9ec9;background:#fff;
  box-shadow:0 8px 20px -12px rgba(16,27,45,.45);box-sizing:content-box;
}
.card-body{padding:14px 16px}
.card-body h3{font-size:13px;font-weight:700;color:#2c3c54;margin:9px 0}
.card-body .between{font-size:10.5px;color:#94a1b3;gap:8px}
.card-body .between>*{min-width:0}
.card-body .mono,.card-footer .mono{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card-footer{padding:11px 16px;font-size:10.5px;color:#8997ab;border-top-color:#eef2f8}

/* 徽标 / 抽屉 / 弹层 */
.chip{border-radius:6px;padding:3px 8px;font-size:11px;font-weight:500;background:#f1f4fa;color:#61708a}
.chip.blue{background:#e9f0ff;color:#2d55c0}
.chip.green{background:#e6f6ef;color:#0d7a5c}
.chip.amber{background:#fff4e2;color:#9a620c}
.chip.red{background:#feeeee;color:#b33f3b}
.avatar{border-radius:10px;background:#edf2ff;color:#4d6fb5} 
dialog::backdrop{background:rgba(11,20,34,.45);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
#detail{box-shadow:-26px 0 80px -32px rgba(9,18,33,.55);border-left:1px solid #e7ecf4}
.drawer-head{padding:20px 26px}
.drawer-head h2{font-size:19px}
.drawer-tabs{gap:26px;padding:0 26px}
.drawer-tabs button{font-size:12.5px;padding:14px 0 12px;color:#8291a6}
.drawer-tabs button.active{font-weight:700}
.drawer-body{padding:24px 26px;background:#f7f9fd}
.drawer-foot{font-size:10.5px;color:#9ba5b5}
.preview-box{border-radius:12px;border-color:#e7ecf4;box-shadow:0 1px 2px rgba(16,27,45,.03)}

/* 滚动条与细节 */
*{scrollbar-width:thin;scrollbar-color:#cfd8e6 transparent}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#cfd8e6;border:3px solid transparent;background-clip:content-box;border-radius:9px}
::-webkit-scrollbar-thumb:hover{background:#b3c1d6;background-clip:content-box}
.nav-scroll{scrollbar-color:#31415c transparent}
.nav-scroll::-webkit-scrollbar-thumb{background:#31415c;border:3px solid transparent;background-clip:content-box}
.nav-scroll::-webkit-scrollbar-thumb:hover{background:#405273;background-clip:content-box}
svg.icon{stroke-width:1.65}

/* 提示条、时间线、聊天与反馈 */
.info-banner{
  padding:13px 16px;border-radius:11px;border-color:#e2ebfa;
  background:linear-gradient(180deg,#f8fbff,#f2f7ff);color:#6b82a4;
  font-size:11.5px;line-height:1.75;box-shadow:0 1px 2px rgba(16,27,45,.02);
}
.info-banner .icon{color:#5b86e0}
.timeline-item{border-left-color:#e2e9f4;padding-bottom:22px}
.timeline-item:before{width:8px;height:8px;border-width:2px;border-color:#7ba2e8;box-shadow:0 0 0 4px #fff}
.timeline-time{font-size:10.5px;color:#93a1b5;letter-spacing:.3px}
.timeline-title{font-size:12.5px;color:#354a68}
.timeline-content{font-size:11.5px;color:#7f8ea5}
.date-btn{border-radius:8px;padding:10px 11px;font-size:11.5px;color:#7c8ba0}
.date-btn:hover{background:#f4f7fd;color:#4a5e7c}
.date-btn.active{background:#eaf1ff;color:var(--blue);font-weight:700;box-shadow:inset 0 0 0 1px #d9e5ff}
.date-btn span{font-size:10px}
.profile-hero{border-radius:13px;box-shadow:var(--shadow-card);padding:22px}
.chat-layout{border-radius:12px}
.chat-messages{background:#f4f7fc}
.message-locator{border-radius:8px;box-shadow:0 2px 8px rgba(168,128,53,.08)}
#toast{
  border-radius:10px;font-size:12.5px;font-weight:500;padding:12px 20px;
  box-shadow:0 18px 40px -20px rgba(20,38,66,.5);border-color:#e2e9f4;
}
.empty{padding:64px 24px}
.empty .icon{color:#b7c6dc}
.empty h3{font-size:13.5px;font-weight:700;color:#5b6d87}
.empty p{font-size:12px}
.asset-name .subtitle{font-family:Consolas,"Microsoft YaHei",monospace;letter-spacing:.3px;color:#93a1b4}

/* 响应式跟随（覆盖层后置，需要同步原断点） */
@media(max-width:1600px){.main{padding:32px 40px 45px}}
@media(max-width:1200px){
  .sidebar{width:200px;padding-left:11px;padding-right:11px}
  .app{margin-left:200px}
  .main{padding:24px 22px}
  .topbar{padding:0 22px}
  th,td{padding-left:14px;padding-right:14px}
  .brand{font-size:20px;letter-spacing:1.2px;gap:9px}
  .brand small{font-size:8.5px;letter-spacing:1.4px}
  .nav-btn{font-size:12px;padding:9px 11px}
}
@media(max-width:900px){
  .sidebar{width:72px;padding:22px 8px}
  .app{margin-left:72px}
  .main{padding:24px 18px}
  .topbar{padding:0 18px}
  .global-search input{width:150px}
  .brand{padding:0;justify-content:center;gap:0}
}
@media(max-width:620px){
  .sidebar{display:none}
  .app{margin-left:0}
  .main{padding:20px 14px}
  .topbar{height:60px;padding:0 14px}
  .panel-head{padding:15px 16px}
  .global-search{padding:4px 8px}
  h1{font-size:22px}
  .page-head{flex-wrap:wrap;margin-bottom:20px}
  .page-head p{font-size:12px;max-width:100%}
  .eyebrow{font-size:10px;letter-spacing:1.8px}
  .head-actions{width:100%;flex-direction:row;justify-content:flex-end;padding-top:4px;gap:8px}
  .head-actions .btn{font-size:11.5px;padding:7px 11px;border-radius:8px}
  .btn{padding:8px 12px}
}

/* 客户档案二级页：目录负责定位，档案负责跨系统聚合查阅 */
.customer-profile-page{max-width:1540px;margin:0 auto}
.customer-profile-header{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden;box-shadow:0 8px 26px rgba(34,57,94,.035)}
.customer-profile-toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 18px;border-bottom:1px solid var(--line);background:#fbfcfe}
.customer-profile-actions{display:flex;align-items:center;gap:8px}
.customer-profile-identity{display:flex;align-items:center;gap:16px;padding:24px 26px 20px}
.customer-profile-name{min-width:0}
.customer-profile-name h1{font-size:25px;color:#253a58;line-height:1.3}
.customer-profile-name .person-tags{margin-top:8px}
.customer-profile-contact{display:flex;align-items:center;gap:18px;margin-left:auto;color:#6f819a;font-size:11px}
.customer-profile-contact span{display:flex;align-items:center;gap:7px;white-space:nowrap}
.customer-profile-contact .icon{width:15px;height:15px;color:#8ba4c9}
.customer-profile-summary{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));border-top:1px solid var(--line);background:#fcfdff}
.customer-profile-summary>div{min-width:0;padding:15px 19px;border-right:1px solid var(--line)}
.customer-profile-summary>div:last-child{border-right:0}
.customer-profile-summary small{display:block;color:#96a3b4;font-size:10px;margin-bottom:6px}
.customer-profile-summary strong{display:block;color:#48607f;font-size:12px;font-weight:600;overflow-wrap:anywhere}
.customer-profile-summary strong .chip{font-weight:500}
.customer-profile-summary>div>span{display:block;color:#9aa6b6;font-size:10px;margin-top:4px}
.customer-profile-tabs{display:flex;align-items:center;gap:28px;margin-top:17px;padding:0 20px;border:1px solid var(--line);border-radius:10px;background:#fff;overflow-x:auto;scrollbar-width:thin}
.customer-profile-tabs button{padding:14px 0 12px;white-space:nowrap;color:#7e8ca0;font-size:12px;border-bottom:2px solid transparent}
.customer-profile-tabs button.active{color:var(--blue);border-color:var(--blue);font-weight:600}
.customer-profile-content{padding-top:17px;min-width:0}
.customer-profile-content>.chat-layout{height:650px;min-height:520px}
.customer-profile-footer{padding:3px 2px 0;color:#9ba7b7;font-size:10px;text-align:right}
.customer-overview-grid{display:grid;grid-template-columns:minmax(0,1.75fr) minmax(280px,.75fr);gap:17px;align-items:start}
.customer-overview-grid>div,.customer-overview-grid>aside{min-width:0}
.customer-profile-two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:17px}
.customer-profile-two>.detail-section{min-width:0}
.customer-meta-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 20px}
.customer-meta-item{min-width:0;padding:10px 0;border-bottom:1px solid #edf1f6}
.customer-meta-item:nth-last-child(-n+2){border-bottom-color:transparent}
.customer-meta-item small{display:block;color:#98a4b4;font-size:10px;margin-bottom:3px}
.customer-meta-item strong{display:block;color:#526a88;font-size:11.5px;line-height:1.7;overflow-wrap:anywhere}
.customer-meta-item>span{display:block;color:#a3adba;font-size:9.5px;margin-top:2px}
.customer-identity-note{margin-top:12px;line-height:1.8}
.risk-cell{display:inline-flex;flex-direction:column;align-items:flex-start;gap:3px}
.risk-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:11px;color:#7c8ca3}
.risk-note{margin-top:9px;line-height:1.8}
.profile-source-line{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:11px 13px;border:1px solid #e5ebf4;border-radius:7px;background:#f8faff;color:#7890af;font-size:10px}
.profile-source-line span{display:flex;align-items:center;gap:6px}
.profile-source-line .icon{width:14px;height:14px}
.customer-staff-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #edf1f6}
.customer-staff-row:last-child{border-bottom:0}
.customer-staff-row .avatar{width:31px;height:31px;border-radius:8px;font-size:10px}
.customer-staff-row span{display:block;color:#97a3b4;font-size:10px;margin-top:2px}
.customer-privacy-note{display:flex;align-items:flex-start;gap:11px;padding:13px 15px;margin-bottom:17px;border:1px solid #dce7f8;border-radius:8px;background:#f5f8fe;color:#657d9e}
.customer-privacy-note>.icon{width:17px;height:17px;margin-top:2px;color:#6e91c9}
.customer-privacy-note strong{font-size:11.5px;color:#4e6788}
.customer-privacy-note p{font-size:10.5px;margin-top:3px;line-height:1.8}
.customer-profile-footnote{padding:12px 15px;border:1px solid #e5ebf3;border-radius:7px;background:#fafbfd;color:#8b99ab;font-size:10.5px}
/* 客户信息独立成页：身份、联系方式与证件按来源字段分组展示。 */
.customer-info-grid{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,.75fr);gap:17px;align-items:start}
.customer-info-grid>.detail-section,.customer-info-stack{min-width:0}
.customer-info-grid .detail-section,.customer-info-stack .detail-section{margin-bottom:0}
.customer-info-stack{display:grid;gap:17px;align-content:start}
.customer-info-stack .identity-list{grid-template-columns:repeat(2,minmax(0,1fr))}
.customer-info-jump{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:11px 14px;margin-bottom:17px;border:1px solid #e3eaf5;border-radius:7px;background:#fafcff;color:#8697ad;font-size:10.5px}
.customer-info-jump>.icon{width:14px;height:14px;color:#8fa9cd;flex:none}
.customer-info-jump .link{font-size:10.5px}
/* 数据资产看板：聚合口径演示数据，与明细页样本解耦。 */
.board-facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 18px}
.board-fact{padding:10px 0;border-bottom:1px solid #eef1f6}
.board-fact small{display:block;font-size:10px;color:#98a4b4;margin-bottom:3px}
.board-fact strong{display:block;font-size:12px;color:#4f6a8d;font-weight:600}
.board-fact span{display:block;font-size:10px;color:#9aa7b8;margin-top:3px}
.board-grid.trend-row{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}
.trend-summary{display:flex;gap:22px;flex-wrap:wrap;padding:11px 13px;margin-bottom:14px;border:1px solid #e8eef7;border-radius:7px;background:#f7f9fd;font-size:10.5px;color:#6c7f9a;line-height:1.8}
.trend-summary b{display:block;font:17px "Bahnschrift",Consolas,var(--font);color:#3d5473;font-weight:500;letter-spacing:-.3px}
.trend-summary span>i{font-style:normal;color:#98a4b6;margin-right:5px}
.trend-summary .down b{color:#168065}
.trend-summary .up b{color:#bc4a4a}
.trend-chart{display:flex;gap:9px;height:228px}
.trend-yaxis{display:flex;flex-direction:column;justify-content:space-between;padding:4px 0 18px;font:9.5px Consolas,monospace;color:#9aa7b8;text-align:right;flex:none;min-width:26px}
.trend-plot{position:relative;flex:1;min-width:0;margin-bottom:18px;background-image:repeating-linear-gradient(to bottom,#eef2f8 0 1px,transparent 1px 33.333%);background-size:100% 33.333%}
.trend-plot svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.trend-line{fill:none;stroke:#4a7fd4;stroke-width:2;vector-effect:non-scaling-stroke;stroke-linecap:round;stroke-linejoin:round}
.trend-area{fill:url(#trendFade);stroke:none}
.trend-dot{position:absolute;width:7px;height:7px;border-radius:50%;background:#4a7fd4;border:1.5px solid #fff;box-shadow:0 1px 4px #2b4d7a33;transform:translate(-50%,-50%)}
.trend-dot.peak{background:#c9635d;width:8px;height:8px}
.trend-peak-label{position:absolute;font:9.5px Consolas,monospace;color:#a8534d;background:#fff6f5;border:1px solid #f0d8d5;border-radius:4px;padding:1px 5px;white-space:nowrap}
.trend-xaxis{display:flex;justify-content:space-between;margin:-12px 0 0 35px;font:9.5px Consolas,monospace;color:#9aa7b8}
.trend-xaxis span{transform:translateX(-50%)}
.trend-xaxis span:first-child{transform:none}
.trend-xaxis span:last-child{transform:translateX(-100%)}
.trend-note{margin-top:13px;padding-top:12px;border-top:1px dashed #e7ebf2;font-size:10.5px;line-height:1.9;color:#7d8ea6}
.trend-legend{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin:2px 0 14px}
.trend-legend-item{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border:1px solid #e6ebf3;border-radius:99px;background:#fff;font-size:10.5px;color:#6f819b;transition:opacity .15s,border-color .15s,background .15s}
.trend-legend-item i{width:8px;height:8px;border-radius:2px}
.trend-legend-item b{font:10.5px Consolas,monospace;color:#435a78;font-weight:400}
.trend-legend-item:not(.on){opacity:.5;border-style:dashed}
.trend-legend-item:not(.on) b{color:#a3aebe}
.trend-legend-item:hover{border-color:#c7d8f5;background:#f8faff}
.trend-legend-note{font-size:9.5px;color:#a3aebe;margin-left:auto}
@media(max-width:620px){.trend-legend{gap:6px}.trend-legend-note{display:none}}
.board-toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:-4px 0 16px}
.board-ranges{display:inline-flex;padding:3px;background:#eef2f8;border-radius:7px;gap:3px}
.board-ranges button{padding:6px 14px;border-radius:5px;font-size:11px;color:#7d899a}
.board-ranges button.active{background:#fff;color:var(--blue);font-weight:600;box-shadow:0 1px 4px #17294a12}
.board-snapshot{font-size:10px;color:#98a4b5}
.board-kpis{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:12px;margin-bottom:16px}
.board-kpi{text-align:left;background:#fff;border:1px solid var(--line);border-radius:10px;padding:15px 16px;transition:border-color .14s,box-shadow .14s;min-width:0}
.board-kpi:hover{border-color:#c7d8f5;box-shadow:0 6px 18px #17294a10}
.board-kpi small{display:flex;align-items:center;gap:6px;font-size:10.5px;color:#8794a8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.board-kpi small .icon{width:13px;height:13px;color:#9aa9bd}
.board-kpi strong{display:block;font:26px "Bahnschrift",Consolas,var(--font);font-weight:500;color:#33465f;margin:8px 0 3px;letter-spacing:-.6px}
.board-kpi em{font-style:normal;font-size:10px;color:#97a3b5;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

}function boardPieChart(rows,total,unitLabel='条预警'){
 const size=230,c=size/2,R=95;let a=-Math.PI/2;
 const geo=rows.map(row=>{const sweep=row.n/total*Math.PI*2,seg={...row,a1:a,mid:a+sweep/2,sweep};a+=sweep;return seg;});
 const slices=geo.map(s=>{if(s.sweep>=Math.PI*2-1e-6)return `<circle cx="${c}" cy="${c}" r="${R}" fill="${s.color}"/>`;const x1=c+R*Math.cos(s.a1),y1=c+R*Math.sin(s.a1),x2=c+R*Math.cos(s.a1+s.sweep),y2=c+R*Math.sin(s.a1+s.sweep);return `<path d="M${c} ${c}L${x1.toFixed(2)} ${y1.toFixed(2)}A${R} ${R} 0 ${s.sweep>Math.PI?1:0} 1 ${x2.toFixed(2)} ${y2.toFixed(2)}Z" fill="${s.color}" stroke="#fff" stroke-width="1.5"><title>${esc(s.label)}：${s.n} 条（${boardPct(s.n,total)}）</title></path>`;}).join('');
 const labels=geo.filter(s=>s.n/total>=.09).map(s=>`<text x="${(c+R*.68*Math.cos(s.mid)).toFixed(1)}" y="${(c+R*.68*Math.sin(s.mid)).toFixed(1)}" text-anchor="middle" dominant-baseline="central" fill="#fff" font-size="10.5" font-weight="600">${Math.round(s.n/total*100)}%</text>`).join('');
 return `<svg class="dab-pie" viewBox="0 0 ${size} ${size}" role="img" aria-label="咨诉预警原因分布饼图，共 ${total} 条">${slices}<circle cx="${c}" cy="${c}" r="51" fill="#fff"/><text x="${c}" y="${c-6}" text-anchor="middle" font-family="Bahnschrift,Consolas,sans-serif" font-size="27" font-weight="600" fill="#2f4460">${total}</text><text x="${c}" y="${c+15}" text-anchor="middle" font-size="10" fill="#94a0b1">${unitLabel}</text>${labels}</svg>`;
}

function dealTrendChart(deal){

 const yA=v=>base-(base-top)*(v/maxAmount),yC=v=>base-(base-top)*(v/maxCount);
 const barW=Math.max(2.4,Math.min(8,stepX*0.3));
 const bars=rows.map((r,i)=>`<rect x="${(x(i)-barW-1).toFixed(1)}" y="${yA(r.amount).toFixed(1)}" width="${barW.toFixed(1)}" height="${Math.max(0.5,base-yA(r.amount)).toFixed(1)}" rx="1.5" fill="#4868bd"><title>${r.day} 成交 ${dealMoney(r.amount)} · ${r.count} 笔</title></rect>${r.refund?`<rect x="${(x(i)+1).toFixed(1)}" y="${yA(r.refund).toFixed(1)}" width="${barW.toFixed(1)}" height="${Math.max(0.5,base-yA(r.refund)).toFixed(1)}" rx="1.5" fill="#c18769"><title>${r.day} 退款 ${dealMoney(r.refund)} · ${r.refundCount} 笔</title></rect>`:''}`).join('');
 const grids=[0,.5,1].map(v=>`<line x1="${left}" x2="${w-right}" y1="${yA(maxAmount*v).toFixed(1)}" y2="${yA(maxAmount*v).toFixed(1)}" stroke="#e9eef4"/><text x="${left-7}" y="${(yA(maxAmount*v)+3.5).toFixed(1)}" text-anchor="end" fill="#8c98a9" font-size="9.5">${dealAxis(maxAmount*v)}</text><text x="${w-right+7}" y="${(yC(maxCount*v)+3.5).toFixed(1)}" fill="#8c98a9" font-size="9.5">${Math.round(maxCount*v)}</text>`).join('');
 const line=rows.map((r,i)=>`${x(i).toFixed(1)},${yC(r.count).toFixed(1)}`).join(' ');
 const dots=rows.map((r,i)=>`<circle cx="${x(i).toFixed(1)}" cy="${yC(r.count).toFixed(1)}" r="2.4" fill="#5b8fa8"><title>${r.day} 成交 ${r.count} 笔</title></circle>`).join('');
 const labels=rows.map((r,i)=>i===0||i===rows.length-1||i%Math.ceil(rows.length/5)===0?`<text x="${x(i).toFixed(1)}" y="${h-8}" text-anchor="middle" fill="#8c98a9" font-size="9.5">${r.day.slice(5)}</text>`:'').join('');
 return `<div class="dab-legend dab-deal-legend"><span><i style="background:#4868bd"></i>成交金额</span><span><i style="background:#c18769"></i>退款金额</span><span><i class="dab-dot-line"></i>成交笔数（右轴）</span></div><svg class="dab-chart" viewBox="0 0 660 ${h}" role="img" aria-label="每日成交金额、退款金额与成交笔数"><title>每日成交与退款</title>${grids}${bars}<polyline points="${line}" fill="none" stroke="#5b8fa8" stroke-width="1.6" stroke-dasharray="3 3"/>${dots}${labels}</svg><details class="dab-chart-data"><summary>查看逐日成交与退款数据</summary><div class="dab-table-wrap"><table><thead><tr><th>日期</th><th>成交笔数</th><th>成交金额</th><th>退款笔数</th><th>退款金额</th><th>净额</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${r.day}</td><td>${r.count}</td><td>${dealMoney(r.amount)}</td><td>${r.refundCount}</td><td>${dealMoney(r.refund)}</td><td>${dealMoney(r.amount-r.refund)}</td></tr>`).join('')}</tbody></table></div></details>`;

const sourceDefault=()=>({endpoint:'',tenant:'',auth:'bearer',clientId:'',interval:60,lookback:30,cursor:'updated_at',timeout:30,retries:3,enabled:true,configured:false,health:'未配置',lastCheck:null,lastSuccess:null,lastAttempt:null,logs:[]});

function sourceStatus(c){return !c.configured?'未配置':!c.enabled?'已暂停':c.lastCheck?.result==='模拟失败'&&c.logs?.[0]?.type==='check'?'连接异常':c.health||'待检测';}

function sourceNext(c){if(!c.configured||!c.enabled)return '—';if(!c.lastSuccess)return '首次同步后计算';return boardStamp(boardTime(c.lastSuccess)+Number(c.interval)*60000)+'（模拟计划）';}

 if(!dialog.open)dialog.showModal();

function saveSourceConfig(form){
 const data=new FormData(form),old=sourceConfig(sourceDraftId),err=$('#source-config-error');let endpoint;
 try{endpoint=new URL(String(data.get('endpoint')).trim());if(endpoint.protocol!=='https:'||endpoint.username||endpoint.password||endpoint.search||endpoint.hash)throw Error();}catch{err.textContent='请输入有效 HTTPS 地址，地址中不可包含凭据、查询参数或片段。';return;}
 const auth=data.get('auth'),clientId=String(data.get('clientId')||'').trim(),tenant=String(data.get('tenant')||'').trim(),cursor=String(data.get('cursor')||'').trim();
 if(!tenant||auth==='client'&&!clientId){err.textContent='请补充租户标识及认证方式要求的 Client ID。';return;}
 const secret=String(data.get('secret')||'').trim(),identityChanged=old.endpoint!==endpoint.href||old.tenant!==tenant||old.auth!==auth||old.clientId!==clientId;
 if(secret)sourceSecrets[sourceDraftId]=secret;else if(identityChanged)delete sourceSecrets[sourceDraftId];
 const scopeChanged=identityChanged||old.cursor!==cursor||old.lookback!==Number(data.get('lookback')),changed=scopeChanged||secret!=='';
 sourceSettings[sourceDraftId]={...old,endpoint:endpoint.href,tenant,auth,clientId,interval:Number(data.get('interval')),lookback:Number(data.get('lookback')),cursor,timeout:Number(data.get('timeout')),retries:Number(data.get('retries')),enabled:data.has('enabled'),configured:true,configVersion:(old.configVersion||0)+1,health:changed||!old.configured?'待检测':old.health,lastCheck:changed?null:old.lastCheck,...(scopeChanged?{lastSuccess:null,lastAttempt:null,snapshotId:null,watermark:null}:{} )};
 sourcePersist();$('#source-dialog').close();render();toast('接口配置已保存，可进行模拟检测与同步。');
}

 if(!dialog.open)dialog.showModal();

function runSourceSimulation(id,type){
 const c=sourceConfig(id);if(!c.configured||!c.enabled)return;
 const scene=$('#source-scenario')?.value||'success',time=boardStamp(Date.now()),missing=!sourceSecrets[id];
 const errors={auth:'认证失败（401）：请检查 Token、Client ID 或授权范围。',timeout:`连接超时：${c.timeout} 秒内未收到响应。`,schema:'字段映射异常：缺少来源记录 ID 或增量时间字段。'};
 const error=missing?'缺少认证凭据：请重新配置本次会话的演示凭据。':errors[scene]||'';
 const from=c.watermark||boardDay(boardSnapshot.slice(0,10),1-Number(c.lookback))+' 00:00:00';
 const success=!error,records=boardRecords().filter(r=>r.source===id&&(c.watermark?boardTime(r.time)>boardTime(from):boardTime(r.time)>=boardTime(from))),batch='SIM-'+id+'-'+Date.now()+'-'+Math.random().toString(36).slice(2,6);
 const log={id:batch,type,time,result:success?'模拟成功':'模拟失败',error,attempts:!success&&!missing&&scene==='timeout'?1+c.retries:1,count:type==='sync'&&success?records.length:0,added:0,updated:type==='sync'&&success?records.length:0,snapshotId:type==='sync'&&success?batch:null,recordIds:type==='sync'&&success?records.map(r=>r.id):[],range:{from,to:boardSnapshot,mode:c.watermark?'增量':'首次回溯'},configVersion:c.configVersion||1,config:{endpoint:c.endpoint,tenant:c.tenant,interval:c.interval,lookback:c.lookback,cursor:c.cursor,timeout:c.timeout,retries:c.retries}};
 c.logs=[log,...(c.logs||[])].slice(0,50);
 if(type==='check')c.lastCheck={time,result:log.result,error};
 else{c.lastAttempt=time;c.health=success?'模拟正常':'模拟异常';if(success){c.lastSuccess=time;c.snapshotId=batch;c.watermark=boardSnapshot;}}
 sourceSettings[id]=c;sourcePersist();render();
 const result=$('#source-run-result');if(result)result.innerHTML=`<div class="dab-run-result ${success?'ok':'error'}"><strong>${type==='check'?'连接检测':'快照同步'} · ${log.result}</strong><p>${error?esc(error):type==='check'?'模拟接口可达。连接检测不会标记为同步正常，请继续执行快照同步。':`批次 ${batch}：读取 ${log.count} 条，新增 0 条，更新快照 ${log.updated} 条。`}</p><small>${time}${!success?' · 尝试 '+log.attempts+' 次':''}</small><button class="link" data-action="source-logs" data-id="${id}">查看日志 →</button></div>`;
}

 try{if(navigator.clipboard?.writeText){await navigator.clipboard.writeText(text);ok=true;}}catch{}

 return ok;
}

function profileEventMarkup(e,selectable=false){

 const clock=raw?raw.replace('T',' '):'时间未提供',precision=match&&!match[2]?'秒未提供':raw&&!match?'时间未提供':'';
 const description=String(e.description||''),long=description.length>100||description.includes('\n');
 const text=long?`<details><summary><span class="profile-event-preview">${esc(description.replace(/\s+/g,' '))}</span><span class="profile-event-expand">展开全文</span><span class="profile-event-collapse">收起全文</span></summary><div class="profile-event-full">${esc(description)}</div></details>`:esc(description);

 return `<article class="timeline-item profile-event${selected?' selected':''}${isAnchor?' is-anchor':''}" data-event-id="${esc(e.id)}">${check}<div class="profile-event-time"><time ${raw?`datetime="${esc(raw.replace(' ','T'))}"`:''}>${esc(clock)}</time>${precision?`<small>${precision}</small>`:''}</div><div class="profile-event-body"><div class="profile-event-head"><div class="profile-event-heading">${chip(types[e.type]?.label||'业务记录')}<span>${esc(e.title)}</span><span class="profile-event-source">${esc(source(e.source)?.short||'')}</span>${flag}</div>${range}<button class="link profile-event-link" data-action="${e.action==='message'?'locate-message':'open-asset'}" data-id="${esc(e.action==='message'?e.messageId:e.assetId)}" ${e.action==='product-history'?'data-tab="source"':''} ${e.versionId?`data-version="${esc(e.versionId)}" data-tab="reviews"`:''}>${e.action==='message'?'查看原始消息':e.action==='review'?'查看审核记录':'查看关联记录'} →</button></div><div class="profile-event-text">${text}</div></div></article>`;

function dailyChatModel(){
 const grouped=new Map();
 if(state.source==='all'||state.source==='wecom')messages.forEach(m=>{
  const date=dt(m.time);if(state.start&&date<state.start||state.end&&date>state.end)return;
  const c=conversation(m.conversationId);if(!c)return;
  const key=c.employeeId+'|'+c.customerId,groupKey=date+'|'+key;
  if(!grouped.has(groupKey))grouped.set(groupKey,{key,date,employeeId:c.employeeId,customerId:c.customerId,messages:[],conversationIds:[]});
  const pair=grouped.get(groupKey);pair.messages.push(m);if(!pair.conversationIds.includes(c.id))pair.conversationIds.push(c.id);
 });
 const query=state.query.toLowerCase();
 const allPairs=[...grouped.values()].filter(pair=>{
  pair.messages.sort((a,b)=>a.time.localeCompare(b.time)||a.id.localeCompare(b.id));
  const emp=employee(pair.employeeId),cust=customer(pair.customerId);
  const text=[emp.name,emp.id,emp.team,cust.name,cust.id,cust.code,cust.wecom,cust.open,cust.union,...pair.conversationIds.flatMap(id=>{const c=conversation(id);return [c.account,c.accountId,byId(id)?.sourceId];}),...pair.messages.flatMap(m=>[m.id,m.text,m.assetId,m.versionId])].join(' ').toLowerCase();
  return !query||text.includes(query);
 });
 const dates=unique(allPairs.map(p=>p.date)).sort((a,b)=>b.localeCompare(a));
 if(!dates.includes(state.date)){state.date=dates[0]||'';state.archivePrimary=null;state.archivePair=null;}
 const pairs=allPairs.filter(p=>p.date===state.date);
 const primaryKey=state.chatAxis==='sales'?'employeeId':'customerId',peerKey=state.chatAxis==='sales'?'customerId':'employeeId';
 const map=new Map();pairs.forEach(pair=>{const id=pair[primaryKey];if(!map.has(id))map.set(id,{id,pairs:[]});map.get(id).pairs.push(pair);});
 const nameOf=(id,isPrimary)=>((isPrimary?state.chatAxis==='sales':state.chatAxis!=='sales')?employee(id):customer(id)).name;
 const groups=[...map.values()].sort((a,b)=>nameOf(a.id,true).localeCompare(nameOf(b.id,true),'zh-CN'));
 groups.forEach(g=>g.pairs.sort((a,b)=>nameOf(a[peerKey],false).localeCompare(nameOf(b[peerKey],false),'zh-CN')));
 if(state.archivePrimary&&!groups.some(g=>g.id===state.archivePrimary)){state.archivePrimary=null;state.archivePair=null;}
 const selected=pairs.find(p=>p.key===state.archivePair&&p[primaryKey]===state.archivePrimary)||null;
 if(!selected)state.archivePair=null;
 return {allPairs,dates,pairs,groups,selected,primaryKey,peerKey};
}

}
function exportIndex(){
 if(state.page==='sales'&&state.salesProfile){const p=employee(state.salesProfile.id);if(!p)return;saveFile(JSON.stringify({name:'员工结构化档案',page:'sales',exportScope:'当前员工档案',record:salesProfileExport(p.id)},null,2),(p.code||p.id)+'-'+p.name+'-员工档案.json');toast('已导出当前员工的结构化档案。');return;}
 if(state.page==='customers'&&state.customerProfile){const p=customer(state.customerProfile.id);if(!p)return;saveFile(JSON.stringify({name:'客户结构化档案',page:'customers',exportScope:'当前客户档案',record:customerProfileExport(p.id)},null,2),p.code+'-'+p.name+'-客户档案.json');toast('已导出当前客户的脱敏结构化档案。');return;}
 let payload;if(state.page==='board')payload=boardModel();else if(state.page==='product')payload=filteredProducts().map(productExportRecord);else if(state.page==='customers')payload=customerDirectoryExport();else if(state.page==='sales')payload=salesDirectoryExport();else if(state.page==='sources')payload=sources.map(s=>({...s,config:sourceConfig(s.id),recordIds:boardRecords().filter(r=>r.source===s.id).map(r=>r.id)}));else if(state.page==='dates')payload=archiveExportRecords();else payload=getFiltered().map(a=>({id:a.id,title:a.title,type:a.type,format:a.format,source:a.source,sourceRecordId:a.sourceId,time:a.time,status:status(a),relationships:links(a),productReferences:assetProductReferences(a),productSnapshot:a.productSnapshot,product:a.type==='product'?productExportRecord(a):undefined,versions:a.versions?.map(({original,...v})=>v)}));saveFile(JSON.stringify({name:'企业数据资产中心演示索引',page:state.page,exportScope:state.page==='dates'&&state.type==='conversation'?(state.archivePair?'选中对话的当日消息':state.archivePrimary?'选中人员的当日消息':'当前日期的聊天消息'):state.page==='dates'?'当前选中日期':'当前筛选范围',archiveContext:state.page==='dates'&&state.type==='conversation'?{date:state.date,axis:state.chatAxis,primaryId:state.archivePrimary,pairKey:state.archivePair}:undefined,productQuery:state.page==='product'?{...state.productApplied}:undefined,customerQuery:state.page==='customers'?customerDirectoryExportQuery():undefined,salesQuery:state.page==='sales'?{...state.salesApplied,text:redactDirectoryQueryText(state.salesApplied.text)}:undefined,records:payload},null,2),'资产索引-'+state.page+'.json');toast('已导出当前范围的结构化索引。');
}
document.addEventListener('click',event=>{
 const button=event.target.closest('[data-action]');if(!button||button.disabled)return;const {action,id,version,tab,key,chatDate}=button.dataset;
 if(action==='nav')nav(id);
 else if(action==='nav-group'){if(!navGroups.some(g=>g.id===id))return;state.navExpanded[id]=!state.navExpanded[id];renderNav();}
 else if(action==='open-asset')openDetail('asset',id,{versionId:version,tab,chatDate});
 else if(action==='open-customer')openCustomerPage(id,{tab,focusId:button.id||null});
 else if(action==='open-sales')openSalesPage(id,{tab,focusId:button.id||null});
 else if(action==='sales-profile-back')closeSalesPage();
 else if(action==='sales-profile-tab'){if(!state.salesProfile)return;state.salesProfile.tab=id;state.salesProfile.highlight=null;render();requestAnimationFrame(()=>document.querySelector(`[data-action="sales-profile-tab"][data-id="${id}"]`)?.focus({preventScroll:true}));}
 else if(action==='customer-profile-back')closeCustomerPage();
 else if(action==='customer-profile-tab'){if(!state.customerProfile)return;state.customerProfile.tab=id;state.customerProfile.highlight=null;render();requestAnimationFrame(()=>document.querySelector(`[data-action="customer-profile-tab"][data-id="${id}"]`)?.focus({preventScroll:true}));}
 else if(action==='profile-range')setProfileRange(id);
 else if(action==='profile-range-clear')setProfileRange('all','','');
 else if(action==='eval-toggle'){if(event.shiftKey&&evalSelState().anchor)evalRangeTo(id);else evalToggle(id);}
 else if(action==='eval-range')evalRangeTo(id);
 else if(action==='eval-all'){const sel=evalSelState();sel.ids=[...document.querySelectorAll('#customer-record-timeline .profile-event')].map(row=>row.dataset.eventId);updateEvalUI();}
 else if(action==='eval-clear'){const sel=evalSelState();sel.ids=[];sel.anchor=null;updateEvalUI();}
 else if(action==='eval-pack')openEvalDialog();
 else if(action==='eval-close')$('#eval-dialog').close();
 else if(action==='eval-copy'){const preview=$('#eval-preview');if(!preview)return;copyPlainText(preview.textContent).then(ok=>{if(ok){state.evalExports=(state.evalExports||0)+1;updateEvalFoot();toast('评测上下文已复制，可直接粘贴到 agent。');}else toast('浏览器阻止了剪贴板写入，请用「下载 .md」或手动全选复制。');});}
 else if(action==='eval-download'){const preview=$('#eval-preview');if(!preview)return;const p=customer(state.customerProfile?.id);saveFile(preview.textContent,(p?.code||'customer')+'-评测上下文-'+state.evalTarget+'.md','text/markdown;charset=utf-8');state.evalExports=(state.evalExports||0)+1;updateEvalFoot();toast('已下载 Markdown，内容已脱敏。');}
 else if(action==='staff-account')toggleEmployeeAccount(id);
 else if(action==='staff-account-clear')toggleEmployeeAccount(null,true);
 else if(action==='locate-message')locateMessage(id);
 else if(action==='drawer-close')$('#detail').close();
 else if(action==='drawer-back'){const previous=state.stack.pop();if(previous){state.drawer=previous;renderDrawer();}}
 else if(action==='drawer-tab'){state.drawer.tab=id;state.drawer.highlight=null;renderDrawer();}
 else if(action==='select-version'){state.drawer.versionId=id;renderDrawer();}
 else if(action==='thread'){if(state.salesProfile&&state.page==='sales'&&!state.drawer){state.salesProfile.threadId=id;state.salesProfile.highlight=null;render();requestAnimationFrame(()=>document.querySelector(`#sales-profile-content [data-action="thread"][data-id="${id}"]`)?.focus({preventScroll:true}));}else if(state.customerProfile&&!state.drawer){state.customerProfile.threadId=id;state.customerProfile.highlight=null;render();requestAnimationFrame(()=>document.querySelector(`#customer-profile-content [data-action="thread"][data-id="${id}"]`)?.focus({preventScroll:true}));}else if(state.drawer){state.drawer.threadId=id;state.drawer.highlight=null;renderDrawer();}}
 else if(action==='category'){state[key]=id;state.pageNo=1;state.archivePrimary=null;state.archivePair=null;render();}
 else if(action==='product-reset'){state.productDraft=productFilterDefaults();state.productApplied=productFilterDefaults();state.productPage=1;render();$(button.id==='product-empty-reset'?'#product-query':'#product-reset')?.focus({preventScroll:true});}
 else if(action==='product-page'){state.productPage=Math.max(1,Number(id)||1);render();$('#product-page-size')?.focus({preventScroll:true});}
 else if(action==='sales-reset'){salesDirectoryCache=null;salesDirectoryResultCache=null;state.salesDraft=salesFilterDefaults();state.salesApplied=salesFilterDefaults();state.salesPage=1;state.salesExpanded=[];render();$('.sales-table-wrap')?.scrollTo({top:0});}
 else if(action==='sales-accounts'){const index=state.salesExpanded.indexOf(id);if(index<0)state.salesExpanded.push(id);else state.salesExpanded.splice(index,1);render();}
 else if(action==='sales-page'){state.salesPage=Math.max(1,Number(id)||1);state.salesExpanded=[];render();$('.sales-table-wrap')?.scrollTo({top:0});}
 else if(action==='sales-remove'){if(!['text','team','accounts'].includes(key))return;state.salesApplied[key]=key==='text'?'':'all';state.salesDraft[key]=state.salesApplied[key];state.salesPage=1;state.salesExpanded=[];render();$('.sales-table-wrap')?.scrollTo({top:0});}
 else if(action==='directory-reset'){state.directoryDraft=customerFilterDefaults();state.directoryApplied=customerFilterDefaults();state.directoryPage=1;state.directoryError='';render();}
 else if(action==='directory-more'){state.directoryMore=!state.directoryMore;render();}
 else if(action==='directory-remove')removeCustomerDirectoryCondition(key);
 else if(action==='directory-page'){state.directoryPage=Math.max(1,Number(id)||1);render();$('.customer-table-wrap')?.scrollTo({top:0});}
 else if(action==='run-search'){clearTimeout(inputTimer);state.query=$('#filter-query').value.trim();state.pageNo=1;render();}
 else if(action==='toggle-search-filters'){state.moreFilters=!state.moreFilters;render();}
 else if(action==='remove-search-filter'){clearTimeout(inputTimer);if(!['query','type','source','start','end','customerId','salesId','format'].includes(key))return;state[key]=['query','start','end'].includes(key)?'':'all';if(key==='query')$('#global-query').value='';state.pageNo=1;render();}
 else if(action==='reset-filters'){clearTimeout(inputTimer);state.customerId='all';state.salesId='all';state.moreFilters=false;const keepChats=state.page==='dates'&&state.type==='conversation';state.query='';state.type=keepChats?'conversation':'all';state.format='all';state.source='all';state.start='';state.end='';state.pageNo=1;state.archivePrimary=null;state.archivePair=null;$('#global-query').value='';render();}
 else if(action==='layout'){state.layout=id;state.pageNo=1;render();}
 else if(action==='page'){state.pageNo=Number(id);render();}
 else if(action==='date'){state.date=id;state.archivePrimary=null;state.archivePair=null;render();}
 else if(action==='archive-axis'){if(!['sales','customers'].includes(id))return;state.chatAxis=id;state.archivePrimary=null;state.archivePair=null;render();}
 else if(action==='archive-primary'){state.archivePrimary=state.archivePrimary===id?null:id;state.archivePair=null;render();}
 else if(action==='archive-peer'){const model=dailyChatModel();if(!model.pairs.some(p=>p.key===id&&p[model.primaryKey]===state.archivePrimary))return;state.archivePair=id;render();if(innerWidth<=620)requestAnimationFrame(()=>$('#archive-chat-detail')?.scrollIntoView({block:'start',behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'instant':'smooth'}));}
 else if(action==='source-assets'){nav('all');state.source=id;render();}
 else if(action==='board-range'){if(!['7','30'].includes(id))return;state.boardRange=id;render();}

 else if(action==='board-list')openBoardList(id);
 else if(action==='board-close')$('#board-detail').close();
 else if(action==='board-list-page'){boardListPage+=Number(id);openBoardList(boardActiveList,false);}
 else if(action==='board-record')boardOpenRecord(Number(id),key);
 else if(action==='board-list-export')saveFile(JSON.stringify(boardResolveList(boardActiveList),null,2),'看板明细.json');
 else if(action==='board-dimension'){if(['team','product','channel'].includes(id)){state.boardDimension=id;render();}}
 else if(action==='source-config')openSourceConfig(id);
 else if(action==='source-close')$('#source-dialog').close();
 else if(action==='source-run')openSourceRun(id);
 else if(action==='source-check')runSourceSimulation(id,'check');
 else if(action==='source-sync')runSourceSimulation(id,'sync');
 else if(action==='source-logs')openSourceLogs(id);
 else if(action==='source-toggle')sourceToggle(id);
 else if(action==='source-log-export')saveFile(JSON.stringify({source:id,...sourceConfig(id)},null,2),'接口模拟日志-'+id+'.json');
 else if(action==='export')exportIndex();
 else if(action==='download-product'){const p=byId(id);if(p?.type==='product')saveFile(JSON.stringify(productExportRecord(p),null,2),p.sourceId+'-商品档案.json');}
 else if(action==='download-original')downloadOriginal(id).catch(()=>toast('原件读取失败，请检查本地文件是否完整。'));
 else if(action==='download-extract'){const a=byId(id),v=getVersion(a,state.drawer?.versionId);saveFile(JSON.stringify({assetId:a.id,sourceId:a.sourceId,version:v?.label||'来源快照',processingState:a.extractionState||'demo',content:extractedText(a,v),description:contentDescription(a,v),sourceFields:a.fields||{},productReferences:assetProductReferences(a),productSnapshot:a.productSnapshot},null,2),a.title+'-结构化内容.json');}
});
let inputTimer,composingInput=null;
function scheduleQuery(target){clearTimeout(inputTimer);if(state.page==='sales'){state.salesDraft.text=target.value;updateSalesDirty();return;}if(state.page==='customers'){state.directoryDraft.text=target.value;updateDirectoryDirty();return;}state.query=target.value;state.pageNo=1;inputTimer=setTimeout(render,180);}
document.addEventListener('compositionstart',event=>{if(event.target.dataset.filter==='query'){clearTimeout(inputTimer);composingInput=event.target;}});
document.addEventListener('compositionend',event=>{if(event.target===composingInput){composingInput=null;if(event.target.isConnected)scheduleQuery(event.target);}});
document.addEventListener('input',event=>{if(event.target.dataset.productFilter){state.productDraft[event.target.dataset.productFilter]=event.target.value;updateProductDirty();return;}if(event.target.dataset.filter==='query'){clearTimeout(inputTimer);if(event.isComposing||composingInput===event.target)return;scheduleQuery(event.target);}});
document.addEventListener('change',event=>{
 const target=event.target;
 if(target.dataset.productFilter){state.productDraft[target.dataset.productFilter]=target.value;updateProductDirty();}
 else if(target.id==='product-page-size'){state.productSize=Number(target.value);state.productPage=1;render();$('#product-page-size')?.focus({preventScroll:true});}
 else if(target.dataset.salesFilter){const key=target.dataset.salesFilter;if(Object.hasOwn(state.salesDraft,key)){state.salesDraft[key]=target.value;updateSalesDirty();}}
  else if(target.id==='sales-page-size'){state.salesSize=Number(target.value);state.salesPage=1;state.salesExpanded=[];render();$('.sales-table-wrap')?.scrollTo({top:0});}
  else if(target.dataset.customerFilter){const key=target.dataset.customerFilter;if(Object.hasOwn(state.directoryDraft,key)){state.directoryDraft[key]=target.value;updateDirectoryDirty();}}
  else if(target.id==='directory-page-size'){state.directorySize=Number(target.value);state.directoryPage=1;render();}
  else if(target.dataset.filter&&target.dataset.filter!=='query'){clearTimeout(inputTimer);state[target.dataset.filter]=target.value;state.pageNo=1;render();}
 else if(target.id==='source-auth')$('#source-client-label').hidden=target.value!=='client';
 else if(target.id==='profile-start'||target.id==='profile-end'){const id=target.id;setProfileRange('custom',id==='profile-start'?target.value:state.profileStart,id==='profile-end'?target.value:state.profileEnd);requestAnimationFrame(()=>$('#'+id)?.focus({preventScroll:true}));}
 else if(target.id==='eval-target'){state.evalTarget=target.value;refreshEvalPack();}
 else if(target.id==='eval-blind'){state.evalBlind=target.checked;refreshEvalPack();}
 else if(target.id==='eval-pad'){state.evalPad=target.checked;refreshEvalPack();}
 else if(target.id==='mobile-nav')nav(target.value);
 else if(target.dataset.control==='version'){state.drawer.versionId=target.value;renderDrawer();}
});
document.addEventListener('keydown',event=>{if(event.isComposing||event.keyCode===229)return;if(event.target.id==='filter-query'&&event.key==='Enter'){event.preventDefault();if(state.page==='sales'){state.salesDraft.text=event.target.value;applySalesDirectory();return;}if(state.page==='customers'){state.directoryDraft.text=event.target.value;applyCustomerDirectory();return;}clearTimeout(inputTimer);state.query=event.target.value.trim();state.pageNo=1;render();}else if(event.target.id==='global-query'&&event.key==='Enter'){const query=event.target.value;clearTimeout(inputTimer);nav('all');state.query=query;$('#global-query').value=query;render();}});
document.addEventListener('submit',event=>{if(event.target.id==='product-directory-form'){event.preventDefault();state.productApplied={...state.productDraft,text:state.productDraft.text.trim()};state.productPage=1;render();$('#product-submit')?.focus({preventScroll:true});}else if(event.target.id==='sales-directory-form'){event.preventDefault();applySalesDirectory();}else if(event.target.id==='customer-directory-form'){event.preventDefault();applyCustomerDirectory();}else if(event.target.id==='source-config-form'){event.preventDefault();saveSourceConfig(event.target);}});
$('#detail').addEventListener('close',()=>{if($('#detail').open)return;$('#detail').querySelectorAll('audio,video').forEach(media=>media.pause());if(preserveDrawerOnCustomerNavigation){preserveDrawerOnCustomerNavigation=false;$('#detail').innerHTML='';return;}state.drawer=null;state.stack=[];$('#detail').innerHTML='';});
$('#detail').addEventListener('click',event=>{if(event.target===$('#detail')){const rect=$('#detail').getBoundingClientRect();if(event.clientX<rect.left)$('#detail').close();}});
for(const id of ['board-detail','source-dialog'])document.getElementById(id).addEventListener('click',event=>{const d=event.currentTarget;if(event.target===d){const r=d.getBoundingClientRect();if(event.clientX<r.left)d.close();}});
window.AssetDemo={getData:()=>({assets,customers,employees,conversations,messages,reviews,liveActions,sources}),getState:()=>({...state}),links,usages,allEvents,openDetail,openCustomerPage,openSalesPage,nav};
function boot(){render();window.assetDemoReady=true;}
boot();
