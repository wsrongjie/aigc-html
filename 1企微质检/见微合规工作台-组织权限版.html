        <div class="result-kpis">${resultKpis}</div>

        ${keyIssueCards(keyIssues)}
        <div class="section-label lead-layer-label">汇总概览<span class="subtext">趋势、对象、结构、重复与覆盖</span></div>
        <div class="report-grid secondary summary-grid">
          <section class="panel summary-half">${trendPanel(trend, current)}</section>
          <section class="panel top-panel summary-half">
            <div class="panel-heading"><h2>Top 5 风险对象</h2><span class="small muted">按确认数排序</span></div>
            <div class="panel-body">${top}</div>
          </section>
          <section class="panel summary-third">
            <div class="panel-heading"><h2>风险等级分布</h2><span class="small muted">含人工驳回</span></div>
            <div class="panel-body">${levelPie(levels, summary.hits)}</div>
          </section>
          <section class="panel summary-third">
            <div class="panel-heading"><h2>处置漏斗</h2><span class="small muted">各环节转化</span></div>
            <div class="panel-body">${funnel(summary)}</div>
          </section>
          <section class="panel summary-third">
            <div class="panel-heading"><h2>风险类型分布</h2><span class="small muted">按规则分类</span></div>
            <div class="panel-body">${categoryChart(categories)}<p class="panel-foot">蓝色为人工确认、灰色为误报驳回，按命中条数排序。</p></div>
          </section>
          <section class="panel summary-third">
            <div class="panel-heading"><h2>团队风险密度</h2><span class="small muted">每千条会话</span></div>
            <div class="panel-body">${densityChart(departments.map(row => ({ name: row.name, value: row.density, title: `${row.name}：每千条会话命中 ${row.density.toFixed(2)}‰ · 命中 ${row.hits} 条 / 约 ${number(row.sessions)} 条会话` })))}<p class="panel-foot">按会话量归一化，避免人多就显示问题多。会话量按团队占比估算。</p></div>
          </section>
          <section class="panel summary-third">
            <div class="panel-heading"><h2>重复违规</h2><span class="small muted">同人同规则再犯</span></div>
            <div class="panel-body">${repeatPanel(summary, repeatTop)}<p class="panel-foot">再犯指同一员工在同一规则上被再次确认；名单可点击跳转该员工相关风险。</p></div>
          </section>
          <section class="panel summary-third">
            <div class="panel-heading"><h2>业务量与覆盖</h2><span class="small muted">已归档会话</span></div>
            <div class="panel-body">
              <div class="volume-stats"><span><b>${number(summary.archived)}</b>本期会话</span><span><b>${number(summary.scanned)}</b>已质检</span><span><b>${percent(summary.coverage)}</b>覆盖率</span></div>
              <div class="cat-legend"><span class="legend-item"><i class="legend-dot" style="background:#2c5bd8"></i>已质检</span><span class="legend-item"><i class="legend-dot" style="background:#aab8cc"></i>会话量</span></div>
              ${volumeChart(volume)}
              <p class="panel-foot">会话量按已归档口径，${current.days.length <= 31 ? '按天' : '按周'}聚合；悬停蓝点可见逐期明细。</p>
            </div>
          </section>
        </div>

        <div class="section-label lead-layer-label">问题与团队详情<span class="subtext">问题清单、团队责任与行动跟踪</span></div>
        ${issueTable(issueRows)}
        ${teamCompareTable(teamRows, current)}
        ${solutionTable(solutions)}

        <p class="report-foot">
          口径：统计范围为时间窗内<strong>已归档会话</strong>；红线暂按承诺类 + 材料类演示，待客户合规确认；AI 提示为规则命中条数，人工确认为判定成立条数，两者之差为误报，<strong>不等同准确率</strong>；涉及员工按确认违规员工姓名去重；涉及客户按客户标识去重；超过 30 天未闭环按确认日期计算；投诉、纠纷、监管事件与客户损失金额尚未接入。风险复核页的 10 条事件是同一批会话中已展开的可复核样例，本页只做聚合、不参与处置。本页为虚构演示数据，不代表客户实测口径或业务效果。
        </p>`;
    }

    function handleAction(dataset) {
      if (dataset.action === 'overview-export') { window.print(); return true; }
      if (dataset.action === 'overview-issue') { openIssue(dataset.rule); return true; }
      if (dataset.action === 'overview-top') { topTab = dataset.tab === 'departments' ? 'departments' : 'people'; render(); return true; }
      if (dataset.action !== 'overview-preset') return false;
      const days = Number(dataset.days);
      const preset = PRESETS.find(item => item.days === days);
      if (!preset) return true;
      if (preset.offset) range = { from: dayBefore(lastDate, preset.offset), to: dayBefore(lastDate, preset.offset) };
      else range = { from: dayBefore(lastDate, days - 1), to: lastDate };
      render();
      return true;
    }
    function change(target) {
      if (!target.dataset.overviewDate) return false;
      if (!target.value) return true;
      range[target.dataset.overviewDate] = target.value;
      clampRange();
      render();
      return true;
    }

    return { render, handleAction, change, reset: () => { range = { from: dayBefore(lastDate, 6), to: lastDate }; topTab = 'people'; } };
  };
})();

/* ===== conversation-archive.js ===== */
/* 会话档案：企业全体员工的客户会话存档浏览器。
 * 三层结构：客户 → 会话片段 → 消息；风险提示只读展示，不做任何处置。
 * 支持按组织、员工、客户、时间、有无违规筛选，并在详情内切换同一客户的不同时期与对接员工。
 */
(() => {
  'use strict';

  const DAY = 86400000;
  const PAGE_SIZE = 20;
  const STEP = 30;
  const RANGES = [['all', '全部时间'], ['7', '近 7 天'], ['30', '近 30 天'], ['90', '近 90 天'], ['custom', '自定义区间']];
  const VERDICT = { null: '待复核', true: '人工已确认', false: '人工驳回误报', unreviewed: '未经人工确认' };
  const VERDICT_TONE = { null: 'amber', true: 'green', false: 'subtle', unreviewed: 'subtle' };

  window.createConversationArchive = env => {
    const { esc, icon, levelBadge, statusBadge } = env;
    const data = window.ConversationArchive;
    function hitsOf(session) {
      return session.violations.flatMap(hit => {
        const linked = env.getCases().filter(c => c.sourceSessionId === session.id && c.evidenceId === hit.messageId);
        return linked.length ? linked.map(c => ({ ...hit, rules: c.rules, level: c.level, status: c.status, humanConfirmed: c.requiresReview ? QualityTasks.decision(c) : 'unreviewed', caseId: c.id, planName: env.getTaskName(c.planId) })) : [hit];
      });
    }
    const clientById = new Map(data.clients.map(client => [client.id, client]));
    const clientOf = session => clientById.get(session.clientId);
    const pageOf = { current: 1 };
    let filter = { dept: '', employee: '', client: '', range: 'all', from: '', to: '', risk: '' };
    let query = '';
    let selectedId = null;
    let visible = STEP;

    const shortTime = text => `${Number(text.slice(5, 7))}/${Number(text.slice(8, 10))}`;
    const number = value => value.toLocaleString('zh-CN');
    const rangeStart = date => Date.parse(`${date}T00:00:00+08:00`);

    function reset() {
      filter = { dept: '', employee: '', client: '', range: 'all', from: '', to: '', risk: '' };
      query = '';
      selectedId = null;
      visible = STEP;
      pageOf.current = 1;
    }

    /* ---------- 筛选 ---------- */
    function bounds() {
      if (filter.range === 'custom') {
        const parse = value => value ? Date.parse(value + '+08:00') : null;
        const start = parse(filter.from), stop = parse(filter.to);
        if (start !== null && stop !== null && start > stop) return { from: stop, to: start };
        return { from: start === null ? -Infinity : start, to: stop === null ? Infinity : stop };
      }
      if (filter.range === 'all') return { from: -Infinity, to: Infinity };
      return { from: rangeStart(data.range.to) - (Number(filter.range) - 1) * DAY, to: Infinity };
    }

    function filtered() {
      const { from, to } = bounds();
      const text = query.trim().toLowerCase();
      return data.sessions
        .filter(session => {
          if (filter.dept && session.dept !== filter.dept) return false;
          if (filter.employee && session.employee !== filter.employee) return false;
          if (filter.client && session.clientId !== filter.client) return false;
          if (data.sessionStart(session) < from || data.sessionStart(session) > to) return false;
          const hits = hitsOf(session);
          if (filter.risk === 'yes' && !hits.length) return false;
          if (filter.risk === 'no' && hits.length) return false;
          if (filter.risk === 'confirmed' && !hits.some(h => h.humanConfirmed === true)) return false;
          if (filter.risk === 'rejected' && !hits.some(h => h.humanConfirmed === false)) return false;
          if (filter.risk === 'pending' && !hits.some(h => h.humanConfirmed === null)) return false;
          if (text) {
            const client = clientOf(session);
            const haystack = `${client.name} ${client.customerId} ${session.employee} ${session.dept} ${session.messages.map(message => message.text).join(' ')}`.toLowerCase();
            if (!haystack.includes(text)) return false;
          }
          return true;
        })
        .sort((a, b) => `${b.date} ${b.endTime || b.messages.at(-1)?.time || ''}`.localeCompare(`${a.date} ${a.endTime || a.messages.at(-1)?.time || ''}`) || a.id.localeCompare(b.id));
    }

    function selectOptions(rows, value, placeholder) {
      return `<option value="">${placeholder}</option>${rows.map(row => `<option value="${esc(row.value)}" ${row.value === value ? 'selected' : ''}>${esc(row.label)}</option>`).join('')}`;
    }

    function filterBar() {
      const employees = filter.dept ? data.EMPLOYEES.filter(row => row.dept === filter.dept) : data.EMPLOYEES;
      const clients = [...data.clients].sort((a, b) => a.name.localeCompare(b.name, 'zh-CN'));
      const rangeSelect = `<select data-archive-filter="range" aria-label="筛选会话时间">${RANGES.map(([value, label]) => `<option value="${value}" ${filter.range === value ? 'selected' : ''}>${label}</option>`).join('')}</select>`;
      const deptOptions = [...new Set([...data.DEPARTMENTS.map(row => row.name), ...data.sessions.map(session => session.dept)])].sort();
      const custom = filter.range === 'custom'
        ? `<input type="datetime-local" step="1" data-archive-filter="from" aria-label="起始时间" value="${esc(filter.from)}" max="${data.range.to}T23:59:59"><input type="datetime-local" step="1" data-archive-filter="to" aria-label="结束时间" value="${esc(filter.to)}" max="${data.range.to}T23:59:59">`
        : '';
      return `<div class="filters archive-filters">
        <select data-archive-filter="dept" aria-label="按组织筛选">${selectOptions(deptOptions.map(name => ({ value: name, label: name })), filter.dept, '全部组织')}</select>
        <select data-archive-filter="employee" aria-label="按员工筛选">${selectOptions(employees.map(row => ({ value: row.name, label: `${row.name} · ${row.dept}` })), filter.employee, '全部员工')}</select>
        <select data-archive-filter="client" aria-label="按客户筛选">${selectOptions(clients.map(row => ({ value: row.id, label: `${row.name} · ${row.customerId}` })), filter.client, '全部客户')}</select>
        ${rangeSelect}${custom}
        <select data-archive-filter="risk" aria-label="按是否命中筛选"><option value="">全部会话</option><option value="yes" ${filter.risk === 'yes' ? 'selected' : ''}>有风险提示</option><option value="no" ${filter.risk === 'no' ? 'selected' : ''}>未命中风险</option><option value="pending" ${filter.risk === 'pending' ? 'selected' : ''}>待人工复核</option><option value="confirmed" ${filter.risk === 'confirmed' ? 'selected' : ''}>人工确认风险</option><option value="rejected" ${filter.risk === 'rejected' ? 'selected' : ''}>人工已驳回</option></select>

    if (!name || !content) { document.getElementById('form-error').textContent = '规则名称和内容不能为空。'; return; }
    let knowledgeIds;
    try { knowledgeIds = QualityConfig.validateLinks(config, data.getAll('knowledgeIds'), r.knowledgeIds || []); }
    catch (error) { document.getElementById('form-error').textContent = error.message; return; }
    r.name = name; r.content = content; r.level = String(data.get('level')); r.enabled = data.get('enabled') === 'true';
    r.knowledgeIds = knowledgeIds;
    const version = Number(r.version.split('.').at(-1)) || 0;
    r.version = `${r.version.split('.')[0]}.${version + 1}`;
    commitConfig('更新基础规则', `${r.name} / v${r.version}，关联 ${knowledgeIds.length} 条知识。历史命中快照不变。`, true);
  }
  function mediaModal(id) {
    const c = cases.find(x => x.id === id);
    const m = c.messages.find(x => x.id === c.evidenceId);
    if (m.type === 'image' && m.file) openModal('图片原件 · 虚构样例', `<div class="modal-body"><img class="modal-image" src="${m.file}" alt="虚构营销材料大图，含稳赚不赔用语"><p class="modal-image-caption">${m.id} · ${c.date} ${m.time}<br>本地制作的虚构图片，不是客户原始材料。</p></div>`, '', true);
    else openModal(`${MEDIA[m.type]}证据 · 原件未接入`, `<div class="modal-body"><div class="notice warning">此样例没有可核对的原始${MEDIA[m.type]}。提取内容均为虚构演示，不能替代原件核对。</div><div class="h5-section"><h3>提取片段 ${esc(m.timecode || '时间码未留存')}</h3><p>${esc(m.text)}</p></div><div class="proof-details">原消息：${m.id}<br>原件名称：${esc(m.filename)}<br>提取记录：${esc(m.extraction)}</div></div>`);
  }
  async function copyReply() {
    const text = document.getElementById('suggested-reply')?.value.trim() || '';
    if (!text) { toast('请先填写建议回复。'); return; }
    try { await navigator.clipboard.writeText(text); toast('建议已复制，请在原生企微中核对后自行操作。'); }
    catch { const area = document.getElementById('suggested-reply'); area?.focus(); area?.select(); toast('浏览器未允许自动复制，已选中文字，请手动复制。'); }
  }
  document.addEventListener('click', event => {
    if (event.target.closest('.skip-link')) { event.preventDefault(); main.focus(); main.scrollIntoView({ block: 'start' }); return; }
    const button = event.target.closest('[data-action]');
    if (!button || button.disabled) return;
    const { action, id, kind } = button.dataset;
    if (!access.allowed(button.dataset)) { toast('当前角色没有此页面或操作权限。'); return; }
    pendingPermission = access.requirement(button.dataset).permission || '';
    if (action.startsWith('access-')) { access.handleAction(button.dataset); return; }
    if (action.startsWith('task-')) { taskAction(button.dataset); return; }
    if (action.startsWith('h5-')) { employee.handleAction(button.dataset); return; }
    if (action.startsWith('basis-')) { basis.handleAction(button.dataset); return; }
    if (action.startsWith('admin-')) { admin.handleAction(button.dataset); return; }
    if (action.startsWith('asset-')) { assets.handleAction(button.dataset); return; }
    if (action.startsWith('archive-')) { archive.handleAction(button.dataset); return; }
    if (action === 'overview-cases') { if (modal.open) closeModal(); filters = { query: button.dataset.employee || '', dept: button.dataset.dept || '', level: button.dataset.level || '', status: button.dataset.status || '', date: '', planId: '' }; selectedId = null; rightTab = 'analysis'; navigate('review'); return; }
    if (action.startsWith('overview-')) { report.handleAction(button.dataset); return; }
    if (action === 'navigate') navigate(button.dataset.view);
    if (action === 'select-case') { selectedId = id; rightTab = 'analysis'; syncHash(); render(); }
    if (action === 'clear-filters') { filters = { query: '', dept: '', level: '', status: '', date: '', planId: '' }; render(); }
    if (action === 'case-prev') moveCase(-1);
    if (action === 'case-next') moveCase(1);
    if (action === 'fill-reason') {
      const area = document.getElementById('workflow-note');
      if (!area) return;
      const text = button.dataset.text || '';
      const current = area.value.trim();
      area.value = current ? `${current}；${text}` : text;
      area.focus();
      area.selectionStart = area.selectionEnd = area.value.length;
      return;
    }
    if (action === 'undo-last') {
      if (!lastWorkflow) { toast('没有可撤销的处置。'); return; }
      const targetCase = cases.find(c => c.id === lastWorkflow.id);
      if (!targetCase) { lastWorkflow = null; toast('原事件已不存在。'); return; }
      Object.assign(targetCase, { status: lastWorkflow.before.status, owner: lastWorkflow.before.owner, deadline: lastWorkflow.before.deadline, history: lastWorkflow.before.history });
      selectedId = lastWorkflow.id; rightTab = 'analysis'; lastWorkflow = null;
      const saved = save(); syncHash(); render();
      if (saved) toast('已撤销上一步处置。');
      return;
    }
    if (action === 'right-tab') { rightTab = button.dataset.tab; render(); }
    if (action === 'locate') {
      if (modal.open) closeModal();
      const c = cases.find(x => x.id === id); const target = document.getElementById(`message-${c.evidenceId}`);
      target?.scrollIntoView({ block: 'center', behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'instant' : 'smooth' });
      target?.classList.remove('flash'); requestAnimationFrame(() => target?.classList.add('flash'));
    }
    if (action === 'workflow') openWorkflow(id, kind);
    if (action === 'close-modal') closeModal();
    if (action === 'media') mediaModal(id);
    if (action === 'customer') {
      const c = cases.find(x => x.id === id);
      openModal('客户资料 · 虚构样例', `<div class="modal-body"><div class="table-name"><span class="avatar customer">${c.customer[0]}</span><h3>${c.customer}</h3></div><div class="h5-section"><div class="context-kv"><b>客户标识</b>${c.customerId}</div><div class="context-kv"><b>服务员工</b>${c.employee} / ${c.dept}</div><div class="context-kv"><b>客户阶段</b>咨询中 · 演示字段</div><div class="context-kv"><b>资产与持仓</b>未接入</div></div><div class="notice">实际 CRM 关系、客户阶段、字段权限与授权范围待调研确认。</div></div>`);
    }
    if (action === 'open-case') { filters = { query: '', dept: '', level: '', status: '', date: '', planId: '' }; selectedId = id; rightTab = 'analysis'; navigate('review', id); }
    if (action === 'employee-cases') { filters = { query: button.dataset.name, dept: '', level: '', status: '', date: '', planId: '' }; navigate('review'); }
    if (action === 'org-filter') { orgDept = button.dataset.dept; render(); }
    if (action === 'edit-rule') openRule(id);
    if (action === 'focus-assistant') employee.focusReply();
    if (action === 'copy-reply') copyReply();
    if (action === 'share-demo') {
      const text = document.getElementById('suggested-reply')?.value.trim() || '';
      if (!text) { toast('请先填写推荐话术。'); return; }
      openModal('手动发送推荐话术', `<div class="modal-body"><div class="notice warning">本页仅说明操作步骤，不会向客户发送消息。</div><div class="h5-section"><h3>1. 核对内容与客户</h3><p>目标：${esc(DEMO.cases[0].customer)}（虚构客户）。请结合正式服务资料和客户实际情况核对下方内容，确认没有确定性承诺。</p><div class="evidence-quote" style="margin-top:12px">${esc(text)}</div></div><div class="h5-section"><h3>2. 复制后回到原生聊天</h3><p>由员工自行粘贴、按客户情况修改并手动发送。助手不会代替你发送，也不会读取你正在编辑的内容。</p></div><div class="h5-section"><h3>3. 核对客户端实际结果</h3><p>复制或粘贴成功不代表消息已发送；请以原生客户端的实际会话为准。</p></div></div>`, '<div class="modal-actions"><button class="button primary" data-action="close-modal">已了解，返回核对</button></div>');
    }
    if (action === 'guide') openModal('现场演示指引', '<div class="modal-body"><p>建议先选择第一条高风险事件，点击“定位证据”，回看员工与客户的完整语境。</p><div class="h5-section"><h3>走一遍复核闭环</h3><p>确认风险 → 分配整改 → 提交反馈 → 人工验收 → 归档。每一步填写依据，处理轨迹会持续保留。</p></div><div class="h5-section"><h3>再看两个边界</h3><p>“否定承诺语境”可演示驳回误报；语音与视频样例缺少原件，需先补证，不能确认违规。</p></div><div class="h5-section"><h3>第二阶段话术助手</h3><p>左下角进入员工助手，它不做实时质检也不推送告警，只在员工点击“获取推荐回复”后给出预设话术，员工核对、编辑、复制后回原生聊天发送。</p></div><div class="notice">全部为虚构数据。本机保存不代表生产留痕、权限、模型或企微接口已经实现。</div></div>');
    if (action === 'reset') openModal('重置本地演示', '<div class="modal-body"><p>将清除本原型保存的质检计划、处置操作、方案、规则及知识修改，恢复初始虚构样例。主动上传的素材单独保留，如需删除请进入资产管理操作。</p></div>', '<div class="modal-actions"><button class="button" data-action="close-modal">取消</button><button class="button danger" data-action="confirm-reset">重置为初始样例</button></div>');
    if (action === 'confirm-reset') {
      closeTaskDrawer(true,false); taskListPosition = { top: 0, left: 0 };
      cases = clone(DEMO.cases); rules = clone(DEMO.rules); config = clone(initialConfig); tasks = QualityTasks.initial(cases,ConversationArchive,config); selectedTaskId = null; taskQuery = ''; taskStatus = ''; taskResultPage = 1; taskResultFilter = {kind:'',value:''}; admin.reset(); employee.reset(); report.reset(); archive.reset(); selectedId = cases[0].id; filters = { query: '', dept: '', level: '', status: '', date: '', planId: '' }; rightTab = 'analysis'; orgDept = ''; pageQuery = '';
      access.syncConfig(); assets.reset(); planDemoVersion = 0; addDemoPlans(); const saved = save(); closeModal(); render(); if (saved) toast('已恢复初始演示样例，主动上传素材已保留。');
    }
  });
  document.addEventListener('submit', event => {
    if (event.target.id === 'access-form') { event.preventDefault(); access.submit(event.target); return; }
    const required = event.target.id === 'asset-upload-form' ? 'assets.upload' : event.target.id === 'asset-edit-form' ? 'assets.edit' : modalContext?.type === 'task' ? modalContext.permission : modalContext?.type === 'workflow' ? access.workflowPermission(modalContext.kind) : modalContext?.type === 'rule' ? 'rules.edit' : modalContext?.type === 'admin' ? modalContext.permission : '';
    if (['asset-upload-form','asset-edit-form','action-form'].includes(event.target.id) && (!required || !access.requirePermission(required))) { event.preventDefault(); return; }
    if (event.target.id === 'asset-upload-form') { event.preventDefault(); assets.submitUpload(); return; }
    if (event.target.id === 'asset-edit-form') { event.preventDefault(); assets.submitEdit(); return; }
    if (event.target.id !== 'action-form') return;
    event.preventDefault();
    if (modalContext?.type === 'task') submitTask(event.target);
    if (modalContext?.type === 'workflow') submitWorkflow(event.target);
    if (modalContext?.type === 'rule') submitRule(event.target);
    if (modalContext?.type === 'admin') admin.submit(event.target);
  });
  function updateSearch(event) {
    const target = event.target;
    if (target.hasAttribute('data-access-search')) { if (!event.isComposing) access.input(target); return; }
    if (target.hasAttribute('data-asset-search') || target.hasAttribute('data-asset-draft-name') || target.id === 'asset-upload-tags') { if (!event.isComposing) assets.input(target); return; }
    if (modalContext?.type === 'task' && target.closest('#action-form')) {
      // 团队点击先由 change 同步员工，再回算团队状态，避免 input 覆盖本次勾选。
      if (!target.hasAttribute('data-task-team')) updateTaskForm();
      return;
    }
    if (target.matches('[data-task-search]')) { if (event.isComposing) return; const pos = target.selectionStart; taskQuery = target.value; render(); const fresh = document.getElementById('task-search'); fresh?.focus(); fresh?.setSelectionRange(pos,pos); return; }
    if (target.matches && target.matches('[data-archive-search]')) {
      if (event.isComposing) return;
      const position = target.selectionStart;
      const id = target.id;
      archive.setQuery(target.value);
      const fresh = document.getElementById(id);
      fresh?.focus(); fresh?.setSelectionRange(position, position);
      return;
    }
    if (target.matches('[data-filter="query"], [data-page-search]')) {
      if (event.isComposing) return;
      const position = target.selectionStart;
      const id = target.id;
      if (target.hasAttribute('data-page-search')) pageQuery = target.value;
      else filters.query = target.value;
      render();
      const fresh = document.getElementById(id);
      fresh?.focus(); fresh?.setSelectionRange(position, position);
    }
    if (target.id === 'suggested-reply') employee.editReply(target.value);
  }
  document.addEventListener('input', updateSearch);
  document.addEventListener('compositionend', updateSearch);
  document.addEventListener('keydown', event => {
    if (event.defaultPrevented || event.metaKey || event.ctrlKey || event.altKey) return;
    if (modal.open || taskDrawer.open) return;
    if (view !== 'review') return;
    const target = event.target;
    if (target && target.closest && target.closest('input,textarea,select,[contenteditable="true"]')) return;
    if (event.key === 'ArrowDown' || event.key === 'j' || event.key === 'J') { event.preventDefault(); moveCase(1); }
    if (event.key === 'ArrowUp' || event.key === 'k' || event.key === 'K') { event.preventDefault(); moveCase(-1); }
  });
  document.addEventListener('change', event => {
    const target = event.target;
    if (target.dataset.accessPage || target.dataset.accessFilter) { access.change(target); return; }
    if (target.hasAttribute('data-asset-files') || target.dataset.assetFilter) { assets.change(target); return; }
    if (target.dataset.overviewDate) { report.change(target); return; }
    if (target.hasAttribute('data-task-team')) { document.querySelectorAll('[data-task-member]').forEach(m => { if (m.dataset.taskMember === target.dataset.taskTeam) m.checked = target.checked; }); }
    if (modalContext?.type === 'task' && target.closest('#action-form')) { updateTaskForm(); return; }
    if (target.hasAttribute('data-task-status')) { taskStatus = target.value; render(); return; }
    if (target.matches('[data-queue-sort]')) { queueSort = target.value; render(); return; }
    if (event.target.matches('select[data-filter]')) { filters[event.target.dataset.filter] = event.target.value; render(); } if (event.target.dataset.adminFilter) admin.change(event.target); if (event.target.dataset.archiveFilter) archive.change(event.target); });
  window.addEventListener('hashchange', () => {
    const parts = location.hash.slice(1).split('/');
    const next = VIEWS[parts[0]] ? parts[0] : 'overview';
    const id = parts[1] ? decodeURIComponent(parts[1]) : '';
    if (next === 'plans') selectedTaskId = id && tasks.some(t => t.id === id) ? id : null;
    if (next === 'review' && id && cases.some(c => c.id === id)) selectedId = id;
    view = next;
    pageQuery = '';
    render();
  });
  restore();
  access.init();
  const accessObserver = new MutationObserver(() => access.decorate());
  accessObserver.observe(document.body,{childList:true,subtree:true});
  addDemoPlans();
  if (deepCaseId && cases.some(c => c.id === deepCaseId)) selectedId = deepCaseId;
  else if (deepCaseId) history.replaceState(null, '', '#review');
  if (deepTaskId && tasks.some(t => t.id === deepTaskId)) selectedTaskId = deepTaskId;
  else if (deepTaskId) history.replaceState(null, '', '#plans');
  render();
  tickTasks();
  taskTimer = setInterval(tickTasks,1200);
  window.addEventListener('pagehide',() => { clearInterval(taskTimer); taskTimer = null; });
  window.addEventListener('pageshow',() => { if (!taskTimer) { tickTasks(); taskTimer = setInterval(tickTasks,1200); } });
})();
  </script>
