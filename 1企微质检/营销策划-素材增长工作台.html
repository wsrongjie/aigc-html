function aggregate(events){const clients=new Set(),replies=new Set(),engaged=new Set(),paid=new Set(),paid3=new Set(),staff=new Set(),orderIds=new Set(),mats=new Set();for(const t of events){clients.add(t.customerId);staff.add(t.salesId);mats.add(t.materialId);if(t.reply)replies.add(t.customerId);if(t.engage)engaged.add(t.customerId);if(t.orderId){orderIds.add(t.orderId);paid.add(t.customerId);const o=orderById.get(t.orderId);if(o&&o.paidAt<=t.ts+3*DAY)paid3.add(t.customerId)}}const refunded=orders.filter(o=>orderIds.has(o.id)&&o.refunded).length;return{n:events.length,customers:clients.size,replies:replies.size,engaged:engaged.size,paid:paid.size,paid3:paid3.size,sales:staff.size,materials:mats.size,orders:orderIds.size,refunded,replyRate:clients.size?replies.size/clients.size:0,paidRate:clients.size?paid.size/clients.size:0,paid3Rate:clients.size?paid3.size/clients.size:0,engageRate:clients.size?engaged.size/clients.size:0}}

function ranked(){return rows().filter(r=>(r.m.title+r.m.id+r.m.topic+(r.m.source?.file||'')).toLowerCase().includes(state.q.toLowerCase())&&(state.format==='全部形式'||r.m.format===state.format)).sort((a,b)=>{const va=state.sort==='paid'?a.s.paidRate:state.sort==='paid3'?a.s.paid3Rate:state.sort==='use'?a.s.n:a.s.replyRate,vb=state.sort==='paid'?b.s.paidRate:state.sort==='paid3'?b.s.paid3Rate:state.sort==='use'?b.s.n:b.s.replyRate;return Number(!!b.m.isNew)-Number(!!a.m.isNew)||(a.m.isNew&&b.m.isNew?a.m.index-b.m.index:0)||Number(b.s.customers>=80)-Number(a.s.customers>=80)||vb-va})}

function metricHelp(label,key){if(!METRIC_HELP[key])return esc(label);return `<span class="metric-with-help">${esc(label)}<button type="button" class="metric-help" data-metric-help="${key}" aria-label="查看${esc(label)}的统计口径" aria-describedby="metric-help-popover" aria-expanded="false">?</button></span>`}
function showMetricHelp(button){
 const key=button?.dataset?.metricHelp,description=METRIC_HELP[key],bubble=document.getElementById('metric-help-popover');
 if(!description||!bubble)return;

 button.setAttribute('aria-expanded','true');bubble.textContent=description;bubble.hidden=false;
 bubble.style.left='0px';bubble.style.top='0px';
 const rect=button.getBoundingClientRect(),width=bubble.offsetWidth,height=bubble.offsetHeight;
 const x=Math.max(10,Math.min(window.innerWidth-width-10,rect.left+rect.width/2-width/2));
 let y=rect.bottom+9;if(y+height>window.innerHeight-10)y=rect.top-height-9;
 bubble.style.left=x+'px';bubble.style.top=Math.max(8,y)+'px';
}

function overview(){const s=aggregate(scoped()),list=rows().filter(r=>r.s.customers>=80&&!r.m.isNew).sort((a,b)=>b.s.replyRate-a.s.replyRate),best=list[0],small=rows().filter(r=>r.s.customers>0&&r.s.customers<80);return header('每一次使用，让素材更有效','从销售使用到客户反馈，让下一批素材有据可循。',btn(`${icon('download')} 导出效果报表`,'export'))+filters()+metricCards(s)+`<div class="grid g-main"><section class="card pad"><div class="panel-head"><div><h2>客户响应趋势</h2><p class="meta">${state.days===30?'每 3 天聚合':'按天聚合'} · 同一周期内客户去重</p></div><div class="legend"><span><i></i>${metricHelp('开口率','reply')}</span><span><i class="teal"></i>${metricHelp('有效沟通率','engage')}</span></div></div>${trend()}</section><section class="card pad opportunity"><div class="overline">${icon('spark')} 本期值得关注</div><h2>${best?`「${esc(best.m.cover)}」<br>值得进入下一轮复盘`:'当前范围样本较少<br>先积累使用反馈'}</h2><p>${best?`触达 ${best.s.customers} 位客户，开口率 ${pct(best.s.replies,best.s.customers)}。建议结合使用话术、客户阶段进一步分析，再决定是否扩大使用。`:'调整观察周期或团队范围，查看素材使用表现。少量样本暂不作为优先推广依据。'}</p><div class="bottom"><span class="tiny blue">观察发现 · 尚非因果结论</span>${best?btn('查看素材证据 →','detail',best.m.id,'small primary'):btn('查看素材库 →','go','library','small')}</div></section></div><div class="grid g-main mt"><section class="card"><div class="pad" style="padding-bottom:0"><div class="panel-head"><div><h2>值得复盘的素材</h2><p class="meta">样本 ≥ 80 人 · 按开口率排列 · 跨阶段仅作浏览</p></div><button class="link" data-action="go" data-id="library">全部素材 →</button></div></div>${materialTable(list.slice(0,4),true)}<div class="table-foot"><span>选择相同客户阶段后，再比较素材效果。</span><button class="link" data-action="go" data-id="review">进入素材复盘 →</button></div></section><section class="card pad"><div class="panel-head"><h2>下一步，做什么</h2><span class="pill info">策划行动</span></div><div class="review-item"><span class="step-number">01</span><div><h3>拆解素材为什么有效</h3><p>从素材结构、使用话术和客户反馈中提炼创作假设。</p><button class="link" data-action="go" data-id="review">对比素材 →</button></div></div><div class="review-item"><span class="step-number">02</span><div><h3>让历 function libraryResults(list=ranked(),pages=Math.max(1,Math.ceil(list.length/8))){state.pageNo=Math.min(pages,state.pageNo);return materialTable(list.slice((state.pageNo-1)*8,state.pageNo*8))+`<div class="table-foot"><span>共 ${list.length} 份素材 · 新增素材置顶 · 原有素材按样本与指标排序</span><div class="row"><button class="btn small" data-action="prev" ${state.pageNo===1?'disabled':''}>上一页</button><span>${state.pageNo} / ${pages}</span><button class="btn small" data-action="next" ${state.pageNo===pages?'disabled':''}>下一页</button></div></div>`}
function materialEvents(id){return scoped().filter(t=>t.materialId===id)}
function detail(){const m=byMaterial(state.detail),events=materialEvents(m.id),s=aggregate(events);return`<button class="link back" data-action="go" data-id="library">← 返回素材效果库</button>`+filters()+`${m.isNew?sourceBanner(m):''}<section class="card pad"><div class="detail-hero">${cover(m,true)}<div class="detail-info"><div class="row"><span class="pill">${m.id} · ${m.version}</span><span class="pill info">${m.stage}</span>${m.isNew?'<span class="pill info">原始样例</span>':badge(s)}</div><h1>${esc(m.title)}</h1><p class="muted tiny">${esc(m.content)}</p>${m.risks&&m.risks.length?`<div class="row" style="margin-top:10px;gap:6px">${m.risks.map(x=>`<span class="pill warn">合规关注 · ${esc(x)}</span>`).join('')}</div>`:''}<div class="detail-stats"><div><small>${metricHelp('累计使用 / 销售','uses_sales')}</small><b class="num">${fmt(s.n)} <small>/ ${s.sales} 人</small></b></div><div><small>${metricHelp('触达客户','reach')}</small><b class="num">${fmt(s.customers)} <small>人</small></b></div><div><small>${metricHelp('客户开口率','reply')}</small><b class="num">${pct(s.replies,s.customers)}</b></div><div><small>${metricHelp('3 日关联支付率','paid3')}</small><b class="num">${pct(s.paid3,s.customers)}</b></div><div><small>${metricHelp('7 日关联支付率','paid7')}</small><b class="num">${pct(s.paid,s.customers)}</b></div></div></div></div></section><div class="tabs mt">${[['usage','销售使用表现'],['feedback','客户反馈与记录'],['strategy','使用策略与话术']].map(([v,l])=>`<button data-action="detail-tab" data-id="${v}" class="${state.detailTab===v?'active':''}">${l}</button>`).join('')}</div><div id="detail-content">${state.detailTab==='usage'?usage(m,events,s):state.detailTab==='feedback'?feedback(m,events):strategy(m,events)}</div>${m.isNew?'<div class="notice-box mt">原始样例已补充演示表现数据，暂不进入复盘选择器；可查看销售使用、客户反馈和原文摘录。</div>':`<div class="insight-banner mt"><div><h2>让这份素材，成为下一份好素材的起点。</h2><p>结合表达结构与使用反馈，提炼可验证的创作方向。</p></div><div class="actions">${btn('加入对比复盘','review-material',m.id)}${btn('带入参考，评估新稿 →','new-brief',m.id,'primary')}</div></div>`}`}
function sourceBanner(m){const s=m.source;if(!s)return'';return`<div class="notice-box" style="margin-bottom:16px"><div class="row" style="justify-content:space-between;gap:12px"><b>新增原始素材 · 演示表现数据</b><span class="pill info">${esc(s.type)}</span></div><div class="tiny muted" style="margin-top:8px">来源文件：${esc(s.file)}（${esc(s.pages)}） · ${esc(s.date)}<br>责任人：${esc(s.advisor)} · ${esc(s.license)}<br>素材特征：${s.risks.map(x=>`<span class="pill warn">${esc(x)}</span>`).join(' ')}</div><div class="row" style="margin-top:10px"><button class="link" data-action="source-view" data-id="${m.id}">查看原文摘录 →</button><span class="tiny muted">仅作演示引用，不构成投资建议</span></div></div>`}
function sourceView(id){const m=byMaterial(id),s=m?.source;if(!s)return;showModal('原始素材 · '+esc(m.title),`<div class="notice-box"><b>${esc(s.file)}</b> · ${esc(s.pages)} · ${esc(s.type)}<br>责任人：${esc(s.advisor)} · ${esc(s.license)}<br>素材特征：${s.risks.map(x=>`<span class="pill warn">${esc(x)}</span>`).join(' ')}</div><div class="quote mt" style="white-space:pre-wrap">${esc(s.excerpt)}</div><p class="notice">以上为原始素材摘录，仅用于原型演示；涉及个股名称、收益表述和付费引导，不构成投资建议。生产环境需经合规审核。</p>`,btn('关闭','close','','primary'))}
function usage(m,events,s){const targetSales=sales.filter(x=>state.team==='全部团队'||x.team===state.team),active=targetSales.map(person=>({person,s:aggregate(events.filter(t=>t.salesId===person.id))})).sort((a,b)=>b.s.customers-a.s.customers);return`<div class="grid g-main"><section class="card pad"><div class="panel-head"><div><h2>同一份素材，销售如何使用</h2><p class="meta">销售人数按员工 ID 去重，合并名下企微账号。</p></div><span class="pill info">${s.sales} / ${targetSales.length} 人已采用</span></div><input id="sales-search" type="search" placeholder="搜索销售姓名或团队" aria-label="搜索销售" value="${esc(state.salesQ)}" style="margin-bottom:14px;width:100%"><div id="sales-results">${salesTable(active)}</div></section><div><section class="card pad"><div class="panel-head"><h2>触达后的客户表现</h2></div><div class="mini-funnel">${[['触达客户',s.customers,'reach'],['24h 开口',s.replies,'reply_count'],['有效沟通',s.engaged,'engage_count'],['3 日支付',s.paid3,'paid3_count'],['7 日支付',s.paid,'paid7_count']].map(([name,v,key],i)=>`<div><span>${metricHelp(name,key)}</span><b class="num">${v}</b><div class="fbar"><i style="width:${s.customers?100*v/s.customers:0}%;opacity:${1-i*.17}"></i></div></div>`).join('')}</div><p class="notice">开口与有效沟通来自会话反馈；支付独立按订单关联，可能来自其他触点，并非严格逐级漏斗。${metricHelp('关联退款','refund')} ${s.refunded} / ${s.orders} 笔订单，退款结果仅截至快照日。</p></section><section class="card pad mt"><div class="panel-head"><h2>素材内容结构</h2><span class="pill">创作参考</span></div><div class="quote">${esc(m.structure)}</div><p class="notice">素材主题：${m.topic}<br>主要用途：${m.stage}<br>复盘时结合客户问题，判断结构是否帮助推进沟通。</p>${btn('查看配套话术 →','detail-tab','strategy','small')}</section></div></div>`}
function salesTable(list){const filtered=list.filter(r=>(r.person.name+r.person.team).includes(state.salesQ));return`<div class="table-wrap"><table><thead><tr><th>销售 / 团队</th><th class="right">${metricHelp('使用次数','sends')}</th><th class="right">${metricHelp('触达客户','reach')}</th><th class="right">${metricHelp('开口率','reply')}</th><th class="right">${metricHelp('3 日支付客户','paid3_count')}</th><th class="right">${metricHelp('7 日支付客户','paid7_count')}</th><th></th></tr></thead><tbody>${filtered.map(({person,s})=>`<tr><td><b>${person.name}</b><div class="tiny muted">${person.team} · ${person.accounts} 个企微</div></td><td class="right num">${s.n}</td><td class="right num">${s.customers}</td><td class="right num">${pct(s.replies,s.customers)}</td><td class="right num">${s.paid3}</td><td class="right num">${s.paid}</td><td>${s.n?`<button class="link" data-action="sales-case" data-id="${person.id}">使用记录</button>`:'<span class="tiny muted">未使用</span>'}</td></tr>`).join('')||'<tr><td colspan="7" class="empty">没有匹配的销售</td></tr>'}</tbody></table></div><p class="notice">个体样本量可能很小，表格用于查阅使用情况，不作销售能力排名。</p>`}
function caseCard(t){const person=bySales(t.salesId),o=orders.find(x=>x.id===t.orderId),m=byMaterial(t.materialId);return`<section class="card pad"><div class="case-head"><div><h3>客户 ${t.customerId}</h3><span class="tiny muted">${person.name} · ${person.team} · ${t.stage}</span></div><span class="pill ${t.engage?'good':t.reply?'info':''}">${t.feedback}</span></div><div class="timeline"><section><time>${stamp(t.ts)} · ${t.id}</time><p>发送「${esc(m.title)}」<br><span class="muted">${t.script}：${t.script==='提问式开场'?'您目前最想了解哪一部分？我整理了一份说明，可以先看看。':'这是一份相关介绍，您可以先了解，有问题随时沟通。'}</span></p></section><section><time>触达后 24 小时内</time><p>${t.reply?(t.engage?'客户：“可以再具体讲讲吗？我想了解一下实际的服务安排。”':t.feedback==='询问具体服务'?'客户：“具体都包含哪些服务？”':'客户：“收到，暂时先了解一下。”'):'未观察到客户回复。可能未阅读或暂不需要，不能据此判定素材无效。'}</p></section>${o?`<section><time>${stamp(o.paidAt)} · ${o.id}</time><p>关联支付订单 ¥${fmt(o.amount)}${o.refunded?' · 截至快照日已退款':''}<br><span class="tiny muted">在七天观察窗口内，非素材独立促成证明。</span></p></section>`:'<section><time>七天观察窗口</time><p class="muted">未关联到支付订单。</p></section>'}</div><span class="tiny muted">虚构会话示例 · 用于演示使用记录与业务结果的关联</span></section>`}
const feedbackState={query:'',page:1,size:20,sort:'recent',customerId:'',detailPage:1};
function customerFeedbackRows(events){
 const map=new Map();
 for(const t of events){
  let r=map.get(t.customerId);
  if(!r){r={id:t.customerId,count:0,reply:false,engage:false,orderIds:new Set(),salesIds:new Set(),latest:t};map.set(t.customerId,r)}
  r.count++;r.reply=r.reply||t.reply;r.engage=r.engage||t.engage;r.salesIds.add(t.salesId);
  if(t.orderId)r.orderIds.add(t.orderId);
  if(t.ts>r.latest.ts||t.ts===r.latest.ts&&t.id.localeCompare(r.latest.id)>0)r.latest=t;
 }
 return [...map.values()];
}
function feedbackMatches(events){
 const query=feedbackState.query.trim().toLowerCase();
 return customerFeedbackRows(events).filter(r=>{
  const match=!query||(query.startsWith('c')&&/^c\d+$/i.test(query)?r.id.toLowerCase()===query:r.id.toLowerCase().includes(query)||[...r.salesIds].some(id=>{const s=bySales(id);return(s.name+' '+s.team).toLowerCase().includes(query)}));
  return match&&(state.caseMode==='全部反馈'||state.caseMode==='已回复'&&r.reply||state.caseMode==='有效沟通'&&r.engage||state.caseMode==='未回复'&&!r.reply||state.caseMode==='有关联支付'&&r.orderIds.size>0);
 }).sort((a,b)=>feedbackState.sort==='uses'?(b.count-a.count||b.latest.ts-a.latest.ts||a.id.localeCompare(b.id)):(b.latest.ts-a.latest.ts||a.id.localeCompare(b.id)));
}
function feedback(m,events){const all=customerFeedbackRows(events);return`<section class="card feedback-panel"><div class="panel-head"><div><h2>客户反馈明细</h2><p class="meta">当前范围 ${fmt(all.length)} 位客户 · ${fmt(events.length)} 次触达 · 按客户汇总，点击后查看完整使用记录</p></div><span class="pill">客户维度</span></div><div class="feedback-tools"><input type="search" id="feedback-search" aria-label="搜索反馈客户" value="${esc(feedbackState.query)}" placeholder="客户编号精确搜索 / 销售姓名 / 团队"><select id="case-filter" aria-label="反馈筛选">${['全部反馈','已回复','有效沟通','未回复','有关联支付'].map(x=>`<option ${x===state.caseMode?'selected':''}>${x}</option>`).join('')}</select><select id="feedback-sort" aria-label="客户排序"><option value="recent" ${feedbackState.sort==='recent'?'selected':''}>最近触达优先</option><option value="uses" ${feedbackState.sort==='uses'?'selected':''}>触达次数最多</option></select><button class="btn small" data-action="feedback-reset">重置筛选</button></div><div id="feedback-results" aria-live="polite">${feedbackResults(events)}</div><div class="feedback-note">反馈按当前触达期内该客户的全部使用记录汇总：“未回复”表示每次触达后的 24 小时内均未观察到回复；关联支付按订单 ID 去重，与回复状态独立。数据为虚构演示。</div></section>`}
function feedbackResults(events=materialEvents(state.detail)){

function deepOverlap(g){const [a,b]=g.pair,aa=new Set(a.events.map(t=>t.customerId)),bb=new Set(b.events.map(t=>t.customerId)),overlap=[...aa].filter(x=>bb.has(x)).length;const topSales=row=>{const tally=new Map();for(const t of row.events)tally.set(t.salesId,(tally.get(t.salesId)||0)+1);const top=[...tally].sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0])).slice(0,3);return{count:top.reduce((s,x)=>s+x[1],0),names:top.map(x=>bySales(x[0]).name).join('、')}};return{overlap,aTop:topSales(a),bTop:topSales(b),aQuestion:a.events.filter(t=>t.script==='提问式开场').length,bQuestion:b.events.filter(t=>t.script==='提问式开场').length}}
function deepPlan(g){if(!g.pair)return null;const [a,b]=g.pair,d=deepDiagnosis(b,g),openingA=a.m.structure.split(' → ')[0],openingB=b.m.structure.split(' → ')[0],different=openingA!==openingB;let hypothesis,change,summary;
 if(d.focus==='opening'){summary=`先验证「${b.m.cover}」的开头；「${a.m.cover}」仅作为回复表现参考。`;hypothesis=different?`在“${g.stage} / ${g.topic}”中，将“${openingB}”开头改为“${openingA}”，可能更容易引发客户回应。`:'开头结构标签相同，可尝试减少首段信息量并明确一个客户问题，验证是否更容易引发回复。';change=different?`只改 ${b.m.id} 的首屏切入：从“${openingB}”改为“${openingA}”。保留原事实、服务范围、主体内容和结尾入口。`:`只改 ${b.m.id} 的首段信息组织，其余事实、主题与使用话术保持一致。`}
 else if(d.focus==='depth'){summary=`优先验证「${b.m.cover}」的后续解释，暂不调整开头。`;hypothesis='回复后的沟通承接偏低，可能需要更清楚地说明服务细节或下一步安排；须先检查原稿是否已有相应说明。';change=`核对 ${b.m.id} 原稿后，只补充一段真实的服务流程或下一步说明；保留开头、主体事实与发送话术。不虚构服务承诺。`}
 else{summary='当前证据不足以指定优劣，先核对客户问题，再选一个实验方向。';hypothesis='暂不能把回复差异归因于表达结构。可先从客户提问中确认一个未被清楚回答的问题，再提出修改假设。';change=`待运营核对 ${b.m.id} 原稿与客户记录后，只选择一处回答具体问题的表述进行改写；若原稿已清楚说明，则保持版本，不强行改稿。`}
 return{summary,hypothesis,change,control:`旧版对照组使用 ${b.m.id} 当前版本，新版试验组使用基于同一素材制作的新版本；${a.m.id} 仅作为历史观察对象，不直接充当实验处理组。`,metric:g.stage==='初次咨询'?'24 小时客户开口率':g.stage==='成交推进'?'7 日支付客户占比（按预先分组的客户统计）':'有效沟通客户占比',guard:'同时观察有效沟通客户占比、负面反馈及退款；回复增加而有效沟通没有改善，不能视为完成优化。负面反馈需补充采集，当前原型没有该统计。',allocation:'以客户为分组单位随机分配，每位客户只接收一个版本；平衡销售、渠道与发送时段，固定配套话术，并记录跨组接触。',decision:'预先约定最小有意义改善、样本量和结束规则，完成统一观察窗口后判断。当前数据不足以给出所需样本量或承诺提升幅度。'};}
function deepBrief(g){const p=deepPlan(g);if(!p)return'';const [a,b]=g.pair;return`复盘范围：${md(END-state.days*DAY)}–${md(END-DAY)}，${state.team}，${g.stage} / ${g.topic}。\n观察：${a.m.id} 回复 ${a.s.replies}/${a.s.customers}（${pct(a.s.replies,a.s.customers)}），${b.m.id} 回复 ${b.s.replies}/${b.s.customers}（${pct(b.s.replies,b.s.customers)}）。\n待验证解释：${p.hypothesis}\n本次只改：${p.change}\n对照方式：${p.control}\n主指标：${p.metric}\n同时观察：${p.guard}\n分组方法：${p.allocation}\n判断规则：${p.decision}\n以上为观察与实验建议，不是已验证的因果结论。`}
function deepGroupView(g,index){const can=!!g.pair,[a,b]=g.pair||[],plan=deepPlan(g),overlap=can?deepOverlap(g):null;return`<details class="deep-group" ${index===0?'open':''} data-deep-group="${esc(g.key)}"><summary><div class="deep-group-name"><strong>${g.stage} · ${g.topic}</strong><small>${g.rows.length} 份素材 · ${g.eligible.length} 份达到观察门槛</small></div><span class="pill ${can?'info':'warn'}">${can?'可展开深度复盘':g.rows.length>=2?'样本不足，暂不判断优劣':'需要同主题参照'}</span></summary><div class="deep-body">${can?`<div class="deep-answer"><div class="eyebrow">本组结论 · 运营决策建议</div><h3>${esc(plan.summary)}</h3><p>依据：两份开口率分别为 ${pct(a.s.replies,a.s.customers)}（${a.s.replies}/${a.s.customers}）和 ${pct(b.s.replies,b.s.customers)}（${b.s.replies}/${b.s.customers}）；回复后进入有效沟通的占比分别为 ${pct(a.s.engaged,a.s.replies)} 与 ${pct(b.s.engaged,b.s.replies)}。支付单独关联观察，不能当作回复后的必然下一步。此处只拆解回复差异，不代表综合转化排名；是否改善须以本组实验主指标判断。</p><p>行动边界：不直接放量或淘汰。先检查下面的使用差异，再决定采用哪条修改假设。</p></div>`:`<div class="deep-nodata">${g.rows.length<2?'当前仅有一份同阶段、同主题素材，尚不能判断相对效果。':'样本足够的同阶段、同主题素材不足两份，暂不输出优劣判断。'} 可以先查看每份素材的回应结构，并补充可比样本。</div>`}<div class="deep-section"><div class="deep-section-title"><b>01</b><h3>逐份诊断：问题在哪一段</h3><small>先分清回复、沟通承接与支付</small></div><div class="deep-panel"><div class="table-wrap"><table class="deep-table"><thead><tr><th>素材</th><th class="right">${metricHelp('开口 / 触达','open_reach')}</th><th class="right">${metricHelp('有效沟通 / 已开口','engage_depth')}</th><th class="right">${metricHelp('3 日支付 / 触达','paid3')}</th><th class="right">${metricHelp('7 日支付 / 触达','paid7')}</th><th>运营动作</th><th>判断依据</th></tr></thead><tbody>${g.rows.map(r=>{const d=deepDiagnosis(r,g);return`<tr><td class="deep-material">${r.m.id} · ${esc(r.m.title)}</td><td class="right num">${pct(r.s.replies,r.s.customers)}<div class="tiny muted">${r.s.replies}/${r.s.customers}</div></td><td class="right num">${r.s.replies?pct(r.s.engaged,r.s.replies):'—'}<div class="tiny muted">${r.s.engaged}/${r.s.replies}</div></td><td class="right num">${pct(r.s.paid3,r.s.customers)}<div class="tiny muted">${r.s.paid3}/${r.s.customers}</div></td><td class="right num">${pct(r.s.paid,r.s.customers)}<div class="tiny muted">${r.s.paid}/${r.s.customers}</div></td><td class="deep-reason"><b class="blue">${d.label}</b><br>${d.action}</td><td class="deep-reason">${d.reason}</td></tr>`}).join('')}</tbody></table></div><div class="deep-sub">诊断对照为其余已选、同阶段同主题且触达 ≥ 80 人的素材中位数。承接比较另外要求自身及参照各 ≥ 20 位回复客户。3 个百分点是用于组织运营动作的演示规则，不是显著性阈值。有效沟通是已回复客户的子集；支付不属于严格逐级漏斗。</div></div></div>${can?`<div class="deep-section"><div class="deep-section-title"><b>02</b><h3>使用结构：差异可能来自哪里</h3><small>先检查可比性，再解释内容</small></div><div class="deep-split"><div class="deep-fact"><h4>客户并不是两组完全独立的人</h4><p>两份素材共同触达 <b>${overlap.overlap}</b> 位客户，占 A 的 ${pct(overlap.overlap,a.s.customers)}、B 的 ${pct(overlap.overlap,b.s.customers)}。客户可能连续接触多份素材，因此不能把当前差值直接解释为素材增量效果。</p></div><div class="deep-fact"><h4>销售使用习惯也可能影响结果</h4><p>提问式开场占发送次数：A 为 <b>${pct(overlap.aQuestion,a.events.length)}</b>，B 为 <b>${pct(overlap.bQuestion,b.events.length)}</b>。这是发送结构占比，与按客户去重的开口率不同。</p><p>A 的前三位使用销售（${overlap.aTop.names}）贡献 ${pct(overlap.aTop.count,a.events.length)} 的发送；B 的前三位（${overlap.bTop.names}）贡献 ${pct(overlap.bTop.count,b.events.length)}。</p></div></div></div><div class="deep-section"><div class="deep-section-title"><b>03</b><h3>分组验证：换一种比较方法，差异还在吗</h3></div><div class="deep-panel" data-factor-panel="${esc(g.key)}">${deepFactorPanel(g)}</div></div>`:''}<div class="deep-section"><div class="deep-section-title"><b>${can?'04':'02'}</b><h3>反馈证据：客户实际回应了什么</h3><small>按发送事件计数，四类互斥</small></div><div class="deep-panel"><div class="table-wrap"><table class="deep-table"><thead><tr><th>素材</th><th class="right">${metricHelp('进一步沟通意愿','event_engage')}</th><th class="right">${metricHelp('询问具体服务','event_question')}</th><th class="right">${metricHelp('其他回复 / 暂无需求','event_other')}</th><th class="right">${metricHelp('未观察到回复','event_silent')}</th><th>查看证据</th></tr></thead><tbody>${g.rows.map(r=>{const f=deepFeedback(r);return`<tr><td>${r.m.id} · ${esc(r.m.cover)}</td><td class="right num">${f.engage} 次</td><td class="right num">${f.question} 次</td><td class="right num">${f.other} 次</td><td class="right num">${f.silent} 次</td><td><div class="row"><button class="link" data-action="deep-evidence" data-id="${r.m.id}" data-bucket="question">提问记录</button><button class="link" data-action="deep-evidence" data-id="${r.m.id}" data-bucket="silent">未回复记录</button></div></td></tr>`}).join('')}</tbody></table></div><div class="deep-sub">这里使用演示记录已有的反馈标签，没有额外推断客户顾虑。“未回复”不等于拒绝、未阅读或素材无效；当前也没有客户原始文字的完整语义分析。</div></div></div>${can?`<div class="deep-section"><div class="deep-section-title"><b>05</b><h3>下一版怎么改，以及怎样证明改得有效</h3></div><dl class="deep-experiment"><dt>待验证解释</dt><dd>${esc(plan.hypothesis)}</dd><dt>这次只改一处</dt><dd>${esc(plan.change)}</dd><dt>旧版与新版</dt><dd>${esc(plan.control)}</dd><dt>客户如何分组</dt><dd>${plan.allocation}</dd><dt>主要判断指标</dt><dd><b>${plan.metric}</b></dd><dt>同时观察</dt><dd>${plan.guard}</dd><dt>什么时候下结论</dt><dd>${plan.decision}</dd></dl><div class="deep-actions"><button class="btn" data-action="deep-copy" data-key="${esc(g.key)}">复制本组优化方案</button><button class="btn primary" data-action="deep-transfer" data-key="${esc(g.key)}">按这个方向评估初稿 →</button></div></div>`:''}<div class="deep-gap">尚缺的证据：客户来源与意向强弱、实际阅读、完整素材正文/画面、完整对话语义，以及随机分组结果。当前可分析使用差异和提出假设，不能确定视觉风格、文案措辞或某个销售动作是转化变化的原因。</div></div></details>`}
function deepReviewReport(){const cohorts=deepCohorts();return`<section class="card mt" id="deep-report"><div class="deep-report-head"><div><h2>深度复盘报告</h2><p>按“客户阶段 × 内容主题”建立 ${cohorts.length} 个分析组，其中 ${cohorts.filter(g=>g.pair).length} 组可进一步拆解。</p></div><button class="btn small" data-action="deep-export">导出完整复盘报告</button></div>${cohorts.map(deepGroupView).join('')}</section>`}
function deepReportText(){const cohorts=deepCohorts();return`# 多素材深度复盘\n\n范围：${md(END-state.days*DAY)}–${md(END-DAY)} · ${state.team}\n已选素材：${state.compareIds.join('、')}\n\n${cohorts.map(g=>`## ${g.stage} / ${g.topic}\n\n${g.rows.map(r=>{const d=deepDiagnosis(r,g);return`${r.m.id} ${r.m.title}\n触达 ${r.s.customers} 人，开口 ${r.s.replies} 人，有效沟通 ${r.s.engaged} 人，3 日关联支付 ${r.s.paid3} 人，7 日关联支付 ${r.s.paid} 人。\n建议：${d.label}。${d.reason}\n行动：${d.action}`}).join('\n\n')}\n\n${g.pair?`### 使用差异\n历史 A = ${g.pair[0].m.id}「${g.pair[0].m.title}」，历史 B = ${g.pair[1].m.id}「${g.pair[1].m.title}」。仅按开口率选取本组最高与最低者，不代表综合转化排名。\n共同触达 ${deepOverlap(g).overlap} 位客户；当前不是随机分组。\n提问式开场占发送次数：A ${pct(deepOverlap(g).aQuestion,g.pair[0].events.length)}，B ${pct(deepOverlap(g).bQuestion,g.pair[1].events.length)}。\nA 前三位销售（${deepOverlap(g).aTop.names}）贡献 ${pct(deepOverlap(g).aTop.count,g.pair[0].events.length)} 发送；B 前三位销售（${deepOverlap(g).bTop.names}）贡献 ${pct(deepOverlap(g).bTop.count,g.pair[1].events.length)} 发送。\n${['script','sales','time','period'].map(f=>{const d=deepFactors(g,f);return`${{script:'开场话术',sales:'销售人员',time:'发送时段',period:'前后周期'}[f]}：${factorSummary(d)}\n${d.rows.map(r=>`${r.label}：A 回复 ${r.a.replies}/${r.a.customers}，B 回复 ${r.b.replies}/${r.b.customers}，${r.valid?'达到探索展示门槛':'样本不足'}`).join('\n')}`}).join('\n\n')}\n\n### 优化与验证方案\n${deepBrief(g)}`:'同阶段同主题的充分样本不足，不输出优劣或因果结论。'}\n\n### 反馈标签（事件数）\n${g.rows.map(r=>{const f=deepFeedback(r);return`${r.m.id}：进一步沟通 ${f.engage} 次，询问服务 ${f.question} 次，其他回复 ${f.other} 次，未回复 ${f.silent} 次。`}).join('\n')}`).join('\n\n')}\n\n规则：同阶段同主题且至少80位触达客户才可作相对诊断；承接比较另需至少20位回复客户。3个百分点仅为运营动作组织规则；分组每侧话术/时段/周期至少20人、销售至少8人仅为探索展示门槛。\n\n边界：全部为演示数据，客户/素材/话术分组可能重叠；样本门槛和诊断规则不表示统计显著；未解析图片、视频或完整对话。关联支付不证明素材促成成交。\n`}

 if(action==='deep-factor'){const g=deepCohorts().find(g=>g.key===key);if(!g?.pair)return;deepTabs[key]=id;const panel=[...document.querySelectorAll('[data-factor-panel]')].find(el=>el.dataset.factorPanel===key);if(panel)panel.innerHTML=deepFactorPanel(g)}

function refreshPicker(){const list=$('#review-picker-results');if(list)list.innerHTML=pickerList();const count=$('#review-picker-count');if(count)count.textContent=`已选 ${reviewPicker.ids.size} 份 · 至少选择 2 份`;const confirm=$('#review-picker-confirm');if(confirm){confirm.disabled=reviewPicker.ids.size<2;confirm.textContent=`确认选择（${reviewPicker.ids.size}）`}}
function openReviewPicker(){reviewPicker.ids=new Set(state.compareIds.filter(id=>{const m=byMaterial(id);return m&&!m.isNew}));reviewPicker.query='';reviewPicker.stage='全部阶段';reviewPicker.format='全部形式';showModal('选择参与复盘的素材',`<div class="notice-box" style="margin-bottom:15px">可以选择多份素材。筛选仅影响候选列表，不会丢弃已选素材；不同客户阶段会分别比较。<br>新增的 3 份原始素材作为外部样例，暂不参与复盘。</div><div class="review-picker-tools"><input type="search" id="review-picker-search" aria-label="搜索复盘素材" placeholder="搜索素材名称、编号或主题"><select id="review-picker-stage" aria-label="候选客户阶段">${['全部阶段',...STAGES].map(x=>`<option>${x}</option>`).join('')}</select><select id="review-picker-format" aria-label="候选素材形式">${['全部形式',...new Set(materials.map(m=>m.format))].map(x=>`<option>${x}</option>`).join('')}</select></div><div id="review-picker-results">${pickerList()}</div>`,`<div class="review-picker-footer"><span id="review-picker-count">已选 ${reviewPicker.ids.size} 份 · 至少选择 2 份</span><div class="row">${btn('取消','close')}<button class="btn primary" id="review-picker-confirm" data-action="review-confirm" ${reviewPicker.ids.size<2?'disabled':''}>确认选择（${reviewPicker.ids.size}）</button></div></div>`)}
function reviewEvidence(id){const row=reviewRows().find(r=>r.m.id===id);if(!row)return;const {m,s}=row,events=touches.filter(t=>t.materialId===id&&t.ts>=END-state.days*DAY&&(state.team==='全部团队'||t.team===state.team)).sort((a,b)=>b.ts-a.ts);showModal('复盘依据 · '+esc(m.title),`<div class="notice-box">${md(END-state.days*DAY)}–${md(END-DAY)} · ${state.team} · ${m.stage}<br>触达 ${s.customers} 位客户；开口 ${s.replies} 人；有效沟通 ${s.engaged} 人；3 日关联支付 ${s.paid3} 人；7 日关联支付 ${s.paid} 人。<br>本次复盘使用周期与团队范围，不受其他页面的客户阶段筛选影响。</div><div class="quote mt">${esc(m.content)}<br>${esc(m.structure)}</div><h3 class="mt" style="margin-bottom:15px">最近使用记录（最多 3 条）</h3><div class="grid">${events.slice(0,3).map(caseCard).join('')||'<div class="empty">当前范围没有使用记录。</div>'}</div>`)}
document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b||b.disabled)return;const {action,id}=b.dataset;
 if(action==='review-pick')openReviewPicker();
 else if(action==='review-confirm'){if(reviewPicker.ids.size<2)return;state.compareIds=materials.filter(m=>reviewPicker.ids.has(m.id)).map(m=>m.id);$('#modal').close();render()}
 else if(action==='review-remove'){state.compareIds=state.compareIds.filter(x=>x!==id);render()}
 else if(action==='review-clear'){state.compareIds=[];render()}
 else if(action==='review-select-visible'){pickerMatches().forEach(m=>reviewPicker.ids.add(m.id));refreshPicker()}
 else if(action==='review-unselect-visible'){pickerMatches().forEach(m=>reviewPicker.ids.delete(m.id));refreshPicker()}
 else if(action==='review-evidence')reviewEvidence(id);

document.addEventListener('input',e=>{if(e.target.id==='review-picker-search'){reviewPicker.query=e.target.value;refreshPicker()}});
document.addEventListener('change',e=>{const id=e.target.dataset.reviewSelect;if(id){if(e.target.checked)reviewPicker.ids.add(id);else reviewPicker.ids.delete(id);$('#review-picker-count').textContent=`已选 ${reviewPicker.ids.size} 份 · 至少选择 2 份`;$('#review-picker-confirm').disabled=reviewPicker.ids.size<2;$('#review-picker-confirm').textContent=`确认选择（${reviewPicker.ids.size}）`}else if(e.target.id==='review-picker-stage'){reviewPicker.stage=e.target.value;refreshPicker()}else if(e.target.id==='review-picker-format'){reviewPicker.format=e.target.value;refreshPicker()}});
// 评估工作室以运营初稿为起点；历史记录仅作为观察依据，不预测转化提升。

 image:[['headline','标题与卖点','查看标题是否聚焦，重点信息是否突出。'],['hierarchy','文案层级','查看信息主次、字号与阅读顺序。'],['visual','主视觉与可读性','查看主体、留白、对比度及移动端阅读体验。'],['cta','行动入口','查看咨询入口、二维码或行动提示是否明确。']],
 video:[['hook','开头吸引力','关注开头是否说明主题，是否与目标客户相关。'],['pacing','内容节奏','关注段落节奏、转场和目标时长。'],['subtitle','字幕与声音','关注字幕可读性、音画配合与信息重复。'],['ending','结尾引导','关注结尾是否自然引导后续交流。']]

function assetSettings(d){return`<div class="asset-type-switch" aria-label="素材类型">${[['text','文字文案','粘贴内容或导入文件','brief'],['image','海报图片','上传图片，按需补充文案','library'],['video','视频片段','上传片段，按需补充脚本','review']].map(([id,label,sub,ic])=>`<button type="button" data-action="opt-kind" data-id="${id}" class="${d.inputKind===id?'active':''}" aria-pressed="${d.inputKind===id}">${icon(ic)}<span><b>${label}</b><small>${sub}</small></span></button>`).join('')}</div><div class="asset-options"><div class="row" style="justify-content:space-between"><h3>本次重点看什么</h3><button type="button" class="link" data-action="opt-dimensions-reset">恢复推荐项</button></div><div class="dimension-options">${OPT_DIMENSIONS[d.inputKind].map(([id,label])=>`<label><input type="checkbox" data-opt-dimension="${id}" ${d.dimensions.includes(id)?'checked':''}>${label}</label>`).join('')}</div><div class="form-grid"><label class="field">计划使用渠道（选填）${optSelect('channel',OPT_CHANNELS,d.channel)}</label>${d.inputKind!=='text'?`<label class="field">画面比例（选填）${optSelect('ratio',OPT_RATIOS,d.ratio)}</label>`:''}${d.inputKind==='video'?`<label class="field">期望时长（选填）${optSelect('duration',OPT_DURATIONS,d.duration)}</label>`:''}</div>${d.inputKind!=='text'?'<p class="notice">可只提交媒体素材；文案和脚本按需补充。当前原型未接入视觉或音视频模型，画面、声音与节奏将标为待解析；比例、时长作为制作要求保留。</p>':''}</div>`}
function hasUsableText(d){return d.content.trim().length>=30}
function dimensionEnabled(d,id){const map=d.inputKind==='image'?{opening:'headline',structure:'hierarchy',closing:'cta'}:d.inputKind==='video'?{opening:'hook',structure:'pacing',closing:'ending'}:{opening:'opening',structure:'structure',closing:'closing'};return d.dimensions.includes(map[id])}
function pendingMediaView(d){const labels=d.dimensions.map(id=>OPT_DIMENSIONS[d.inputKind].find(x=>x[0]===id)).filter(Boolean);return`<div class="studio-warning">${d.file?.kind===d.inputKind?(fileURL?'媒体已提交，尚未完成内容解析。':'本次报告有媒体附件记录，预览需重新选择文件；尚未完成媒体解析。'):'尚未上传媒体，本次只参考配套文字和评估配置。'}下列为你选择的评估方向，不是对当前素材的实际判断。${hasUsableText(d)?'本页修改建议仅针对补充的文案或脚本。':'可先浏览历史素材，或补充至少 30 字符的文案 / 脚本以体验文字优化。'}</div><div class="pending-dimensions">${labels.map(([,label,desc])=>`<div><div class="row" style="justify-content:space-between"><h3>${label}</h3><span class="pill">待媒体解析</span></div><p>${desc}</p></div>`).join('')}</div>`}
const blankDraft=()=>({inputKind:'text',dimensions:dimensionIds('text'),channel:'不限定',ratio:'保持原素材',duration:'不限定',title:'',content:'',stage:'未指定',format:'图文',topic:'未指定',goal:OPT_GOALS[0],market:'',keep:'',team:'全部团队',days:'30',file:null,sourceIds:[],reviewNote:''});
function cleanDraft(raw){const d=blankDraft();if(!raw||typeof raw!=='object')return d;for(const k of ['title','content','market','keep','reviewNote'])if(typeof raw[k]==='string')d[k]=raw[k].slice(0,k==='content'?12000:k==='reviewNote'?6000:k==='title'?80:1000);for(const [k,values]of Object.entries({inputKind:['text','image','video'],channel:OPT_CHANNELS,ratio:OPT_RATIOS,duration:OPT_DURATIONS,stage:OPT_STAGES,format:OPT_FORMATS,topic:OPT_TOPICS,goal:OPT_GOALS,team:['全部团队',...TEAMS],days:['7','30']}))if(values.includes(raw[k]))d[k]=raw[k];if(raw.file&&typeof raw.file.name==='string'&&['text','image','video'].includes(raw.file.kind))d.file={name:raw.file.name.slice(0,180),kind:raw.file.kind,size:Number(raw.file.size)||0};d.sourceIds=Array.isArray(raw.sourceIds)?raw.sourceIds.filter(id=>byMaterial(id)):[];if(!raw.inputKind&&d.file?.kind!=='text'&&d.file)d.inputKind=d.file.kind;if(d.inputKind==='video')d.format='短视频';else if(d.format==='短视频')d.format='图文';d.dimensions=Array.isArray(raw.dimensions)?raw.dimensions.filter(id=>dimensionIds(d.inputKind).includes(id)):dimensionIds(d.inputKind);return d}
function draftKey(d){return JSON.stringify([d.inputKind,d.dimensions,d.channel,d.ratio,d.duration,d.title,d.content,d.stage,d.format,d.topic,d.goal,d.market,d.keep,d.team,d.days,d.file,d.sourceIds,d.reviewNote])}
function validReport(r){return r&&typeof r.key==='string'&&Array.isArray(r.refs)&&r.refs.every(x=>x&&byMaterial(x.id)&&x.s&&['customers','replies','paid','engaged'].every(k=>Number.isFinite(x.s[k])))&&Array.isArray(r.suggestions)&&r.suggestions.every(x=>x&&['opening','structure','closing'].includes(x.id)&&['title','why','before','after','basis','level'].every(k=>typeof x[k]==='string'))&&typeof r.scope==='string'&&typeof r.date==='string'&&r.input&&typeof r.input.content==='string'&&Number.isFinite(r.usable)}
function cleanSession(raw){const draft=cleanDraft(raw?.draft),report=validReport(raw?.report)?{...raw.report,input:cleanDraft(raw.report.input)}:null;const result=raw?.result&&typeof raw.result.content==='string'&&typeof raw.result.title==='string'&&typeof raw.result.key==='string'&&typeof raw.result.selection==='string'?{title:raw.result.title.slice(0,100),content:raw.result.content,mode:raw.result.mode==='original'?'original':'optimized',key:raw.result.key,selection:raw.result.selection,status:raw.result.status==='待投放验证'?'待投放验证':'待人工确认',version:Number(raw.result.version)||1}:null;return{draft,report,result:report?result:null,selected:Array.isArray(raw?.selected)?raw.selected.filter(id=>report?.suggestions.some(s=>s.id===id)):[],step:report&&['report','result'].includes(raw?.step)&&(raw.step!=='result'||result)?raw.step:'input',recordId:typeof raw?.recordId==='string'?raw.recordId:''}}

try{const data=JSON.parse(localStorage.getItem(OPT_KEY)||'null');if(data){studio=cleanSession(data.current);optRecords=Array.isArray(data.records)?data.records.filter(r=>r&&typeof r.id==='string'&&typeof r.updatedAt==='string').map(r=>({id:r.id,updatedAt:r.updatedAt,session:cleanSession(r.session)})):[]}}catch(e){$('#storage-alert').hidden=false}

function validateDraft(){
 const d=studio.draft;
 if(d.file&&d.file.kind!=='text'&&d.file.kind!==d.inputKind){toast('附件与所选素材类型不一致，请移除附件或切换类型');return false}
 if(d.inputKind==='text'&&!hasUsableText(d)){toast('文字素材请填写至少 30 字符的正文');return false}
 if(d.inputKind!=='text'&&!hasUsableText(d)&&!(d.file?.kind===d.inputKind&&fileURL)){toast('请选择对应的图片或视频文件，或补充至少 30 字符文案 / 脚本；刷新后需重新选择媒体文件');return false}
 if(!d.dimensions.length){toast('请至少选择一个评估方向');return false}
 if(d.content.length>12000){toast('初稿最多 12,000 字符，请精简后评估');return false}
 const missing=d.keep.split('\n').map(s=>s.trim()).filter(s=>s&&!d.content.includes(s));
 if(missing.length){toast('“必须保留的原文”需要逐段出现在初稿正文中');return false}
 if(!d.title.trim())d.title=d.file?.name||d.content.trim().slice(0,22)||'未命名素材';
 return true;
}
function openingFor(d){if(d.topic==='其他主题'||d.topic==='未指定')return '在进一步了解之前，您最希望先弄清楚哪个问题？';if(d.topic!=='服务说明')return `关于${d.topic}，您最希望先弄清楚哪个问题？`;return d.stage==='初次咨询'?'第一次了解这项服务，您最想先弄清楚什么？':d.stage==='需求沟通'?'面对这些信息，您现在最关心的问题是什么？':d.stage==='异议处理'?'在继续了解之前，您还有哪些顾虑想先说清楚？':'开始之前，还有哪些准备事项需要一起确认？'}
function closingFor(d){return d.goal===OPT_GOALS[2]?'如果这份说明与您的需求相关，您希望进一步确认哪项安排？':d.goal===OPT_GOALS[1]?'哪一部分与您当前的情况最相关？我们可以围绕这一点继续沟通。':'您更想进一步了解哪一部分？可以回复您最关心的问题。'}
function restructureText(text,keep){
 const chunks=[...new Set(keep.split('\n').map(x=>x.trim()).filter(Boolean))].sort((a,b)=>b.length-a.length);
 const prefix=`__KEEP_${Date.now()}__`;let body=text;
 chunks.forEach((value,i)=>{body=body.split(value).join(prefix+i+'__')});
 body=body.replace(/([。！？])(?=[^\s])/g,'$1\n\n');
 chunks.forEach((value,i)=>{body=body.split(prefix+i+'__').join(value)});
 return body;
}
function evaluateDraft(){if(uploadBusy){toast('请等待文件读取完成');return}if(!validateDraft())return;const d=studio.draft,refs=refsFor(d),usable=refs.filter(r=>r.s.customers>=80),first=d.content.trim().split(/\n+/)[0],paragraphs=d.content.split(/\n+/).filter(x=>x.trim()),longest=[...paragraphs].sort((a,b)=>b.length-a.length)[0]||'',openingRef=d.stage!=='未指定'&&d.topic!=='未指定'&&usable.find(r=>/场景|问题|疑问|答疑/.test(byMaterial(r.id).structure.split(' → ')[0]));const suggestions=[];
 if(hasUsableText(d)&&dimensionEnabled(d,'opening')&&!/[？?]/.test(first.slice(0,70)))suggestions.push({id:'opening',title:'先回应客户，再展开背景',why:`初稿开头为“${first.slice(0,48)}${first.length>48?'…':''}”。可以先增加一个与${d.stage}相关的提问，让客户更容易找到交流入口。`,before:first.slice(0,120),after:openingFor(d),level:openingRef?'历史案例参考':'一般表达建议',basis:openingRef?`参考 ${openingRef.id}「${byMaterial(openingRef.id).title}」：以“${byMaterial(openingRef.id).structure.split(' → ')[0]}”开头，触达 ${openingRef.s.customers} 人，开口率 ${pct(openingRef.s.replies,openingRef.s.customers)}。这是结构参考，不证明这种开头带来提升。`:'没有足够匹配的历史样本支持这一改法，仅作为表达假设。'});
 if(hasUsableText(d)&&dimensionEnabled(d,'structure')&&longest.length>90&&restructureText(d.content,d.keep)!==d.content)suggestions.push({id:'structure',title:'拆开长段落，让每层信息更清楚',why:`初稿最长一段有 ${longest.length} 字符。可在句子之间增加换行，方便客户分段理解，保留原有事实和措辞。`,before:longest.slice(0,120)+(longest.length>120?'…':''),after:'按句子拆段，保留全部原文信息；避免一屏堆积多层内容。',level:'一般表达建议',basis:'来自初稿长度与句子结构检查；历史数据不能证明分段本身提高转化。'});
 if(hasUsableText(d)&&dimensionEnabled(d,'closing')&&!/[？?]/.test(d.content.trim().slice(-90)))suggestions.push({id:'closing',title:'结尾补充一个具体的交流问题',why:'当前结尾没有明确的问题。可补充一个与本次目标对应的交流入口，让客户知道如何继续回应。',before:d.content.trim().slice(-120),after:closingFor(d),level:'一般表达建议',basis:`对应运营目标“${d.goal}”；属于待验证的沟通建议，没有独立效果证明。`});
 studio.report={input:JSON.parse(JSON.stringify(d)),key:draftKey(d),refs,suggestions,usable:usable.length,scope:`${md(END-Number(d.days)*DAY)}–${md(END-DAY)} · ${d.team} · ${d.stage} · ${d.topic}`,date:new Date().toISOString(),preserved:d.keep};studio.selected=suggestions.map(s=>s.id);studio.result=null;studio.step='report';saveStudio();render();window.scrollTo({top:0,behavior:'instant'})}

function generateVersion(keepOriginal=false){
 if(!reportCurrent()){toast('初稿已变化，请重新评估');return}
 if(!hasUsableText(studio.draft)){toast('媒体尚未解析，请补充至少 30 字符文案或脚本后体验文字优化');return}
 if(!keepOriginal&&!studio.selected.length){toast('请至少选择一条修改建议');return}
 if(keepOriginal)studio.selected=[];
 const d=studio.draft;let body=d.content.trim();
 if(studio.selected.includes('structure'))body=restructureText(body,d.keep);
 if(studio.selected.includes('opening'))body=openingFor(d)+'\n\n'+body;
 if(studio.selected.includes('closing'))body+='\n\n'+closingFor(d);
 if(d.format==='短视频'&&!keepOriginal){
   const parts=body.split(/\n\s*\n/).filter(Boolean),groupSize=Math.max(1,Math.ceil(parts.length/12)),groups=[];
   for(let i=0;i<parts.length;i+=groupSize)groups.push(parts.slice(i,i+groupSize).join('\n'));
   body=groups.map((p,i)=>`【第 ${i+1} 段】\n画面：展示本段要点，搭配运营提供的素材。\n口播：${p}`).join('\n\n');
 }
 if(body.length>24000){toast('优化后正文超过 24,000 字符，请减少拆段建议或精简初稿后重试；原稿已保留');return}
 studio.result={title:d.title,content:body,mode:keepOriginal?'original':'optimized',key:draftKey(d),selection:selectedKey(),version:(studio.result?.version||0)+1,status:'待人工确认'};
 studio.step='result';saveStudio();render();window.scrollTo({top:0,behavior:'instant'});

let toastTimer;function toast(text){$('#toast').textContent=text;$('#toast').hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('#toast').hidden=true,3200)}
let modalReturn=null;function showModal(title,body,foot=''){const el=$('#modal');if(!el.open)modalReturn=document.activeElement;el.classList.remove('feedback-drawer');el.innerHTML=`<div class="modal-head"><h2 id="modal-title">${title}</h2><button class="close" data-action="close" aria-label="关闭">×</button></div><div class="modal-body">${body}</div>${foot?`<div class="modal-foot">${foot}</div>`:''}`;if(!el.open)el.showModal();el.scrollTop=0}
function metrics(){showModal('指标口径与观察边界',`<div class="notice-box" style="margin-bottom:20px">当前均为虚构演示数据。触达记录覆盖 2026.09.19–10.18，结果观察至 10.25；所有触达均已获得完整 7 天观察窗口。</div><dl class="metric-list"><dt>使用次数 / 销售</dt><dd>记录到的素材发送次数 / 按员工 ID 去重的销售人数。员工与企微账号一对多，避免重复计算采用人数。</dd><dt>触达客户</dt><dd>当前范围内，按统一客户 ID 去重。素材维度和话术维度之间存在重叠，不能直接相加；总览重新去重。</dd><dt>客户开口率</dt><dd>触达后 24 小时内开口的客户数 ÷ 触达客户数。同一客户多次触达，只要有一次符合则计入该范围分子。</dd><dt>有效沟通率</dt><dd>在开口客户中表达进一步沟通意愿的客户数 ÷ 触达客户数。原型为预设事件标签，生产环境需要明确识别及抽检口径。</dd><dt>3 日关联支付率</dt><dd>触达后三天内存在支付订单的客户数 ÷ 触达客户数。支付时间须晚于触达时间；同一订单可以关联多份素材，不分配独占归因。3 日与 7 日为同一批订单的不同观察窗口，不是两个独立订单。</dd><dt>7 日关联支付率</dt><dd>触达后七天内存在支付订单的客户数 ÷ 触达客户数。支付时间须晚于触达时间；同一订单可以关联多份素材，不分配独占归因。</dd><dt>退款</dt><dd>关联订单中截至 10.25 已退款的订单数。退款观察期不统一，仅作补充，不用于排名。</dd><dt>排名与样本</dt><dd>先将触达客户 ≥ 80 的素材排前，再按选定指标排列。80 人是演示门槛，不代表统计显著；建议同阶段比较。</dd><dt>观察与归因</dt><dd>不提供阅读率。关联支付不证明素材导致成交；销售能力、客户质量、其他触点均可能影响结果。复盘建议为待验证假设。</dd></dl>`,btn('知道了','close','','primary'))}
function briefText(t){return`# ${t.title}\n\n任务：${t.id}\n状态：${t.status}\n依据范围：${t.scope}\n来源素材：${t.sourceIds.map(id=>byMaterial(id).title).join(' / ')}\n样本快照：${(t.snapshots||[]).map(s=>`${s.id}：触达 ${s.customers} 人，回复 ${s.replies} 人，关联支付 ${s.paid} 人`).join('；')}\n\n目标客户：${t.audience}\n素材形式：${t.format}\n\n## 创作假设\n${t.hypothesis}\n\n## 内容结构\n${t.structure}\n\n## 生成要求\n请根据以上目标和结构创作一份${t.format}。${t.instructions}\n仅依据提供的信息创作，不编造服务事实、客户案例或效果。\n\n## 验证计划\n主指标：${t.metric}\n${t.validation}\n新素材版本：${t.newVersion||'待制作'}\n\n说明：来源为虚构原型数据，创作方向为待验证假设，未证明因果提升。\n`}
function download(name,text,type='text/plain;charset=utf-8'){const blob=new Blob(['\ufeff',text],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}
async function copy(text){try{await navigator.clipboard.writeText(text);toast('已复制到剪贴板')}catch(e){showModal('复制内容',`<p class="muted tiny" style="margin-bottom:12px">当前浏览器无法自动复制，请选中下方内容后复制。</p><textarea id="copy-text" readonly style="min-height:280px">${esc(text)}</textarea>`,btn('关闭','close'));$('#copy-text').select()}}
function exportRows(){const list=state.page==='library'?ranked():rows(),cell=x=>'"'+String(x).replace(/"/g,'""')+'"',lines=[['触达期','团队','阶段','素材编号','标题','形式','销售人数','发送次数','触达客户','开口客户','开口率','3日关联支付客户','3日关联支付率','7日关联支付客户','7日关联支付率','样本状态','说明'],...list.map(({m,s})=>[`${date(END-state.days*DAY)} 至 ${date(END-DAY)}`,state.team,state.stage,m.id,m.title,m.format,s.sales,s.n,s.customers,s.replies,pct(s.replies,s.customers),s.paid3,pct(s.paid3,s.customers),s.paid,pct(s.paid,s.customers),m.isNew?'原始样例':s.customers===0?'暂无样本':s.customers>=80?'可供复盘':'样本不足',m.isNew?'新增原始素材；演示表现数据；不参与复盘':'虚构演示数据；关联非因果；跨素材客户不可相加'])];download(`素材效果-${state.days}天.csv`,lines.map(r=>r.map(cell).join(',')).join('\r\n'),'text/csv;charset=utf-8');toast('当前范围的素材效果报表已导出')}
document.addEventListener('click',async e=>{const button=e.target.closest('[data-action]');if(!button||button.disabled)return;const {action,id}=button.dataset;
 if(action==='go')go(id);
 else if(action==='detail')go('detail',id);
 else if(action==='days'){state.days=Number(id);state.pageNo=1;feedbackState.page=1;render()}
 else if(action==='metrics')metrics();
 else if(action==='source-view')sourceView(id);
 else if(action==='close')$('#modal').close();
 else if(action==='export')exportRows();
 else if(action==='prev'||action==='next'){state.pageNo+=action==='next'?1:-1;render()}
 else if(action==='detail-tab'){state.detailTab=id;render()}
 else if(action==='review-material'){if(!state.compareIds.includes(id))state.compareIds.push(id);go('review')}
 else if(action==='new-brief')enterOptimizer([id]);
 else if(action==='new-compare'){if(state.compareIds.length>=2)enterOptimizer([...state.compareIds])}

 else if(action==='export-brief'){const t=tasks.find(x=>x.id===id);if(t){download(`${t.id}-创作任务.md`,briefText(t));toast('创作任务已导出')}}

 else if(action==='copy-strategy'){const m=byMaterial(id),container=document.createElement('div');container.innerHTML=strategy(m,materialEvents(id));await copy(`素材：${m.title}\n适用：${m.stage}\n\n`+[...container.querySelectorAll('.strategy-step')].map(el=>el.innerText||el.textContent).join('\n\n'))}
 else if(action==='sales-case'){const person=bySales(id),list=materialEvents(state.detail).filter(t=>t.salesId===id).sort((a,b)=>b.ts-a.ts);showModal(`${person.name} · 素材使用记录`,`<p class="muted tiny" style="margin-bottom:15px">${scopeText()} · 共 ${list.length} 条记录，按最近触达展示。</p><div class="grid">${list.map(caseCard).join('')||'<div class="empty">暂无使用记录</div>'}</div>`)}
});
document.addEventListener('change',e=>{const el=e.target;if(el.id==='filter-team'){state.team=el.value;state.pageNo=1;feedbackState.page=1;render()}else if(el.id==='filter-stage'){state.stage=el.value;state.pageNo=1;feedbackState.page=1;render()}else if(el.id==='format-filter'){state.format=el.value;state.pageNo=1;render()}else if(el.id==='sort-filter'){state.sort=el.value;state.pageNo=1;render()}else if(el.id==='case-filter'){state.caseMode=el.value;feedbackState.page=1;refreshFeedback()}});
document.addEventListener('input',e=>{if(e.target.id==='material-search'){state.q=e.target.value;state.pageNo=1;$('#library-results').innerHTML=libraryResults()}else if(e.target.id==='sales-search'){state.salesQ=e.target.value;const events=materialEvents(state.detail),list=sales.filter(s=>state.team==='全部团队'||s.team===state.team).map(person=>({person,s:aggregate(events.filter(t=>t.salesId===person.id))})).sort((a,b)=>b.s.customers-a.s.customers);$('#sales-results').innerHTML=salesTable(list)}});

$('#modal').addEventListener('close',()=>{if(modalReturn?.isConnected)modalReturn.focus()});
function route(){const [page,id]=location.hash.slice(1).split('/');if(page==='detail'&&byMaterial(id)){state.page='detail';state.detail=id}else if(navs.some(x=>x[0]===page))state.page=page;else state.page='overview';render()}
window.addEventListener('hashchange',route);route();
// 仅暴露只读演示数据与聚合函数，方便核验看板和详情的同源口径。
window.MaterialGrowth={materials,sourceMaterials,allMaterials,sales,customers,touches,orders,aggregate,scoped,state,rows,ranked,tasks,START,END,SNAPSHOT,customerFeedbackRows,feedbackMatches,feedbackState,get studio(){return studio},get optRecords(){return optRecords},refsFor,deepPlan,deepCohorts,deepFactors,deepFeedback,deepOverlap,deepDiagnosis,deepBrief};
</script>
