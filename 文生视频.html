<main><section class="intro"><div><div class="eyebrow">VIDEO STUDIO</div><h1>让想法，成为画面。</h1><p>描述你想要的视频，或者用首尾帧定义画面的起点与终点。</p></div><div class="intro-mark"><i></i> 视频生成</div></section>
<section class="studio" aria-label="视频生成设置"><div class="workspace"><div class="prompt-pane"><label class="sr-only" for="promptInput">视频画面描述</label><div class="textarea-shell"><textarea id="promptInput" maxlength="2000" placeholder="例如：一瓶护肤精华放在浅色石台上，晨光从左侧照入。镜头缓慢推近，瓶身的水珠轻轻滑落，最后停留在产品正面，画面干净、自然。"></textarea><div class="prompt-foot"><div class="prompt-actions"><button class="optimize" id="optimizeBtn" disabled><svg fill="none" stroke="currentColor" stroke-width="1.5"><use href="#i-spark"/></svg><span id="optimizeLabel">一键优化提示词</span></button><button class="text-btn" id="undoBtn" hidden>撤销优化</button><span class="opt-status" id="optStatus" role="status"></span></div><div class="word-count"><span id="wordCount">0</span> / 2000</div></div><div class="frames-pane" aria-label="首尾帧图片，选填"><div class="frame-grid" id="frameGrid"></div><p class="frame-guide">首尾帧选填 · JPG / PNG · 每张不超过 10MB<br>添加首帧后可补充尾帧。</p></div></div>
</div>
</div>
<div class="controls"><div class="parameters"><div class="param"><label for="ratio">画幅比例</label><select id="ratio"><option value="9:16">9:16 · 竖屏</option><option value="16:9">16:9 · 横屏</option><option value="1:1">1:1 · 方形</option></select></div><div class="param"><label for="resolution">分辨率</label><select id="resolution"><option>720P</option><option>1080P</option></select></div><div class="param"><label for="duration">视频时长</label><select id="duration"><option value="5">5 秒</option><option value="10">10 秒</option><option value="30" selected>30 秒</option><option value="60">60 秒</option></select></div></div><div class="submit-area"><span class="submit-hint">文字或首帧，任意一种即可开始<br>每次生成 1 条视频</span><button class="generate" id="genBtn" disabled>生成视频<svg fill="none" stroke="currentColor" stroke-width="1.8"><use href="#i-arrow"/></svg></button></div></div><div id="formError" class="status-line" role="alert" hidden></div></section>

<script>
'use strict';
const $=id=>document.getElementById(id);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const state={first:null,last:null,reading:false,optimizing:false,undo:null,tasks:[],sequence:0,confirmAction:null};
function notify(message){$('toast').textContent=message;$('toast').hidden=false;clearTimeout(notify.timer);notify.timer=setTimeout(()=>$('toast').hidden=true,3000)}
function error(message=''){$('formError').textContent=message;$('formError').hidden=!message}
function update(){const prompt=$('promptInput').value;$('wordCount').textContent=prompt.length;$('optimizeBtn').disabled=!prompt.trim()||state.optimizing||state.reading;$('genBtn').disabled=(!prompt.trim()&&!state.first)||state.optimizing||state.reading;$('promptInput').readOnly=state.optimizing;$('undoBtn').hidden=!state.undo;$('undoBtn').disabled=state.optimizing;$('optimizeLabel').textContent=state.optimizing?'正在优化…':'一键优化提示词'}
function renderFrames(){const busy=state.reading; $('frameGrid').innerHTML=['first','last'].map(k=>{const image=state[k],label=k==='first'?'首帧':'尾帧',locked=k==='last'&&!state.first;return `<div class="frame-cell"><div class="frame-title"><span>${label}</span><small>${k==='first'?'画面的起点':'画面的终点'}</small></div><div class="frame-box ${locked?'locked':''}">${image?`<button class="image-open" data-preview="${k}" aria-label="预览${label}"><img src="${esc(image.src)}" alt="${label}图片"></button>`:`<button class="frame-upload" data-upload="${k}" ${locked||busy?'disabled':''}><svg fill="none" stroke="currentColor"><use href="#i-image"/></svg><strong>${locked?'先添加首帧':'上传'+label}</strong><small>${locked?'可在上传后补充尾帧':'点击选择图片'}</small></button>`}</div><div class="frame-tools">${image?`<span class="frame-name" title="${esc(image.name)}">${esc(image.name)}</span><button data-upload="${k}" ${busy?'disabled':''}>替换</button><button data-remove="${k}" ${busy?'disabled':''}>删除</button>`:`<span class="frame-name">${busy?'正在处理图片…':''}</span>`}</div></div>`}).join('')}
function confirmAction(title,text,action){state.confirmAction=action;$('confirmTitle').textContent=title;$('confirmText').textContent=text;$('confirmDialog').showModal();$('confirmCancel').focus()}
function closeConfirm(){state.confirmAction=null;$('confirmDialog').close()}
$('confirmCancel').onclick=closeConfirm;$('confirmClose').onclick=closeConfirm;$('confirmDialog').addEventListener('cancel',()=>{state.confirmAction=null});$('confirmOk').onclick=()=>{const action=state.confirmAction;closeConfirm();if(action)action()};
$('frameGrid').onclick=e=>{const button=e.target.closest('button');if(!button||state.reading)return;const upload=button.dataset.upload,remove=button.dataset.remove,preview=button.dataset.preview;if(upload){if(upload==='last'&&!state.first)return;$(upload+'File').click()}if(preview){$('largeImage').src=state[preview].src;$('largeImage').alt=preview==='first'?'首帧':'尾帧';$('imageTitle').textContent=$('largeImage').alt+'预览';$('imageDialog').showModal()}if(remove){const act=()=>{state[remove]=null;if(remove==='first')state.last=null;renderFrames();update();error()};if(remove==='first'&&state.last)confirmAction('删除首帧','删除首帧会同时移除尾帧，是否继续？',act);else act()}};
async function readImage(file){if(!['image/jpeg','image/png'].includes(file.type))throw Error('请上传 JPG 或 PNG 格式的图片。');if(file.size>10*1024*1024)throw Error('图片超过 10MB，请选择较小的文件。');const url=URL.createObjectURL(file);try{const img=new Image();img.src=url;await img.decode();const scale=Math.min(1,1600/Math.max(img.naturalWidth,img.naturalHeight)),canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(img.naturalWidth*scale));canvas.height=Math.max(1,Math.round(img.naturalHeight*scale));const ctx=canvas.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.drawImage(img,0,0,canvas.width,canvas.height);return {src:canvas.toDataURL('image/jpeg',.86),name:file.name}}catch(e){throw Error('图片无法读取，请更换有效的 JPG 或 PNG 图片。')}finally{URL.revokeObjectURL(url)}}
for(const k of ['first','last'])$(k+'File').onchange=async e=>{const file=e.target.files?.[0];if(!file||state.reading)return;if(k==='last'&&!state.first){e.target.value='';return}state.reading=true;error();renderFrames();update();try{state[k]=await readImage(file)}catch(err){error(err.message)}finally{state.reading=false;e.target.value='';renderFrames();update()}};
$('imageClose').onclick=()=>$('imageDialog').close();$('taskClose').onclick=()=>$('taskDialog').close();
$('promptInput').oninput=()=>{update();$('optStatus').textContent='';error()};
// 仅演示优化交互；真实服务应由后端调用 LLM，不在浏览器存放密钥。
async function simulateOptimize(original){
    await new Promise(resolve=>setTimeout(resolve,900));
    // 根据输入主题选择完整的演示文案，不拼接原文；原文只保存在撤销快照中。
    const subject=original.match(/护肤精华|精华液|保温杯|蓝牙耳机|咖啡|香水|口红|产品|人物|女孩|男孩|女性|男性|城市|街道|森林|海边|山川/);
    const name=subject?subject[0]:'画面主体';
    let result;
    if(/人物|女孩|男孩|女性|男性/.test(name)){
        result=`以${name}为视觉中心，采用自然的中近景构图。柔和光线勾勒面部与衣物细节，背景简洁，人物动作舒展自然。镜头随动作缓慢跟随，保持表情、姿态与环境连续，最后平稳停留在清晰的主体画面。整体节奏舒缓，避免突兀切换和夸张变形。`;
    }else if(/城市|街道|森林|海边|山川/.test(name)){
        result=`围绕${name}展开一段连贯的环境镜头。以宽阔的全景建立空间关系，再缓慢向前推进，逐渐呈现前景纹理与远处层次。光线自然，色彩协调，环境中的运动保持真实节奏。结尾平稳停留在构图完整的画面，避免跳切、闪烁与景物形变。`;
    }else{
        result=`以${name}为画面焦点，采用简洁、有层次的构图。柔和侧光呈现主体轮廓与表面质感，背景保持干净，突出关键细节。镜头从中景缓慢推近，主体运动自然流畅，整个过程保持外观与空间关系一致。最后停留在清晰的主体特写，画面稳定，避免突兀切换、闪烁和形变。`;
    }
    if(result.length>2000)throw Error('优化后的内容超过 2000 字，请精简描述后重试。');
    return result;
}
$('optimizeBtn').onclick=async()=>{if(state.optimizing||state.reading||!$('promptInput').value.trim())return;const before=$('promptInput').value;state.optimizing=true;$('optStatus').textContent='正在整理画面与镜头描述';error();update();try{const result=await simulateOptimize(before);if(result!==before){state.undo={before,after:result};$('promptInput').value=result;$('optStatus').textContent='已优化，可撤销'}else $('optStatus').textContent='当前描述已优化，无需重复处理'}catch(err){error(err.message);$('optStatus').textContent='优化未完成，原文已保留'}finally{state.optimizing=false;update()}};
$('undoBtn').onclick=()=>{if(!state.undo||state.optimizing)return;const undo=()=>{$('promptInput').value=state.undo.before;state.undo=null;$('optStatus').textContent='已恢复优化前的描述';error();update()};if($('promptInput').value!==state.undo.after)confirmAction('撤销提示词优化','你在优化后修改了文字。撤销会覆盖这些修改，并恢复优化前的完整文本。',undo);else undo()};
function renderTasks(){$('tasksSection').hidden=!state.tasks.length;$('taskCount').textContent=state.tasks.length+' 条任务';$('taskGrid').innerHTML=state.tasks.map(t=>`<article class="task" id="task-${t.id}"><div class="task-preview">${t.first?`<img src="${esc(t.first.src)}" alt="任务首帧示意">`:'<svg fill="none" stroke="currentColor"><use href="#i-film"/></svg>'}<span class="task-state">${t.progress<100?'<i class="busy-dot"></i>生成中 · '+t.progress+'%':'演示完成'}</span><div class="task-progress" style="width:${t.progress}%"></div></div><div class="task-body"><p class="task-title">${esc(t.prompt||'首帧生成视频')}</p><div class="task-meta"><span>${t.ratio} · ${t.resolution} · ${t.duration} 秒</span><button data-task="${t.id}">查看详情</button></div></div></article>`).join('')}
$('genBtn').onclick=()=>{if(state.optimizing||state.reading||(!$('promptInput').value.trim()&&!state.first))return;const task={id:++state.sequence,prompt:$('promptInput').value,first:state.first?{...state.first}:null,last:state.last?{...state.last}:null,ratio:$('ratio').value,resolution:$('resolution').value,duration:$('duration').value,progress:0};state.tasks.unshift(task);renderTasks();error();notify('已创建视频生成演示任务');const timer=setInterval(()=>{task.progress=Math.min(100,task.progress+20);const card=$('task-'+task.id);card.querySelector('.task-progress').style.width=task.progress+'%';card.querySelector('.task-state').textContent=task.progress<100?'生成中 · '+task.progress+'%':'演示完成';if(task.progress===100){clearInterval(timer);notify('生成演示完成，可查看任务详情')}},650)};
$('taskGrid').onclick=e=>{const button=e.target.closest('[data-task]');if(!button)return;const t=state.tasks.find(t=>t.id===Number(button.dataset.task));if(!t)return;$('taskDetail').innerHTML=`<div class="detail-meta">${t.ratio} · ${t.resolution} · ${t.duration} 秒</div><p>${esc(t.prompt||'未填写文字描述，使用首帧生成。')}</p>${t.first?`<div class="snapshot-frames"><figure><img src="${esc(t.first.src)}" alt="首帧"><figcaption>首帧</figcaption></figure>${t.last?`<figure><img src="${esc(t.last.src)}" alt="尾帧"><figcaption>尾帧</figcaption></figure>`:''}</div>`:''}<p style="margin-top:20px;font-size:11px">本任务为交互演示，未调用视频生成服务，也未产生可播放的视频文件。</p>`;$('taskDialog').showModal()};
renderFrames();update();
</script></body></html>
