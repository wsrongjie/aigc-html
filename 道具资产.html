<div class="main" id="libraryPage"><header class="topbar"><span>资产</span><span>/</span>道具</header><main><div class="heading"><div><h1>道具资产</h1><p>管理产品资料与四面视图，留存每一处产品细节。</p></div><button class="btn primary" id="create">＋ 新增道具</button></div><div class="toolbar"><input class="search" id="search" aria-label="搜索道具名称或产品细分类别" placeholder="搜索道具名称、产品细分类别"><span class="count" id="count"></span></div><div id="notice" role="alert"></div><div class="grid" id="list"></div></main></div>

<div class="main" id="editorPage" hidden><header class="topbar"><span>资产</span><span>/</span><a href="#/">道具</a><span>/</span><span id="breadcrumbMode">新增道具</span></header><main class="editor-page"><div class="heading"><div><h1 id="editorTitle">新增道具</h1><p>填写产品资料，上传完整的四面视图。</p></div><a class="btn" href="#/">返回道具首页</a></div><div id="editorNotice" role="alert"></div><div class="form-surface"><form id="form" novalidate><div class="dialog-body"><div class="fields"><div><label for="name">道具名称 <em>*</em></label><input id="name" maxlength="100" required placeholder="例如：轻润保湿精华"></div><div><label for="category">产品细分类别 <em>*</em></label><input id="category" maxlength="50" required placeholder="例如：面部精华、保温杯"></div></div><div class="label" style="margin-top:24px">产品四面视图 <em>*</em></div><p class="hint">四张图片全部必填。请上传同一产品，完整露出产品，背景尽量简洁。支持 JPG、PNG，单张不超过 10MB。</p><p class="hint">左右侧以你面对产品正面时为准：你左手一侧为左侧，右手一侧为右侧。参考图仅用于说明角度。</p><div class="views" id="views"></div><label for="remarks">备注 <span class="hint">选填</span></label><textarea id="remarks" maxlength="500" rows="3" placeholder="补充产品说明或需要注意的细节，最多 500 字"></textarea><div class="error" id="formError" role="alert"></div></div><div class="footer"><button class="btn" type="button" id="cancel">取消</button><button class="btn primary" type="submit" id="save">保存道具</button></div></form></div></main></div>
<dialog id="detail" aria-labelledby="detailTitle"><div class="dialog-head"><h2 id="detailTitle">道具详情</h2><button class="close" aria-label="关闭详情" id="closeDetail">×</button></div><div class="dialog-body" id="detailBody"></div><div class="footer"><button class="btn primary" id="editDetail">编辑道具</button></div></dialog>

function reference(angle){const front=angle==='front',back=angle==='back',wide=front||back,w=wide?50:29,x=(100-w)/2;return `<svg viewBox="0 0 100 120" role="img" aria-label="${angles.find(a=>a[0]===angle)[1]}参考视图"><ellipse cx="50" cy="108" rx="30" ry="5" fill="#dfe5ed"/><rect x="${x}" y="21" width="${w}" height="82" rx="3" fill="${wide?'#ecede6':'#daddd0'}" stroke="#a7b09b"/><rect x="${x}" y="21" width="${w}" height="12" fill="#5f7563"/>${front?'<circle cx="50" cy="56" r="10" fill="#93a982"/><text x="50" y="80" text-anchor="middle" font-size="8" fill="#536950">SERUM</text>':back?'<path d="M33 45h34 M33 51h34 M33 57h34 M33 63h25 M33 69h34 M33 85h34 M33 88h34" stroke="#8b9584" stroke-width="2"/>':`<path d="M${angle==='left'?39:59} 39v53" stroke="#a5ae99"/><text x="50" y="70" text-anchor="middle" font-size="8" fill="#66735d">${angle==='left'?'L':'R'}</text>`}</svg><span>参考视图</span>`}
function mockRecords(){return [['serum','植萃保湿精华','面部精华','30ml 玻璃瓶，浅绿色瓶身。'],['cup','日常随行保温杯','保温杯','500ml 雾蓝色杯身。'],['earbuds','轻音无线耳机','蓝牙耳机','浅紫色耳机与充电盒。'],['coffee','晨光拼配咖啡','咖啡豆','250g 袋装咖啡。']].map(([id,name,category,remarks])=>({id:'mock-prop-'+id,name,category,remarks:'示例道具：'+remarks,images:Object.fromEntries(angles.map(([a])=>[a,`assets/props/${id}-${a}.svg`]))}))}
function load(){readFailed=false;$('notice').textContent='';try{storageSnapshot=localStorage.getItem(key);const raw=JSON.parse(storageSnapshot||'[]');const legacy=Array.isArray(raw);const value=legacy?raw:raw.items;if(!legacy&&(raw.version!==2||raw.seeded!==true))throw Error();if(!Array.isArray(value)||value.some(r=>!r||typeof r.id!=='string'||typeof r.name!=='string'||typeof r.category!=='string'||typeof r.remarks!=='string'||!r.images||angles.some(([a])=>typeof r.images[a]!=='string'||!(/^(data:image\/(jpeg|png);base64,|assets\/props\/(serum|cup|earbuds|coffee)-(front|back|left|right)\.svg$)/.test(r.images[a])))))throw Error();records=value;if(legacy)persist([...records,...mockRecords().filter(m=>!records.some(r=>r.id===m.id))]);}catch(e){readFailed=true;$('notice').textContent='本地道具数据无法读取或初始化失败。为保护原有数据，暂不能保存和删除。';}render()}
function persist(next){if(readFailed)throw Error('本地数据无法读取，暂不能保存。');if(localStorage.getItem(key)!==storageSnapshot)throw Error('道具数据已在其他页面更新。请保留当前资料，刷新页面后重新编辑，避免覆盖他人的修改。');try{const serialized=JSON.stringify({version:2,seeded:true,items:next});localStorage.setItem(key,serialized);storageSnapshot=serialized}catch(e){throw Error('保存失败，浏览器存储空间不足或不可用。请保留表单，释放空间后重试。')}records=next;render()}
function render(){if(isEditor)return;const q=$('search').value.trim().toLowerCase(),shown=records.filter(r=>(r.name+' '+r.category).toLowerCase().includes(q));$('count').textContent=q?`找到 ${shown.length} 个道具 · 共 ${records.length} 个`:`共 ${records.length} 个道具`;$('list').innerHTML=shown.length?shown.map(r=>`<article class="card"><button class="delete-card" data-action="delete" data-id="${esc(r.id)}" aria-label="删除${esc(r.name)}" title="删除道具"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13M10 10v7M14 10v7"/></svg>删除</button><button class="cover" data-action="view" data-id="${esc(r.id)}" aria-label="查看${esc(r.name)}"><img src="${esc(imageSource(r.images.front))}" alt="${esc(r.name)}正面图"></button><div class="card-body"><h3>${esc(r.name)}</h3><span class="tag">${esc(r.category)}</span></div><div class="actions"><span class="hint">四面视图 · 4/4</span><div><button class="link" data-action="edit" data-id="${esc(r.id)}">编辑</button></div></div></article>`).join(''):`<div class="empty"><div class="icon">▣</div><h2>${q?'没有找到匹配的道具':'还没有道具资产'}</h2><p>${q?'试试其他产品名称或细分类别。':'添加产品资料与前后左右四张图片，创建你的第一个道具。'}</p>${q?'':'<button class="btn primary" data-action="create">＋ 新增道具</button>'}</div>`}
function drawViews(){ $('views').innerHTML=angles.map(([a,label])=>`<section class="view" id="view-${a}"><div class="label">${label} <em>*</em>${a==='front'?' <span class="hint">默认封面</span>':''}</div><div class="view-row"><button type="button" class="upload" data-upload="${a}" aria-label="上传${label}图">${draft[a]?`<img src="${esc(imageSource(draft[a]))}" alt="${label}图">`:`<span>＋<br>上传${label}图</span>`}</button><div class="reference">${reference(a)}</div></div><input type="file" id="file-${a}" data-file="${a}" accept="image/jpeg,image/png" hidden><div class="view-actions">${draft[a]?`<button type="button" class="link" data-preview="${a}">放大预览</button><button type="button" class="link" data-upload="${a}">替换</button><button type="button" class="link danger" data-remove="${a}">移除</button>`:''}</div></section>`).join('')}
function openEditor(id){location.hash=id?'#/edit?id='+encodeURIComponent(id):'#/new'}
function initEditor(){const id=location.hash.startsWith('#/edit')?new URLSearchParams(location.hash.split('?')[1]||'').get('id'):null,r=records.find(r=>r.id===id);if(readFailed||(location.hash.startsWith('#/edit')&&!r)){$('form').hidden=true;if(!readFailed)$('editorNotice').textContent='该道具已被删除或不存在，请返回道具首页。';return}editId=r?.id||null;draft=r?{...r.images}:{};$('name').value=r?.name||'';$('category').value=r?.category||'';$('remarks').value=r?.remarks||'';$('editorTitle').textContent=r?'编辑道具':'新增道具';$('breadcrumbMode').textContent=$('editorTitle').textContent;document.title=$('editorTitle').textContent;drawViews()}
function closeEditor(){if(pending){toast('图片处理中，请稍候');return}location.hash='#/'}
function zoom(src,label){$('zoomImage').src=imageSource(src);$('zoomImage').alt=label;$('zoomTitle').textContent=label;$('zoom').showModal()}
function showDetail(id){const r=records.find(r=>r.id===id);if(!r)return;detailId=id;$('detailTitle').textContent=r.name;$('detailBody').innerHTML=`<span class="tag">${esc(r.category)}</span><div class="detail-images">${angles.map(([a,label])=>`<div><button data-detail-preview="${a}" aria-label="放大${label}图"><img src="${esc(imageSource(r.images[a]))}" alt="${label}图"></button><p>${label}${a==='front'?' · 默认封面':''}</p></div>`).join('')}</div><div class="label">备注</div><div class="note">${esc(r.remarks||'暂无备注')}</div>`;$('detail').showModal()}
async function readImage(file){if(!['image/jpeg','image/png'].includes(file.type))throw Error('请上传 JPG 或 PNG 图片。');if(file.size>10*1024*1024)throw Error('图片超过 10MB，请选择较小的图片。');const url=URL.createObjectURL(file);try{const img=new Image();img.src=url;await img.decode();const ratio=Math.min(1,1000/Math.max(img.naturalWidth,img.naturalHeight));const canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(img.naturalWidth*ratio));canvas.height=Math.max(1,Math.round(img.naturalHeight*ratio));const ctx=canvas.getContext('2d');ctx.fillStyle='#ffffff';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.drawImage(img,0,0,canvas.width,canvas.height);return canvas.toDataURL('image/jpeg',.8)}catch(e){throw Error('图片无法读取，请换一张有效的 JPG 或 PNG 图片。')}finally{URL.revokeObjectURL(url)}}
$('views').onclick=e=>{const b=e.target.closest('button');if(!b||pending)return;if(b.dataset.upload)$('file-'+b.dataset.upload).click();if(b.dataset.preview)zoom(draft[b.dataset.preview],angles.find(a=>a[0]===b.dataset.preview)[1]);if(b.dataset.remove){delete draft[b.dataset.remove];drawViews()}};
$('views').onchange=async e=>{const a=e.target.dataset.file,file=e.target.files?.[0];if(!a||!file||pending)return;const token=session;pending++;$('save').disabled=true;$('formError').textContent='正在处理图片…';try{const data=await readImage(file);if(token===session){draft[a]=data;drawViews();$('formError').textContent=''}}catch(err){if(token===session)$('formError').textContent=err.message}finally{pending--;$('save').disabled=false;e.target.value=''}};
$('form').onsubmit=e=>{e.preventDefault();if(pending)return;$('formError').textContent='';for(const [id,label] of [['name','道具名称'],['category','产品细分类别']]){if(!$(id).value.trim()){$('formError').textContent=`请填写${label}。`;$(id).focus();return}}const missing=angles.filter(([a])=>!draft[a]);document.querySelectorAll('.view').forEach(v=>v.classList.remove('invalid'));if(missing.length){missing.forEach(([a])=>$('view-'+a).classList.add('invalid'));$('formError').textContent='请补齐'+missing.map(a=>a[1]).join('、')+'图片，四张全部上传后才能保存。';$('view-'+missing[0][0]).scrollIntoView({block:'center'});$('view-'+missing[0][0]).querySelector('button').focus();return}const item={id:editId||'prop-'+Date.now()+'-'+Math.random().toString(36).slice(2,9),name:$('name').value.trim(),category:$('category').value.trim(),remarks:$('remarks').value.trim(),images:{...draft}};try{persist(editId?records.map(r=>r.id===editId?item:r):[item,...records]);location.hash='#/';toast(editId?'道具已更新':'道具已创建')}catch(err){$('formError').textContent=err.message}};
$('cancel').onclick=closeEditor;
$('list').onclick=e=>{const b=e.target.closest('button');if(!b)return;const id=b.dataset.id;if(b.dataset.action==='create')openEditor();if(b.dataset.action==='view')showDetail(id);if(b.dataset.action==='edit')openEditor(id);if(b.dataset.action==='delete'){deleteId=id;$('deleteName').textContent=records.find(r=>r.id===id)?.name||'';$('deleteError').textContent='';$('deleteDialog').showModal();$('cancelDelete').focus()}};
let deleteId=null;$('cancelDelete').onclick=()=>$('deleteDialog').close();$('confirmDelete').onclick=()=>{try{persist(records.filter(r=>r.id!==deleteId));$('deleteDialog').close();toast('道具已删除')}catch(err){$('deleteError').textContent=err.message}};

$('detailBody').onclick=e=>{const b=e.target.closest('[data-detail-preview]');if(b){const r=records.find(r=>r.id===detailId),a=b.dataset.detailPreview;zoom(r.images[a],angles.find(v=>v[0]===a)[1])}};
$('create').onclick=()=>openEditor();$('search').oninput=render;$('closeDetail').onclick=()=>$('detail').close();$('editDetail').onclick=()=>openEditor(detailId);
$('closeZoom').onclick=()=>$('zoom').close();
// 在同一文件内切换完整页面，支持刷新、浏览器前进和后退。
function route(){
    session++;
    document.querySelectorAll('dialog[open]').forEach(dialog=>dialog.close());
    isEditor=location.hash==='#/new'||location.hash.startsWith('#/edit');
    $('libraryPage').hidden=isEditor;
    $('editorPage').hidden=!isEditor;
    $('form').hidden=false;
    $('formError').textContent='';
    load();
    $('editorNotice').textContent=$('notice').textContent;
    if(isEditor)initEditor();
    else{document.title='道具资产';render();}
    window.scrollTo(0,0);
}
window.addEventListener('hashchange',route);
window.addEventListener('pageshow',e=>{if(e.persisted)route()});
route();

</script></body></html>
