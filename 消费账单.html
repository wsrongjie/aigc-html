function action(x){return '<td><button class="btn-text" onclick="openDetail(\''+x.id+'\')">详情</button></td>'}function tag(t){return '<span class="tag tag-blue">'+t+'</span>'}function statusTag(s){var cls=(s==='已失败'||s==='已驳回')?'tag-red':(s==='已过期'||s==='待审核')?'tag-orange':'tag-green';return '<span class="tag '+cls+'">'+s+'</span>'}function num(n){return Number(n).toLocaleString('zh-CN')}
function escapeBillHtml(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function openDetail(id){var x;Object.keys(data).some(function(k){x=data[k].find(function(r){return r.id===id});return !!x});if(!x)return;document.getElementById('drawerTitle').textContent=x.title;document.getElementById('drawerSub').textContent=x.id;var html;if(state.ledger==='refunds'){html='<div class="detail">'+dl('申请编号',escapeBillHtml(x.id))+dl('关联任务',escapeBillHtml(x.ref))+dl('申请人',escapeBillHtml(x.member))+dl('申请时间',escapeBillHtml(x.time))+dl('申请积分',num(x.change)+' 积分')+dl('当前状态',escapeBillHtml(x.status))+dl('问题描述',escapeBillHtml(x.detail))+dl('问题截图',(x.attachments||[]).length+' 张')+dl('承诺处理时间',escapeBillHtml(x.dueAt))+dl('处理人',escapeBillHtml(x.reviewer))+dl('处理时间',escapeBillHtml(x.handledAt))+dl('处理说明',escapeBillHtml(x.reviewNote))+'</div>';if((x.attachments||[]).length)html+='<div class="proof-grid">'+x.attachments.map(function(a){return '<img src="'+a.dataUrl+'" alt="问题截图" title="点击查看原图" onclick="window.open(this.src,\'_blank\')">'}).join('')+'</div>';if(x.chargeSnapshot.length)html+='<div class="notice">实际扣费组件：'+x.chargeSnapshot.map(function(c){return escapeBillHtml(c.label)+' '+Number(c.refundablePoints)+'积分'}).join('；')+'。语音合成免费，不参与退还。</div>';if(x.refundTransactions.length)html+='<div class="notice">退还批次：'+x.refundTransactions.map(function(t){return escapeBillHtml(t.batchId)+'（'+Number(t.points)+'积分，'+escapeBillHtml(t.expiresAt)+'到期）'}).join('；')+'</div>'}else{html='<div class="detail">'+dl('记录类型',escapeBillHtml(x.type))+dl('发生时间',escapeBillHtml(x.time))+dl('成员/操作人',escapeBillHtml(x.member))+dl('关联编号',escapeBillHtml(x.ref))+dl('说明',escapeBillHtml(x.desc))+dl(state.ledger==='rights'?'并发变化':'积分变化',(x.change>0?'+':'')+x.change)+dl('状态',escapeBillHtml(x.status));if(x.batch)html+=dl('积分批次',escapeBillHtml(x.batch))+dl('到期时间',escapeBillHtml(x.expire));if(x.start)html+=dl('生效时间',escapeBillHtml(x.start))+dl('到期时间',escapeBillHtml(x.expire));html+='</div>';if(x.detail)html+='<div class="notice">扣减追溯：'+escapeBillHtml(x.detail)+'</div>'}document.getElementById('drawerBody').innerHTML=html;document.getElementById('drawerMask').classList.add('show')}
function dl(k,v){return '<div class="detail-line"><span>'+k+'</span><b>'+v+'</b></div>'}function closeDrawer(){document.getElementById('drawerMask').classList.remove('show')}function resetFilters(){document.getElementById('keyword').value='';document.getElementById('status').value='all';document.getElementById('start').value='';document.getElementById('end').value='';render()}var timer;function toast(msg){var e=document.getElementById('toast');e.textContent=msg;e.className='toast show';clearTimeout(timer);timer=setTimeout(function(){e.className='toast'},1600)}document.getElementById('drawerMask').addEventListener('click',function(e){if(e.target===this)closeDrawer()});window.addEventListener('xingzao-refund-change',function(){syncCommercialState();render()});syncCommercialState();syncRefundData();if(location.hash==='#credits')setLedger('credits');else if(location.hash==='#refunds')setLedger('refunds');else if(location.hash==='#rights')setLedger('rights');else setLedger('generation');
</script></body></html>
