<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>合规检查</title>
  <style>
    :root {
      --blue: #2f6bff; --blue-deep: #1746b8; --blue-soft: #edf3ff;
      --ink: #172033; --muted: #7b8497; --line: #e5e9f1; --panel: #ffffff; --canvas: #f3f5f8;
      --mint: #0aa78f; --mint-soft: #e6f8f4; --amber: #d98600; --amber-soft: #fff5df;
      --red: #d83b4a; --red-soft: #fff0f1;
      --shadow: 0 12px 32px rgba(22, 34, 58, 0.08);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      color: var(--ink);
      background: radial-gradient(circle at 72% 0%, rgba(47,107,255,.07), transparent 32%), var(--canvas);
      font-family: "Microsoft YaHei", "PingFang SC", sans-serif; font-size: 14px;
    }
    button, input, textarea, select { font: inherit; }
    button { color: inherit; }

    .sidebar {
      position: fixed; inset: 0 auto 0 0; width: 56px; z-index: 20;
      display: flex; flex-direction: column; align-items: center; gap: 4px;
      padding: 16px 0; background: #fff; border-right: 1px solid #e8e8e8;
    }
    .logo { width: 32px; height: 32px; margin-bottom: 16px; display: grid; place-items: center; }
    .logo svg { width: 28px; height: 28px; }
    .sidebar-item {
      width: 40px; height: 40px; border-radius: 10px;
      display: flex; flex-direction: column; gap: 4px; align-items: center; justify-content: center;
      color: #999; text-decoration: none; font-size: 9px; transition: .18s ease;
    }
    .sidebar-item .icon { font-size: 16px; line-height: 1; }
    .sidebar-item:hover { color: #0066ff; background: #f5f5f5; }
    .sidebar-item.active { color: #0066ff; background: #eef4ff; }
    .sidebar-divider { width: 24px; height: 1px; margin: 8px 0; background: #e8e8e8; }

    .main { margin-left: 56px; min-height: 100vh; }
    .topbar {
      height: 48px; padding: 0 32px; display: flex; align-items: center; justify-content: space-between;
      background: #fff; border-bottom: 1px solid #e8e8e8; position: sticky; top: 0; z-index: 15;
    }
    .topbar-brand { font-size: 13px; font-weight: 600; letter-spacing: 1px; }
    .topbar-right { display: flex; align-items: center; gap: 14px; color: var(--muted); font-size: 12px; }
    .prototype-tag { padding: 5px 9px; border-radius: 999px; background: #eef1f5; color: #697386; }
    .avatar { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; color: #fff; font-size: 11px; font-weight: 700; background: linear-gradient(135deg,#334155,#64748b); }

    .page-head { padding: 22px 26px 18px; display: flex; align-items: flex-end; justify-content: space-between; gap: 24px; }
    .eyebrow { margin-bottom: 7px; color: var(--blue); font-size: 11px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; }
    h1 { margin: 0; font-family: "Songti SC", "STSong", serif; font-size: 27px; letter-spacing: -.02em; }
    .page-desc { margin: 7px 0 0; color: var(--muted); font-size: 13px; }
    .head-note { max-width: 310px; color: #6d778a; font-size: 11px; line-height: 1.6; text-align: right; }

    .workspace {
      padding: 0 26px 26px; display: grid;       grid-template-columns: 338px minmax(440px, 1fr);
      gap: 16px; height: calc(100vh - 152px); min-height: 560px;
    }
    .panel { background: var(--panel); border: 1px solid #e8ebf0; border-radius: 14px; box-shadow: 0 2px 12px rgba(22,34,58,.03); min-height: 0; }

    .primary-btn { width: 100%; height: 42px; border: 0; border-radius: 10px; background: var(--blue); color: #fff; font-weight: 800; cursor: pointer; box-shadow: 0 8px 18px rgba(47,107,255,.2); transition: .18s ease; }
    .primary-btn:hover { background: #245de6; transform: translateY(-1px); }
    .primary-btn:disabled { background: #aebbd9; box-shadow: none; cursor: wait; transform: none; }
    .ghost-btn { height: 31px; padding: 0 10px; border: 1px solid #dfe4ec; border-radius: 8px; background: #fff; color: #5e687b; font-size: 10px; font-weight: 700; cursor: pointer; }
    .ghost-btn:hover:not(:disabled) { color: var(--blue); border-color: #aec2fb; background: var(--blue-soft); }
    .ghost-btn:disabled { opacity: .4; cursor: not-allowed; }
    .quick-chip { border: 1px solid #e2e7ef; border-radius: 999px; padding: 6px 12px; background: #fff; color: #687286; font-size: 11px; cursor: pointer; transition: .15s; }
    .quick-chip:hover { color: var(--blue); border-color: #a9c0ff; background: var(--blue-soft); }

    .editor-panel { display: flex; flex-direction: column; min-width: 0; overflow: hidden; }
    .editor-top { min-height: 57px; padding: 12px 15px; display: flex; align-items: center; justify-content: space-between; gap: 12px; border-bottom: 1px solid var(--line); }
    .editor-heading { font-weight: 800; }
    .editor-sub { margin-top: 3px; color: var(--muted); font-size: 10px; }
    .global-actions { display: flex; gap: 6px; }
    .check-inline-panel { flex: 0 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 18px; padding: 10px 14px; border-bottom: 1px solid #e7ebf1; background: #f8fafc; }
    .check-inline-copy { min-width: 0; }
    .check-inline-copy strong { display: block; font-size: 12px; }
    .check-inline-copy span { display: block; margin-top: 3px; color: var(--muted); font-size: 10px; }
    .check-actions { display: flex; align-items: center; justify-content: flex-end; gap: 8px; flex-wrap: wrap; flex-shrink: 0; }
    .check-actions .quick-chip { height: 32px; padding: 0 12px; }
    .check-actions .primary-btn { width: auto; height: 32px; padding: 0 16px; box-shadow: none; font-size: 12px; }

    .drafts-list { flex: 1; min-width: 0; min-height: 0; overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 12px; }
    .draft-card { border: 1px solid #e8ebf0; border-radius: 12px; flex: 0 0 auto; background: #fff; overflow: hidden; transition: border-color .18s, box-shadow .18s; }
    .draft-card:hover { border-color: #cdd4e0; }
    .draft-card.active { border-color: #8eaeff; box-shadow: 0 0 0 2px rgba(47,107,255,.1), 0 4px 16px rgba(47,107,255,.06); }
    .draft-card-header { display: flex; align-items: center; justify-content: space-between; padding: 8px 12px; background: #fafbfc; border-bottom: 1px solid #eff2f6; gap: 6px; }
    .draft-select { width: 15px; height: 15px; margin: 0 2px 0 0; accent-color: var(--blue); cursor: pointer; flex-shrink: 0; }
    .draft-card-num { font-size: 11px; font-weight: 800; color: var(--muted); flex-shrink: 0; }
    .draft-card-title-input {
      flex: 1; min-width: 0; border: 0; outline: 0; background: transparent;
      font-size: 12px; font-weight: 700; color: var(--ink);
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-family: inherit;
    }
    .draft-card-title-input:focus { background: #fff; border-radius: 4px; box-shadow: 0 0 0 2px rgba(47,107,255,.15); }
    .draft-card-status { padding: 3px 7px; border-radius: 999px; font-size: 9px; font-weight: 700; flex-shrink: 0; background: #f0f2f6; color: #727b8c; }
    .draft-card-status.attention { background: var(--amber-soft); color: #a36600; }
    .draft-card-status.clear { background: var(--mint-soft); color: #087b6a; }
    .draft-card-status.checking { background: var(--blue-soft); color: var(--blue-deep); }
    .draft-card-status.stale { background: #f1f3f6; color: #687286; }
    .draft-card-body-wrap { min-height: 124px; height: 124px; resize: vertical; overflow-x: hidden; overflow-y: auto; }
    .draft-card-body-wrap::-webkit-resizer { display: block; }
    .draft-card-body {
      padding: 12px 14px; font-size: 14px; line-height: 1.85; color: #202a3d;
      white-space: pre-wrap; word-break: break-word; min-height: 100%; box-sizing: border-box; outline: none;
    }
    .draft-card-body mark { border-radius: 2px; padding: 0 1px; cursor: pointer; }
    .draft-card-body mark.risk-high { background: #fdd8dc; color: #7f1d2a; }
    .draft-card-body mark.risk-medium { background: #fdecc8; color: #7a5200; }
    .draft-card-body mark.risk-low { background: #e9ecf2; color: #4a5466; }
    .draft-card-body mark.pulse-highlight { outline: 3px solid var(--blue); outline-offset: 1px; }
    .draft-card-foot { padding: 6px 10px; border-top: 1px solid #eff2f6; display: flex; align-items: center; justify-content: space-between; gap: 6px; }
    .draft-card-meta { font-size: 10px; color: #8c94a4; }
    .draft-card-meta strong { color: #4b566a; }
    .draft-card-actions { display: flex; gap: 4px; }
    .card-action-btn {
      height: 24px; padding: 0 8px; border: 1px solid #dfe4ec; border-radius: 6px;
      background: #fff; color: #5e687b; font-size: 10px; cursor: pointer; font-family: inherit;
    }
    .card-action-btn:hover { color: var(--blue); border-color: #aec2fb; background: var(--blue-soft); }
    .card-more-btn {
      width: 24px; height: 24px; border: 0; border-radius: 5px; background: transparent; color: #8d95a5;
      font-size: 14px; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    }
    .card-more-btn:hover { background: #eef1f6; color: var(--blue); }
    .draft-popover {
      position: fixed; z-index: 35; min-width: 170px; padding: 6px;
      background: #fff; border: 1px solid #e5e9f1; border-radius: 10px; box-shadow: 0 14px 36px rgba(22,34,58,.14);
    }
    .draft-popover button { display: block; width: 100%; padding: 8px 10px; border: 0; border-radius: 7px; background: transparent; font-size: 11px; text-align: left; cursor: pointer; color: var(--ink); }
    .draft-popover button:hover { background: var(--blue-soft); color: var(--blue); }

    .loading-state { display: none; flex: 1; place-items: center; text-align: center; }
    .loading-state.show { display: grid; }
    .loader-ring { width: 42px; height: 42px; margin: 0 auto 14px; border: 3px solid #e5ebf8; border-top-color: var(--blue); border-radius: 50%; animation: spin .8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-title { font-weight: 800; }
    .loading-copy { margin-top: 6px; color: var(--muted); font-size: 11px; }

    .insight-panel { display: flex; flex-direction: column; overflow: hidden; }
    .insight-tabs { padding: 12px; display: grid; grid-template-columns: 1fr 1fr; gap: 6px; border-bottom: 1px solid var(--line); }
    .insight-tab { height: 34px; border: 0; border-radius: 8px; background: #f4f6f9; color: #717a8b; font-size: 11px; font-weight: 700; cursor: pointer; }
    .insight-tab.active { color: #fff; background: #243551; }
    .insight-scroll { flex: 1; overflow-y: auto; padding: 15px; }
    .insight-content { display: none; }
    .insight-content.active { display: block; }
    .insight-empty { margin-top: 70px; color: #9aa2b0; text-align: center; font-size: 11px; line-height: 1.7; }
    .insight-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
    .insight-title { font-size: 14px; font-weight: 800; }
    .insight-desc { margin-top: 4px; color: var(--muted); font-size: 10px; line-height: 1.5; }
    .quality-item { padding: 12px 0; display: grid; grid-template-columns: 26px 1fr; gap: 9px; border-bottom: 1px solid #edf0f4; }
    .quality-item:last-child { border-bottom: 0; }
    .quality-icon { width: 24px; height: 24px; display: grid; place-items: center; border-radius: 7px; background: var(--mint-soft); color: var(--mint); font-size: 11px; font-weight: 900; }
    .quality-item.warn .quality-icon { background: var(--amber-soft); color: var(--amber); }
    .quality-name { font-size: 11px; font-weight: 800; }
    .quality-note { margin-top: 4px; color: #7f8898; font-size: 10px; line-height: 1.55; }
    .risk-summary { display: grid; grid-template-columns: repeat(3,1fr); gap: 6px; margin-bottom: 13px; }
    .risk-count { padding: 9px 5px; border-radius: 8px; text-align: center; background: #f5f6f8; }
    .risk-count strong { display: block; font-size: 17px; }
    .risk-count span { color: #8a92a1; font-size: 9px; }
    .risk-count.high strong { color: var(--red); }
    .risk-count.medium strong { color: var(--amber); }
    .risk-count.low strong { color: #627087; }
    .risk-card { margin-bottom: 9px; padding: 12px; border: 1px solid #e6e9ef; border-radius: 10px; background: #fff; }
    .risk-card[onclick] { cursor: pointer; transition: box-shadow .15s; }
    .risk-card[onclick]:hover { box-shadow: 0 0 0 2px var(--blue); }
    .risk-card.high { border-left: 3px solid var(--red); }
    .risk-card.medium { border-left: 3px solid var(--amber); }
    .risk-card.low { border-left: 3px solid #8490a4; }
    .risk-top { display: flex; justify-content: space-between; gap: 8px; align-items: center; }
    .risk-type { font-size: 11px; font-weight: 800; }
    .risk-level { padding: 3px 6px; border-radius: 999px; font-size: 10px; font-weight: 800; }
    .risk-level.high { color: var(--red); background: var(--red-soft); }
    .risk-level.medium { color: var(--amber); background: var(--amber-soft); }
    .risk-level.low { color: #647084; background: #eff1f5; }
    .risk-quote { margin: 8px 0; padding: 7px 8px; border-radius: 6px; background: #f7f8fa; color: #3e495c; font-size: 12px; line-height: 1.55; }
    .risk-reason { color: #798293; font-size: 12px; line-height: 1.65; }
    .risk-suggestion { margin-top: 7px; color: #355a8b; font-size: 12px; line-height: 1.65; }
    .apply-btn { width: 100%; height: 31px; margin-top: 9px; border: 1px solid #b7c9f8; border-radius: 7px; background: var(--blue-soft); color: var(--blue-deep); font-size: 10px; font-weight: 800; cursor: pointer; }
    .risk-card.adopted { border-left: 3px solid var(--mint); background: #f4fbf9; }
    .risk-card.adopted .risk-quote { background: #e7f5f1; color: #1f5a4e; }
    .adopted-box { margin-bottom: 10px; }
    .adopted-box .risk-card:last-child { margin-bottom: 0; }
    .undo-btn { width: 100%; height: 31px; margin-top: 9px; border: 1px solid #e0e4ea; border-radius: 7px; background: #fff; color: #5e687b; font-size: 10px; font-weight: 700; cursor: pointer; }
    .undo-btn:hover { color: var(--blue); border-color: #aec2fb; background: var(--blue-soft); }
    .compliance-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; margin-bottom: 12px; }
    .compliance-actions button { height: 32px; border: 1px solid #dce2ec; border-radius: 8px; background: #fff; color: #566175; font-size: 10px; font-weight: 700; cursor: pointer; }
    .compliance-actions button.primary { border-color: #9db8ff; color: var(--blue-deep); background: var(--blue-soft); }
    .clear-box { padding: 18px 12px; border-radius: 10px; background: var(--mint-soft); color: #127666; text-align: center; font-size: 11px; line-height: 1.7; }
    .stale-box { padding: 13px; border-radius: 10px; background: #f1f3f6; color: #687286; font-size: 10px; line-height: 1.6; }
    .disclaimer { padding: 11px 14px; border-top: 1px solid var(--line); background: #fafbfc; color: #7d8798; font-size: 11px; line-height: 1.65; }
    .disclaimer strong { color: #5d6677; }

    .toast { position: fixed; left: 50%; bottom: 30px; z-index: 100; transform: translate(-50%, 18px); display: flex; align-items: center; gap: 14px; padding: 10px 16px; border-radius: 9px; background: #172033; color: #fff; opacity: 0; pointer-events: none; transition: .22s ease; box-shadow: var(--shadow); font-size: 11px; max-width: 80vw; }
    .toast.show { opacity: 1; transform: translate(-50%, 0); pointer-events: auto; }
    .toast-action { border: 0; background: transparent; color: #7da0ff; font-weight: 800; font-size: 11px; cursor: pointer; padding: 0; font-family: inherit; }
    .toast-action:hover { text-decoration: underline; }

    .handoff-banner {
      position: fixed; top: 60px; right: 26px; z-index: 95; width: 300px;
      display: flex; align-items: center; gap: 10px; padding: 11px 12px;
      background: #fff; border: 1px solid #d9e5ff; border-radius: 12px; box-shadow: 0 14px 34px rgba(22,34,58,.14);
      opacity: 0; transform: translateY(-8px); transition: .25s ease; pointer-events: none;
    }
    .handoff-banner.show { opacity: 1; transform: translateY(0); pointer-events: auto; }
    .hb-icon { width: 34px; height: 34px; border-radius: 9px; background: var(--blue-soft); display: grid; place-items: center; font-size: 15px; flex-shrink: 0; }
    .hb-body { flex: 1; min-width: 0; }
    .hb-body strong { display: block; font-size: 11px; }
    .hb-body span { display: block; margin-top: 2px; color: var(--muted); font-size: 10px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .hb-close { border: 0; background: transparent; color: #98a0af; cursor: pointer; font-size: 14px; padding: 2px; }

    .batch-bar {
      position: fixed; left: 50%; bottom: 72px; z-index: 90; transform: translate(-50%, 16px);
      display: flex; align-items: center; gap: 10px; padding: 9px 14px;
      background: #172033; color: #fff; border-radius: 12px; box-shadow: 0 16px 38px rgba(22,34,58,.3);
      opacity: 0; pointer-events: none; transition: .22s ease;
    }
    .batch-bar.show { opacity: 1; transform: translate(-50%, 0); pointer-events: auto; }
    .batch-count { font-size: 12px; font-weight: 800; }
    .batch-btn { height: 28px; padding: 0 12px; border: 0; border-radius: 8px; background: var(--blue); color: #fff; font-size: 11px; font-weight: 700; cursor: pointer; }
    .batch-btn:hover { background: #245de6; }
    .batch-btn.ghost { background: rgba(255,255,255,.12); }
    .batch-btn.ghost:hover { background: rgba(255,255,255,.2); }

    .crumb { margin-bottom: 9px; font-size: 11px; color: #98a0af; }
    .crumb a { color: #687286; text-decoration: none; }
    .crumb a:hover { color: var(--blue); text-decoration: underline; }
    .crumb span { color: #4b566a; font-weight: 700; }

    .expand-btn { border: 0; background: transparent; color: #98a0af; font-size: 10px; cursor: pointer; padding: 0 4px; font-family: inherit; }
    .expand-btn:hover { color: var(--blue); }
    .draft-card-body-wrap.expanded { height: 320px; }

    .modal-overlay {
      position: fixed; inset: 0; z-index: 110;
      background: rgba(15,20,35,.38); backdrop-filter: blur(2px);
      display: flex; align-items: center; justify-content: center;
    }
    .diff-dialog { width: 520px; max-width: 92vw; max-height: 80vh; background: #fff; border-radius: 14px; box-shadow: var(--shadow); overflow: hidden; display: flex; flex-direction: column; }
    .diff-header { padding: 14px 18px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #e8ebf1; }
    .diff-header strong { font-size: 14px; }
    .diff-close { width: 28px; height: 28px; border: 0; border-radius: 50%; background: #f0f2f5; color: #697386; cursor: pointer; font-size: 16px; display: flex; align-items: center; justify-content: center; }
    .diff-close:hover { background: #e0e3e8; }
    .diff-body { padding: 18px; overflow-y: auto; }
    .diff-label { font-size: 11px; font-weight: 700; color: #8b94a4; margin-bottom: 8px; }
    .diff-original, .diff-replacement { padding: 12px 14px; border-radius: 8px; font-size: 13px; line-height: 1.75; margin-bottom: 16px; white-space: pre-wrap; word-break: break-all; }
    .diff-original { background: #fff5f5; border-left: 3px solid var(--red); color: #6b2c33; }
    .diff-replacement { background: #ecf9f5; border-left: 3px solid var(--mint); color: #1a4d41; }
    .diff-footer { padding: 12px 18px; border-top: 1px solid #e8ebf1; display: flex; justify-content: flex-end; gap: 8px; }
    .diff-cancel-btn { height: 34px; padding: 0 16px; border: 1px solid #dfe4ec; border-radius: 8px; background: #fff; color: #5e687b; font-size: 12px; cursor: pointer; }
    .diff-cancel-btn:hover { border-color: #bcc3d1; }
    .diff-confirm-btn { height: 34px; padding: 0 16px; border: 0; border-radius: 8px; background: var(--blue); color: #fff; font-size: 12px; font-weight: 700; cursor: pointer; }
    .diff-confirm-btn:hover { background: #245de6; }

    .confirm-overlay { position: fixed; inset: 0; z-index: 120; background: rgba(15,20,35,.38); display: flex; align-items: center; justify-content: center; }
    .confirm-modal { width: 320px; background: #fff; border-radius: 14px; padding: 20px; box-shadow: 0 24px 64px rgba(0,0,0,.18); }
    .confirm-title { font-size: 14px; font-weight: 800; margin-bottom: 6px; }
    .confirm-desc { font-size: 12px; color: var(--muted); line-height: 1.6; }
    .confirm-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }
    .confirm-actions button { height: 32px; padding: 0 16px; border-radius: 8px; font-size: 12px; font-weight: 700; cursor: pointer; }
    .confirm-cancel { border: 1px solid #dce1ea; background: #fff; color: #4b566a; }
    .confirm-cancel:hover { border-color: #aec2fb; color: var(--blue); }
    .confirm-ok { border: 0; background: #e5484d; color: #fff; }
    .confirm-ok:hover { background: #d13438; }

    @media (max-width: 1100px) {
      .workspace { height: auto; grid-template-columns: minmax(0,1fr); }
      .editor-panel { height: clamp(560px, 72vh, 760px); min-height: 0; }
      .insight-panel { min-height: 430px; }
    }
    @media (max-width: 840px) {
      .page-head { align-items: flex-start; flex-direction: column; }
      .head-note { text-align: left; }
      .editor-top { align-items: flex-start; flex-direction: column; }
      .global-actions { flex-wrap: wrap; }
      .check-inline-panel { align-items: flex-start; flex-direction: column; }
      .check-actions { width: 100%; }
      .check-actions .primary-btn { flex: 1; }
    }
  </style>
</head>
<body>
  <aside class="sidebar">
    <div class="logo"><svg viewBox="0 0 24 24" fill="none" stroke="#1a1a2e" stroke-width="1.5"><circle cx="12" cy="12" r="10"/><path d="M8 14s1.5 2 4 2 4-2 4-2"/><line x1="9" y1="9" x2="9.01" y2="9"/><line x1="15" y1="9" x2="15.01" y2="9"/></svg></div>
    <a class="sidebar-item" href="index.html"><span class="icon">📦</span><span class="label">资源</span></a>
    <a class="sidebar-item" href="导演台首页.html"><span class="icon">🎬</span><span class="label">导演台</span></a>
    <div class="sidebar-divider"></div>
    <a class="sidebar-item active" href="全部工具.html"><span class="icon"></span><span class="label">全部工具</span></a>
  </aside>
  <main class="main">
    <header class="topbar">
      <div class="topbar-brand">智造</div>
      <div class="topbar-right"><span class="prototype-tag">静态原型演示</span><div class="avatar">W</div></div>
    </header>
    <section class="page-head">
      <div><div class="crumb"><a href="全部工具.html">全部工具</a> / <span>合规检查</span></div><div class="eyebrow">SCRIPT TOOL · COMPLIANCE</div><h1>合规检查</h1><p class="page-desc">定位台词中的表达风险，提供逐条替换与全文优化建议。</p></div>
      <div></div>
    </section>
    <section class="workspace">
      <aside class="panel insight-panel">
        <div class="insight-tabs">
          <button class="insight-tab active" data-insight="quality" onclick="setInsight('quality')">内容诊断</button>
          <button class="insight-tab" data-insight="compliance" onclick="setInsight('compliance')">合规提示</button>
        </div>
        <div class="insight-scroll">
          <div class="insight-content active" id="quality-content"></div>
          <div class="insight-content" id="compliance-content"></div>
        </div>
      </aside>
      <section class="panel editor-panel">
        <div class="editor-top">
          <div><div class="editor-heading">稿件工作区</div><div class="editor-sub" id="result-summary">尚未进行合规检查</div></div>
          <div class="global-actions">
            <button class="ghost-btn" id="select-all-btn" onclick="selectAll()" disabled>全选</button>
            <button class="ghost-btn" id="add-batch-btn" onclick="sendSelectedToBatch()" disabled>加入批量成片</button>
            <button class="ghost-btn" id="copy-all-btn" onclick="copyAll()" disabled>复制全部</button>
            <button class="ghost-btn" id="txt-btn" onclick="exportTxt()" disabled>导出 TXT</button>
            <button class="ghost-btn" id="csv-btn" onclick="exportCsv()" disabled>导出 CSV</button>
          </div>
        </div>
        <div class="check-inline-panel">
          <div class="check-inline-copy"><strong>合规检查</strong></div>
          <div class="check-actions">
            <button class="quick-chip" onclick="addComplianceDraft()">＋ 新增台词</button>
            <button class="quick-chip" onclick="fillRiskDemo()">填入合规示例</button>
            <button class="primary-btn" id="check-btn" onclick="startExistingCheck()">开始合规检查</button>
          </div>
        </div>
        <div class="loading-state" id="loading-state"><div><div class="loader-ring"></div><div class="loading-title" id="loading-title">正在检查合规风险</div><div class="loading-copy" id="loading-copy">定位风险表达、整理修改建议…</div></div></div>
        <div class="drafts-list" id="drafts-list"></div>
      </section>
    </section>
  </main>
  <div class="toast" id="toast"><span id="toast-msg"></span><button class="toast-action" id="toast-action" style="display:none"></button></div>
  <div class="handoff-banner" id="handoff-banner"><div class="hb-icon">📄</div><div class="hb-body"><strong id="hb-title"></strong><span id="hb-sub"></span></div><button class="hb-close" onclick="dismissHandoffBanner()">✕</button></div>
  <div class="confirm-overlay" id="confirm-overlay" style="display:none" onclick="if(event.target===this)closeConfirm()">
    <div class="confirm-modal">
      <div class="confirm-title" id="confirm-title"></div>
      <div class="confirm-desc" id="confirm-desc"></div>
      <div class="confirm-actions">
        <button class="confirm-cancel" onclick="closeConfirm()">取消</button>
        <button class="confirm-ok" id="confirm-ok" onclick="confirmAction()">清空</button>
      </div>
    </div>
  </div>
  <script>
    var TOOL_HANDOFF_KEY = 'script-tool-handoff';
    var state = { insight: 'compliance', drafts: [], activeId: null, selectedIds: [], loading: false, nextId: 1 };

    function escapeHtml(value) {
      return String(value == null ? '' : value).replace(/[&<>'"]/g, function(ch) {
        return { '&':'&amp;', '<':'&lt;', '>':'&gt;', "'":'&#39;', '"':'&quot;' }[ch];
      });
    }
    function escapeAttr(value) { return escapeHtml(value); }

    function toast(message, action) {
      var el = document.getElementById('toast');
      document.getElementById('toast-msg').textContent = message;
      var act = document.getElementById('toast-action');
      if (action) {
        act.textContent = action.label; act.style.display = '';
        act.onclick = function(){ action.onClick(); el.classList.remove('show'); };
      } else { act.style.display = 'none'; act.onclick = null; }
      el.classList.add('show');
      clearTimeout(toast.timer);
      toast.timer = setTimeout(function(){ el.classList.remove('show'); }, action ? 5000 : 1900);
    }

    function showHandoffBanner(from, title, chars) {
      document.getElementById('hb-title').textContent = '已从「' + (from || '其他工具') + '」载入台词';
      document.getElementById('hb-sub').textContent = (title ? '《' + title + '》 · ' : '') + chars + ' 字';
      var el = document.getElementById('handoff-banner');
      el.classList.add('show');
      clearTimeout(showHandoffBanner.timer);
      showHandoffBanner.timer = setTimeout(dismissHandoffBanner, 6000);
    }
    function dismissHandoffBanner() { document.getElementById('handoff-banner').classList.remove('show'); }

    var _confirmCallback = null;
    function askConfirm(title, desc, onOk, okLabel) {
      document.getElementById('confirm-title').textContent = title;
      document.getElementById('confirm-desc').textContent = desc;
      document.getElementById('confirm-ok').textContent = okLabel || '确认';
      _confirmCallback = onOk;
      document.getElementById('confirm-overlay').style.display = 'flex';
    }
    function closeConfirm() {
      document.getElementById('confirm-overlay').style.display = 'none';
      _confirmCallback = null;
    }
    function confirmAction() {
      var cb = _confirmCallback;
      closeConfirm();
      if (cb) cb();
    }

    function sendToTool(target, text, title) {
      try { localStorage.setItem(TOOL_HANDOFF_KEY, JSON.stringify({ target: target, from: '合规检查', title: title || '', text: text, at: Date.now() })); } catch (e) {}
      window.location.href = target;
    }
    function sendDraftToDerive(draftId) {
      var draft = findDraftById(draftId);
      if (!draft || !draft.text.trim()) { toast('台词为空'); return; }
      sendToTool('台词改写.html', draft.text, draft.title);
    }
    function consumeHandoff() {
      try {
        var raw = localStorage.getItem(TOOL_HANDOFF_KEY);
        if (!raw) return null;
        var data = JSON.parse(raw);
        if (data && data.target === '合规检查.html' && data.text != null) {
          localStorage.removeItem(TOOL_HANDOFF_KEY);
          return data;
        }
      } catch (e) {}
      return null;
    }

    function currentDraft() {
      return state.drafts.find(function(item){ return item.id === state.activeId; }) || null;
    }
    function findDraftById(id) {
      return state.drafts.find(function(d){ return d.id === id; }) || null;
    }
    function makeDraft(title, text, targetDuration) {
      return { id: state.nextId++, title: title, text: text, targetDuration: targetDuration || 60, status: 'unchecked', findings: [], quality: [] };
    }

    function setInsight(type) {
      state.insight = type;
      document.querySelectorAll('.insight-tab').forEach(function(btn){ btn.classList.toggle('active', btn.dataset.insight === type); });
      document.querySelectorAll('.insight-content').forEach(function(panel){ panel.classList.toggle('active', panel.id === type + '-content'); });
    }

    function addComplianceDraft() {
      if (state.loading) { toast('当前任务处理中，请稍候'); return; }
      var draft = makeDraft('合规检查稿 ' + (state.drafts.length + 1), '', 60);
      state.drafts.push(draft);
      state.activeId = draft.id;
      renderWorkspace();
      setTimeout(function(){
        var card = document.querySelector('.draft-card[data-draft-id="' + draft.id + '"]');
        if (!card) return;
        card.scrollIntoView({ behavior:'smooth', block:'nearest' });
        var body = card.querySelector('.draft-card-body');
        if (body) body.focus();
      }, 0);
      toast('已新增一篇合规检查稿');
    }

    function fillRiskDemo() {
      var demo = '朋友们注意了，持仓超过8万还深套的，赶紧调仓！再不调仓就来不及了。我们专业投顾团队用大数据，从5000多只股票里筛选机会，这套短线方法准到吓人，跟着操作快速回本。名额仅限前50名，无需下载、无需注册，也不用留手机号，点击视频下方链接马上领取。';
      var clone = makeDraft('合规检查示例', demo, 60);
      state.drafts = [clone];
      state.selectedIds = [];
      state.activeId = clone.id;
      renderWorkspace(); toast('已载入合规检查示例');
    }

    function startExistingCheck() {
      var selected = validSelectedIds(state.drafts);
      var selectedMap = {};
      selected.forEach(function(id){ selectedMap[id] = true; });
      var scope = selected.length ? state.drafts.filter(function(draft){ return selectedMap[draft.id]; }) : state.drafts.slice();
      var targets = scope.filter(function(draft){ return draft.text.trim(); });
      if (!targets.length) {
        toast(selected.length ? '请先为选中的稿件输入台词' : '请先输入至少一篇台词');
        return;
      }
      if (!targets.some(function(draft){ return draft.id === state.activeId; })) state.activeId = targets[0].id;
      state.loading = true;
      document.getElementById('drafts-list').style.display = 'none';
      document.getElementById('loading-state').classList.add('show');
      document.getElementById('loading-title').textContent = '正在检查 ' + targets.length + ' 篇台词的合规风险';
      var stages = ['逐句扫描风险表达…', '匹配修改建议与替换文案…', '汇总检查结果，更新洞察面板…'];
      var stageTimers = stages.map(function(text, i){
        return setTimeout(function(){ document.getElementById('loading-copy').textContent = text; }, i * 420);
      });
      document.querySelectorAll('.check-inline-panel button').forEach(function(c){ c.disabled = true; });
      var btn = document.getElementById('check-btn');
      btn.textContent = '处理中…';
      targets.forEach(function(draft){ draft.status = 'checking'; });
      var requests = targets.map(function(draft){ return { id: draft.id, text: draft.text }; });
      setTimeout(function(){
        stageTimers.forEach(clearTimeout);
        var completed = [];
        requests.forEach(function(request){
          var draft = findDraftById(request.id);
          if (!draft || draft.text !== request.text) return;
          runDraftCheck(draft); completed.push(draft);
        });
        state.loading = false;
        document.getElementById('loading-state').classList.remove('show');
        document.getElementById('drafts-list').style.display = '';
        document.querySelectorAll('.check-inline-panel button').forEach(function(c){ c.disabled = false; });
        btn.textContent = '开始合规检查';
        renderWorkspace();
        setTimeout(function(){
          var activeCard = document.querySelector('.draft-card[data-draft-id="' + state.activeId + '"]');
          if (activeCard) activeCard.scrollIntoView({ behavior:'smooth', block:'nearest' });
        }, 0);
        setInsight('compliance'); toast('已完成 ' + completed.length + ' 篇台词的合规检查');
      }, 1300);
    }

    function runDraftCheck(draft) {
      draft.findings = findComplianceRisks(draft.text);
      draft.quality = diagnoseQuality(draft.text, draft.targetDuration);
      draft.checkedText = draft.text;
      draft.status = draft.findings.length ? 'attention' : 'clear';
    }

    function isNegatedRisk(text, index) {
      var before = text.slice(Math.max(0, index - 14), index);
      if (/(?:不|并不|并非|不能|不会|无意|无需|切勿|严禁)\s*$/.test(before) || /(?:不建议|不要|避免|不应|谨慎|谨防|警惕|不是|不等于)[^，。；！？]{0,8}$/.test(before)) return true;
      var sentenceStart = Math.max(text.lastIndexOf('。', index - 1), text.lastIndexOf('！', index - 1), text.lastIndexOf('？', index - 1), text.lastIndexOf('!', index - 1), text.lastIndexOf('?', index - 1), text.lastIndexOf('\n', index - 1)) + 1;
      var sentencePrefix = text.slice(sentenceStart, index);
      var startsAsWarning = /^\s*(?:不要|切勿|严禁|谨防|警惕|避免)/.test(sentencePrefix);
      var turnsPositive = /(?:但是|但|不过|然而|，|；)\s*(?:请|可以|欢迎|建议|立即|马上|添加|加|联系|扫码|识别|私信|进群|进入|加入|回复)/.test(sentencePrefix + text.slice(index, index + 6));
      return startsAsWarning && !turnsPositive;
    }
    function findComplianceRisks(text) {
      var actionPattern = /(?:现在就是|这是|当前是)?(?:(?:立即|马上|赶紧)\s*)?(强烈推荐|推荐|建议重点|建议配置|建议关注|优先配置|重点配置|重点关注|值得布局|调仓|放弃[^，。；！？]{0,10}|专做短线|只做短线|快进快出|打板|满仓|清仓|重仓|仓位|加仓|减仓|增持|减持|建仓|抄底|低吸|止盈|止损|目标价|最佳买点|必涨|一定会涨|看好|买入|卖出|持有|申购|赎回)(?:[^，。；！？\s]{0,12})/g;
      var privateLeadPattern = /(?:扫码(?:添加|联系)?|识别二维码|(?:添加|加|联系)(?:我|(?:官方)?客服|助理|老师|顾问|工作人员)?(?:微信|企微|V|联系方式)|联系(?:(?:官方)?客服|助理|老师|顾问|工作人员)|加群|进(?:入)?(?:粉丝|内部|VIP|交流)?群|加入[^，。；！？]{0,8}群|私信(?:我|老师|顾问|(?:官方)?客服|助理)?|评论区(?:回复|留言)|回复关键词)/g;
      var personalizedServicePattern = /(?:免费诊股|诊断持仓|领取[^，。；！？]{0,10}(?:牛股|金股|股票|个股|名单)|(?:牛股|金股|股票|个股)名单|盘中指导|实盘指导|跟单|带单|老师带你操作|(?:一对一|免费)?(?:分析|诊断|解读)(?:持仓|个股|股票)|(?:老师)?手把手指导(?:操作|交易)|(?:指导|陪同)(?:操作|交易))/g;
      var rules = [
        { severity:'high', type:'收益承诺', regex:/(稳赚不赔|稳赚|保本(?:保收益)?|保收益|保证收益|本金(?:安全|无忧)|收益(?:有保障|兜底)|锁定收益|零风险|绝对赚钱|必赚|翻倍收益)/g, reason:'可能构成对本金安全或投资收益的承诺、保证或暗示。', suggestion:'删除确定性收益承诺，说明投资结果受市场等因素影响。', replacement:'投资结果受市场等多重因素影响，不存在确定收益。' },
        { severity:'high', type:'具体行动或确定性建议', regex:actionPattern, skipNegative:true, reason:'涉及具体买卖、仓位、目标价或带有强诱导性的行动表达。', suggestion:'改为介绍公开依据和一般判断方法，不直接给出买卖、调仓指令。', replacement:'可结合自身情况与公开信息理性决策，文中内容仅为方法介绍，不构成任何买卖建议。' },
        { severity:'high', type:'非公开信息暗示', regex:/(内幕消息|内部消息|庄家消息|确定消息|独家消息)/g, reason:'暗示掌握非公开或确定性消息。', suggestion:'仅引用可核验的公开信息，并明确来源与发布日期。', replacement:'相关判断仅基于可核验的公开信息，请核对来源与发布日期。' },
        { severity:'high', type:'站外导流或私域招揽', regex:privateLeadPattern, skipNegative:true, reason:'涉及站外导流、私域群聊或个人联系方式。', suggestion:'发布前核验机构官方渠道、服务资质、留痕要求和隐私说明。' },
        { severity:'high', type:'具体标的或诊股服务招揽', regex:personalizedServicePattern, skipNegative:true, reason:'可能涉及具体标的推荐、个性化诊断或跟单指导。', suggestion:'不要以具体标的、诊股或跟单作为获客诱因。' },
        { severity:'medium', type:'具体交易方法营销', regex:/(短线方法|短线技巧|打板方法|快进快出(?:的)?(?:方法|技巧)|独家(?:战法|方法))/g, reason:'将具体交易方法包装为可复制的获利路径，容易误导用户。', suggestion:'说明方法仅供学习参考，不暗示可稳定获利。', replacement:'以下方法仅为思路分享，实际操作请结合自身风险承受能力谨慎决策。' },
        { severity:'high', type:'回本解套效果承诺', regex:/(带你[^，。；！？]{0,8}(?:回本|解套|扭亏)|帮你[^，。；！？]{0,8}(?:回本|解套|扭亏)|快速(?:回本|解套|扭亏)|实现(?:回本|解套|扭亏))/g, reason:'暗示服务能够帮助用户挽回损失。', suggestion:'删除回本、解套或扭亏承诺。', replacement:'服务仅用于辅助整理公开信息和判断过程，不承诺挽回投资损失。' },
        { severity:'medium', type:'隐性效果暗示', regex:/(准到吓人|快速提升(?:投资)?效果|不会让(?:你|您)失望|脱颖而出|拉开差距|成功翻身|抓住主线|走出主线)/g, reason:'可能通过结果暗示影响用户判断。', suggestion:'改为客观说明服务内容，不暗示确定效果。', replacement:'服务用于辅助整理公开信息和判断过程，实际效果因市场环境及个人情况而异。' },
        { severity:'medium', type:'紧迫性营销', regex:/(再不[^，。；！？]{0,10}就?(来不及了|来不及)|抓紧(?:时间)?|赶紧|立即暂停|只说一次|千万盯紧|紧盯|马上领取|马上报名|行情来了)/g, skipNegative:true, severityHighWhen:2, reason:'通过时间压力推动用户立即行动。', suggestion:'去除时间压力，提醒用户先核验信息与服务说明。', replacement:'请先核对信息来源、适用日期和服务说明，再结合自身情况决定。' },
        { severity:'medium', type:'稀缺名额营销', regex:/(限时名额|名额有限|名额仅限[^，。；！？]{0,8}|仅限\s*\d+\s*名|仅限前\s*\d+\s*名|前\s*\d+\s*名|最后\s*\d+\s*个名额)/g, reason:'通过虚构或未核实的稀缺性推动用户决策。', suggestion:'如确有名额限制，请说明活动规则和有效期；否则删除稀缺性表达。', replacement:'服务面向符合条件的用户开放，具体规则以官方页面说明为准。' },
        { severity:'medium', type:'依据与能力声明待核实', regex:/(专业(?:投顾|投资顾问)?团队|大数据(?:筛选|选股)?|老股民自用|老师(?:每天)?分享|刚出的研报|研报直接告诉|跟踪主力|筛选出潜力)/g, reason:'涉及团队资质、数据能力或研究依据。', suggestion:'请注明具体服务主体、公开信息来源、方法边界及对应日期。', replacement:'内容由本机构研究团队基于公开信息整理，具体方法与数据来源见文末说明。' },
        { severity:'medium', type:'服务与隐私承诺待核实', regex:/((?:不用|无需)(?:下载|注册|留手机号|输入(?:您的|你的)?手机号)(?:、(?:不用|无需)(?:下载|注册|留手机号))?|不收录(?:您的|你的)?手机号码)/g, reason:'涉及注册流程、个人信息收集承诺。', suggestion:'改为提示用户查看真实服务流程和隐私说明。', replacement:'具体使用流程和个人信息处理方式，请以实际服务页面及隐私说明为准。' },
        { severity:'medium', type:'夸大或误导表达', regex:/(唯一|最强|顶级|100%|绝对不会|闭眼买|可怕的(?:炒股)?方法|最聪明)/g, reason:'绝对化或夸张表述可能放大能力、效果或确定性。', suggestion:'在可核验的服务范围和适用条件内客观表述。' },
        { severity:'medium', type:'数据依据待核实', regex:/((?:收益(?:率)?|涨幅|回报(?:率)?|成功率|命中率)(?:达到|为|超过|高达)?\d+(?:\.\d+)?%|\d+(?:\.\d+)?%|\d+(?:\.\d+)?倍|持仓(?:超过|达到|不低于)?\s*\d+(?:\.\d+)?万|\d{3,}(?:多|余)?只(?:股票|个股)?|不超过\s*\d+只)/g, reason:'涉及比例、金额、样本规模或筛选数量。', suggestion:'请补充可核验的数据来源、统计口径和对应日期。' },
        { severity:'medium', type:'历史业绩展示', regex:/(历史业绩|过往业绩|曾经收益|策略收益|客户收益|实盘收益)/g, reason:'历史表现需要核验展示口径与必要提示。', suggestion:'核验展示口径，并明确历史表现不代表未来结果。', replacement:'经核验的历史信息仅供参考，不代表未来表现。' },
        { severity:'medium', type:'时效信息待核实', regex:/(今日|今天|本周|目前|最新|截至现在)/g, reason:'表述具有明显时效性。', suggestion:'请补充信息对应日期，并在发布前重新核验。' },
        { severity:'medium', type:'政策与日期待核实', regex:/((?:截至)?\d{4}[-/.年]\d{1,2}(?:[-/.月]\d{1,2}日?)?|\d{4}年新规|最新政策|监管新规|政策新规|最新监管口径)/g, reason:'涉及明确日期、政策或监管口径。', suggestion:'请注明权威来源与适用日期，并在发布前确认政策仍然有效。' }
      ];
      var findings = [];
      rules.forEach(function(rule){
        var match; rule.regex.lastIndex = 0;
        while ((match = rule.regex.exec(text)) !== null) {
          if (rule.skipNegative && isNegatedRisk(text, match.index)) continue;
          if (rule.skipNegative && /(持有期限|买入成本|卖出机制|推荐阅读|推荐了解)/.test(match[0])) continue;
          var severity = rule.severity;
          if (rule.severityHighWhen && match[rule.severityHighWhen]) severity = 'high';
          findings.push({ id:'risk-' + findings.length, severity:severity, type:rule.type, excerpt:match[0], sourceIndex:match.index, reason:rule.reason, suggestion:rule.suggestion, replacement:rule.replacement || '', append:false });
          if (match[0].length === 0) rule.regex.lastIndex++;
        }
      });
      var hasActionAdvice = false; actionPattern.lastIndex = 0;
      var actionMatch;
      while ((actionMatch = actionPattern.exec(text)) !== null) {
        if (!isNegatedRisk(text, actionMatch.index) && !/(持有期限|买入成本|卖出机制|推荐阅读|推荐了解)/.test(actionMatch[0])) { hasActionAdvice = true; break; }
      }
      var serviceWordPattern = /(选股服务|投顾服务)/g, svcMatch, hasPositiveServiceWord = false;
      while ((svcMatch = serviceWordPattern.exec(text)) !== null) {
        if (!isNegatedRisk(text, svcMatch.index)) { hasPositiveServiceWord = true; break; }
      }
      var hasInvestmentServiceMarketing = findings.some(function(item){ return item.type === '站外导流或私域招揽' || item.type === '具体标的或诊股服务招揽'; }) || hasPositiveServiceWord;
      var hasRiskWarning = /投资有风险[^。！？]{0,24}(决策|入市)需谨慎/.test(text);
      var hasAdviceDisclaimer = /不构成[^。！？]{0,20}投资建议/.test(text);
      if ((/(投资|股票|基金|收益|市场|行情|保本|买入|卖出|持有|申购|赎回|配置)/.test(text) || hasInvestmentServiceMarketing) && (!hasRiskWarning || !hasAdviceDisclaimer)) {
        var missingDisclosure = [!hasAdviceDisclaimer ? '"不构成投资建议"声明' : '', !hasRiskWarning ? '投资风险警示' : ''].filter(Boolean).join('和');
        var disclosureText = (!hasAdviceDisclaimer ? '以上内容仅供参考，不构成具体投资建议。' : '') + (!hasRiskWarning ? '投资有风险，决策需谨慎。' : '');
        findings.push({ id:'risk-' + findings.length, severity:hasActionAdvice ? 'high' : 'medium', type:'风险提示不足', excerpt:'缺少' + missingDisclosure, reason:'"风险承受能力"等一般表述不能替代完整风险揭示。', suggestion:'补充当前缺失的风险揭示，并按机构模板核验。', replacement:disclosureText, append:true });
      }
      if (hasActionAdvice || hasInvestmentServiceMarketing) {
        var missingIdentity = [];
        if (!/(证券公司|证券投资咨询机构|[\u4e00-\u9fa5]{4,}(有限公司|股份有限公司))/.test(text)) missingIdentity.push('机构全称');
        if (!/(投资顾问|证券投资顾问|投顾)[:：\s]*[\u4e00-\u9fa5]{2,4}/.test(text)) missingIdentity.push('人员姓名与身份');
        if (!/(执业|登记)(编号|编码)[:：\s]*[A-Z0-9-]{4,}/i.test(text)) missingIdentity.push('执业登记编号');
        if (missingIdentity.length) findings.push({ id:'risk-' + findings.length, severity:'medium', type:'身份与资质披露待确认', excerpt:'未识别到' + missingIdentity.join('、'), reason:'公开传播涉及证券建议或投顾服务营销时，应由所属机构确认身份、资质及披露要求。', suggestion:'发布前请补充并核验机构名称、人员身份及执业登记信息。', replacement:'', append:false });
        if (!/(来源|研究报告|公司公告|公开信息|财报|根据[^，。；]{0,12}(报告|公告|数据))/.test(text)) findings.push({ id:'risk-' + findings.length, severity:'medium', type:'合理依据待确认', excerpt:'未识别到可核验的公开依据', reason:'投资观点、建议或选股服务声明应具有合理依据。', suggestion:'请补充可核验的公开依据、来源与发布日期。', replacement:'', append:false });
      }
      var sevWeight = { high:3, medium:2, low:1 };
      findings.sort(function(a, b){
        var ia = Number.isFinite(a.sourceIndex) ? a.sourceIndex : Number.MAX_VALUE;
        var ib = Number.isFinite(b.sourceIndex) ? b.sourceIndex : Number.MAX_VALUE;
        return ia - ib || sevWeight[b.severity] - sevWeight[a.severity] || b.excerpt.length - a.excerpt.length;
      });
      var merged = [];
      findings.forEach(function(f){
        if (!Number.isFinite(f.sourceIndex)) { merged.push(f); return; }
        var overlapped = merged.some(function(m){
          if (!Number.isFinite(m.sourceIndex)) return false;
          return f.sourceIndex < m.sourceIndex + m.excerpt.length && m.sourceIndex < f.sourceIndex + f.excerpt.length;
        });
        if (!overlapped) merged.push(f);
      });
      merged.forEach(function(f, i){ f.id = 'risk-' + i; });
      return merged;
    }

    function diagnoseQuality(text, targetDuration) {
      var clean = text.replace(/\s/g, ''); var seconds = Math.max(1, Math.ceil(clean.length / 4));
      var sentences = text.split(/[。！？!?]/).filter(function(item){ return item.trim(); });
      var avg = sentences.length ? clean.length / sentences.length : clean.length;
      var opening = text.slice(0, 70);
      var hookOk = /[？?]|为什么|很多|如果|注意了|先问|你是否|误区|被套|波动|短线/.test(opening);
      var audienceOk = /(投资者|股民|朋友|新手|持仓|短线|小资金)/.test(text);
      var painOk = /(容易|不知道|问题|误区|被套|波动|缺少|打乱|困扰|追涨杀跌)/.test(text);
      var valueOk = /(提供|服务|平台|整理|清单|方法|流程|推送|复盘|筛选|观察方向)/.test(text);
      var ctaOk = /(点击|链接|领取|加入|查看|了解|体验|咨询|关注|私信|评论区|回复|扫码|二维码)/.test(text);
      var disclosureOk = /不构成[^。！？]{0,20}投资建议/.test(text) && /投资有风险[^。！？]{0,24}(决策|入市)需谨慎/.test(text);
      var oralOk = avg <= 42 && !/(综上所述|由此可见|鉴于上述)/.test(text);
      var densityOk = avg <= 48;
      var durationOk = Math.abs(seconds - targetDuration) <= Math.max(12, targetDuration * .42);
      return [
        { name:'获客钩子', ok:hookOk, note:hookOk ? '前段具备问题、人群或具体场景切入。' : '建议在前两句话加入痛点、人群筛选或反常识表达。' },
        { name:'目标人群', ok:audienceOk, note:audienceOk ? '台词能够识别主要沟通对象。' : '建议明确面向哪类投资者。' },
        { name:'用户痛点', ok:painOk, note:painOk ? '已经说明用户为什么需要继续听。' : '建议补充真实使用场景或待解决的问题。' },
        { name:'产品价值', ok:valueOk, note:valueOk ? '已经交代服务内容或使用价值。' : '建议写清提供什么服务、信息从哪里来以及如何使用。' },
        { name:'行动引导', ok:ctaOk, note:ctaOk ? '结尾包含明确的下一步操作。' : '建议在结尾补充查看、了解或领取内容的具体路径。' },
        { name:'风险揭示', ok:disclosureOk, note:disclosureOk ? '已识别到投资建议声明和风险警示。' : '建议补充"不构成投资建议"和投资风险警示。' },
        { name:'口语自然度', ok:oralOk, note:oralOk ? '句子长度适合自然口播。' : '部分句子偏长或书面，建议拆句。' },
        { name:'信息密度', ok:densityOk, note:densityOk ? '单句信息量适中。' : '单句承载内容较多，建议一条句子只表达一个重点。' },
        { name:'时长适配度', ok:durationOk, note:'预计约 ' + seconds + ' 秒，目标为 ' + targetDuration + ' 秒。' }
      ];
    }

    function renderWorkspace() {
      var drafts = state.drafts; var draft = currentDraft();
      updateExportControls(drafts);
      document.getElementById('drafts-list').style.display = !state.loading ? '' : 'none';
      renderDraftCards(drafts, draft);
      renderInsights(draft);
    }

    function renderDraftCards(drafts, active) {
      var list = document.getElementById('drafts-list');
      list.innerHTML = drafts.map(function(draft, index){
        return '<div class="draft-card' + (active && draft.id === active.id ? ' active' : '') + '" data-draft-id="' + draft.id + '" onclick="selectDraft(' + draft.id + ')">' +
          '<div class="draft-card-header">' +
          '<input class="draft-select" type="checkbox" aria-label="选择第 ' + (index + 1) + ' 篇稿件"' + (isDraftSelected(draft.id) ? ' checked' : '') + ' onclick="event.stopPropagation()" onchange="toggleDraftSelection(event,' + draft.id + ')">' +
          '<span class="draft-card-num">#' + (index + 1) + '</span>' +
          '<input class="draft-card-title-input" value="' + escapeAttr(draft.title) + '" oninput="updateCardTitle(' + draft.id + ',this.value)" onclick="event.stopPropagation()">' +
          '<span class="draft-card-status ' + draft.status + '">' + statusLabel(draft.status) + '</span>' +
          '</div>' +
          '<div class="draft-card-body-wrap"><div class="draft-card-body" contenteditable="true" data-draft-id="' + draft.id + '" oninput="onCardBodyInput(this)" onclick="selectDraft(' + draft.id + ')">' + buildHighlightedHtml(draft) + '</div></div>' +
          '<div class="draft-card-foot">' +
          '<span class="draft-card-meta"><strong>' + countChars(draft.text) + '</strong> 字 · 约 <strong>' + estimateSeconds(draft.text) + '</strong> 秒<button class="expand-btn" onclick="event.stopPropagation();toggleCardExpand(this)">展开 ⌄</button></span>' +
          '<div class="draft-card-actions">' +
          '<button class="card-action-btn" onclick="event.stopPropagation();copyDraft(' + draft.id + ')">复制</button>' +
          '<button class="card-action-btn primary" onclick="event.stopPropagation();sendDraftToDerive(' + draft.id + ')">导入台词改写</button>' +
          '<button class="card-action-btn" onclick="event.stopPropagation();clearDraft(' + draft.id + ')" style="color:#ad5360">清空</button>' +
          '</div></div></div>';
      }).join('');
    }

    function toggleCardExpand(btn) {
      var card = btn.closest('.draft-card'); if (!card) return;
      var wrap = card.querySelector('.draft-card-body-wrap'); if (!wrap) return;
      var expanded = wrap.classList.toggle('expanded');
      btn.textContent = expanded ? '收起 ⌃' : '展开 ⌄';
    }

    function buildHighlightedHtml(draft) {
      var text = draft.text; if (!text) return '';
      if (draft.status === 'stale' || draft.status === 'unchecked' || draft.status === 'checking' || !draft.findings || !draft.findings.length) return escapeHtml(text);
      var marks = [];
      draft.findings.forEach(function(f, i) {
        if (f.append || !f.excerpt) return;
        var idx = Number.isFinite(f.sourceIndex) ? f.sourceIndex : text.indexOf(f.excerpt);
        if (idx < 0) return;
        marks.push({ start: idx, end: idx + f.excerpt.length, severity: f.severity, findingIndex: i });
      });
      marks.sort(function(a, b) { return a.start - b.start; });
      var filtered = [];
      marks.forEach(function(m) { if (!filtered.length || m.start >= filtered[filtered.length - 1].end) filtered.push(m); });
      var html = '', last = 0;
      filtered.forEach(function(m) {
        html += escapeHtml(text.slice(last, m.start));
        html += '<mark class="risk-' + m.severity + '" data-finding-index="' + m.findingIndex + '">' + escapeHtml(text.slice(m.start, m.end)) + '</mark>';
        last = m.end;
      });
      html += escapeHtml(text.slice(last));
      return html;
    }

    function caretOffsetInText(root, sel) {
      if (!sel || !sel.rangeCount) return 0;
      var range = sel.getRangeAt(0).cloneRange();
      range.selectNodeContents(root);
      range.setEnd(sel.getRangeAt(0).startContainer, sel.getRangeAt(0).startOffset);
      return range.toString().length;
    }
    function restoreCaretOffset(root, offset) {
      var walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
      var remaining = offset, node;
      while ((node = walker.nextNode())) {
        if (remaining <= node.length) {
          var range = document.createRange();
          range.setStart(node, remaining); range.collapse(true);
          var sel = window.getSelection();
          sel.removeAllRanges(); sel.addRange(range);
          return;
        }
        remaining -= node.length;
      }
    }

    function onCardBodyInput(body) {
      var draftId = parseInt(body.dataset.draftId, 10); var draft = findDraftById(draftId); if (!draft) return;
      if (body.querySelector('mark')) {
        var offset = caretOffsetInText(body, window.getSelection());
        body.textContent = body.textContent;
        restoreCaretOffset(body, offset);
      }
      draft.text = body.textContent;
      draft.quality = diagnoseQuality(draft.text, draft.targetDuration);
      if (draft.status !== 'unchecked') draft.status = 'stale';
      updateCardMeta(draft);
      if (draft.id === state.activeId) renderInsights(draft);
    }
    function updateCardMeta(draft) {
      var card = document.querySelector('.draft-card[data-draft-id="' + draft.id + '"]'); if (!card) return;
      var metaEl = card.querySelector('.draft-card-meta');
      if (metaEl) metaEl.innerHTML = '<strong>' + countChars(draft.text) + '</strong> 字 · 约 <strong>' + estimateSeconds(draft.text) + '</strong> 秒';
      var statusEl = card.querySelector('.draft-card-status');
      if (statusEl) { statusEl.textContent = statusLabel(draft.status); statusEl.className = 'draft-card-status ' + draft.status; }
    }
    function updateCardTitle(draftId, value) { var draft = findDraftById(draftId); if (draft) draft.title = value || '未命名台词'; }
    function copyDraft(draftId) { var draft = findDraftById(draftId); if (draft) copyText(draft.text, '已复制'); }
    function clearDraft(draftId) {
      var draft = findDraftById(draftId); if (!draft) return;
      askConfirm('清空稿件', '确定要清空"' + (draft.title || '未命名') + '"的稿件内容吗？清空后可通过撤销恢复。', function() {
        var snapshot = { text: draft.text, title: draft.title, status: draft.status, findings: draft.findings, quality: draft.quality };
        draft.text = ''; draft.status = 'unchecked'; draft.findings = []; draft.quality = [];
        renderWorkspace();
        toast('已清空', { label: '撤销', onClick: function(){
          draft.text = snapshot.text; draft.title = snapshot.title; draft.status = snapshot.status; draft.findings = snapshot.findings; draft.quality = snapshot.quality;
          renderWorkspace(); toast('已恢复稿件内容');
        } });
      }, '清空');
    }

    function selectDraft(id) {
      if (state.activeId === id) return;
      state.activeId = id;
      document.querySelectorAll('#drafts-list .draft-card').forEach(function(card){
        card.classList.toggle('active', Number(card.dataset.draftId) === id);
      });
      renderInsights(currentDraft());
    }

    function isDraftSelected(id) { return state.selectedIds.indexOf(id) !== -1; }
    function validSelectedIds(drafts) {
      var available = {};
      drafts.forEach(function(draft){ available[draft.id] = true; });
      return state.selectedIds.filter(function(id){ return available[id]; });
    }
    function updateExportControls(drafts) {
      var hasDrafts = drafts.length > 0;
      var selected = validSelectedIds(drafts);
      state.selectedIds = selected;
      document.getElementById('result-summary').textContent = hasDrafts ? ('共 ' + drafts.length + ' 篇' + (selected.length ? ' · 已选 ' + selected.length + ' 篇' : '')) : '尚未进行合规检查';
      document.getElementById('select-all-btn').disabled = !hasDrafts;
      document.getElementById('select-all-btn').textContent = selected.length === drafts.length ? '取消全选' : '全选';
      document.getElementById('add-batch-btn').disabled = selected.length === 0;
      document.getElementById('add-batch-btn').textContent = selected.length ? ('加入批量成片（' + selected.length + '）') : '加入批量成片';
      document.getElementById('copy-all-btn').disabled = !hasDrafts;
      document.getElementById('txt-btn').disabled = !hasDrafts;
      document.getElementById('csv-btn').disabled = !hasDrafts;
      document.getElementById('txt-btn').textContent = selected.length ? ('导出 TXT（' + selected.length + '）') : '导出 TXT';
      document.getElementById('csv-btn').textContent = selected.length ? ('导出 CSV（' + selected.length + '）') : '导出 CSV';
    }
    function selectAll() {
      var drafts = state.drafts;
      var selected = validSelectedIds(drafts);
      if (selected.length === drafts.length) {
        state.selectedIds = [];
      } else {
        state.selectedIds = drafts.map(function(d){ return d.id; });
      }
      document.querySelectorAll('#drafts-list .draft-select').forEach(function(cb, i){
        cb.checked = state.selectedIds.indexOf(drafts[i].id) !== -1;
      });
      updateExportControls(drafts);
    }
    function sendSelectedToBatch() {
      var selected = validSelectedIds(state.drafts);
      if (!selected.length) return;
      var texts = [];
      for (var i = 0; i < state.drafts.length; i++) {
        if (selected.indexOf(state.drafts[i].id) !== -1 && state.drafts[i].text.trim()) {
          texts.push(state.drafts[i].text);
        }
      }
      if (!texts.length) { toast('台词为空'); return; }
      try { localStorage.setItem(TOOL_HANDOFF_KEY, JSON.stringify({ target: '简单模式-流程版-模板版.html', from: '合规检查', title: '已选 ' + texts.length + ' 篇台词', texts: texts, at: Date.now() })); } catch (e) {}
      window.location.href = '简单模式-流程版-模板版.html?returnTo=directorWorkbench';
    }
    function toggleDraftSelection(event, draftId) {
      event.stopPropagation();
      if (event.currentTarget.checked) {
        if (state.selectedIds.indexOf(draftId) === -1) state.selectedIds.push(draftId);
      } else {
        state.selectedIds = state.selectedIds.filter(function(id){ return id !== draftId; });
      }
      updateExportControls(state.drafts);
    }

    document.getElementById('drafts-list').addEventListener('click', function(e) {
      var mark = e.target.closest('mark'); if (!mark || !mark.dataset.findingIndex) return;
      e.stopPropagation(); var idx = parseInt(mark.dataset.findingIndex, 10);
      var draft = currentDraft(); if (!draft || !draft.findings[idx]) return;
      setInsight('compliance');
      setTimeout(function() {
        var riskCards = document.querySelectorAll('#compliance-content .risk-card');
        if (riskCards[idx]) {
          riskCards[idx].scrollIntoView({ behavior: 'smooth', block: 'center' });
          riskCards.forEach(function(c) { c.style.outline = ''; });
          riskCards[idx].style.outline = '2px solid var(--blue)';
          setTimeout(function() { riskCards[idx].style.outline = ''; }, 2500);
        }
        var allMarks = document.querySelectorAll('.draft-card-body mark');
        allMarks.forEach(function(m) { m.classList.remove('pulse-highlight'); });
        mark.classList.add('pulse-highlight');
      }, 100);
    });

    function renderInsights(draft) { renderQuality(draft); renderCompliance(draft); }

    function renderQuality(draft) {
      var el = document.getElementById('quality-content');
      if (!draft) { el.innerHTML = '<div class="insight-empty">生成或载入一篇台词后，<br>这里会展示可操作的内容诊断。</div>'; return; }
      if (draft.status === 'unchecked' || draft.status === 'checking') { el.innerHTML = '<div class="insight-empty">尚未进行合规检查，<br>完成检查后同步展示内容诊断结果。</div>'; return; }
      var quality = draft.quality.length ? draft.quality : diagnoseQuality(draft.text, draft.targetDuration);
      var pending = quality.filter(function(item){ return !item.ok; }), passed = quality.filter(function(item){ return item.ok; });
      var ordered = pending.concat(passed);
      el.innerHTML = '<div class="insight-head"><div><div class="insight-title">口播质量诊断</div><div class="insight-desc">需优化 ' + pending.length + ' 项 · 已通过 ' + passed.length + ' 项</div></div></div>' + ordered.map(function(item){
        return '<div class="quality-item' + (item.ok ? '' : ' warn') + '"><div class="quality-icon">' + (item.ok ? '✓' : '!') + '</div><div><div class="quality-name">' + escapeHtml(item.name) + '</div><div class="quality-note">' + escapeHtml(item.note) + '</div></div></div>';
      }).join('');
    }

    function renderCompliance(draft) {
      window._currentComplianceDraft = draft;
      var el = document.getElementById('compliance-content');
      if (!draft) { el.innerHTML = '<div class="insight-empty">合规检查结果会定位到具体表达，<br>并提供修改原因和替换建议。</div>'; return; }
      if (draft.status === 'checking') { el.innerHTML = '<div class="insight-empty"><div class="loader-ring" style="width:30px;height:30px"></div>正在检查表达合规问题…</div>'; return; }
      if (draft.status === 'stale') {
        var adoptedStale = draft.findings.filter(function(item){ return item.adopted; }).map(function(item){
          var originalIndex = draft.findings.indexOf(item);
          return '<div class="risk-card adopted"><div class="risk-top"><div class="risk-type">' + escapeHtml(item.type) + '</div><span class="risk-level" style="color:var(--mint);background:var(--mint-soft)">✓ 已采纳替换</span></div><div class="risk-quote">已替换为：' + escapeHtml(item.replacement) + '</div><button class="undo-btn" onclick="event.stopPropagation();undoAdopt(' + originalIndex + ')">撤销此次修改</button></div>';
        }).join('');
        el.innerHTML = '<div class="insight-head"><div><div class="insight-title">检查结果已过期</div><div class="insight-desc">正文已发生修改，需要重新执行检查。</div></div><button class="quick-chip" onclick="recheckCurrent()">重新检查</button></div>' + (adoptedStale ? '<div class="adopted-box">' + adoptedStale + '</div>' : '') + '<div class="stale-box">旧结果不再代表当前文本。</div>';
        return;
      }
      var counts = { high:0, medium:0, low:0 }; draft.findings.forEach(function(item){ if (!item.adopted) counts[item.severity]++; });
      var adoptedCount = draft.findings.filter(function(item){ return item.adopted; }).length;
      var html = '<div class="insight-head"><div><div class="insight-title">AI 合规提示</div><div class="insight-desc">仅检查表达，不提供合规结论。' + (adoptedCount ? '已采纳替换 ' + adoptedCount + ' 项。' : '') + '</div></div><button class="quick-chip" onclick="recheckCurrent()">重新检查</button></div>';
      html += '<div class="risk-summary"><div class="risk-count high"><strong>' + counts.high + '</strong><span>高风险</span></div><div class="risk-count medium"><strong>' + counts.medium + '</strong><span>中风险</span></div><div class="risk-count low"><strong>' + counts.low + '</strong><span>低风险</span></div></div>';
      if (!draft.findings.length) {
        if (draft.status === 'unchecked') {
          html += '<div class="clear-box">尚未执行检查。<br>输入台词后点击「开始合规检查」。</div>';
        } else {
          html += '<div class="clear-box">未命中当前演示规则。<br>这不代表内容合规，仍需人工核验。</div>';
        }
      } else {
        html += draft.findings.map(function(item, index){
          var levelText = item.severity === 'high' ? '高风险' : item.severity === 'medium' ? '中风险' : '低风险';
          if (item.adopted) {
            return '<div class="risk-card adopted"><div class="risk-top"><div class="risk-type">' + escapeHtml(item.type) + '</div><span class="risk-level" style="color:var(--mint);background:var(--mint-soft)">✓ 已采纳替换</span></div><div class="risk-quote">已替换为：' + escapeHtml(item.replacement) + '</div><button class="undo-btn" onclick="event.stopPropagation();undoAdopt(' + index + ')">撤销此次修改</button></div>';
          }
          var hasReplacement = item.replacement && !item.append;
          var adoptBtn = hasReplacement ? '<button class="apply-btn" onclick="event.stopPropagation();adoptSuggestion(' + index + ')">采纳建议</button>' : '';
          return '<div class="risk-card ' + item.severity + '" onclick="scrollEditorToRisk(window._currentComplianceDraft.findings[' + index + '])"><div class="risk-top"><div class="risk-type">' + escapeHtml(item.type) + '</div><span class="risk-level ' + item.severity + '">' + levelText + '</span></div><div class="risk-quote">\u201C' + escapeHtml(item.excerpt) + '\u201D</div><div class="risk-reason">' + escapeHtml(item.reason) + '</div><div class="risk-suggestion"><strong>建议：</strong>' + escapeHtml(item.suggestion) + '</div>' + adoptBtn + '</div>';
        }).join('');
      }
      el.innerHTML = html;
    }

    function scrollEditorToRisk(finding) {
      var draft = currentDraft(); if (!draft || !finding || finding.append) return;
      var card = document.querySelector('.draft-card.active'); if (!card) return;
      var body = card.querySelector('.draft-card-body'); if (!body) return;
      var marks = body.querySelectorAll('mark.risk-high, mark.risk-medium, mark.risk-low');
      var targetMark = null;
      marks.forEach(function(m) { if (m.textContent === finding.excerpt && !targetMark) targetMark = m; });
      if (targetMark) {
        marks.forEach(function(m) { m.classList.remove('pulse-highlight'); });
        targetMark.classList.add('pulse-highlight');
        targetMark.scrollIntoView({ behavior: 'smooth', block: 'center' });
      } else { card.scrollIntoView({ behavior: 'smooth', block: 'center' }); }
    }

    function recheckCurrent() {
      var draft = currentDraft(); if (!draft || !draft.text.trim()) { toast('当前台词为空'); return; }
      var requestedId = draft.id, requestedText = draft.text;
      draft.status = 'checking'; renderWorkspace();
      setTimeout(function(){
        if (!findDraftById(requestedId) || draft.text !== requestedText) return;
        runDraftCheck(draft);
        if (state.activeId === requestedId) { renderWorkspace(); setInsight('compliance'); toast('合规检查已更新'); }
      }, 520);
    }

    function adoptSuggestion(index) {
      var draft = currentDraft(); if (!draft || !draft.findings[index]) return;
      var finding = draft.findings[index];
      if (!finding.replacement || finding.append || finding.adopted) return;
      var idx = draft.text.indexOf(finding.excerpt);
      if (idx < 0) { toast('未找到匹配文本，请手动修改'); return; }
      finding.snapshotText = draft.text;
      finding.adopted = true;
      draft.text = draft.text.slice(0, idx) + finding.replacement + draft.text.slice(idx + finding.excerpt.length);
      repositionFindings(draft);
      draft.quality = diagnoseQuality(draft.text, draft.targetDuration);
      syncDraftStatusAfterAdopt(draft);
      renderWorkspace(); setInsight('compliance');
      toast('已替换该违规项，其余违规项保持高亮');
    }
    function undoAdopt(index) {
      var draft = currentDraft(); if (!draft || !draft.findings[index]) return;
      var finding = draft.findings[index];
      if (!finding.adopted) return;
      var idx = draft.text.indexOf(finding.replacement);
      if (idx >= 0) {
        draft.text = draft.text.slice(0, idx) + finding.excerpt + draft.text.slice(idx + finding.replacement.length);
      } else if (finding.snapshotText != null) {
        draft.text = finding.snapshotText;
      } else { return; }
      finding.adopted = false; finding.snapshotText = null;
      repositionFindings(draft);
      draft.quality = diagnoseQuality(draft.text, draft.targetDuration);
      syncDraftStatusAfterAdopt(draft);
      renderWorkspace(); setInsight('compliance');
      toast('已撤销该风险点的替换');
    }
    function repositionFindings(draft) {
      draft.findings.forEach(function(f){ f.sourceIndex = (f.adopted || f.append || !f.excerpt) ? null : draft.text.indexOf(f.excerpt); });
    }
    function syncDraftStatusAfterAdopt(draft) {
      draft.status = draft.findings.some(function(f){ return !f.adopted; }) ? 'attention' : 'clear';
    }

    function fallbackCopy(text) {
      var area = document.createElement('textarea'); area.value = text; area.style.position = 'fixed'; area.style.opacity = '0';
      document.body.appendChild(area); area.focus(); area.select();
      var ok = false; try { ok = document.execCommand('copy'); } catch (error) { ok = false; }
      area.remove(); if (!ok) throw new Error('copy failed');
    }
    function copyText(text, successMessage) {
      if (!text) { toast('没有可复制的内容'); return; }
      if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(text).then(function(){ toast(successMessage); }).catch(function(){
          try { fallbackCopy(text); toast(successMessage); } catch (error) { toast('复制失败'); }
        });
      } else { try { fallbackCopy(text); toast(successMessage); } catch (error) { toast('复制失败'); } }
    }

    function outputNotice(message, drafts) {
      var needsAttention = drafts.some(function(draft){ return draft.status === 'stale' || draft.status === 'unchecked' || draft.status === 'checking' || draft.status === 'attention'; });
      return needsAttention ? message + '；包含待复检或待关注稿件' : message;
    }
    function currentDraftEntries() { return state.drafts.map(function(draft, index){ return { draft:draft, index:index }; }); }
    function currentExportEntries() {
      var selected = validSelectedIds(state.drafts);
      if (!selected.length) return currentDraftEntries();
      var selectedMap = {}; selected.forEach(function(id){ selectedMap[id] = true; });
      return currentDraftEntries().filter(function(entry){ return selectedMap[entry.draft.id]; });
    }
    function entriesText(entries) { return entries.map(function(entry){ return '【' + (entry.index + 1) + '. ' + entry.draft.title + '】\n' + entry.draft.text; }).join('\n\n--------------------\n\n'); }
    function copyAll() { copyText(entriesText(currentDraftEntries()), outputNotice('已复制全部台词', state.drafts)); }
    function exportMessage(type, entries) {
      var selectedCount = validSelectedIds(state.drafts).length;
      return type + ' 已导出' + (selectedCount ? ('选中的 ' + entries.length + ' 篇台词') : ('全部 ' + entries.length + ' 篇台词'));
    }
    function downloadFile(name, content, type) {
      var blob = new Blob(['\ufeff' + content], { type: type + ';charset=utf-8' });
      var url = URL.createObjectURL(blob);
      var link = document.createElement('a'); link.href = url; link.download = name;
      document.body.appendChild(link); link.click(); link.remove();
      setTimeout(function(){ URL.revokeObjectURL(url); }, 500);
    }
    function exportTxt() {
      var entries = currentExportEntries(); if (!entries.length) return;
      downloadFile('合规检查-导出.txt', entriesText(entries), 'text/plain');
      toast(outputNotice(exportMessage('TXT', entries), state.drafts));
    }
    function csvSafeValue(value) { var text = String(value == null ? '' : value); if (/^[\u0000-\u0020]*[=+\-@]/.test(text)) text = "'" + text; return text; }
    function csvCell(value) { return '"' + csvSafeValue(value).replace(/"/g, '""') + '"'; }
    function exportCsv() {
      var entries = currentExportEntries(); if (!entries.length) return;
      var rows = [['序号','标题','台词正文','字数','预计时长（秒）','高风险','中风险','低风险','检查状态']];
      entries.forEach(function(entry){
        var draft = entry.draft;
        var counts = { high:0, medium:0, low:0 }; draft.findings.forEach(function(item){ counts[item.severity]++; });
        var resultCurrent = draft.status === 'attention' || draft.status === 'clear';
        rows.push([entry.index + 1, draft.title, draft.text, countChars(draft.text), estimateSeconds(draft.text), resultCurrent ? counts.high : '', resultCurrent ? counts.medium : '', resultCurrent ? counts.low : '', statusLabel(draft.status)]);
      });
      downloadFile('合规检查-导出.csv', rows.map(function(row){ return row.map(csvCell).join(','); }).join('\r\n'), 'text/csv');
      toast(outputNotice(exportMessage('CSV', entries), state.drafts));
    }

    function countChars(text) { return String(text || '').replace(/\s/g, '').length; }
    function estimateSeconds(text) { return Math.max(1, Math.ceil(countChars(text) / 4)); }
    function statusLabel(status) { return { unchecked:'待检查', checking:'检查中', attention:'存在待关注项', clear:'检查通过', stale:'已修改·待复检' }[status] || '待检查'; }

    document.addEventListener('keydown', function(e){
      if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
        e.preventDefault();
        if (!state.loading) startExistingCheck();
      }
    });

    (function init(){
      var handoff = consumeHandoff();
      if (handoff) {
        var draft = makeDraft(handoff.title || '合规检查稿 1', handoff.text, 60);
        state.drafts = [draft];
        state.activeId = draft.id;
        setTimeout(function(){ showHandoffBanner(handoff.from, handoff.title, countChars(handoff.text)); }, 100);
        if (handoff.autoCheck) setTimeout(function(){ startExistingCheck(); }, 600);
      } else if (!state.drafts.length) {
        var empty = makeDraft('合规检查稿 1', '', 60);
        state.drafts = [empty];
        state.activeId = empty.id;
      }
      renderWorkspace();
    })();
  </script>
</body>
</html>
